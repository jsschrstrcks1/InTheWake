<h2 id="pk-section-1">Section 1 — Your Ship: Norwegian Escape</h2>
<h3 id="pk-the-lead-breakaway-plus-ship-eleven-years-on">The lead Breakaway Plus ship — eleven years on</h3>
<p><a href="/ships/norwegian/norwegian-escape.html">Norwegian Escape</a> was delivered October 22, 2015 by Meyer Werft at Papenburg, Germany — the <strong>lead ship of NCL’s Breakaway Plus class</strong> (the larger evolution of the Breakaway class). Her sisters arrived later: Norwegian Joy (2017), <a href="/ships/norwegian/norwegian-bliss.html">Norwegian Bliss</a> (2018), and <a href="/ships/norwegian/norwegian-encore.html">Norwegian Encore</a> (2019). By your November 2026 sailing she’s eleven years into service: settled, with crew rhythms long established.</p>
<p>She was christened <strong>November 9, 2015 at PortMiami</strong> by <strong>Pitbull</strong> (Armando Christian Pérez) — the Miami-born rapper who became the <strong>first male godfather ever bestowed in cruise-ship christening history</strong>. The convention had been “godmother” for centuries — NCL broke it with Escape. Quietly distinctive in cruise lore.</p>
<p>If you’ve sailed <a href="/ships/norwegian/norwegian-bliss.html">Norwegian Bliss</a> or <a href="/ships/norwegian/norwegian-encore.html">Norwegian Encore</a>, <strong>Escape is a near-identical Breakaway Plus hull and the same general layout</strong> with a few refinements that distinguish her from the later sisters. The Alaska-themed Wyland hull mural on Bliss is replaced on Escape by <strong>Guy Harvey’s marlin-and-billfish hull artwork</strong> — visible the moment the ship is at the pier. If you’re new to Breakaway Plus, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> shows how she compares against the newer Prima Plus class and other megaships.</p>
<h3 id="pk-whats-distinctive-about-escape">What’s distinctive about Escape</h3>
<ul>
<li><strong>The Guy Harvey hull artwork</strong> — Escape’s hull mural depicts a leaping marlin, sea turtle, swordfish, and other Caribbean game fish. Visible from any pier shot. Guy Harvey is a Caribbean marine artist; the partnership is fitting for an Eastern Caribbean ship.</li>
<li><strong>The Sky Walk ropes course</strong> — a three-story rope-and-plank course running the width of the upper decks, with two narrow planks that extend eight feet over the side of the ship and five Sky Rail zip tracks that fly over open ocean. At launch in 2015 NCL marketed this as the largest ropes course at sea — Escape’s defining outdoor signature.</li>
<li><strong>The Aqua Park</strong> — at launch, marketed as the largest at sea: <strong>the Aqua Racer</strong> (twin-tube racing slides), <strong>Free Fall slides</strong> (steep enclosed drops), <strong>The Whip</strong> (a tubular spiral slide), two pools, four hot tubs, and a dedicated kids’ area.</li>
<li><strong><a href="/restaurants/ncl/spice-h2o.html">Spice H2O</a></strong> (Deck 17 aft) — the adults-only open-air lounge at the stern; the open-air viewing spot on this ship. Escape has no forward Observation Lounge, so the forward-lounge advice from other NCL packs does not apply here.</li>
<li><strong>Vibe Beach Club</strong> — adults-only enclave with private pool, two hot tubs, dedicated bar, shaded loungers. ~$99/day or $399/week pre-cruise.</li>
<li><strong>The Haven by Norwegian</strong> — ship-within-a-ship suite enclave with private restaurant, lounge, pool, and butler service.</li>
<li><strong>Pincho Tapas Bar</strong> (Deck 8) — a small Spanish tapas room; specialty dining at small-bites cadence.</li>
</ul>
<h3 id="pk-whats-not-on-escape">What’s NOT on Escape</h3>
<ul>
<li><strong>No go-kart track / Speedway</strong> — NCL introduced the at-sea Speedway with <a href="/ships/norwegian/norwegian-joy.html">Norwegian Joy</a> in 2017, two years after Escape. The later three Breakaway Plus sisters (Joy, <a href="/ships/norwegian/norwegian-bliss.html">Bliss</a>, <a href="/ships/norwegian/norwegian-encore.html">Encore</a>) all got the two-level Speedway; Escape did not.</li>
<li><strong>No Indulge Food Hall</strong> — that’s a Prima-class signature. Escape predates the Prima Class by seven years.</li>
<li><strong>No Penrose Atrium</strong> — also Prima-class.</li>
<li><strong>No Aqua Slidecoaster</strong> — Prima Plus only (Aqua, Luna).</li>
</ul>
<h3 id="pk-cabin-categories-the-solo-calculus">Cabin categories — the solo calculus</h3>
<p>The group flyer shows three price points: <strong>Solo Studio $1,249</strong>, <strong>Ocean View $1,569</strong>, <strong>Balcony $1,839</strong>. Honest reads:</p>
<ul>
<li><strong>Solo Studio at $1,249</strong> — NCL’s signature solo offering. Escape has <strong>82 dedicated Studio cabins</strong> — one of the largest Studio inventories on any cruise ship. Roughly 100 sq ft, windowless, with <strong>no single supplement</strong> and <strong><a href="/restaurants/ncl/studio-lounge.html">Studio Lounge</a> access</strong> (free coffee, social space, hosted hours, scheduled meet-and-greets for solo cruisers). The Studio Lounge is the daily social anchor; solos cluster there independent of the group meetups. <strong>At $1,249, this is the price-leader for solo travel.</strong></li>
<li><strong>Ocean View at $1,569</strong> — a window cabin, daylight in the morning, the world feels different. The $320 differential buys real space + a window. <strong>The value pick for most solo cruisers.</strong></li>
<li><strong>Balcony at $1,839</strong> — a private outdoor space, which on a Caribbean cruise matters more than on Alaska. Sea-day sunrises, port-day return-from-shore decompression, evenings with a book. At a $270 differential over Ocean View, <strong>the splurge that pencils out</strong> if the math works.</li>
</ul>
<p><strong>Before you commit, run the <a href="/stateroom-check.html">stateroom sanity check</a></strong> — give it your ship and cabin number and it tells you whether that cabin sits in a known trouble spot: under the pool deck, over the theater, by the galley or the elevator bank, far forward, behind a lifeboat, or on a connecting door. On most Norwegian ships its cabin list is still partial, and it says so on the result. Studios suit confident sleepers. The check won’t tell you whether a windowless room will bother you; it tells you where the cabin sits. Once chosen, the <a href="/articles/cruise-cabin-organization.html">cabin organization guide</a> covers small-space pragmatics.</p>
<h3 id="pk-dining">Dining</h3>
<p>Escape’s dining map:</p>
<p><strong>Included with your fare (no extra charge):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/the-manhattan-room.html">Manhattan Room</a></strong> (Deck 7 aft) — main dining room with a small dance floor and live music most evenings. Most atmospheric of the included rooms.</li>
<li><strong>Taste</strong> and <strong>Savor</strong> (Deck 6) — paired main dining rooms; same menu, different room atmosphere.</li>
<li><strong><a href="/restaurants/ncl/garden-cafe.html">Garden Café</a></strong> (Deck 16) — buffet; long hours; upper-deck view earns its keep on sea days.</li>
<li><strong><a href="/restaurants/ncl/osheehans.html">O’Sheehan’s Neighborhood Bar &amp; Grill</a></strong> (Deck 7) — pub food and classics around the clock; the fallback for any hour. (This is the venue that goes by The Local on Escape’s younger sisters.)</li>
</ul>
<p><strong>Specialty dining (extra charge or via Specialty Dining Package):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/cagneys-steakhouse.html">Cagney’s Steakhouse</a></strong> — NCL’s standard steakhouse; reliably good.</li>
<li><strong><a href="/restaurants/ncl/le-bistro.html">Le Bistro</a></strong> — French; the most romantic specialty room on NCL ships.</li>
<li><strong><a href="/restaurants/ncl/teppanyaki.html">Teppanyaki</a></strong> — Japanese hibachi; the showy room; group-friendly seating.</li>
<li><strong><a href="/restaurants/ncl/q-texas-smokehouse.html">Q Texas Smokehouse</a></strong> — Texas BBQ.</li>
<li><strong><a href="/restaurants/ncl/los-lobos.html">Los Lobos</a></strong> — modern Mexican.</li>
<li><strong><a href="/restaurants/ncl/ocean-blue.html">Ocean Blue</a></strong> — Geoffrey Zakarian-partnered seafood (verify whether running in 2026).</li>
<li><strong><a href="/restaurants/ncl/la-cucina.html">La Cucina</a></strong> — Italian.</li>
<li><strong><a href="/restaurants/ncl/food-republic.html">Food Republic</a></strong> — pan-Asian small plates; one of NCL’s most distinctive specialty rooms. Worth the visit even if you’re not a sushi-and-pho person.</li>
<li><strong>Pincho Tapas Bar</strong> — Spanish tapas; small bites and wine.</li>
</ul>
<p><strong>Drinks.</strong> NCL’s drink-package math: the Premium Beverage Package is commonly included in the <strong>“Free at Sea”</strong> promotional bundle when booking. If your group fare included Free at Sea, drinks may already be covered — <strong>verify what’s bundled with your booking agent</strong>. Otherwise the package runs ~$109/day per person + 20% gratuity at pre-cruise rates; breaks even at ~5–6 drinks per day. The <a href="/drink-calculator.html">drink-calculator</a> lets you put in your real consumption pattern and see the breakeven. The companion article <a href="/articles/is-drink-package-worth-it.html">Is the drink package worth it?</a> walks through worked examples.</p>
<p><strong>The honest first-day mistake to avoid:</strong> Don’t sign up for an unlimited drink package at the front desk on Day 1 unless you’ve already done the drink-calculator math. Decide before you board, ideally as part of your Free At Sea bundle. Mid-sail upgrades cost more per day and give you fewer days of usage.</p>
<h3 id="pk-connectivity-at-sea">Connectivity at sea</h3>
<p>NCL’s Wi-Fi packages are tier-based and frequently bundled into Free at Sea. The <a href="/internet-at-sea.html">internet at sea guide</a> covers cross-line baselines and how to avoid cellular roaming charges in port.</p>
<p>For most solo cruisers in this group:</p>
<ul>
<li>Use included basic Wi-Fi if your fare bundles any</li>
<li>Don’t try to stream video at sea</li>
<li>Use port-day cellular when possible (DR uses Claro/Altice; USVI uses US carriers normally; BVI uses Flow/Digicel; expect no usable cellular at Great Stirrup Cay)</li>
<li>Keep one trusted person ashore informed via a daily one-line message — see <a href="/admin/voyage-pwa/guides/escape-thanksgiving-guide.html?v=8912cb19d3#section-6">Section 6</a></li>
</ul>

<h3 id="pk-day-1-friday-november-20-port-canaveral-embarkation">Day 1 — Friday, November 20 — Port Canaveral (embarkation)</h3>
<p><strong>Terminal:</strong> <strong>Port Canaveral, Cruise Terminal 10</strong> (NCL’s typical Central Florida berth — verify in the NCL app 14 days before sailing).</p>
<p><strong>Getting to Port Canaveral:</strong></p>
<ul>
<li><strong>Orlando International (MCO) → Port Canaveral:</strong> Uber/Lyft $60–80, 45–60 min. Shared cruise shuttle ~$30/person, slower.</li>
<li><strong>If driving:</strong> Port Canaveral garage ~$17–22/day (significantly cheaper than PortMiami’s $35); reservable in advance via the Port Canaveral website.</li>
<li><strong>Embark window:</strong> Typically 11:30 AM – 3:30 PM. <strong>All-aboard 3:30 PM.</strong> Ship departs ~4:00–5:00 PM.</li>
</ul>
<p><strong>Pre-cruise hotel — strongly recommended.</strong> Same-day flights to a 3:30 PM Friday all-aboard are risky given Thanksgiving-week travel volume. Two viable bases:</p>
<ul>
<li><strong>Cocoa Beach</strong> (15 min from port) — beach town, walking distance to the pier and beach. Right call if you want to be near the port.</li>
<li><strong>Orlando MCO area</strong> (45 min from port) — more hotel options, longer Friday-morning transfer.</li>
</ul>
<p><strong>Thursday Nov 19 — fly into MCO.</strong> This is the day before your Friday embarkation — and, usefully, a full week ahead of the Thanksgiving travel crush (which peaks on the Wednesday before Thanksgiving, Nov 25, while you’re already at sea). Still, book flights early and consider arriving Wednesday Nov 18 for extra buffer. Pam will confirm any pre-cruise gathering plans in the Facebook group chat.</p>
<p><strong>The realistic Day 1 timeline:</strong></p>
<ul>
<li><strong>11:00 AM:</strong> Terminal opens. NCL online check-in via the NCL app — complete it before arrival to skip a 20-minute queue.</li>
<li><strong>12:00 PM:</strong> Aboard. Cabins typically open by 1:30 PM; until then, lunch at the buffet (<a href="/restaurants/ncl/garden-cafe.html">Garden Café</a>, Deck 16) or <a href="/restaurants/ncl/osheehans.html">O’Sheehan’s</a> (Deck 7).</li>
<li><strong>1:30 PM:</strong> Cabin open. Meet your stateroom steward.</li>
<li><strong>3:00 PM:</strong> Mandatory muster drill — partly app-based (watch the safety video in the NCL app) plus an in-person check-in at your assigned station.</li>
<li><strong>4:00 PM:</strong> <strong>Sailaway.</strong> Pam’s group gathers at a spot she names in the Facebook group chat; on Escape the natural sailaway spots are <strong><a href="/restaurants/ncl/spice-h2o.html">Spice H2O</a></strong> (Deck 17 aft, adults-only, open air) and <strong>The Waterfront</strong> (Deck 8, the outdoor promenade). Both are less crowded than the main pool deck.</li>
<li><strong>5:30 – 8:00 PM:</strong> Dinner. Pam’s nightly group dinner is at the <strong>Manhattan Room (or one of the main dining rooms)</strong> at 5:30 PM — verify in the Facebook group chat. Show up to whichever nights work for you.</li>
<li><strong>Later evening:</strong> NCL hosts a <strong>Studio meet-and-greet</strong> sometime on Day 1 in the <a href="/restaurants/ncl/studio-lounge.html">Studio Lounge</a> — check the NCL app’s daily program.</li>
</ul>
<p><strong>What to pack in your carry-on for Day 1:</strong> swimsuit (pools open before checked bags arrive), light layer (Florida November evenings can be 65–75°F outdoors but ship interior runs ~72°F), all medications, change of clothes, <strong>passport</strong> (required — DR, USVI, BVI are foreign or special-jurisdiction; passport is the cleanest documentation), phone charger, refillable water bottle. Your checked bags may not arrive until 7–9 PM.</p>
<p><strong>Money/card:</strong> Your NCL keycard is your ID, room key, and onboard charge. <strong>Currency aboard: US Dollar.</strong></p>
<h3 id="pk-day-puerto-plata">Day 3 — Sunday, November 22 — Puerto Plata (Amber Cove), Dominican Republic</h3>
<p><strong>Arrival:</strong> Approximately 8:00 AM. <strong>Depart:</strong> 5:00 PM. Escape docks at <strong>Amber Cove</strong> — Carnival Corporation’s purpose-built cruise port complex on the Dominican Republic’s north coast, about 30 minutes from the city of Puerto Plata.</p>
<p><strong>The shape of Puerto Plata / Amber Cove.</strong> Amber Cove is the cruise-port complex; Puerto Plata is the actual city. Most cruisers stay at Amber Cove and never see Puerto Plata; some venture inland. Amber Cove has a beach, multiple pools, a zip line, restaurants, shops, and a paid waterpark. The complex was built specifically for cruise visitors and is highly developed. If you want a low-stress “stay near the ship” day, Amber Cove delivers.</p>
<p><strong>Free with your cruise card (at Amber Cove):</strong></p>
<ul>
<li>Multiple pool zones (free; first-come for chairs)</li>
<li>Beach access (small but real)</li>
<li>Shops and the duty-free zone</li>
<li>Restaurants for purchase (most affordable in USD)</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>Damajagua Waterfalls</strong> — the inland excursion that justifies leaving Amber Cove. A series of 27 cascades you can climb and slide through. Ship excursion ~$95/person; independent operators ~$50–60. 4–5 hour day total. Wet shoes required.</li>
<li><strong>Puerto Plata City Tour</strong> — visit the colonial fortress (San Felipe), the amber museum, the malecón waterfront. Half-day; ~$40–60 with transport.</li>
<li><strong>Ocean World Adventure Park</strong> — dolphins, sea lions, tigers, sharks. ~$70 entry; controversial ethics for some travelers (research before booking).</li>
<li><strong>Mount Isabel de Torres cable car</strong> — short ride to the top of the mountain with the Christ statue, botanical gardens, panoramic views. ~$25.</li>
<li><strong>Cofresí Beach</strong> — public beach 15 minutes from Amber Cove; quieter than the cruise-port crowd.</li>
</ul>
<p><strong>For first-time Puerto Plata:</strong> if it’s your first Caribbean DR call, Damajagua Waterfalls is the experience that justifies leaving the cruise port. If you’d rather stay calm, Amber Cove’s pools + beach + lunch is a fine day.</p>
<p><strong>Pack for Puerto Plata:</strong> swimsuit, water shoes (Damajagua requires them), sunscreen (SPF 30+), sun hat, light cover-up, $40–60 USD cash in small bills (USD widely accepted; Dominican peso not necessary), insect repellent for inland excursions.</p>
<p><strong>Worth a look on the way in:</strong> the <a href="/ports/amber-cove.html">Amber Cove port page</a>. Build your day in the <a href="/tools/port-day-planner.html">Port Day Planner</a>; record what actually happened in the <a href="/tools/port-tracker.html">Port Logbook</a> on the way back.</p>
<h3 id="pk-day-st-thomas">Day 4 — Monday, November 23 — St. Thomas, US Virgin Islands</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/st-thomas/city-view.webp" alt="Charlotte Amalie, St. Thomas — colorful Danish colonial buildings cascading down the hillside above the harbor" />
<figcaption aria-hidden="true">Charlotte Amalie, St. Thomas — colorful Danish colonial buildings cascading down the hillside above the harbor</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 10:00 AM. <strong>Depart:</strong> 6:00 PM. Escape typically docks at <strong>Crown Bay</strong> or <strong>Havensight (WICO)</strong> — both in the harbor at Charlotte Amalie. Crown Bay is ~2 miles west of downtown; Havensight is at the eastern end of downtown.</p>
<p><strong>What St. Thomas is.</strong> Charlotte Amalie is one of the busiest cruise ports in the Caribbean; on a busy day several large ships share the harbor. Downtown is well-organized for the cruise crowd: duty-free shopping (jewelry is the marquee category; St. Thomas was the duty-free engine of US Caribbean commerce for decades), the historic Synagogue, Blackbeard’s Castle (overpriced, climb-the-stairs), and ferries to the surrounding islands.</p>
<p><strong>Free, walkable (from Havensight; Crown Bay requires shuttle/taxi):</strong></p>
<ul>
<li><strong>Downtown Charlotte Amalie</strong> — Main Street is the duty-free spine; Government Hill has the historic homes; the Synagogue (1833 — the second-oldest in continuous use in the Western Hemisphere) is worth a quiet half-hour.</li>
<li><strong>The waterfront walking path</strong> — quiet, scenic.</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>Magens Bay</strong> — the beach on most lists of the Caribbean’s best. ~$12–17 r/t per person via taxi-shuttle; $5 entry. The standard St. Thomas beach day.</li>
<li><strong>Sapphire Beach</strong> — quieter alternative, ~$15 r/t taxi; better snorkeling at the east end.</li>
<li><strong>Mountain Top</strong> — short drive to the highest point on the island; the harbor view that ends up on most postcards. Banana daiquiri tradition. ~$25 r/t.</li>
<li><strong>Ferry to St. John</strong> — Cruz Bay ferries leave Red Hook every 30 min; ~$8 each way. Trunk Bay beach in St. John’s national park is one of the Caribbean’s signature beaches.</li>
<li><strong>Skyride to Paradise Point</strong> — gondola from Havensight; ~$24 r/t.</li>
<li><strong>Coral World Ocean Park</strong> — sea-life encounters; ~$25 entry.</li>
</ul>
<p><strong>For first-time St. Thomas:</strong> Magens Bay or the ferry to St. John are the two great calls. Magens is the standard St. Thomas beach day; St. John’s Trunk Bay is the “this is the Caribbean of postcards” experience but takes longer (the ferry adds an hour each way).</p>
<p><strong>Pack for St. Thomas:</strong> swimsuit, water shoes, reef-safe sunscreen, sun hat, $60–80 USD cash, snorkel gear if you have your own.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/st-thomas.html">St. Thomas port page</a>, its <a href="/ports/st-thomas.html#gallery">gallery</a>, and the <a href="/ports/st-thomas.html#logbook">St. Thomas logbook</a>.</p>
<h3 id="pk-day-tortola">Day 5 — Tuesday, November 24 — Tortola, British Virgin Islands</h3>
<p><strong>Arrival:</strong> Approximately 8:00 AM. <strong>Depart:</strong> 5:00 PM. Escape docks at <strong>Tortola Pier Park</strong> in Road Town, the BVI capital — directly adjacent to the cruise terminal complex, no tender required.</p>
<p><strong>What Tortola is.</strong> The largest of the British Virgin Islands; population ~24,000; a British Overseas Territory still using the US Dollar despite the British flag. The BVI is <em>quieter</em> than St. Thomas — fewer ships, fewer aggressive vendors, a more deliberate pace. The island is mountainous; the postcard destinations are reached by safari taxi over winding roads, not on foot.</p>
<p><strong>Free, walkable from the pier:</strong></p>
<ul>
<li><strong>Road Town</strong> — Main Street walkable; the J.R. O’Neal Botanic Gardens (~10-min walk, ~$5 entry — quietly excellent); the old courthouse and government complex.</li>
<li><strong>Pier Park</strong> — a planned cruise-port shopping/dining complex; restaurants and shops at the gangway.</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>Cane Garden Bay</strong> — one of the BVI’s signature beaches; a curve of white sand backed by green hills. ~$20–30 taxi each way. Calm water, restaurants, bars. <strong>For most cruisers in Tortola, this is the day.</strong></li>
<li><strong>The Baths on Virgin Gorda</strong> — the postcard of the BVI. Massive granite boulders forming sea caves and natural pools you swim through. Requires a ferry from Tortola to Virgin Gorda + taxi. A full half-day; with the 5:00 PM all-aboard there’s more margin here than on shorter Tortola calls. ~$150–200/person all in.</li>
<li><strong>Sage Mountain National Park</strong> — Tortola’s high point and rainforest. Hiking; cool temperatures; less-crowded. Half-day excursion.</li>
<li><strong>Sailing or snorkeling day trip</strong> — catamarans to Norman Island or the BVI’s small reef islands. $130–180/person; standout for water-lovers.</li>
</ul>
<p><strong>For first-time Tortola:</strong> Cane Garden Bay is the right call if it’s a beach day. If you’ve already done a Caribbean-beach excursion this trip, The Baths on Virgin Gorda is the postcard.</p>
<p><strong>Weather note for late November:</strong> Tortola in November runs 78–86°F daytime, low rain risk, steady trade winds. Brief afternoon showers possible but the wet stretch (Aug–Nov) is winding down. Comfortable beach day weather. The seasonal panel and live forecast at the <a href="/ports/tortola.html">Tortola port page</a> are the right read 24 hours before docking.</p>
<p><strong>Currency:</strong> US Dollar (despite the British flag).</p>
<p><strong>For accessibility:</strong> Pier Park is accessible. Most off-port excursions involve open-air safari taxis and unpaved beach approaches.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/tortola.html">Tortola port page</a>, its <a href="/ports/tortola.html#gallery">gallery</a>, and the <a href="/ports/tortola.html#logbook">Tortola logbook</a>.</p>
<h3 id="pk-day-great-stirrup-cay">Day 7 — Thursday, November 26 — Great Stirrup Cay, Bahamas (THANKSGIVING)</h3>
<p><strong>Arrival:</strong> Approximately 9:00 AM. <strong>Depart:</strong> 5:00 PM. Escape docks at the cay’s <strong>new multi-ship pier</strong> completed in late 2025; no tendering on a normal day. If weather closes the pier, NCL runs tenders instead, and the app will say so that morning.</p>
<p><strong>What Great Stirrup Cay is right now (November 2026).</strong> NCL leased Great Stirrup Cay in 1977 — the first cruise line in the industry to take exclusive use of a private island in the Caribbean — and bought it outright in 1986. As of November 2026 the cay is in a substantially-expanded state: the <strong>headline new attraction, Great Tides Waterpark, opened September 4, 2026</strong> — almost three months before your sailing. You’ll come ashore at the new <strong>Welcome Plaza</strong>, the arrival area at the pier, and the cay is the most developed it has ever been.</p>
<p><strong>A soft-opening caveat.</strong> Great Tides opened eleven weeks before this sailing; large-scale private-island construction often carries small punch-list items past opening day. Treat the beach + BBQ lunch + pool zones as the reliable core of your cay day; treat any specific waterpark attraction as a bonus that may or may not be running the day you visit. Verify status in the NCL app the morning of the cay call before you commit to a paid slot.</p>
<p><strong>Great Tides Waterpark</strong> (per NCL’s May 2026 marketing booklet):</p>
<ul>
<li><strong>Great Life Lagoon</strong> — a 28,000-square-foot pool with swim-up bars; the new social center of the cay. <strong>No upcharge marker in NCL’s own materials, so it should be included</strong>; NCL publishes no pricing outside the app, so confirm there before you budget.</li>
<li><strong>Tidal Tower</strong> (paid) — racing slides, sea-themed.</li>
<li><strong>Wandering River</strong> (paid) — lazy river with surprise elements.</li>
<li><strong>Cliffside Cove</strong> (paid) — platform-jumping into clear pools. Height/swim ability requirements.</li>
<li><strong>Splash Cay</strong> (paid) — high-energy splash pad for younger kids. (NCL’s island map labels this zone “Splash Harbor” — same area; naming still settling.)</li>
<li><strong>Grotto Bar</strong> — cocktail bar inside the family-pad zone, so adults can drink while kids play.</li>
<li><strong>19 slides</strong> across the park.</li>
</ul>
<p>Waterpark access requires a reservation; <strong>book in the NCL for Me app pre-cruise</strong> ideally 60+ days out. Thanksgiving sailings sell out earlier than typical.</p>
<p><strong>Free with your cruise fare:</strong></p>
<ul>
<li><strong>Beach access</strong> — multiple beach zones across the cay.</li>
<li><strong>BBQ buffet lunch</strong> — at the open-air pavilion; jerk chicken, ribs, salads, hot dogs, burgers. <strong>The Thanksgiving feast also runs onboard tonight after the cay closes</strong> — see Section 12.</li>
<li><strong>Lounge chairs and umbrellas</strong> — first-come; come ashore early for shaded ones.</li>
<li><strong>Great Life Lagoon</strong> (the 28,000-sq-ft pool with swim-up bars) — carries no upcharge marker in NCL’s materials, so expect it to be included; confirm in the app.</li>
<li><strong>Snorkel gear rental</strong> — typically deposit-only or nominal.</li>
<li><strong>Tram service</strong> along the spine from Welcome Plaza to the beach zones.</li>
</ul>
<p><strong>Paid add-ons (reserve in the NCL app):</strong></p>
<ul>
<li><strong>Great Tides Waterpark</strong> — see above; reservation-based.</li>
<li><strong>Flighthouse Zipline</strong> — the existing ten-line zipline complex anchored by the “Flighthouse” tower take-off; ~$20. Worth the price.</li>
<li><strong>Underwater Snorkel Garden</strong> — guided reef-snorkel at a curated underwater garden offshore.</li>
<li><strong>Vibe Shore Club</strong> — adults-only (18+) private beach, premium loungers, dedicated bar. ~$79+/person.</li>
<li><strong>Cabana rentals</strong> — 2-person and family cabanas. $300–700+ for the day.</li>
<li><strong>Silver Cove</strong> — separate ultra-premium adults-only zone with private cove, lagoon villas, spa, and bar.</li>
<li><strong>Kayak tours and waverunners</strong> — small-group; ~$50–80/person.</li>
</ul>
<p><strong>For Thanksgiving Day specifically:</strong> the cay opens around 9 AM and runs through ~5 PM. Most cruisers come back aboard mid-afternoon to shower and rest before the <strong>5:30 PM – 9:00 PM Thanksgiving dinner service</strong> in the main dining rooms (see Section 12). If you booked a waterpark slot, pick a morning or early-afternoon window so you have time to clean up.</p>
<p><strong>Pack for Great Stirrup Cay:</strong> swimsuit, reef-safe sunscreen, sun hat, $20–40 cash for tipping bartenders ($1–2/drink), refillable water bottle, water shoes (some shoreline is coral-fragment), waterproof phone pouch.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/great-stirrup-cay.html">Great Stirrup Cay port page</a> for the cay’s layout and history.</p>
<h3 id="pk-day-8-friday-november-27-port-canaveral-debarkation">Day 8 — Friday, November 27 — Port Canaveral (debarkation)</h3>
<p><strong>The realistic timeline:</strong></p>
<ul>
<li><strong>6:00 – 8:00 AM:</strong> Breakfast at Garden Café or O’Sheehan’s.</li>
<li><strong>6:30 AM:</strong> Customs clearance complete. Self-disembarkation begins.</li>
<li><strong>7:00 – 9:30 AM:</strong> Walk-off in waves. <strong>All passengers off the ship by 10:00 AM</strong> per NCL standard.</li>
</ul>
<p><strong>The bag situation.</strong> The night before (Thanksgiving evening), NCL asks you to place your checked luggage outside your cabin door by ~11 PM with the color-coded tag.</p>
<p><strong>Carry-on with you on debark morning:</strong> change of clothes, all medications, passport, phone charger, valuables.</p>
<p><strong>Getting from Port Canaveral to MCO:</strong></p>
<ul>
<li><strong>Uber/Lyft:</strong> $60–80, 45–60 minutes. <strong>Friday Nov 27 is Black Friday</strong> — traffic is generally light early morning but spikes by afternoon.</li>
<li><strong>Cocoa Beach Shuttle</strong> ($30/person, advance booking).</li>
</ul>
<p><strong>Killing 4–6 hours before an evening flight:</strong></p>
<ul>
<li><strong>Cocoa Beach pier</strong> — 15-min Uber. Beach walk + casual lunch.</li>
<li><strong>Kennedy Space Center</strong> — 20-min Uber, $75 entry. Half-day minimum.</li>
<li><strong>Black Friday shopping at Cocoa Beach outlets</strong> — if that’s your thing.</li>
</ul>
