<h2 id="pk-section-1">Section 1 — Your Ship: MSC World America</h2>
<h3 id="pk-a-class-defining-ship-in-her-second-year-of-service">A class-defining ship in her second year of service</h3>
<p><a href="/ships/msc/msc-world-america.html">MSC World America</a> was delivered March 27, 2025 by Chantiers de l’Atlantique at Saint-Nazaire, France — the second ship of MSC’s <strong>World Class</strong> and the first dedicated to the US market. Her maiden voyage left PortMiami on April 12, 2025. By your December 2026 sailing she’s a year and a half into service: past any new-ship teething, with the operating crew well-trained and the Caribbean rotation in steady rhythm. For broader context on MSC’s positioning in the Caribbean alongside Royal, NCL, and Virgin, <a href="/articles/caribbean-cruise-trends-2026.html">Caribbean Cruise Trends 2026</a> covers the deployment shifts.</p>
<p>She was christened by actress <strong>Drew Barrymore</strong> at PortMiami on April 9, 2025, with Orlando Bloom on hand and Gloria Estefan performing a concert from the deck. At <strong>216,638 GT and 1,093 feet long</strong>, she’s MSC’s largest ship and one of the largest cruise ships in the world. Her direct sister is <a href="/ships/msc/msc-world-europa.html">MSC World Europa</a> (2022), homeported in the Mediterranean. For a side-by-side comparison against other Caribbean megaships (Symphony of the Seas, Norwegian Aqua, Carnival Mardi Gras, etc.), the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> shows the actual relative scale on a single chart.</p>
<h3 id="pk-whats-distinctive-about-world-america">What’s distinctive about World America</h3>
<p>A few features set her apart from anything else your family has likely sailed:</p>
<ul>
<li><strong>The Y-shaped aft.</strong> Most ships have a flat stern. World America’s stern is a wedge — a Y-shape with three floor-to-ceiling glass walls that frame the wake. The <strong>World Promenade</strong> (Deck 8) is the seven-deck outdoor walkway that wraps the aft Y, with bars and seating at the rail. The Panorama Lounge above it puts the same view behind a glass wall for cooler evenings — and December evenings on deck are cooler.</li>
<li><strong>The World Galleria</strong> — a three-deck central atrium with an LED ceiling that changes scenes throughout the day. The architectural centerpiece of the ship, and the easiest “meet back here” landmark for a family.</li>
<li><strong>The Venom Drop @ The Spiral</strong> — an 11-deck dry slide, the longest at sea. Not a waterslide — a dry, friction-controlled enclosed drop. Free. The kids will find it before you do.</li>
<li><strong>Cliffhanger</strong> — the only over-water swing ride at sea: four seats on powered arms that lift and swing riders out over the ship’s edge, about 160 feet above the water. It lives in <strong>The Harbour</strong>, the outdoor family district aft (water park, themed playground, ropes course, free grab-and-go food). Check the MSC for Me app for cost, height requirements and hours before promising anyone a turn.</li>
<li><strong>Eataly at sea.</strong> World America carries the first floating Eataly — the Italian gourmet brand’s fresh-pasta, wood-fired-pizza, and gelato concept. Specialty dining (extra charge). On Deck 8.</li>
<li><strong>Decks named after Americas port cities</strong> — Cozumel, Nassau, Santos, Miami, Seattle, Halifax, Los Angeles, Buenos Aires, New York, Ocean Cay, San Juan, Ocho Rios. Wayfinding gets easier once you’ve learned the geography metaphor — a good game to hand the kids on Day 1.</li>
<li><strong>LNG-powered.</strong> Dual-fuel engines plus Bloom Energy solid-oxide fuel cells. She burns natural gas, not heavy fuel oil — significantly lower particulate emissions. Practically: less engine vibration in lower-deck cabins.</li>
</ul>
<h3 id="pk-whats-not-on-world-america">What’s NOT on World America</h3>
<p>Things you might expect from her size that she doesn’t have:</p>
<ul>
<li><strong>No Cirque du Soleil.</strong> MSC’s longstanding Cirque partnership ended before her delivery; she launched without it. The replacement is in-house production shows at the <strong>World Theatre</strong> and a comedy/karaoke lounge called <strong>The Loft</strong>.</li>
<li><strong>No waterpark.</strong> There’s an Aqua Park (water-play features for kids and an outdoor pool deck) but nothing on the scale of Royal’s Perfect Day at CocoCay or Carnival’s Excel-class waterworks. The big aft attraction is the Venom Drop dry slide, not waterslides. Set the kids’ expectations before boarding, not at the pool rail.</li>
<li><strong>No traditional formal nights.</strong> MSC has a “Gala Evening” once or twice per sailing (suit/cocktail-dress encouraged) but it’s softer than the legacy “formal night” of Holland America or Cunard. Most guests dress smart-casual all week and put on something nicer on Gala Evening.</li>
</ul>
<h3 id="pk-cabin-categories-the-family-calculus">Cabin categories — the family calculus</h3>
<p><strong>Before you commit, check the cabin on the deck plan</strong> against the seven trouble spots in our <a href="/articles/stateroom-sanity-check.html">stateroom sanity check guide</a>: under the pool deck, over the theater, by the galley or the elevator bank, far forward, behind a lifeboat, or on a connecting door. Our cabin-by-cabin checker does not cover MSC ships yet, so the deck plan is the check. The cabin-organization article (<a href="/articles/cruise-cabin-organization.html">cruise-cabin-organization</a>) covers the small-space pragmatics once you’ve chosen.</p>
<p>For a family, the choices that matter most on World America:</p>
<ul>
<li><strong>Connecting cabins vs. one larger cabin.</strong> MSC’s family offerings include connecting staterooms and multi-berth cabins; which works depends on ages and how much door-between-you matters. Walk the deck plan before booking a specific cabin number.</li>
<li><strong>Balcony on a December Caribbean week</strong> earns its keep differently than in summer — sea-day sunrises and port-arrival views, with the caveat that December evenings on the balcony want a light layer.</li>
<li><strong>Mid-ship, mid-deck</strong> cabins feel the least motion — worth weighting in December, when cold fronts can put chop in the Gulf and the Yucatán Channel (see <a href="/admin/voyage-pwa/guides/world-america-family-dec-2026-guide.html?v=178754f577#section-7">Section 7</a>).</li>
<li><strong>MSC Yacht Club</strong> is MSC’s ship-within-a-ship suite product — 159 suites on World America, private restaurant, private pool deck, private bar, butler service. Priced well above standard categories; family suites inside Yacht Club exist but sell early.</li>
</ul>
<p>Pricing for this specific sailing lives with your booking — this pack deliberately doesn’t quote cabin rates it can’t verify.</p>
<h3 id="pk-dining">Dining</h3>
<p>World America has <strong>20+ dining venues</strong>. The dining map:</p>
<p><strong>Included with your fare (no extra charge):</strong></p>
<ul>
<li><strong>Four main dining rooms</strong> on Decks 5 and 6: La Foglia, Esagono, Hexagon, Bubbles. Different room atmospheres, the same menu. MSC’s MDRs run a slightly more formal European dining rhythm than the American lines — longer dinners, multiple courses, table service expected. With younger kids, ask for the earlier seating.</li>
<li><strong>Il Mercato</strong> (Deck 18) — the main buffet. Long hours; the upper-deck windows look down on the pool deck.</li>
<li><strong>La Brasserie</strong> (Deck 19) — 24/7 French-style casual. Crepes, fresh-baked bread, lighter food. This is where you go at 2 AM, and where the breakfast buffet is least crowded.</li>
<li><strong>Luna Park Pizza &amp; Burger</strong> (Deck 6) — quick casual, included. The reliable kid-dinner fallback.</li>
<li><strong>La Boca Grill</strong> (Deck 18) — Argentinian/Latin American, included with fare.</li>
<li><strong>Promenade Bites</strong> (Deck 8) on the World Promenade — small plates and tapas, included.</li>
</ul>
<p><strong>Specialty dining (extra charge or part of a Specialty Dining Package):</strong></p>
<ul>
<li><strong><a href="https://www.eataly.com/">Eataly</a></strong> (Deck 8) — fresh pasta, wood-fired pizza, gelato. The first Eataly at sea. The reservation worth pre-booking on Day 1 if you only do one specialty meal — and the one specialty venue that genuinely works for kids.</li>
<li><strong>Paxos</strong> (Deck 8) — Greek seafood, open-air seating on the Promenade.</li>
<li><strong>Butcher’s Cut</strong> — steakhouse.</li>
<li><strong>Kaito Teppanyaki</strong> and <strong>Kaito Sushi Bar</strong> — Japanese. Teppanyaki’s flat-top theatrics are a family-dinner win if your kids will eat off a shared grill.</li>
<li><strong>HOLA! Tacos &amp; Cantina</strong> — modern Mexican.</li>
<li><strong>Jean-Philippe Chocolat &amp; Café</strong> — pastries and chocolate; partially included for some fare types, à la carte for others.</li>
<li><strong>Masters of the Sea Pub</strong> (Deck 7) — onboard microbrewery + pub food.</li>
</ul>
<p><strong>Drinks.</strong> MSC’s drink package tiers (Easy / Easy+ / Premium Plus / Premium Extra) are different from NCL’s or Royal’s tiering, and kids’ soda/mocktail packages price separately. <strong>Whether anyone needs a package depends on what you actually drink</strong> — the <a href="/drink-calculator.html">drink-calculator</a> lets you put in your real consumption pattern. The companion article <a href="/articles/is-drink-package-worth-it.html">Is the drink package worth it?</a> walks through the breakeven math with worked examples.</p>
<h3 id="pk-connectivity">Connectivity</h3>
<p>MSC’s Wi-Fi packages are tier-based (Browse / Browse &amp; Stream / Browse, Stream &amp; Calls) and run separately from the drink-package promotions. Pricing is significantly cheaper pre-cruise than onboard. The <a href="/internet-at-sea.html">internet at sea guide</a> covers the cross-line baseline including how to avoid cellular roaming charges in port.</p>
<p>The family version of the right approach:</p>
<ul>
<li>One paid Wi-Fi plan on one parent’s phone covers the “checking in with home” job</li>
<li>Don’t try to stream video at sea</li>
<li>Use port-day cellular when possible (Roatán uses Honduras carriers, Mexican ports use Telcel/AT&amp;T-Mexico, Ocean Cay has no terrestrial carriers at all)</li>
<li>Kids’ devices: download the week’s entertainment BEFORE leaving home; ship Wi-Fi will not do it</li>
<li>Keep one trusted person ashore informed via a daily one-line message; see <a href="/admin/voyage-pwa/guides/world-america-family-dec-2026-guide.html?v=178754f577#section-6">Section 6 — Emergency Contacts</a></li>
</ul>

<h3 id="pk-day-1-saturday-december-5-portmiami-embarkation">Day 1 — Saturday, December 5 — PortMiami (embarkation)</h3>
<p><strong>Terminal:</strong> <strong>MSC Miami Cruise Terminal</strong> at PortMiami — the MSC-built terminal that opened in April 2025. ~492,678 square feet; MSC has marketed it as the world’s largest cruise terminal. Different terminal from where Royal Caribbean and Carnival board at PortMiami; verify the MSC terminal address in the MSC for Me app before your taxi/Uber pickup.</p>
<p><strong>Embark window:</strong> Typically 11:30 AM – 3:30 PM. Departure <strong>5:00 PM</strong> (MSC app itinerary); all-aboard runs about an hour before sailing. <strong>Be at the terminal by 1:30 PM</strong> to clear security and embarkation with margin — earlier with kids.</p>
<p><strong>Typical December day:</strong> 78°F high / 65°F low, and December is Miami’s dry season — only about 1 in 5 days sees measurable rain. Warm sun, genuinely cool evening.</p>
<p><strong>Getting to PortMiami:</strong></p>
<ul>
<li><strong>Miami International (MIA) → PortMiami:</strong> Uber/Lyft $30–45, 20–30 min. Taxi $32 flat-rate.</li>
<li><strong>Fort Lauderdale (FLL) → PortMiami:</strong> Uber/Lyft $60–90, 45–60 min.</li>
<li><strong>If you’re driving:</strong> PortMiami garage parking ran $35/day at Terminal AA (firsthand May 2026 — verify at booking); ~$245 for the week. Offsite Miami long-term lots run $7–14/day with shuttle service; with a family’s luggage, weigh the shuttle hassle against the garage’s walk-on convenience.</li>
</ul>
<p><strong>Pre-cruise hotel — strongly recommended.</strong> Same-day flights to an afternoon all-aboard are risky in any season. A Friday-night (Dec 4) stay in Miami Beach, Brickell, or Downtown gives you margin and a calmer Saturday morning with kids.</p>
<p><strong>The realistic Day 1 timeline:</strong></p>
<ul>
<li><strong>10:30 AM – 12:00 PM:</strong> Arrive terminal, security, check-in. MSC’s check-in is online via the MSC for Me app — complete it for the whole family before you arrive to skip a 20-minute queue.</li>
<li><strong>12:30 PM:</strong> Aboard. Cabins typically open by 1:30 PM; until then, lunch at the buffet (Il Mercato, Deck 18) or La Brasserie (Deck 19, calmer).</li>
<li><strong>1:30 – 2:30 PM:</strong> Cabins open. Meet your stateroom steward; drop carry-ons. <strong>Register the kids at Doremiland Kids Clubs now</strong> — Day 1 registration lines are the shortest of the week.</li>
<li><strong>~3:30 PM:</strong> Mandatory muster drill — MSC’s drill is partly app-based (watch the safety video in MSC for Me) plus an in-person check-in at your assigned station. <strong>Every member of the family must complete both before sailing.</strong></li>
<li><strong>5:00 PM:</strong> <strong>Sailaway.</strong> The World Promenade (Deck 8 aft, the seven-deck outdoor walkway around the Y-shaped stern) is the signature viewing location. Less crowded than the main pool deck; the wake unfolds directly below the rail.</li>
<li><strong>6:00 – 8:00 PM:</strong> Dinner — first night is the night to confirm your MDR table and seating time work for the kids’ bedtimes.</li>
</ul>
<p><strong>What to pack in the carry-ons for Day 1:</strong> swimsuits (pools open before checked bags arrive), light layers (December Miami afternoons run ~78°F but the evening drops to the 60s and ship interior runs ~72°F), all medications, a change of clothes per person, passports (preferred for Caribbean itineraries — Roatán and Mexico are foreign ports), phone chargers, refillable water bottles, embarkation paperwork (printed or in MSC for Me), and whatever small entertainment keeps your kids happy in a check-in line. Checked bags may not arrive until 7–9 PM.</p>
<p><strong>Money/card:</strong> Your MSC cruise cards are room key, ID, and onboard charge account in one. Kids’ cards can be set to no-charge — decide at check-in. <strong>Currency aboard: US Dollar.</strong></p>
<h3 id="pk-day-roatan">Day 3 — Monday, December 7 — Roatán, Honduras</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/roatan/roatan-1.webp" alt="Roatán waterfront" />
<figcaption aria-hidden="true">Roatán waterfront</figcaption>
</figure>
<p><strong>Times (MSC app):</strong> 9:00 AM – 6:00 PM. World America docks at the <strong>Port of Roatán at Coxen Hole</strong> — the pier at the island’s working capital on the central-north coast, used by MSC, Royal Caribbean, NCL, and Virgin. (Roatán’s <em>other</em> cruise pier, <strong>Mahogany Bay</strong> — recently rebranded <em>Isla Tropicale</em> — is Carnival Corporation’s exclusive facility; World America does <strong>not</strong> call there.)</p>
<p><strong>The December honesty note, up front.</strong> Early December is the tail of Roatán’s rainy season: in the Dec 5–12 window, roughly <strong>3 out of 4 days see measurable rain</strong> (2020–2024 archive). Typical temps are a warm 81/77 — the rain is usually warm, often brief, and the sun between showers is real. What it means practically: plan a flexible beach day, not a tight-schedule day; pack dry bags for phones and a packable rain shell; and hold excursion bookings loosely enough that a morning downpour doesn’t sink the day. If the family gets a dry day, Roatán is the best snorkel stop of the week.</p>
<p><strong>Roatán — reef, beaches, and the excursion-pricing catch.</strong> Roatán is the largest of Honduras’s Bay Islands, sitting on the Mesoamerican Reef — the world’s second-largest barrier reef. Clear water, friendly locals, snorkeling that converts non-snorkelers into snorkelers, and a pricing structure where ship-sponsored excursions cost noticeably more than independently arranged alternatives. The island is the cruiser-friendly face of Honduras.</p>
<p><strong>Free / low-cost, at the Port of Roatán (Coxen Hole):</strong></p>
<ul>
<li>The port’s shopping-and-dining complex at the pier — shops, restaurants, tour desks, a duty-free area, and taxi/tour touts (haggle, and agree fares before you get in).</li>
<li>Coxen Hole town is right at the pier — a real, workaday Honduran capital rather than a manicured pier village. Most cruisers head straight for a beach.</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>West Bay Beach</strong> — Roatán’s signature beach. About 30–40 minutes by taxi from Coxen Hole (~$6–10/person each way for a shared van; agree the fare first). White sand, calm water, restaurants, beach chairs ~$10–15/day. The family day most cruisers come for.</li>
<li><strong>Snorkel from West Bay Beach</strong> — the reef is 30 yards offshore; bring your own masks and it’s free. Best beach snorkeling on the itinerary for kids who can swim.</li>
<li><strong>Roatán Institute for Marine Sciences (RIMS) dolphin programs</strong> — at Anthony’s Key Resort; $90–180/person. Family-friendly and well-regulated.</li>
<li><strong>Gumbalimba Park</strong> — botanical garden + monkey/iguana encounter + zipline ($40–80/person depending on bundle). The kid-pleaser if the beach day washes out early.</li>
</ul>
<p><strong>Pack for Roatán:</strong> swimsuits, reef-safe sunscreen (locally enforced — the reef is protected), dry bags, packable rain shells, water shoes, $40–60 USD cash in small bills (US Dollar widely accepted; lempiras not necessary), sun hats.</p>
<p><strong>Worth a look on the way in:</strong> the <a href="/ports/roatan.html">Roatán port page</a>, its <a href="/ports/roatan.html#gallery">photo gallery</a>, and the <a href="/ports/roatan.html#logbook">Roatán logbook</a>. Build your day in the <a href="/tools/port-day-planner.html">Port Day Planner</a> before you go ashore.</p>
<h3 id="pk-day-costa-maya">Day 4 — Tuesday, December 8 — Costa Maya, Mexico</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/costa-maya/costa-maya-1.webp" alt="Costa Maya pier complex — purpose-built Mexican cruise port with the Yucatán coast beyond" />
<figcaption aria-hidden="true">Costa Maya pier complex — purpose-built Mexican cruise port with the Yucatán coast beyond</figcaption>
</figure>
<p><strong>Times (MSC app):</strong> 8:00 AM – 5:00 PM. Typical December day: 82/74, with better-than-even odds of a shower somewhere in the day and real sun between them.</p>
<p><strong>Costa Maya — the purpose-built port, for better and worse.</strong> A Mexican government-built cruise port on the Yucatán’s Caribbean coast — purpose-designed for cruise ships. The pier complex is large, manicured, and contains shops, restaurants, a small zoo, swimming pools, and excursion meeting points. It’s the easiest of the Mexican ports — everything walkable from the ship — and the <em>least</em> “authentic Mexico” of the Yucatán cruise ports. That’s not a value judgment; it’s information. <strong>For a family, this is the low-effort day of the week</strong>, and after a Roatán beach day that’s a feature.</p>
<p><strong>Easy-day option (no taxi needed):</strong></p>
<ul>
<li>Stay in the Costa Maya port complex. <strong>Tropicante</strong> beach area is a 10-minute walk from the gangway — chairs $10–15, drinks and food for purchase. The pool complex inside the port is free with your cruise card, shaded, and five minutes from re-boarding for the mid-day nap run.</li>
</ul>
<p><strong>Half-day option:</strong></p>
<ul>
<li><strong>Mahahual village</strong> (~10 min by shared shuttle, ~$4/person each way) — a small fishing town turned cruiser stop. The <em>malecón</em> (waterfront walk) has restaurants, beach access, and shops less crowded than the port complex.</li>
</ul>
<p><strong>Full-day option:</strong></p>
<ul>
<li><strong>Chacchoben Mayan ruins</strong> (~45 min by tour bus). Independent operators outside the pier offer this for ~$50/person; ship excursions run ~$80–100. The one culture stop of the itinerary — smaller and less restored than Tulum but less crowded and closer. A real archaeological site; school-age kids who like temples will remember it.</li>
<li><strong>Bacalar lagoon “Lake of Seven Colors”</strong> — about 1.5 hours each way; full-day excursion only ($120–180/person). Long bus legs — weigh against your kids’ bus tolerance.</li>
</ul>
<p><strong>Pack for Costa Maya:</strong> swimsuits, reef-safe sunscreen, light cover-ups, $40–60 USD cash, small backpack. You can return to the ship for lunch easily.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/costa-maya.html">Costa Maya port page</a>, its <a href="/ports/costa-maya.html#gallery">gallery</a>, and the <a href="/ports/costa-maya.html#logbook">Costa Maya logbook</a>.</p>
<h3 id="pk-day-cozumel">Day 5 — Wednesday, December 9 — Cozumel, Mexico</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/cozumel/cozumel-fom-1.webp" alt="Cozumel waterfront" />
<figcaption aria-hidden="true">Cozumel waterfront</figcaption>
</figure>
<p><strong>Times (MSC app):</strong> 9:00 AM – 7:00 PM. Verify the berth in the app — World America typically docks at one of three piers — <strong>Punta Langosta</strong> (downtown), <strong>International Pier</strong>, or <strong>Puerta Maya</strong>. Cozumel is the most heavily visited Caribbean port; expect several ships in port the same day.</p>
<p><strong>Typical December day:</strong> 81/74 and breezy. One December-specific note: a <strong>norther</strong> (a cold front pushing down the Gulf) can stir the crossing and put chop on the island’s west side — if one is passing, boat-snorkel tours may run bumpy or reschedule, and the calm-water beach parks become the better family call. The ship’s daily program and the tour operators will know; ask morning-of.</p>
<p><strong>Cozumel — the Western Caribbean’s dive capital.</strong> The reef system off Cozumel — protected within Cozumel Reefs National Park since 1996 — delivers visibility consistently among the best in the Caribbean. If anyone in the family has ever wanted to try snorkeling, this is the day. Above water, Cozumel feels touristed in a familiar way — it’s been a cruise stop for 50 years.</p>
<p><strong>Easy-day option (no excursion needed):</strong></p>
<ul>
<li>Stay near your pier. <strong>Punta Langosta</strong> puts you directly in downtown San Miguel — walk, find a real Mexican lunch ($15–25/person at a non-tourist restaurant), shop at <strong>Mercado Municipal</strong> (the local market, NOT the pier shops). International and Puerta Maya are 5–10 minutes from downtown by taxi (~$10).</li>
</ul>
<p><strong>Half-day options:</strong></p>
<ul>
<li><strong>Chankanaab Beach Adventure Park</strong> (~$50/person entry, ~15 min by taxi). Calm water, snorkel rentals, lounger and umbrella. <strong>The best kid-snorkel setup on the itinerary</strong> — protected water, gear on site, facilities at your back.</li>
<li><strong>Paradise Beach</strong> (~$3 entry, free chairs with food/drink minimum, ~15 min by taxi). Lower-key with a real “Mexican beach club” feel.</li>
</ul>
<p><strong>Full-day options:</strong></p>
<ul>
<li><strong>Palancar Reef snorkel tour</strong> — <em>the iconic Cozumel experience.</em> Operators on the pier offer this for $40–60/person (ship excursion: $80–110). Two-hour tour, calm-day dependent in December. Confident swimmers only — Chankanaab is the better call for younger kids.</li>
<li><strong>Tulum ruins</strong> (ferry + bus; $90–150 ship or ~$80 independent). A long day with children; Chacchoben yesterday covers the Mayan itch with far less transit.</li>
</ul>
<p><strong>A note on shopping:</strong> Cozumel’s pier shops sell the same blanket, silver, and vanilla at every Caribbean port. The interesting shopping is at <strong>Mercado Municipal</strong> in San Miguel — vanilla, ceramics, leather, and food vendors at local-shopper prices.</p>
<p><strong>For wheelchair users and limited mobility:</strong> Cozumel is genuinely accessible at the piers. Punta Langosta connects directly to a paved boardwalk into San Miguel. Beach clubs have beach wheelchairs available; ask in advance. Snorkel <em>boats</em> are typically NOT accessible — book a beach-snorkel instead.</p>
<p><strong>Pack for Cozumel:</strong> swimsuits, reef-safe sunscreen, water shoes, sun hats, $60–80 USD cash for entry fees and lunch, waterproof phone case.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/cozumel.html">Cozumel port page</a>, its <a href="/ports/cozumel.html#gallery">gallery</a>, and the <a href="/ports/cozumel.html#logbook">Cozumel logbook</a>.</p>
<p><strong>Wednesday evening:</strong> the late departure means no rush back — all-aboard is likely ~6:30 PM; verify in the app.</p>
<h3 id="pk-day-ocean-cay">Day 7 — Friday, December 11 — Ocean Cay, Bahamas</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/ocean-cay/we-love-ocean-cay-boat-and-lighthouse.webp" alt="The signature view — a “WE ❤ OCEAN CAY” boat-bench on white sand with the red-and-white striped Marine Reserve lighthouse on the spit behind it, beach umbrellas flanking either side" />
<figcaption aria-hidden="true">The signature view — a “WE ❤ OCEAN CAY” boat-bench on white sand with the red-and-white striped Marine Reserve lighthouse on the spit behind it, beach umbrellas flanking either side</figcaption>
</figure>
<p><strong>Times (MSC app):</strong> <strong>8:00 AM – 8:00 PM</strong> — a late-departure call. The public listing used earlier showed 7:00 AM – 6:00 PM; the app’s window departs two hours later into the evening (and runs an hour longer overall), and that 8:00 PM departure is what makes the lighthouse evening show possible (below).</p>
<p>World America <strong>docks alongside</strong> Ocean Cay’s deep-water pier — no tender. Gangway to sand is about 5–10 minutes’ walk.</p>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/ocean-cay/msc-seaside-at-ocean-cay-pier.webp" alt="MSC Seaside (a sister-line ship in the same MSC berth) alongside Ocean Cay’s deep-water pier — World America uses the same dock; no tender" />
<figcaption aria-hidden="true">MSC Seaside (a sister-line ship in the same MSC berth) alongside Ocean Cay’s deep-water pier — World America uses the same dock; no tender</figcaption>
</figure>
<p><strong>Typical December day:</strong> 76/72 — Bahamian winter. Pleasant, breezy, only about 1 in 5 days sees rain. The water is cooler than summer but swimmable; kids will not care, grown-ups will notice. Limited natural shade matters less in December than July, but the sun is still real.</p>
<p><strong>Ocean Cay — from aragonite mine to private island.</strong> MSC’s private island — and only MSC’s. Located in the Bimini chain of the Bahamas, ~65 miles east of Miami. Until 2015 the cay was an industrial aragonite-mining operation. MSC bought it, spent ~$200 million and four years rebuilding it, and opened it in December 2019 as the Ocean Cay MSC Marine Reserve. <strong>Your visit lands almost exactly on the island’s seventh birthday.</strong></p>
<p><strong>Ocean Cay is deliberately different from CocoCay, Half Moon Cay, and Castaway Cay.</strong> No waterpark, no helium balloon, no zip line, no overwater cabanas. What it has instead: an engineered swim lagoon, the lighthouse, the Marine Conservation Center, and seven named beaches with distinct personalities. First-timers expecting waterpark-and-fireworks will call it boring; veterans comparing private islands rate it highly for what it deliberately chooses not to be.</p>
<p><strong>Free with your cruise fare:</strong></p>
<ul>
<li><strong>All seven beaches</strong> — South Beach, Lighthouse Bay, Bimini Beach, Pineapple Beach, Seakers Family Cove, Sunset Beach, Ocean House Beach. All sand, all included, all walkable from the pier or via free tram.</li>
<li><strong>Loungers and umbrellas</strong> at the main beach areas.</li>
<li><strong>Tram service</strong> — runs the spine of the cay, free, accommodates wheelchairs and strollers.</li>
<li><strong>Buffet lunch</strong> at the Marketplace Buffet near the pier (sit-down options at Boho House, Seakers, Smiling Fish — inclusion status varies by venue; verify in the app before counting on a complimentary sit-down).</li>
<li><strong>The Beach Shack</strong> at South Beach — chalkboard menu of cheeseburger, hot dog, fries, chicken nuggets, brownie. 11 AM to 4 PM.</li>
<li><strong>Lighthouse climb</strong> during posted hours.</li>
<li><strong>Marine Conservation Center tours</strong> — scheduled hours, free.</li>
</ul>
<p><strong>Paid add-ons:</strong> cabana rentals (pre-book in the app — typically cheaper than dockside), reserved beach beds, snorkel-gear rental, specialty restaurant covers, Spa Ocean Cay treatments.</p>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/ocean-cay/swim-lagoon-through-breakwater.webp" alt="The engineered swim lagoon viewed through the breakwater — calm, contained turquoise, with South Beach umbrellas visible at the far end" />
<figcaption aria-hidden="true">The engineered swim lagoon viewed through the breakwater — calm, contained turquoise, with South Beach umbrellas visible at the far end</figcaption>
</figure>
<p><strong>The beaches — the family read:</strong></p>
<ul>
<li><strong>Seakers Family Cove</strong> — protected family swim area with reef structure creating shallow zones. <strong>Start here</strong> — best for mixed swimming abilities, no parent-split required.</li>
<li><strong>South Beach</strong> — the center, the busiest, where the Beach Shack and the swim lagoon are.</li>
<li><strong>Bimini Beach and Pineapple Beach</strong> — twin west-side beaches, calmer water, often less crowded.</li>
<li><strong>Lighthouse Bay</strong> — east side, next to the tower. Quieter cove, photogenic.</li>
<li><strong>Ocean House Beach</strong> (far north) — longest walk, least crowded.</li>
<li><strong>Sunset Beach</strong> (south end) — quieter end of the cay.</li>
</ul>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/ocean-cay/lighthouse-from-pier.webp" alt="Ocean Cay’s red-and-white striped lighthouse seen across the cruise pier, with the thatched-roof Lighthouse Bar at its base and the swim-zone buoy line in the channel — the first thing you see from the gangway" />
<figcaption aria-hidden="true">Ocean Cay’s red-and-white striped lighthouse seen across the cruise pier, with the thatched-roof Lighthouse Bar at its base and the swim-zone buoy line in the channel — the first thing you see from the gangway</figcaption>
</figure>
<p><strong>The lighthouse evening show — now genuinely in play.</strong> The 15-minute lighting-and-music performance <strong>runs only on overnight or late-departure calls</strong> — and this sailing’s MSC-app window is <strong>8:00 AM – 8:00 PM, a late departure</strong>. December sunset at Ocean Cay lands around 5:30 PM (approximate for the latitude and season), so there is real darkness before sail-away; whether the full show runs on your call is set by the ship’s program, not this pack — check the daily program aboard. If it runs, <strong>Lighthouse Bay</strong> beach is the watching spot and the World Promenade the shipboard backup. If it doesn’t, the lit tower at sail-away is still the week’s best night photo.</p>
<p><strong>The Marine Conservation Center.</strong> Real, not branding. The MSC Foundation operates it; coral nursery work, turtle-nesting protection on the cay’s beaches. Free tours during scheduled hours; ~6-minute walk from the pier. Ocean Cay carries a Mission Blue Hope Spot designation — and it’s the best 30 minutes of “the ocean is worth taking care of” your kids will get this week.</p>
<p><strong>Pack for Ocean Cay:</strong></p>
<ul>
<li><strong>MSC cruise cards</strong> — required for entry and all purchases. <strong>Cash is not needed on the cay.</strong></li>
<li><strong>Reef-safe sunscreen</strong> — December sun is gentler than summer, still reapply on the kids.</li>
<li><strong>Waterproof phone case</strong> for swim-lagoon photos.</li>
<li><strong>Hats and sunglasses.</strong></li>
<li><strong>Flip-flops AND water shoes</strong> — the limestone shoreline gets rocky away from the swim cove.</li>
<li><strong>A light layer for the sail-away</strong> — December evening on deck is cool.</li>
</ul>
<p><strong>Pitfalls and things to know:</strong></p>
<ul>
<li><strong>Beach Shack vs. sit-down venues.</strong> Beach Shack is hot-dogs-and-nuggets. The buffet and labeled restaurants have real food.</li>
<li><strong>Inclusion status not always clearly posted.</strong> Verify in the app or ask a venue host.</li>
<li><strong>Construction may be visible</strong> on the cay’s south spit.</li>
<li><strong>No passport stamp.</strong> Ocean Cay is a private island; you don’t formally enter the Bahamas.</li>
</ul>
<p><strong>Worth a look:</strong> the <a href="/ports/ocean-cay.html">Ocean Cay port page</a> — extensive coverage of the cay’s history, the beach personalities, the lighthouse show, the accessibility design, and logbook entries from prior visitors.</p>
<h3 id="pk-day-8-saturday-december-12-portmiami-debarkation">Day 8 — Saturday, December 12 — PortMiami (debarkation)</h3>
<p><strong>The realistic timeline:</strong></p>
<ul>
<li><strong>6:00 – 8:00 AM:</strong> Breakfast at the buffet (Il Mercato or La Brasserie). Eat now if your bags went out last night.</li>
<li><strong>~7:00 AM:</strong> Arrival and customs clearance. Self-disembarkation begins for families carrying their own bags.</li>
<li><strong>7:30 – 10:00 AM:</strong> Walk-off in waves. <strong>All passengers off by 10:00 AM</strong> per MSC standard.</li>
</ul>
<p><strong>The bag situation.</strong> The night before, MSC asks you to place checked luggage outside your cabin door by ~11 PM with the color-coded debark tag. Bags go to the terminal overnight; you collect them in baggage claim before customs. With kids, seriously consider self-carry — one wave, no waiting, done.</p>
<p><strong>Carry-on for debark morning:</strong> a change of clothes per person, all medications, passports, chargers, valuables, and anything you can’t bear to lose if a bag is misrouted.</p>
<p><strong>Getting from PortMiami to MIA:</strong> Uber/Lyft $30–45, 20–30 minutes; Saturday-morning surge pricing is real, so pre-book if possible. For a domestic flight after 4 PM, leave PortMiami by 1:30 PM; MIA TSA runs 30–60 min during the Saturday cruise-return rush.</p>
<p><strong>Killing hours before an evening flight:</strong> Bayfront Park / Bayside Marketplace (10-minute walk), Pérez Art Museum ($20, air-conditioned, 15-minute walk), or Brickell by short Uber. PortMiami has no official luggage storage; some Bayside vendors hold bags for $5–10/bag — confirm before counting on it.</p>
<p><strong>And then you’re home — thirteen days before Christmas</strong>, with the laundry done by the ship and the tree still up ahead of you.</p>
