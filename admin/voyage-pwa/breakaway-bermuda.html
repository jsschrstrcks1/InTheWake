<h2 id="pk-section-1">Section 1 — Your Ship: Norwegian Breakaway</h2>
<h3 id="pk-a-big-new-york-themed-ship-christened-by-the-rockettes">A big New-York-themed ship christened by the Rockettes</h3>
<p><a href="/ships/norwegian/norwegian-breakaway.html">Norwegian Breakaway</a> is a <strong>Breakaway-class ship</strong> — 145,655 gross tons, 1,068 feet, 18 decks, 3,963 guests, 1,657 crew. She was <strong>delivered April 25, 2013</strong> by Meyer Werft at Papenburg, Germany, the lead ship of her class (her sister, Norwegian Getaway, followed in 2014). She was <strong>christened May 8, 2013 in New York City, with the Radio City Rockettes as her godmothers</strong> — fitting for a ship whose whole identity is built around New York, from a Peter Max hull design to the Manhattan Room dining room.</p>
<p>This is a genuinely big ship — more than 50% larger than the Norwegian Gem, and one of the largest ever to run the Boston-to-Bermuda route. That scale buys a lot of onboard variety, which matters on an itinerary with three sea days and a cool-weather leg where you may spend real time aboard. A few signatures worth knowing:</p>
<ul>
<li><strong>The Waterfront</strong> — an outdoor oceanfront promenade lined with bars and restaurants that wraps the ship at sea level. On the warm Bermuda leg it’s the best place to be.</li>
<li><strong>The Aqua Park + the ropes course</strong> — a multi-story sports complex high on the ship; the ropes course cantilevers out over the side. Weather-dependent on the cool northern days, glorious approaching Bermuda.</li>
<li><strong>678 Ocean Place</strong> — the three-deck atrium and social hub connecting the main entertainment and dining decks; the orienting landmark and a good group-gathering spot.</li>
<li><strong>The Studio complex</strong> — NCL’s dedicated solo-cabin neighborhood with its own private <strong>Studio Lounge</strong>. More on this in <a href="/admin/voyage-pwa/guides/breakaway-bermuda-guide.html?v=6b1c52d8e1#section-10">Section 10</a>; it’s why this ship is a strong solo pick.</li>
<li><strong>The Cavern Club</strong> — the Beatles-tribute venue, and <strong>Syd Norman’s / the entertainment lineup</strong> for evening variety.</li>
</ul>
<p>For a side-by-side sense of the Breakaway’s scale against other ships you may have sailed, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> shows the real proportions; <a href="/articles/caribbean-cruise-trends-2026.html">Caribbean Cruise Trends 2026</a> covers the wider NCL fleet picture.</p>
<h3 id="pk-dining">Dining</h3>
<p>The Breakaway’s dining map, confirmed against her current <a href="/ships/norwegian/norwegian-breakaway.html">In the Wake ship profile</a>:</p>
<p><strong>Included with your fare (no extra charge):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/the-manhattan-room.html">Manhattan Room</a></strong> — the ship’s grand two-deck main dining room, with a dance floor and floor-to-ceiling stern windows; multi-course, no cover.</li>
<li><strong><a href="/restaurants/ncl/savor.html">Savor</a></strong> and <strong><a href="/restaurants/ncl/taste.html">Taste</a></strong> — the two additional complimentary main dining rooms; same fare, different rooms, shorter waits.</li>
<li><strong><a href="/restaurants/ncl/garden-cafe.html">Garden Café</a></strong> — the buffet; long hours, reliable fallback.</li>
<li><strong><a href="/restaurants/ncl/osheehans.html">O’Sheehan’s</a></strong> — the pub, open essentially around the clock; wings, burgers, and comfort food at any hour. The solo cruiser’s best friend late at night.</li>
</ul>
<p><strong>Specialty dining (extra charge, or via a Specialty Dining Package):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/ocean-blue.html">Ocean Blue</a></strong> — the upscale seafood room (a Geoffrey Zakarian concept); the Breakaway’s signature specialty meal.</li>
<li><strong><a href="/restaurants/ncl/cagneys-steakhouse.html">Cagney’s Steakhouse</a></strong> — NCL’s reliable steakhouse.</li>
<li><strong><a href="/restaurants/ncl/le-bistro.html">Le Bistro</a></strong> — French; the most romantic room aboard and a fine solo-treat night.</li>
<li><strong><a href="/restaurants/ncl/la-cucina.html">La Cucina</a></strong> — Italian.</li>
<li><strong><a href="/restaurants/ncl/teppanyaki.html">Teppanyaki</a></strong> — Japanese hibachi cooked at your table; the communal-seating room where solo diners eat with a small group by design.</li>
<li><strong><a href="/restaurants/ncl/moderno-churrascaria.html">Moderno Churrascaria</a></strong> — Brazilian rodizio.</li>
</ul>
<p><strong>Teppanyaki is the smart solo-dining pick</strong> on the Breakaway for the same reason as on the Gem: the communal table takes the “table for one” question off the table entirely.</p>
<p><strong>Drinks.</strong> NCL’s Premium Beverage Package is commonly bundled into the <strong>“Free at Sea”</strong> promotion at booking. If your group fare included Free at Sea, drinks may already be covered — <strong>verify what’s bundled with Tina.</strong> Bought separately, the package runs on the order of $100+/day per person plus 20% gratuity, breaking even at roughly 5–6 drinks a day. Put your real pattern into the <a href="/drink-calculator.html">drink-calculator</a>; the companion article <a href="/articles/is-drink-package-worth-it.html">Is the drink package worth it?</a> walks the math.</p>
<p><strong>The Day 1 mistake to avoid:</strong> don’t buy an unlimited drink package at the front desk on embarkation afternoon on impulse. Decide before you board, ideally as part of your Free at Sea bundle.</p>
<h3 id="pk-cabin-categories-the-solo-calculus">Cabin categories — the solo calculus</h3>
<p>The group flyer shows three solo tiers: <strong>Solo Studio $1,509 · Ocean View $2,199 · Balcony $2,689.</strong> The Studio is the story here:</p>
<ul>
<li><strong>Solo Studio at $1,509</strong> — this is NCL’s flagship solo product and the reason to consider this ship first. Studios are compact (~100 sq ft), windowless cabins <strong>built for one, with no single supplement</strong> and <strong>private access to the Studio Lounge</strong> — a residents-only social space with free coffee, hosted hours, and scheduled solo meet-and-greets. The price gap tells the story: the Studio is roughly $700 <em>below</em> the next tier because you’re not paying a double-occupancy fare for one person. If budget matters and you sleep fine without a window, this is the clear pick. Once you have a Studio number, run it through the <a href="/stateroom-check.html">stateroom sanity check</a> for noise and motion trouble spots.</li>
<li><strong>Ocean View at $2,199</strong> — a standard cabin with a window, priced at the solo (roughly double-occupancy) rate. You gain daylight and a bit more room; you lose the Studio Lounge and pay a real premium for sailing a two-person cabin alone.</li>
<li><strong>Balcony at $2,689</strong> — a private veranda, again at the solo rate. On the warm Bermuda days a balcony is lovely; on the cool northern leg it matters less. Weigh the ~$1,180 premium over the Studio against how much private outdoor space is worth to you for two warm days.</li>
</ul>
<p><strong>Verify what’s in each tier with Tina</strong> — Free at Sea inclusions can vary by cabin category, which changes the real value more than the sticker prices do. Once chosen, the <a href="/articles/cruise-cabin-organization.html">cabin organization guide</a> covers small-space pragmatics — doubly useful in a compact Studio.</p>
<h3 id="pk-connectivity-at-sea">Connectivity at sea</h3>
<p>NCL Wi-Fi is tier-based and frequently bundled into Free at Sea. The <a href="/internet-at-sea.html">internet at sea guide</a> covers the baselines. Note the roaming picture for this itinerary: <strong>Boston is on your U.S. plan (no roaming); Halifax (Canada) and Bermuda are foreign</strong> — check your carrier’s Canada/Bermuda day-pass rates or use port Wi-Fi. Keep your daily one-line message to a contact ashore going regardless — see <a href="/admin/voyage-pwa/guides/breakaway-bermuda-guide.html?v=6b1c52d8e1#section-6">Section 6</a>.</p>

<h3 id="pk-day-1-sunday-may-30-boston-embarkation">Day 1 — Sunday, May 30 — Boston (embarkation)</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/boston/boston-hero.webp" alt="Boston Harbor and the waterfront — embarkation day for the Norwegian Breakaway" />
<figcaption aria-hidden="true">Boston Harbor and the waterfront — embarkation day for the Norwegian Breakaway</figcaption>
</figure>
<p><strong>Terminal:</strong> <strong>Flynn Cruiseport Boston (Black Falcon Terminal)</strong>, in the South Boston seaport (confirm in the NCL app before sailing).</p>
<p><strong>Getting to the port:</strong></p>
<ul>
<li><strong>Logan International (BOS) → Black Falcon Terminal:</strong> about 15 minutes; rideshare typically $20–30. Boston is a rare port where the airport is genuinely close.</li>
<li><strong>From within Boston:</strong> rideshare or taxi; South Station (Amtrak / bus) is a short ride away if you’re arriving by train.</li>
<li><strong>If driving:</strong> the terminal has paid parking (reserve ahead in peak weeks).</li>
<li><strong>Embark window:</strong> typically early afternoon; the Breakaway sails <strong>~4 PM</strong> past the Boston Harbor Islands.</li>
</ul>
<p><strong>Pre-cruise time in Boston — worth it.</strong> Boston rewards an extra day: the Freedom Trail, Faneuil Hall and Quincy Market, the North End for Italian food. Fly in Saturday May 29 (or earlier), stay downtown, and start the trip unhurried. Confirm Tina’s pre-cruise meetup plans first. The <a href="/ports/boston.html">Boston port page</a> covers the walkable core.</p>
<p><strong>The realistic Day 1 timeline:</strong></p>
<ul>
<li><strong>Check-in</strong> at your assigned window; complete NCL online check-in in advance to skip a queue.</li>
<li><strong>Aboard:</strong> drop carry-ons, lunch at the Garden Café or O’Sheehan’s while cabins are readied.</li>
<li><strong>Cabin ready:</strong> meet your steward; drop bags. Studio guests — find the Studio Lounge; the first meet-and-greet is usually Day 1.</li>
<li><strong>Muster drill:</strong> partly app-based (watch the safety video in the NCL app) plus an in-person station check-in.</li>
<li><strong>Sailaway ~4 PM:</strong> Tina’s group gathers beforehand — watch her communications for the spot. The Boston Harbor Islands slide by as you head out.</li>
<li><strong>Dinner:</strong> join the group’s first dinner if Tina has set one, or eat casual. The night to find the Solo Cruisers meetup.</li>
</ul>
<p><strong>What to pack in your carry-on for Day 1:</strong> a <strong>warm layer</strong> (a Boston harbor evening in late May is cool), swimsuit (pools open before checked bags arrive), <strong>all medications</strong>, a change of clothes, your <strong>travel documents</strong> (see below), phone charger, refillable water bottle. Checked bags may not arrive until evening. <a href="/articles/cruise-embarkation-day-what-to-expect.html">Embarkation Day: What to Expect</a> is the fuller primer.</p>
<p><strong>Documents — the closed-loop rule, with a caveat.</strong> This is a <strong>closed-loop cruise</strong> (round-trip Boston) visiting Canada and Bermuda. U.S. citizens may technically sail on a <strong>birth certificate plus government photo ID</strong>. <strong>But because two foreign countries are involved — including Canada — a passport is strongly recommended here</strong>, and it’s the only document that lets you fly home cleanly if an emergency pulls you off the ship in Halifax or Bermuda. Bring the passport.</p>
<p><strong>Money/card:</strong> your NCL keycard is your ID, room key, and onboard charge account. <strong>Currency aboard: US Dollar.</strong></p>
<h3 id="pk-day-halifax">Day 3 — Tuesday, June 1 — Halifax, Nova Scotia</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/halifax/halifax-1.webp" alt="Halifax, Nova Scotia — the historic Atlantic harbour and waterfront boardwalk" />
<figcaption aria-hidden="true">Halifax, Nova Scotia — the historic Atlantic harbour and waterfront boardwalk</figcaption>
</figure>
<p><strong>Arrival:</strong> ~7:30 AM. <strong>Depart:</strong> ~4:30 PM. The Breakaway docks <strong>downtown on the Halifax Seaport</strong>, steps from the waterfront boardwalk — one of the most walkable cruise arrivals anywhere. No shuttle needed to reach the heart of the city.</p>
<p><strong>Halifax — Nova Scotia’s historic Atlantic capital.</strong> A working harbour city with deep maritime history and an easy, friendly scale. Cool and often overcast in early June; dress in layers.</p>
<p><strong>Free / walkable from the ship:</strong></p>
<ul>
<li><strong>The Halifax Waterfront Boardwalk</strong> — one of the longest urban boardwalks in the world; cafés, the buskers, the harbour views, and local seafood shacks.</li>
<li><strong>The Halifax Public Gardens</strong> and the historic downtown, a short uphill walk.</li>
</ul>
<p><strong>Paid / ticketed:</strong></p>
<ul>
<li><strong>The Halifax Citadel</strong> — the star-shaped 19th-century fortress on the hill above the harbour; the noon gun, the tartan-clad guides, and the best view in the city.</li>
<li><strong>The Maritime Museum of the Atlantic</strong> — home to the finest <em>Titanic</em> collection in the region and the Halifax Explosion exhibit; a strong rainy-day choice.</li>
<li><strong>Peggy’s Cove</strong> — the iconic lighthouse on the granite coast, ~45 minutes each way by tour or taxi; the postcard of Nova Scotia. A half-day.</li>
<li><strong>The Titanic connection</strong> — Halifax recovered many of the <em>Titanic</em>’s victims in 1912, and 121 are buried at <strong>Fairview Lawn Cemetery</strong>, including the grave marked “J. Dawson.” A quiet, moving stop for history readers.</li>
</ul>
<p><strong>For first-time Halifax:</strong> if the weather is fine, Peggy’s Cove is the signature half-day; if it’s raw and grey, the waterfront boardwalk plus the Maritime Museum is a satisfying, walkable day that keeps you near the ship. Worth a look: the <a href="/ports/halifax.html">Halifax port page</a>, its <a href="/ports/halifax.html#gallery">gallery</a>, and the <a href="/ports/halifax.html#logbook">Halifax logbook</a>.</p>
<p><strong>Pack for Halifax:</strong> layers (a fleece or light jacket), a compact rain shell (Maritime weather turns fast), comfortable walking shoes, a little <strong>Canadian cash</strong> or a card for buskers and small shops (Canada uses the Canadian dollar; cards are widely accepted).</p>
<h3 id="pk-day-bermuda-1">Day 5 — Thursday, June 3 — Bermuda, Kings Wharf (overnight)</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/bermuda/bermuda-hero.webp" alt="Bermuda — the pink-sand coast and turquoise water around the Royal Naval Dockyard" />
<figcaption aria-hidden="true">Bermuda — the pink-sand coast and turquoise water around the Royal Naval Dockyard</figcaption>
</figure>
<p><strong>Arrival:</strong> ~10 AM at <strong>Kings Wharf, the Royal Naval Dockyard</strong>, at the island’s western tip. <strong>The ship stays overnight</strong>, so you have all of today, tonight, and tomorrow in Bermuda — the heart of this itinerary.</p>
<p><strong>Bermuda — pink sand and pastel British subtropics.</strong> A British Overseas Territory about 650 miles off the U.S. East Coast, known for its pink-sand beaches, turquoise water, and pastel towns. <strong>Money is easy here:</strong> the Bermudian dollar is <strong>pegged 1:1 to the U.S. dollar</strong>, and both circulate at par — your U.S. cash and cards work everywhere at face value, no conversion math.</p>
<p><strong>Getting around from the Dockyard:</strong> Bermuda’s <strong>ferries and public buses</strong> run from right at Kings Wharf and are the way to see the island — visitors <strong>cannot rent cars</strong> here (the island limits car ownership), so it’s ferries, buses, taxis, and the small two-seat electric “Twizy” rentals or scooters. The fast ferry to Hamilton is a scenic ~20 minutes.</p>
<p><strong>Free or low-cost:</strong></p>
<ul>
<li><strong>Horseshoe Bay Beach</strong> — the famous pink sand, a short bus ride (#7) from the Dockyard; the postcard of Bermuda. Chairs and a beach café on site.</li>
<li><strong>The Royal Naval Dockyard itself</strong> — shops, the Clocktower Mall, the <strong>National Museum of Bermuda</strong> in the old fortifications, and craft studios, all walkable from the ship.</li>
</ul>
<p><strong>Paid / ticketed:</strong></p>
<ul>
<li><strong>A reef snorkel or glass-bottom-boat trip</strong> — Bermuda’s reefs and shipwrecks are the northernmost coral reefs in the Atlantic; clear water, easy snorkeling.</li>
<li><strong>Ferry to Hamilton</strong> — the pastel capital: Front Street shopping, cafés, the small-city waterfront.</li>
<li><strong>Dolphin Quest</strong> at the Dockyard — a paid dolphin-interaction program in the old naval keep.</li>
</ul>
<p><strong>Because you’re overnight, don’t cram today.</strong> A pink-sand beach afternoon at Horseshoe Bay and an evening exploring the Dockyard is a full, happy first day. Save Hamilton and St. George’s for tomorrow. Tina may organize a group dinner ashore or at the Dockyard — watch her communications.</p>
<p><strong>Pack for the day:</strong> swimsuit, reef-safe sunscreen, sun hat, water shoes (some pink-sand coves have rock), a light cover-up, and U.S. cash (works at par). Worth a look: the <a href="/ports/bermuda.html">Bermuda port page</a>, its <a href="/ports/bermuda.html#gallery">gallery</a>, and the <a href="/ports/bermuda.html#logbook">Bermuda logbook</a>.</p>
<h3 id="pk-day-bermuda-2">Day 6 — Friday, June 4 — Bermuda, Kings Wharf (departure day)</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/bermuda/bermuda-1.webp" alt="Bermuda — a pastel town and the turquoise Atlantic beyond" />
<figcaption aria-hidden="true">Bermuda — a pastel town and the turquoise Atlantic beyond</figcaption>
</figure>
<p><strong>A full second morning-to-midday in Bermuda, then an afternoon sailaway.</strong> Confirm the exact all-aboard time — it’s early-to-mid afternoon — and plan your morning around it.</p>
<p><strong>How to use the day:</strong></p>
<ul>
<li><strong>St. George’s</strong> — the UNESCO World Heritage old town at the island’s east end; the oldest continuously inhabited English town in the New World, with narrow lanes, St. Peter’s Church, and the historic square. A ferry or bus ride, but the most historic corner of Bermuda.</li>
<li><strong>The Crystal &amp; Fantasy Caves</strong> — underground pools of astonishing clarity; a guided walk, ~30 minutes, great for a cooler or cloudy morning.</li>
<li><strong>One more pink-sand morning</strong> — Horseshoe Bay or the quieter <strong>Elbow Beach</strong> if you’d rather a beach send-off than a history one.</li>
<li><strong>Golf</strong> — Bermuda has famous courses (Port Royal among them) if that’s your thing and the tee time fits before all-aboard.</li>
</ul>
<p><strong>Mind the clock:</strong> anything at the east end (St. George’s) is a real distance from the Dockyard by ferry/bus, so give yourself a generous buffer to get back for the afternoon all-aboard. This is the day a long east-end excursion can go wrong. Then take the sailaway from deck as Bermuda falls behind.</p>
<h3 id="pk-day-8-sunday-june-6-boston-debarkation">Day 8 — Sunday, June 6 — Boston (debarkation)</h3>
<p><strong>Arrival:</strong> ~8 AM at Flynn Cruiseport.</p>
<p><strong>The realistic timeline:</strong></p>
<ul>
<li><strong>Early breakfast</strong> at the Garden Café or O’Sheehan’s.</li>
<li><strong>Self-disembarkation</strong> after the ship clears; walk-off in waves, typically all guests off by mid-morning.</li>
</ul>
<p><strong>The bag situation.</strong> The night before, place tagged checked luggage outside your cabin door by the posted deadline; bags go ashore overnight and you collect them before customs. Keep a change of clothes, all medications, documents, and valuables in your carry-on.</p>
<p><strong>Getting from Black Falcon Terminal to BOS:</strong> rideshare/taxi ~15 minutes, $20–30 — one of the easiest cruise-to-airport transfers anywhere. If you have hours before a flight, the <a href="/ports/boston.html">Freedom Trail</a>, Faneuil Hall, or the North End are close.</p>

chusetts Itinerary 7 nights / 8 days · Halifax + a Bermuda overnight, round-trip from Boston Foreign stops Two — Halifax (Canada) and Bermuda (British Overseas Territory) Audience Solo travelers (hosted group) Group host Tina Maulsby , Maulsby Travel Co. — tina@maulsbytravel.com · 910-528-5077 (on-ship + booking) Group solo rates Solo Studio $1,509 · Ocean View $2,199 · Balcony $2,689 (per the group flyer; verify with Tina) Dress code NCL smart-casual — no formal nights (one optional “Norwegian’s Night Out”) Currency aboard US Dollar"},{"t":"Ports of call","s":"guide","a":"ports-of-call","x":"The Boston–Bermuda sequence for the May 30 – June 6, 2027 sailing: Boston, Massachusetts — embark Sun May 30 · sailaway ~4 PM Cruising at sea — Mon May 31 Halifax, Nova Scotia — Tue Jun 1 (~7:30 AM – 4:30 PM) Cruising at sea — Wed Jun 2 Bermuda — Kings Wharf — Thu Jun 3 (arrive ~10 AM, overnight in port ) Bermuda — Kings Wharf — Fri Jun 4 (afternoon sailaway) Cruising at sea — Sat Jun 5 Boston, Massachusetts — disembark Sun Jun 6 Verify your specific times in the NCL app. Track the ship’s real position any time from the Ship Tracker ."},{"t":"Section 1 — Your Ship: Norwegian Breakaway","s":"ship","a":"pk-section-1","x":""},{"t":"A big New-York-themed ship christened by the Rockettes","s":"ship","a":"pk-a-big-new-york-themed-ship-christened-by-the-rockettes","x":"Norwegian Breakaway is a Breakaway-class ship — 145,655 gross tons, 1,068 feet, 18 decks, 3,963 guests, 1,657 crew. She was delivered April 25, 2013 by Meyer Werft at Papenburg, Germany, the lead ship of her class (her sister, Norwegian Getaway, followed in 2014). She was christened May 8, 2013 in New York City, with the Radio City Rockettes as her godmothers — fitting for a ship whose whole identity is built around New York, from a Peter Max hull design to the Manhattan Room dining room. This is a genuinely big ship — more than 50% larger than the Norwegian Gem, and one of the largest ever to run the Boston-to-Bermuda route. That scale buys a lot of onboard variety, which matters on an itinerary with three sea days and a cool-weather leg where you may spend real time aboard. A few signatures worth knowing: The Waterfront — an outdoor oceanfront promenade lined with bars and restaurants that wraps the ship at sea level. On the warm Bermuda leg it’s the best place to be. The Aqua Park + the ropes course — a multi-story sports complex high on the ship; the ropes course cantilevers out over the side. Weather-dependent on the cool northern days, glorious approaching Bermuda. 678 Ocean Place — the three-deck atrium and social hub connecting the main entertainment and dining decks; the orienting landmark and a good group-gathering spot. The Studio complex — NCL’s dedicated solo-cabin neighborhood with its own private Studio Lounge . More on this in Section 10 ; it’s why this ship is a strong solo pick. The Cavern Club — the Beatles-tribute venue, and Syd Norman’s / the entertainment lineup for evening variety. For a side-by-side sense of the Breakaway’s scale against other ships you may have sailed, the Ship Size Atlas shows the real proportions; Caribbean Cruise Trends 2026 covers the wider NCL fleet picture."},{"t":"Dining","s":"ship","a":"pk-dining","x":"The Breakaway’s dining map, confirmed against her current In the Wake ship profile : Included with your fare (no extra charge): Manhattan Room — the ship’s grand two-deck main dining room, with a dance floor and floor-to-ceiling stern windows; multi-course, no cover. Savor and Taste — the two additional complimentary main dining rooms; same fare, different rooms, shorter waits. Garden Café — the buffet; long hours, reliable fallback. O’Sheehan’s — the pub, open essentially around the clock; wings, burgers, and comfort food at any hour. The solo cruiser’s best friend late at night. Specialty dining (extra charge, or via a Specialty Dining Package): Ocean Blue — the upscale seafood room (a Geoffrey Zakarian concept); the Breakaway’s signature specialty meal. Cagney’s Steakhouse — NCL’s reliable steakhouse. Le Bistro — French; the most romantic room aboard and a fine solo-treat night. La Cucina — Italian. Teppanyaki — Japanese hibachi cooked at your table; the communal-seating room where solo diners eat with a small group by design. Moderno Churrascaria — Brazilian rodizio. Teppanyaki is the smart solo-dining pick on the Breakaway for the same reason as on the Gem: the communal table takes the “table for one” question off the table entirely. Drinks. NCL’s Premium Beverage Package is commonly bundled into the “Free at Sea” promotion at booking. If your group fare included Free at Sea, drinks may already be covered — verify what’s bundled with Tina. Bought separately, the package runs on the order of $100+/day per person plus 20% gratuity, breaking even at roughly 5–6 drinks a day. Put your real pattern into the drink-calculator ; the companion article Is the drink package worth it? walks the math. The Day 1 mistake to avoid: don’t buy an unlimited drink package at the front desk on embarkation afternoon on impulse. Decide before you board, ideally as part of your Free at Sea bundle."},{"t":"Cabin categories — the solo calculus","s":"ship","a":"pk-cabin-categories-the-solo-calculus","x":"The group flyer shows three solo tiers: Solo Studio $1,509 · Ocean View $2,199 · Balcony $2,689. The Studio is the story here: Solo Studio at $1,509 — this is NCL’s flagship solo product and the reason to consider this ship first. Studios are compact (~100 sq ft), windowless cabins built for one, with no single supplement and private access to the Studio Lounge — a residents-only social space with free coffee, hosted hours, and scheduled solo meet-and-greets. The price gap tells the story: the Studio is roughly $700 below the next tier because you’re not paying a double-occupancy fare for one person. If budget matters and you sleep fine without a window, this is the clear pick. Once you have a Studio number, run it through the stateroom sanity check for noise and motion trouble spots. Ocean View at $2,199 — a standard cabin with a window, priced at the solo (roughly double-occupancy) rate. You gain daylight and a bit more room; you lose the Studio Lounge and pay a real premium for sailing a two-person cabin alone. Balcony at $2,689 — a private veranda, again at the solo rate. On the warm Bermuda days a balcony is lovely; on the cool northern leg it matters less. Weigh the ~$1,180 premium over the Studio against how much private outdoor space is worth to you for two warm days. Verify what’s in each tier with Tina — Free at Sea inclusions can vary by cabin category, which changes the real value more than the sticker prices do. Once chosen, the cabin organization guide covers small-space pragmatics — doubly useful in a compact Studio."},{"t":"Connectivity at sea","s":"ship","a":"pk-connectivity-at-sea","x":"NCL Wi-Fi is tier-based and frequently bundled into Free at Sea. The internet at sea guide covers the baselines. Note the roaming picture for this itinerary: Boston is on your U.S. plan (no roaming); Halifax (Canada) and Bermuda are foreign — check your carrier’s Canada/Bermuda day-pass rates or use port Wi-Fi. Keep your daily one-line message to a contact ashore going regardless — see Section 6 ."},{"t":"Section 2 — Day by Day","s":"guide","a":"section-2","x":"The sequence below is the ship’s published Boston–Bermuda pattern. Verify your specific times in the NCL app. Build each port day in the Port Day Planner before you go ashore, and record what actually happened in the Port Logbook on the way back."},{"t":"Day 1 — Sunday, May 30 — Boston (embarkation)","s":"ports","a":"pk-day-1-sunday-may-30-boston-embarkation","x":"Boston Harbor and the waterfront — embarkation day for the Norwegian Breakaway Terminal: Flynn Cruiseport Boston (Black Falcon Terminal) , in the South Boston seaport (confirm in the NCL app before sailing). Getting to the port: Logan International (BOS) → Black Falcon Terminal: about 15 minutes; rideshare typically $20–30. Boston is a rare port where the airport is genuinely close. From within Boston: rideshare or taxi; South Station (Amtrak / bus) is a short ride away if you’re arriving by train. If driving: the terminal has paid parking (reserve ahead in peak weeks). Embark window: typically early afternoon; the Breakaway sails ~4 PM past the Boston Harbor Islands. Pre-cruise time in Boston — worth it. Boston rewards an extra day: the Freedom Trail, Faneuil Hall and Quincy Market, the North End for Italian food. Fly in Saturday May 29 (or earlier), stay downtown, and start the trip unhurried. Confirm Tina’s pre-cruise meetup plans first. The Boston port page covers the walkable core. The realistic Day 1 timeline: Check-in at your assigned window; complete NCL online check-in in advance to skip a queue. Aboard: drop carry-ons, lunch at the Garden Café or O’Sheehan’s while cabins are readied. Cabin ready: meet your steward; drop bags. Studio guests — find the Studio Lounge; the first meet-and-greet is usually Day 1. Muster drill: partly app-based (watch the safety video in the NCL app) plus an in-person station check-in. Sailaway ~4 PM: Tina’s group gathers beforehand — watch her communications for the spot. The Boston Harbor Islands slide by as you head out. Dinner: join the group’s first dinner if Tina has set one, or eat casual. The night to find the Solo Cruisers meetup. What to pack in your carry-on for Day 1: a warm layer (a Boston harbor evening in late May is cool), swimsuit (pools open before checked bags arrive), all medications , a change of clothes, your travel documents (see below), phone charger, refillable water bottle. Checked bags may not arrive until evening. Embarkation Day: What to Expect is the fuller primer. Documents — the closed-loop rule, with a caveat. This is a closed-loop cruise (round-trip Boston) visiting Canada and Bermuda. U.S. citizens may technically sail on a birth certificate plus government photo ID . But because two foreign countries are involved — including Canada — a passport is strongly recommended here , and it’s the only document that lets you fly home cleanly if an emergency pulls you off the ship in Halifax or Bermuda. Bring the passport. Money/card: your NCL keycard is your ID, room key, and onboard charge account. Currency aboard: US Dollar."},{"t":"Day 2 — Monday, May 31 — Cruising at sea","s":"guide","a":"day-2-monday-may-31-cruising-at-sea","x":"Northeast across the Gulf of Maine toward Nova Scotia. Cool North Atlantic — expect changeable skies and a breeze on deck. Morning: breakfast at the Garden Café or a main dining room; the spa thermal suite (sea-day intro rates); the Studio Lounge coffee hour if you’re in a Studio. Midday: the Aqua Park and ropes course if the weather cooperates — it may be brisk this far north; otherwise the indoor options (spa, casino, 678 Ocean Place). The Halifax port talk. Evening: the group’s dinner if Tina has set one; a production show; the Cavern Club. This is the day the group forms. Teppanyaki, if you book it, is the easiest first solo-dining night."},{"t":"Day 3 — Tuesday, June 1 — Halifax, Nova Scotia","s":"ports","a":"pk-day-halifax","x":"Halifax, Nova Scotia — the historic Atlantic harbour and waterfront boardwalk Arrival: ~7:30 AM. Depart: ~4:30 PM. The Breakaway docks downtown on the Halifax Seaport , steps from the waterfront boardwalk — one of the most walkable cruise arrivals anywhere. No shuttle needed to reach the heart of the city. Halifax — Nova Scotia’s historic Atlantic capital. A working harbour city with deep maritime history and an easy, friendly scale. Cool and often overcast in early June; dress in layers. Free / walkable from the ship: The Halifax Waterfront Boardwalk — one of the longest urban boardwalks in the world; cafés, the buskers, the harbour views, and local seafood shacks. The Halifax Public Gardens and the historic downtown, a short uphill walk. Paid / ticketed: The Halifax Citadel — the star-shaped 19th-century fortress on the hill above the harbour; the noon gun, the tartan-clad guides, and the best view in the city. The Maritime Museum of the Atlantic — home to the finest Titanic collection in the region and the Halifax Explosion exhibit; a strong rainy-day choice. Peggy’s Cove — the iconic lighthouse on the granite coast, ~45 minutes each way by tour or taxi; the postcard of Nova Scotia. A half-day. The Titanic connection — Halifax recovered many of the Titanic ’s victims in 1912, and 121 are buried at Fairview Lawn Cemetery , including the grave marked “J. Dawson.” A quiet, moving stop for history readers. For first-time Halifax: if the weather is fine, Peggy’s Cove is the signature half-day; if it’s raw and grey, the waterfront boardwalk plus the Maritime Museum is a satisfying, walkable day that keeps you near the ship. Worth a look: the Halifax port page , its gallery , and the Halifax logbook . Pack for Halifax: layers (a fleece or light jacket), a compact rain shell (Maritime weather turns fast), comfortable walking shoes, a little Canadian cash or a card for buskers and small shops (Canada uses the Canadian dollar; cards are widely accepted)."},{"t":"Day 4 — Wednesday, June 2 — Cruising at sea","s":"guide","a":"day-4-wednesday-june-2-cruising-at-sea","x":"South across the open Atlantic toward Bermuda — and this is where the water warms. You’ll feel the climate change over the course of the day; by evening the deck is a different world than Halifax that morning. Morning: a slow start; spa; the Bermuda port talk (worth attending for the ferry-vs-bus logistics). Midday: the Aqua Park comes into its own as it warms; The Waterfront for lunch outdoors. Evening: group dinner; a specialty night at Ocean Blue or Le Bistro if you’re treating yourself; the theater. A note on motion: this open-ocean stretch can carry more swell than a coastal cruise. If you’re motion-sensitive, this is the day to have your remedy already workin s for tomorrow. Tina may organize a group dinner ashore or at the Dockyard — watch her communications. Pack for the day: swimsuit, reef-safe sunscreen, sun hat, water shoes (some pink-sand coves have rock), a light cover-up, and U.S. cash (works at par). Worth a look: the Bermuda port page , its gallery , and the Bermuda logbook ."},{"t":"Day 6 — Friday, June 4 — Bermuda, Kings Wharf (departure day)","s":"ports","a":"pk-day-bermuda-2","x":"Bermuda — a pastel town and the turquoise Atlantic beyond A full second morning-to-midday in Bermuda, then an afternoon sailaway. Confirm the exact all-aboard time — it’s early-to-mid afternoon — and plan your morning around it. How to use the day: St. George’s — the UNESCO World Heritage old town at the island’s east end; the oldest continuously inhabited English town in the New World, with narrow lanes, St. Peter’s Church, and the historic square. A ferry or bus ride, but the most historic corner of Bermuda. The Crystal & Fantasy Caves — underground pools of astonishing clarity; a guided walk, ~30 minutes, great for a cooler or cloudy morning. One more pink-sand morning — Horseshoe Bay or the quieter Elbow Beach if you’d rather a beach send-off than a history one. Golf — Bermuda has famous courses (Port Royal among them) if that’s your thing and the tee time fits before all-aboard. Mind the clock: anything at the east end (St. George’s) is a real distance from the Dockyard by ferry/bus, so give yourself a generous buffer to get back for the afternoon all-aboard. This is the day a long east-end excursion can go wrong. Then take the sailaway from deck as Bermuda falls behind."},{"t":"Day 7 — Saturday, June 5 — Cruising at sea","s":"guide","a":"day-7-saturday-june-5-cruising-at-sea","x":"Northwest across the Atlantic back toward Boston, and the water cools again as you go. The last full day. Morning: pack in the calm; a last spa visit; the Aqua Park while it’s still warm-ish. Afternoon: the pool deck, the casino, a final group gathering. Evening: the last-night group dinner; settle your onboard account and set out your tagged debark bags before the deadline."},{"t":"Day 8 — Sunday, June 6 — Boston (debarkation)","s":"ports","a":"pk-day-8-sunday-june-6-boston-debarkation","x":"Arrival: ~8 AM at Flynn Cruiseport. The realistic timeline: Early breakfast at the Garden Café or O’Sheehan’s. Self-disembarkation after the ship clears; walk-off in waves, typically all guests off by mid-morning. The bag situation. The night before, place tagged checked luggage outside your cabin door by the posted deadline; bags go ashore overnight and you collect them before customs. Keep a change of clothes, all medications, documents, and valuables in your carry-on. Getting from Black Falcon Terminal to BOS: rideshare/taxi ~15 minutes, $20–30 — one of the easiest cruise-to-airport transfers anywhere. If you have hours before a flight, the Freedom Trail , Faneuil Hall, or the North End are close."},{"t":"Section 3 — Pre-Cruise Countdown","s":"guide","a":"section-3","x":"Work the countdown page alongside this list if you like a running checklist."},{"t":"6+ months before — booking and big decisions","s":"guide","a":"months-before-booking-and-big-decisions","x":"Confirm the booking with Tina. Cabin category, final price, and what’s in the group rate (Free at Sea — drinks tier, Wi-Fi minutes, specialty dining credits, excursion credit, gratuities). Buy travel insurance. Sensible for any cruise; standard trip-interruption/medical coverage (early June is a low-hurricane-risk window). Plan flights to Boston (BOS). Arrive at minimum the day before sailing (Saturday May 29, 2027). Passport check. Confirm your passport is valid well past June 2027 — strongly recommended for this Canada + Bermuda itinerary."},{"t":"4 months before — soft logistics","s":"guide","a":"months-before-soft-logistics","x":"NCL online check-in in the NCL app; complete the health questions close to sailing. Specialty dining reservations. Ocean Blue, Le Bistro, and Teppanyaki fill first. Book one for a sea day when the rhythm has settled. Excursions. Book Halifax (Peggy’s Cove) and Bermuda (snorkel, St. George’s, Crystal Caves) tours in advance; Bermuda beach days need no booking."},{"t":"2 months before — final commitments","s":"guide","a":"months-before-final-commitments","x":"Confirm gratuities — pre-paid in your group rate or billed aboard (see Section 5 ). Drink / Wi-Fi packages if Free at Sea didn’t include the tier you want — decide with the drink-calculator . Confirm pre-cruise hotel and begin the packing list . The packing-lists hub has printable versions."},{"t":"1 month before — final prep window","s":"guide","a":"month-before-final-prep-window","x":"Photocopy your passport — keep the copy in your cabin, separate from the original. Print the emergency handoff card and share it with one trusted person ashore. Confirm Tina’s group rhythm — sailaway gathering, Day 1 dinner, any Bermuda group plans."},{"t":"14 days before","s":"guide","a":"days-before","x":"NCL online check-in closes ahead of sailing — complete it early. Save boarding documents offline in the NCL app. Begin physical packing — remember: warm Bermuda kit and a cool-weather Boston/Halifax layer."},{"t":"Day before — Boston arrival","s":"guide","a":"day-before-boston-arrival","x":"Fly into BOS Saturday May 29. Check into your hotel ; confirm Sunday-morning porter/rideshare timing."},{"t":"Section 4 — Packing List (calibrated for a two-climate late-spring sailing)","s":"guide","a":"section-4","x":"This is the packing section to read carefully, because this itinerary spans two climates. You need a real cool-weather kit for Boston and Halifax (late-May highs in the 60s, evenings in the 40s–50s) and warm-water beachwear for Bermuda (mid-70s, sunny, pink sand). Pack for both. Boston embarkation / debarkation: mild-to-cool, breezy harbor (52–68°F). Sea day north (Day 2): cool North Atlantic. Halifax: cool, often overcast, changeable (48–60°F). Sea day south (Day 4) + Bermuda: warming to warm (Bermuda ~68–77°F, sunny). Sea day north (Day 7): cooling again. Dress culture: NCL smart-casual; no formal nights."},{"t":"Documents and money","s":"guide","a":"documents-and-money","x":"Passport (strongly recommended for this Canada + Bermuda itinerary) Photocopy of your passport (separate location) Travel insurance policy + emergency phone number (printed) Credit card + debit card (separate locations) $200–300 USD cash — works at par in Bermuda; a little Canadian cash or a card for Halifax NCL boarding documents (saved offline in the NCL app) Group itinerary from Tina"},{"t":"Carry-on (must arrive on the ship with you)","s":"guide","a":"carry-on-must-arrive-on-the-ship-with-you","x":"All medications in original prescription bottles Phone + charger + power bank Refillable water bottle A warm layer (Boston/Halifax; ship AC) and a packable rain shell Swimsuit (pools open before checked bags arrive) Change of clothes (in case a checked bag is delayed) Sunglasses, sun hat, reef-safe sunscreen (Bermuda)"},{"t":"Daytime — cool (Boston, Halifax, northern sea days)","s":"guide","a":"daytime-cool-boston-halifax-northern-sea-days","x":"1 warm jacket or fleece (Halifax mornings, breezy deck) 2–3 long-sleeve shirts / light sweaters (layering) 1–2 pairs long pants / jeans A packable rain shell or compact umbrella (Maritime weather turns fast) Genuinely comfortable walking shoes — Halifax boardwalk, Boston cobbles"},{"t":"Daytime — warm (Bermuda + pool)","s":"guide","a":"daytime-warm-bermuda-pool","x":"2–3 swimsuits 1–2 swim cover-ups 2–3 quick-dry t-shirts / shorts Water shoes (some pink-sand coves have rock; reef snorkeling) Reef-safe sunscreen and a brimmed hat"},{"t":"Evening — ship dining","s":"guide","a":"evening-ship-dining","x":"4–5 smart-casual outfits — NCL’s evening code is American smart casual 1 dressier outfit for “Norwegian’s Night Out” or a specialty night (no formalwear needed) Comfortable shoes for carpeted corridors"},{"t":"Toiletries","s":"guide","a":"toiletries","x":"All prescription medications (original bottles, carry-on) OTC standbys: Tylenol, Advil, Imodium, Benadryl, Bonine or Dramamine ( Section 7 ) Reef-safe sunscreen (SPF 30+); after-sun aloe; lip balm with SPF Toothbrush, toothpaste, deodorant, basics"},{"t":"Accessories and essentials","s":"guide","a":"accessories-and-essentials","x":"Polarized sunglasses; brimmed sun hat (Bermuda) Small daypack for port days Waterproof phone case (Bermuda snorkel; Halifax rain) Small dry bag (~5L) for the beach day Power adapter (US outlets aboard; standard US plugs fine — Bermuda also uses US-style plugs) Pen + small notebook if you keep a logbook"},{"t":"Skip — what NOT to bring","s":"guide","a":"skip-what-not-to-bring","x":"Iron or steamer — prohibited in cabins; the ship provides facilities Candles — prohibited (fire hazard) Heavy jewelry — leave high-value pieces home Formalwear — no formal nights on NCL A rental-car reservation for Bermuda — visitors can’t rent cars there; it’s ferries, buses, taxis, and scooters"},{"t":"Section 5 — Budget Breakdown","s":"guide","a":"section-5","x":"The numbers below are calibrated for this specific sailing. For a total tuned to your own cabin, drinking habits, excursion appetite, and tipping pattern, the cruise-budget-calculator builds a personalized figure — usually within about 5% of what you’ll actually spend if you input honestly."},{"t":"What’s included in your fare","s":"guide","a":"whats-included-in-your-fare","x":"The group rate covers: Your cabin (Solo Studio, Ocean View, or Balcony per the flyer) All meals at the Manhattan Room, Savor, Taste, the Garden Café, and O’Sheehan’s Soft drinks, juice, coffee, tea at most venues Onboard entertainment, pools, hot tubs, Aqua Park, ropes course, fitness center Cabin steward and dining-room service; Studio Lounge access for Studio guests If your group rate has Free at Sea attached: likely includes the Premium Beverage Package, Wi-Fi minutes, specialty dining credits (typically 2–4 meals), and shore-excursion credit. Verify with Tina."},{"t":"What’s NOT included","s":"guide","a":"whats-not-included","x":"Category Typical cost (per person, week) Auto-gratuity (if not pre-paid) ~$140 — $20/person/day × 7 (Studio/OV/Balcony); $25/day Haven/Suites Drinks package (if not in Free at Sea) $700+ at pre-cruise rates (~$100/day × 7 + 20% gratuity) Wi-Fi package (if not in Free at Sea) $120–280 — varies by tier Specialty dining (beyond Free at Sea credits) $0–300 — Ocean Blue, Cagney’s, Le Bistro, Teppanyaki, Moderno per meal Halifax excursion $0–90 — Peggy’s Cove tour $50–90; Citadel ~$12; Maritime Museum ~$10; waterfront free Bermuda — beach & ferry $0–40 — bus/ferry day pass ~$19; Horseshoe Bay free (chair rental extra) Bermuda — snorkel / boat tour $60–110 Bermuda — Crystal Caves / attractions $25–40 Spa treatments $0–400 — massages $130–200; thermal day pass ~$40 Travel insurance $70–160 per person Pre-cruise hotel (Boston) ~$180–280 (Boston runs pricey) Airport transfers BOS ↔︎ port ~$40–60 round trip"},{"t":"A realistic mid-range solo budget (per person, on top of cruise fare)","s":"guide","a":"a-realistic-mid-range-solo-budget-per-person-on-top-of-cruise-fare","x":"Item Cost Auto-gratuity ($20 × 7) $140 Wi-Fi (if not bundled) $120 Drinks (if not bundled — moderate drinker) $400 Specialty dining (one Ocean Blue or Le Bistro night) $60 Halifax: Peggy’s Cove tour + lunch $80 Bermuda: transit pass + snorkel + lunch $120 Bermuda: Crystal Caves or St. George’s day $40 Travel insurance $100 Pre-cruise hotel (Boston) $220 Airport transfers $50 Total above fare ~$1,330 Frugal version (Studio cabin, Free at Sea bundles drinks + Wi-Fi, beach-and-boardwalk days, packed lunches): ~$450 above fare . Splurge version (balcony already booked, spa days, private Bermuda tours, the full drink package): $1,900–3,000 above fare . The cruise-tipping-calculator covers the gratuity math; Cruise Tipping 2026 is the broader 2026 context."},{"t":"Section 6 — Emergency Contacts","s":"guide","a":"section-6","x":"Every Voyage Pack ships with this section. Fill in the handoff card and share it with one trusted person ashore."},{"t":"The family handoff card","s":"guide","a":"the-family-handoff-card","x":"FAMILY HANDOFF — IN THE WAKE VOYAGE PACK ───────────────────────────────────────── CRUISER: ________________________ CABIN: ____________ SHIP: Norwegian Breakaway LINE: Norwegian Cruise Line (NCL) SAILING: May 30 – June 6, 2027 FROM: Flynn Cruiseport Boston (Black Falcon Terminal), Boston, MA, USA ITINERARY: Boston → Halifax (Canada) → Bermuda / Kings Wharf (overnight) → Boston GROUP HOST: Tina Maulsby, Maulsby Travel Co. tina@maulsbytravel.com · 910-528-5077 EMERGENCY (24/7) — US State Dept, Overseas Citizens Services (can locate the ship and contact NCL through official channels): +1 (888) 407-4747 (US/Canada) +1 (202) 501-4444 (from abroad) SHIP-TO-SHORE (non-emergency messages only): NCL paid ship-phone relay: +1 (888) 627-4477 (credit card required; per-minute rate) NEAREST CONSULATE BY PORT: Boston, MA — US domestic; call 911 Halifax, NS — US Consulate General Halifax: +1 (902) 429-2480 Bermuda — US Consulate General Hamilton: +1 (441) 295-1342 After-hours US-citizen emergency duty officer: +1 (441) 335-3828 (Bermuda local emergency: 911) CRUISER MEDICAL: Allergies: ________________________ Medications: ________________________ Conditions: ________________________ Insurance: ________________________ policy: ____________ MOST RECENT KNOWN POSITION: Track at: /tools/ship-tracker.html or marinetraffic.com (search \"Norwegian Breakaway\") ─────────────────────────────────────────"},{"t":"What an at-home contact does","s":"guide","a":"what-an-at-home-contact-does","x":"If they don’t hear from you for 36+ hours: Don’t panic. Cruise Wi-Fi is unreliable; silence usually means signal, not emergency. For a true emergency, call the State Department’s Overseas Citizens Services line (above) — they can locate the ship and reach NCL through official channels at no cost. For a non-urgent message, NCL’s paid ship-phone relay connects to the onboard phone system. Reach Tina at tina@maulsbytravel.com or 910-528-5077 — she’s both your booking agent and your on-ship host. If there’s been an incident: US Coast Guard for US waters; US Consulate General Halifax for Canada; US Consulate General Hamilton for Bermuda; ship’s medical for health emergencies. Track the ship’s position at /tools/ship-tracker.html ."},{"t":"What you should pack for emergencies","s":"guide","a":"what-you-should-pack-for-emergencies","x":"Printed list of medications, allergies, and emergency contacts (in your cabin) Photocopy of your passport (separate from the passport) Travel insurance policy number (printed) This handoff card, in your phone’s notes app and shared with one trusted person ashore"},{"t":"Section 7 — Seasickness + North Atlantic Weather","s":"guide","a":"section-7","x":""},{"t":"What the weather actually does this week","s":"guide","a":"what-the-weather-actually-does-this-week","x":"Hurricane risk is low. The season opens June 1, but the first week of June is one of its quietest stretches; Bermuda’s real exposure is August–October. Don’t let the calendar technicality alarm you. The North Atlantic is cool and changeable on the Boston/Halifax leg — layers and a rain shell earn their place. Halifax especially can turn from sun to fog to drizzle in an afternoon. Bermuda is warm and bright — mid-70s, trade-wind breezy, the payoff of the itinerary. The open-ocean crossings (Days 4 and 7) cross deep Atlantic water and can carry more swell than a coastal cruise. This is the itinerary’s main motion exposure."},{"t":"Seasickness onboard","s":"guide","a":"seasickness-onboard","x":"A big Breakaway-class ship is stable, but the two open-Atlantic days can be felt. If you’re motion-sensitive, start your remedy the night before the southbound crossing (Day 4) — prevention beats treatment. Bonine (meclizine) — once-daily, less drowsy than Dramamine. Sea-Bands (acupressure wristbands) — many find them effective. Ginger (capsules, tea, candies) — mild but real. Scopolamine patches (prescription, behind-the-ear) — the strongest option; 3-day duration; put one on before the Bermuda crossing. Stay mid-ship and low in your cabin choice — mid-ship, lower-to-middle decks feel the least motion. (Worth weighing if you’re prone: an interior Studio mid-ship may ride easier than a high forward balcony.) The article Cruise Seasickness: What Actually Works goes deeper on timing and options."},{"t":"If weather changes a port","s":"guide","a":"if-weather-changes-a-port","x":"Halifax is a sheltered downtown dock and rarely weather-blocked; Bermuda’s Kings Wharf is exposed to open Atlantic and, very occasionally, a call is shortened or a tender arrangement changes in rough conditions — unlikely in early June, but possible. If a port is skipped, NCL typically refunds prepaid ship-sold excursions to your onboard account; independent-operator bookings are between you and the operator, so screenshot every confirmation before you sail."},{"t":"Section 8 — Practical Logistics","s":"guide","a":"section-8","x":""},{"t":"Cell service and roaming","s":"guide","a":"cell-service-and-roaming","x":"At sea — ship Wi-Fi only; keep airplane mode ON. Cellular via the ship’s onboard tower roams at a steep per-minute rate. Boston — your regular U.S. plan, no roaming (Days 1 and 8). Halifax, Canada — foreign roaming; check your carrier’s Canada day-pass (T-Mobile often includes Canada; Verizon/AT&T sell ~$10/day passes). Bermuda — foreign roaming; Bermuda day-pass rates vary by carrier, or use port/Dockyard Wi-Fi. The internet at sea guide has the cross-line detail."},{"t":"Currency","s":"guide","a":"currency","x":"Aboard: US Dollar. Halifax, Canada: Canadian dollar (CAD); cards widely accepted, a little cash handy for buskers and small shops. USD is sometimes accepted but at a poor rate — use CAD or a card. Bermuda: Bermudian dollar (BMD), pegged 1:1 to the USD ; U.S. cash and cards accepted everywhere at par. No conversion needed — the easiest money of any port in this series."},{"t":"Tipping ashore","s":"guide","a":"tipping-ashore","x":"Halifax, Canada: standard North American tipping — 15–20% on restaurant bills, a few dollars for tour guides and drivers, a coin or two for buskers. Bermuda: many restaurants add a service charge (~17%) automatically — check the bill before adding more; $5–10/person for a half-day tour or boat guide; a dollar or two for taxi help with bags."},{"t":"Onboard tipping","s":"guide","a":"onboard-tipping","x":"NCL’s daily service charge for bookings made on or after January 1, 2023 is $20 per person, per day for standard cabins (Club Balcony Suite and below — which covers Solo Studio, Ocean View, and Balcony on this sailing) and $25 per person, per day for The Haven and Suites. Verify with Tina whether your group rate has it pre-paid. NCL also adds a 20% gratuity automatically to beverages, specialty dining, and spa. Extra cash for standout service is appreciated but not expected: Stateroom attendant: $20–40 cash at the end of the week A bartender who remembers your order: $1–2 per drink in cash The cruise-tipping-calculator runs the total; Cruise Tipping 2026 is the broader 2026 context."},{"t":"Section 9 — The Group Cruise Rhythm","s":"guide","a":"section-9","x":"Tina is both your booking agent and your on-ship host. She sets the rhythm. The typical pattern: Day 1 sailaway — Tina hosts a gathering before the ~4 PM departure. Watch her communications for the exact spot and time. A standing group dinner — Tina usually anchors the group with a nightly dinner (often at one of the main dining rooms) so people can find each other. Show up to whichever nights work; free with your fare, no per-night reservation. The Bermuda overnight — a natural night for a group dinner ashore or at the Dockyard if Tina organizes one. Group activities — she may add a specialty dinner, hosted trivia, or a spa day; check her communications. Studio Lounge — if you’re in a Studio, solo cruisers cluster here regardless of who’s hosting; NCL schedules a Studio meet-and-greet on Day 1. Last-night dinner — the Saturday-night gathering (final sea day) is the traditional send-off. How to find Tina on Day 1. Watch her email or Facebook for the sailaway spot and time. If you don’t see anything before boarding, the Studio Lounge (for Studio guests) or 678 Ocean Place near sailaway is the likeliest place to find the group."},{"t":"How the group actually works — the unwritten part","s":"guide","a":"how-the-group-actually-works-the-unwritten-part","x":"The schedule above is the written part. The unwritten part is what most first-time hosted-group cruisers actually wonder about, so here it is plainly: Every event is opt-in, and opting out costs you nothing. Skip tomorrow’s dinner to eat at O’Sheehan’s with a book? Nobody logs it. The standing dinner exists so the group can find each other at a predictable time — not so attendance can be taken. “No thanks, I’m doing my own thing today” is a complete sentence. On a solo group cruise, everyone aboard has needed alone-time — they recognize it and don’t take it personally. Tina won’t either. That matters on the two Bermuda days, where you might want a whole day to yourself on a pink beach. Dinner-table norms. Sit anywhere the group is sitting; no fixed seating, no group menu. On nights you skip the group, O’Sheehan’s and the Garden Café make solo dining low-friction, and Teppanyaki seats you with others by design. Port-day friendliness is not a port-week commitment. Sharing a taxi to Peggy’s Cove doesn’t obligate you to anyone’s Bermuda plan. Pairings form and re-form all week; that’s the design. A group this size produces a few real connections, not a crowd of them. A hosted solo week tends to yield two or three friendships that outlast the trip and a circle of friendly faces. Don’t measure the week against “everyone became best friends.”"},{"t":"Section 10 — Solo Cruising Considerations","s":"guide","a":"section-10","x":"The Breakaway is one of the strongest ships at sea for solo cruising, because of the Studio complex — a dedicated neighborhood of solo cabins with a private lounge: Studio cabins with no single supplement — you pay for one person, not a double-occupancy fare (that’s why the flyer’s Studio price is far below the other tiers). The strongest solo-value cabin product in the fleet. The Studio Lounge — a residents-only space with free coffee, hosted hours, and scheduled solo meet-and-greets. The daily social anchor; solos cluster here independent of any group meetup. O’Sheehan’s — always open, no table-for-one question at any hour. Teppanyaki — communal seating means you dine with others whether or not you booked alone. The Waterfront and 678 Ocean Place — big, populated social spaces where you can be alone in company without it feeling like it. For first-time solo cruisers: Tina runs welcoming, low-pressure group cruises. Show up when you want, skip when you want. The Studio meet-and-greet (Day 1) is the easiest way to find your people in the first 24 hours. The Solo Cruising Practical Guide covers the broader rhythm and the small social moves that make a solo week feel right. Solo cruising stories. Tina has written extensively on solo cruising — her solo cruising hub collects the practical, the emotional, and the social rhythms across multiple sailings. Worth reading whether before, during, or after this trip."},{"t":"If you’re sailing this one to mark a transition","s":"guide","a":"if-youre-sailing-this-one-to-mark-a-transition","x":"Some readers of this pack are solo because of where life has put them — a recent loss, a marriage that ended, a long stretch of caregiving that finally has a quiet week in it. This is a gentle itinerary for that kind of trip: unhurried sea days, a walkable Maritime city, and two warm days on a pink-sand island. There’s room here to be quiet and room to be found. Tina’s broader writing on the solo hub — particularly In the Wake of Grief — names this directly; this pack won’t repeat what she’s already said well. If that’s why you booked, the resources are there to read at your pace."},{"t":"Solo safety — cabin and onboard","s":"guide","a":"solo-safety-cabin-and-onboard","x":"Solo cruising is overwhelmingly safe — cruise ships are among the most surveilled travel environments anywhere, with CCTV in common areas, 24-hour security, controlled deck access, and crew trained in emergency response. The Cruise Vessel Security and Safety Act (US federal law since 2010) mandates camera coverage and reporting obligations. None of this makes risk zero, but the baseline is high. A few habits still make sense: Your cabin door. Use the deadbolt and privacy latch at night. Some solo cruisers add a portable door wedge — under $10, takes no space, and calming for anyone who sleeps uneasily in an unfamiliar room. Ashore — normal travel sense. Halifax and Bermuda are both very safe, low-crime destinations; the usual habits apply (well-lit streets at night, an eye on your bag). In Bermuda, if you rent a scooter — a popular way to get around — go slowly: left-side driving and narrow roads catch visitors out, and scooter scrapes are the island’s most common tourist injury. Share your itinerary before sailing. Send the day-by-day to one trusted person ashore, with your cabin number once assigned and your insurance policy number. The family handoff card in Section 6 is built for exactly that. Friendliness is not obligation. A good conversation in the Studio Lounge is not an invitation to dinner; a shared dinner is not an invitation to a port day. You set the pace, and on a hosted solo cruise declining doesn’t fracture anything — see Section 9 . If something feels off, Guest Services and the 24-hour security desk respond fast. Most solo cruisers go a lifetime without needing this; the option exists if you do."},{"t":"Section 11 — First Cruise Notes","s":"guide","a":"section-11","x":"If this is your first cruise of any kind, the first-cruise guide is the deeper read. A few foundational notes: The cabin is small. A Studio is genuinely compact; even a balcony cabin is smaller than a budget hotel room. You’re not living in it; you’re sleeping in it. The ship is your living room — and on a ship this big, that living room is enormous. You can’t get lost. Every elevator lobby has a deck map, and any crew member can point you. On an 18-deck ship it takes a day to learn; 678 Ocean Place (mid-ship) is the orienting landmark. You don’t need to book everything ahead. Most days unfold with significant unplanned time. That’s by design — and the Bermuda overnight especially rewards leaving room to wander. Tipping is built in. Beyond the daily service charge you don’t need to tip every interaction; a few dollars to a great bartender or steward at the end of the week is appreciated, not expected. Don’t try to do everything. Two days in Bermuda is enough to do what matters if you don’t try to do all of it. Pick a few things and let the rest be next time. The thing nobody tells first-timers: the best moments are usually unplanned — the exact moment the water turns Bermuda-turquoise on the crossing, the busker on the Halifax boardwalk, the conversation at O’Sheehan’s at midnight. The Cruising Duck tradition is the one piece of cruise culture worth knowing in advance — bring or hide a few rubber ducks if you want a friendly, accidental social ritual. Leave room for that."},{"t":"Closing","s":"guide","a":"closing","x":"This pack is the calm read on one specific week — yours. Soli Deo Gloria. All work on this project is offered as a gift to God. The site that produced it is independent — no affiliate links, no commissions, no upsells. If it helped you, that’s the whole point. Safe sailing. Last reviewed | 2026-07-06 | How facts here are checked | Every ship spec, price, date, cont
