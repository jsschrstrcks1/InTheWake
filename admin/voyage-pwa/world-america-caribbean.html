<h2 id="pk-section-1">Section 1 — Your Ship: MSC World America</h2>
<h3 id="pk-a-class-defining-ship-in-her-second-year-of-service">A class-defining ship in her second year of service</h3>
<p><a href="/ships/msc/msc-world-america.html">MSC World America</a> was delivered March 27, 2025 by Chantiers de l’Atlantique at Saint-Nazaire, France — the second ship of MSC’s <strong>World Class</strong> and the first dedicated to the US market. Her maiden voyage left PortMiami on April 12, 2025. By your April 2027 sailing she’s two years into service: past any new-ship teething, with the operating crew well-trained and the Caribbean rotation in steady rhythm. For broader context on MSC’s positioning in the Caribbean alongside Royal, NCL, and Virgin, <a href="/articles/caribbean-cruise-trends-2026.html">Caribbean Cruise Trends 2026</a> covers the deployment shifts.</p>
<p>She was christened by actress <strong>Drew Barrymore</strong> at PortMiami on April 9, 2025, with Orlando Bloom on hand and Gloria Estefan performing a concert from the deck. At <strong>216,638 GT and 1,093 feet long</strong>, she’s MSC’s largest ship and one of the largest cruise ships in the world. Her direct sister is <a href="/ships/msc/msc-world-europa.html">MSC World Europa</a> (2022), homeported in the Mediterranean. For a side-by-side comparison against other Caribbean megaships you may have sailed (Symphony of the Seas, Norwegian Aqua, Carnival Mardi Gras, etc.), the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> shows the actual relative scale on a single chart.</p>
<h3 id="pk-whats-distinctive-about-world-america">What’s distinctive about World America</h3>
<p>A few features set her apart from anything else sailing in 2027:</p>
<ul>
<li><strong>The Y-shaped aft.</strong> Most ships have a flat stern. World America’s stern is a wedge — a Y-shape with three floor-to-ceiling glass walls that frame the wake. The <strong>World Promenade</strong> (Deck 8) is the seven-deck outdoor walkway that wraps the aft Y, with bars and seating at the rail. The Panorama Lounge above it puts the same view behind a glass wall for cooler evenings.</li>
<li><strong>The World Galleria</strong> — a three-deck central atrium with an LED ceiling that changes scenes throughout the day. The architectural centerpiece of the ship.</li>
<li><strong>The Venom Drop @ The Spiral</strong> — an 11-deck dry slide, the longest at sea. Not a waterslide — a dry, friction-controlled enclosed drop. Free.</li>
<li><strong>Eataly at sea.</strong> World America carries the first floating Eataly — the Italian gourmet brand’s fresh-pasta, wood-fired-pizza, and gelato concept. Specialty dining (extra charge). On Deck 8.</li>
<li><strong>Decks named after Americas port cities</strong> — Cozumel, Nassau, Santos, Miami, Seattle, Halifax, Los Angeles, Buenos Aires, New York, Ocean Cay, San Juan, Ocho Rios. Wayfinding gets easier once you’ve learned the geography metaphor.</li>
<li><strong>LNG-powered.</strong> Dual-fuel engines plus Bloom Energy solid-oxide fuel cells. She burns natural gas, not heavy fuel oil — significantly lower particulate emissions. Practically: less engine vibration in lower-deck cabins; the working ports below the buffet are quieter.</li>
</ul>
<h3 id="pk-whats-not-on-world-america">What’s NOT on World America</h3>
<p>Things you might expect from her size that she doesn’t have:</p>
<ul>
<li><strong>No Cirque du Soleil.</strong> MSC’s longstanding Cirque partnership ended before her delivery; she launched without it. The replacement is in-house production shows at the <strong>World Theatre</strong> and a new comedy/karaoke lounge called <strong>The Loft</strong>.</li>
<li><strong>No waterpark.</strong> There’s an Aqua Park (water-play features for kids and an outdoor pool deck) but nothing on the scale of Royal’s Perfect Day at CocoCay or Carnival’s Excel-class waterworks. The big aft attraction is the Venom Drop dry slide, not waterslides.</li>
<li><strong>No traditional formal nights.</strong> MSC has a “Gala Evening” once or twice per sailing (suit/cocktail-dress encouraged) but it’s softer than the legacy “formal night” of Holland America or Cunard. Most guests dress smart-casual all week and put on something nicer on Gala Evening.</li>
</ul>
<h3 id="pk-cabin-categories-the-solo-calculus">Cabin categories — the solo calculus</h3>
<p><strong>Before you commit, check the cabin on the deck plan</strong> against the seven trouble spots in our <a href="/articles/stateroom-sanity-check.html">stateroom sanity check guide</a>: under the pool deck, over the theater, by the galley or the elevator bank, far forward, behind a lifeboat, or on a connecting door. Our cabin-by-cabin checker does not cover MSC ships yet, so the deck plan is the check. The cabin-organization article (<a href="/articles/cruise-cabin-organization.html">cruise-cabin-organization</a>) covers the small-space pragmatics once you’ve chosen.</p>
<p>The group flyer shows four price points: <strong>Solo Studio $1,068</strong>, <strong>Ocean View $1,358</strong>, <strong>Interior $1,623</strong>, <strong>Balcony $2,225</strong>. How the four price points compare:</p>
<ul>
<li><strong>Solo Studio at $1,068</strong> is the price-leader and the obvious choice if budget matters more than space. MSC’s solo-traveler offering on World America is functionally a small interior cabin priced without a single supplement. You’re trading square footage and a window for the lowest possible solo price on a brand-new ship. If you’re a confident solo traveler who’ll be in the cabin to sleep, shower, and change, this is the rate to take.</li>
<li><strong>Interior at $1,623</strong> is <em>more expensive</em> than the Ocean View — verify with Tina that this isn’t a typo on the flyer. Standard MSC pricing has Ocean View above Interior, not the other way around. The flyer is the flyer; if the numbers are correct as posted, the Ocean View is the better value of the two.</li>
<li><strong>Ocean View at $1,358</strong> is a real upgrade over Solo Studio: a window cabin, daylight in the morning, the world feeling different. For a $290 upcharge on a solo week, this is the value pick for most solo cruisers who’d appreciate a window.</li>
<li><strong>Balcony at $2,225</strong> is the bigger jump. A private outdoor space matters more on a Caribbean cruise than on Alaska — sea-day sunrises, port-day return-from-shore decompression, evenings on the balcony with a book. If the differential is workable, the balcony changes the texture of the week.</li>
</ul>
<p><strong>MSC Yacht Club is not on the flyer at these rates.</strong> Yacht Club is MSC’s ship-within-a-ship suite product — 159 suites on World America, private restaurant, private pool deck, private bar, butler service, full embarkation lounge at the terminal. If you want to inquire about Yacht Club for this sailing, contact Tina; pricing is significantly higher than the published group rates, and inventory at booking time will determine availability.</p>
<p>Before you commit to a specific cabin number, walk through the deck plan with accessibility, motion, noise, and view considerations against your category. The <a href="/articles/cruise-cabin-organization.html">cabin organization article</a> covers the cross-line basics; MSC’s own deck plan (linked from World America’s page) is the source of truth for layouts.</p>
<h3 id="pk-dining">Dining</h3>
<p>World America has <strong>20+ dining venues</strong>. The dining map:</p>
<p><strong>Included with your fare (no extra charge):</strong></p>
<ul>
<li><strong>Four main dining rooms</strong> on Decks 5 and 6: La Foglia, Esagono, Hexagon, Bubbles. Different room atmospheres, the same menu. MSC’s MDRs run a slightly more formal European dining rhythm than the American lines — longer dinners, multiple courses, table service expected.</li>
<li><strong>Il Mercato</strong> (Deck 18) — the main buffet. Long hours; the upper-deck windows look down on the pool deck.</li>
<li><strong>La Brasserie</strong> (Deck 19) — 24/7 French-style casual. Crepes, fresh-baked bread, lighter food. This is where you go at 2 AM, and where the breakfast buffet is least crowded.</li>
<li><strong>Luna Park Pizza &amp; Burger</strong> (Deck 6) — quick casual, included.</li>
<li><strong>La Boca Grill</strong> (Deck 18) — Argentinian/Latin American, included with fare.</li>
<li><strong>Promenade Bites</strong> (Deck 8) on the World Promenade — small plates and tapas, included.</li>
</ul>
<p><strong>Specialty dining (extra charge or part of a Specialty Dining Package):</strong></p>
<ul>
<li><strong><a href="https://www.eataly.com/">Eataly</a></strong> (Deck 8) — fresh pasta, wood-fired pizza, gelato. The first Eataly at sea. The reservation worth pre-booking on Day 1 if you only do one specialty meal.</li>
<li><strong>Paxos</strong> (Deck 8) — Greek seafood, open-air seating on the Promenade.</li>
<li><strong>Butcher’s Cut</strong> — steakhouse.</li>
<li><strong>Kaito Teppanyaki</strong> and <strong>Kaito Sushi Bar</strong> — Japanese.</li>
<li><strong>HOLA! Tacos &amp; Cantina</strong> — modern Mexican.</li>
<li><strong>Jean-Philippe Chocolat &amp; Café</strong> — pastries and chocolate; partially included for some fare types, à la carte for others.</li>
<li><strong>Masters of the Sea Pub</strong> (Deck 7) — onboard microbrewery + pub food.</li>
</ul>
<p><strong>Drinks.</strong> MSC’s drink package tiers (Easy / Easy+ / Premium Plus / Premium Extra) are different from NCL’s or Royal’s tiering. Most group sailings include a baseline Easy or Easy+ as part of “MSC Free” booking promotions; verify with Tina what’s bundled in your specific group rate. <strong>Whether you need to upgrade depends on what you actually drink</strong> — the <a href="/drink-calculator.html">drink-calculator</a> lets you put in your real consumption pattern. The companion article <a href="/articles/is-drink-package-worth-it.html">Is the drink package worth it?</a> walks through the breakeven math with worked examples.</p>
<h3 id="pk-connectivity">Connectivity</h3>
<p>MSC’s Wi-Fi packages are tier-based (Browse / Browse &amp; Stream / Browse, Stream &amp; Calls) and run separately from the drink-package promotions. Pricing is significantly cheaper if you buy a package pre-cruise versus onboard. The <a href="/internet-at-sea.html">internet at sea guide</a> covers the cross-line baseline including how to avoid cellular roaming charges in port.</p>
<p>For most solo cruisers in the group, the right approach is:</p>
<ul>
<li>Use included basic Wi-Fi if your fare includes any</li>
<li>Don’t try to stream video at sea</li>
<li>Use port-day cellular when possible (turn airplane mode off only at confirmed ports — Roatán uses Honduras carriers, Mexican ports use Telcel/AT&amp;T-Mexico, Ocean Cay uses no terrestrial carriers at all)</li>
<li>Keep one trusted person ashore informed via a daily one-line message; see <a href="/admin/voyage-pwa/guides/world-america-caribbean-guide.html?v=a64d725c67#section-6">Section 6 — Emergency Contacts</a></li>
</ul>

<h3 id="pk-day-1-saturday-april-24-portmiami-embarkation">Day 1 — Saturday, April 24 — PortMiami (embarkation)</h3>
<p><strong>Terminal:</strong> <strong>MSC Miami Cruise Terminal</strong> at PortMiami — the new MSC-built terminal that opened in April 2025. ~492,678 square feet; MSC has marketed it as the world’s largest cruise terminal. Different terminal from where Royal Caribbean and Carnival board at PortMiami; verify the MSC terminal address with Tina or the MSC for Me app before your taxi/Uber pickup.</p>
<p><strong>Embark window:</strong> Typically 11:30 AM – 3:30 PM. Ship departs ~5:00 PM. All-aboard 4:00 PM. <strong>Be at the terminal by 2:00 PM</strong> to clear security and embarkation with margin.</p>
<p><strong>Getting to PortMiami:</strong></p>
<ul>
<li><strong>Miami International (MIA) → PortMiami:</strong> Uber/Lyft $30–45, 20–30 min. Taxi $32 flat-rate.</li>
<li><strong>Fort Lauderdale (FLL) → PortMiami:</strong> Uber/Lyft $60–90, 45–60 min. Cheaper if you can split with another group member.</li>
<li><strong>If you’re driving:</strong> PortMiami parking at the <strong>Terminal AA garage runs $35/day</strong> (firsthand May 2026 — verify at booking). Other terminals are in a similar range. Secure but not cheap for a week (~$245). Offsite Miami long-term lots run $7–14/day with shuttle service; the math favors offsite if you don’t mind a 15-minute Uber to the terminal Saturday morning.</li>
</ul>
<p><strong>Pre-cruise hotel — strongly recommended.</strong> Same-day flights to a 3:30 PM all-aboard are risky; afternoon thunderstorms during MIA arrival windows are common. A Friday-night stay in Miami Beach, Brickell, or Downtown gives you margin and lets you use Friday afternoon for South Beach, Wynwood, Little Havana, or just sleeping off the travel.</p>
<p><strong>Saturday morning before boarding.</strong> If you arrived Friday and have Saturday morning to kill: PortMiami opens for terminal arrivals around 10:30 AM, but bag drop-off via the curbside porters runs from 10:00 AM. Drop your bags, then walk Bayfront Park or the InterContinental waterfront before checking in.</p>
<p><strong>The realistic Day 1 timeline:</strong></p>
<ul>
<li><strong>10:30 AM – 12:00 PM:</strong> Arrive terminal, security, check-in. MSC’s check-in is online via the MSC for Me app — complete it before you arrive to skip a 20-minute queue.</li>
<li><strong>12:30 PM:</strong> Aboard. Cabins typically open by 1:30 PM; until then, lunch at the buffet (Il Mercato, Deck 18) or La Brasserie (Deck 19, calmer).</li>
<li><strong>2:30 PM:</strong> Cabin open. Meet your stateroom steward; drop carry-ons.</li>
<li><strong>3:30 PM:</strong> Mandatory muster drill — MSC’s drill is partly app-based (watch the safety video in MSC for Me) plus an in-person check-in at your assigned station. <strong>You must complete both before sailing.</strong></li>
<li><strong>5:00 PM:</strong> <strong>Sailaway.</strong> The World Promenade (Deck 8 aft, the seven-deck outdoor walkway around the Y-shaped stern) is the signature viewing location. Less crowded than the main pool deck; the wake unfolds directly below the rail.</li>
<li><strong>6:00 – 8:00 PM:</strong> Dinner. Group dinner location and time will be set by Denise — check her Facebook page or your group communications.</li>
</ul>
<p><strong>What to pack in your carry-on for Day 1:</strong> swimsuit (pools open before checked bags arrive), light layer (PortMiami afternoons can hit a humid 85°F but ship interior runs ~72°F), all medications, change of clothes, passport (preferred for Caribbean itineraries — Roatán and Mexico are foreign ports), phone charger, refillable water bottle, embarkation paperwork (printed boarding pass or pulled up in MSC for Me). Your checked bags may not arrive until 7–9 PM.</p>
<p><strong>Money/card:</strong> Your MSC cruise card is your room key, ID, and onboard charge account. You’ll receive it at check-in or in your cabin. <strong>Currency aboard: US Dollar.</strong></p>
<h3 id="pk-day-roatan">Day 3 — Monday, April 26 — Roatán, Honduras</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/roatan/roatan-1.webp" alt="Roatán waterfront" />
<figcaption aria-hidden="true">Roatán waterfront</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 8:00 AM. <strong>Depart:</strong> 5:00 PM. World America docks at the <strong>Port of Roatán at Coxen Hole</strong> — the pier at the island’s working capital on the central-north coast, and the one used by MSC, Royal Caribbean, NCL, and Virgin. (Roatán’s <em>other</em> cruise pier, <strong>Mahogany Bay</strong> — recently rebranded <em>Isla Tropicale</em> — is Carnival Corporation’s exclusive facility for Carnival and Princess ships; World America does <strong>not</strong> call there. Don’t let a “Mahogany Bay” reference in a generic Roatán guide confuse you.) Confirm your berth in the MSC for Me app.</p>
<p><strong>Roatán — reef, beaches, and the excursion-pricing catch.</strong> Roatán is the largest of Honduras’s Bay Islands, sitting on the Mesoamerican Reef — the world’s second-largest barrier reef. Clear water, friendly locals, snorkeling that converts non-snorkelers into snorkelers, and a developing-country pricing structure where ship-sponsored excursions cost noticeably more than independently arranged alternatives. The island is the cruiser-friendly face of Honduras; if you’ve heard anything about Honduras as a country, none of it applies to a day on Roatán.</p>
<p><strong>Free / low-cost, at the Port of Roatán (Coxen Hole):</strong></p>
<ul>
<li>The port’s shopping-and-dining complex at the pier — shops, restaurants, tour desks, a duty-free area, and taxi/tour touts (haggle, and agree fares before you get in).</li>
<li>Coxen Hole town is right at the pier — a real, workaday Honduran capital rather than a manicured pier village. Walkable and modest; most cruisers head straight for a beach rather than lingering in town.</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>West Bay Beach</strong> — Roatán’s signature beach. About 30–40 minutes by taxi from the Port of Roatán at Coxen Hole (~$6–10/person each way for a shared van; agree the fare first). White sand, calmer water than West End, multiple restaurants, beach chairs for ~$10–15/day. The day most cruisers come for.</li>
<li><strong>Snorkel tour to the Mesoamerican Reef.</strong> Independent operators run tours from West End for ~$35–55/person; ship excursions run $80–150/person for similar experiences. Choose ship excursion if you want the guaranteed return-to-ship safety net; choose independent if you’re a confident traveler with a watch.</li>
<li><strong>Roatán Institute for Marine Sciences (RIMS) dolphin program</strong> — at Anthony’s Key Resort; $90–180/person for swim-with-dolphins, encounter, or trainer-for-a-day programs. Family-friendly; the encounters are well-regulated.</li>
<li><strong>Gumbalimba Park</strong> — botanical garden + monkey/iguana encounter + zipline ($40–80/person depending on what you bundle). Lower-cost full-day option.</li>
</ul>
<p><strong>For first-timers in Roatán:</strong> West Bay Beach via taxi is the highest-value low-stress day. Snorkeling at West Bay’s offshore reef (just swim out from the beach, the reef is 30 yards offshore) is among the best beach snorkeling in the Caribbean and costs nothing if you bring your own mask/snorkel.</p>
<p><strong>Pack for Roatán:</strong> swimsuit, reef-safe sunscreen (locally enforced — Roatán’s reef is protected), towel (the ship’s pool towels are fine), water shoes if you’re snorkeling rocky shores, $40–60 USD cash in small bills (US Dollar is widely accepted; lempiras not necessary), sun hat, polarized sunglasses.</p>
<p><strong>Worth a look on the way in:</strong> the <a href="/ports/roatan.html">Roatán port page</a>, its <a href="/ports/roatan.html#gallery">photo gallery</a>, and the <a href="/ports/roatan.html#logbook">Roatán logbook</a> — what other travelers noticed at West Bay, the reef snorkel routes, the taxi rhythms. Build your day in the <a href="/tools/port-day-planner.html">Port Day Planner</a> before you go ashore.</p>
<p><strong>Monday evening:</strong> likely casual dining. Check Denise’s group plan for whether a group dinner is on tonight.</p>
<h3 id="pk-day-costa-maya">Day 4 — Tuesday, April 27 — Costa Maya, Mexico</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/costa-maya/costa-maya-1.webp" alt="Costa Maya pier complex — purpose-built Mexican cruise port with the Yucatán coast beyond" />
<figcaption aria-hidden="true">Costa Maya pier complex — purpose-built Mexican cruise port with the Yucatán coast beyond</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 9:00 AM. <strong>Depart:</strong> 6:00 PM.</p>
<p><strong>Costa Maya — the purpose-built port, for better and worse.</strong> A Mexican government-built cruise port on the Yucatán’s Caribbean coast — purpose-designed for cruise ships. The pier complex itself is large, manicured, and contains shops, restaurants, a small zoo, swimming pools, and excursion meeting points. It’s the easiest of the Mexican ports — everything is walkable from the ship, beach access is nearby, and the developed area is genuinely pleasant. It’s also the <em>least</em> “authentic Mexico” of the Yucatán cruise ports — feels more like a resort than a port town. That’s not a value judgment; it’s information.</p>
<p><strong>Easy-day option (no taxi needed):</strong></p>
<ul>
<li>Stay in the Costa Maya port complex. <strong>Tropicante</strong> beach area is a 10-minute walk from the gangway — chairs $10–15, drinks for purchase, buffet for purchase. The pool complex inside the port (the central plaza area) is free with your cruise card.</li>
</ul>
<p><strong>Half-day option:</strong></p>
<ul>
<li><strong>Mahahual village</strong> (~10 min by shared shuttle, ~$4/person each way) — a small fishing town turned cruiser stop. The <em>malecón</em> (waterfront walk) has restaurants, beach access, and shops less crowded than the port complex.</li>
</ul>
<p><strong>Full-day option:</strong></p>
<ul>
<li><strong>Chacchoben Mayan ruins</strong> (~45 min by tour bus). Independent tour operators outside the pier offer this for ~$50/person; ship excursions run ~$80–100. Worth it if you have any interest in Mayan history — the ruins are smaller and less restored than Tulum but less crowded and closer to the port. A real archaeological site, not a reconstruction.</li>
<li><strong>Bacalar lagoon “Lake of Seven Colors”</strong> — about 1.5 hours each way; full-day excursion only via ship or pre-booked tour ($120–180/person). Worth the bus ride if you have a swimsuit-day appetite — the layered freshwater colors and the floating wood-plank platforms are unique on this itinerary.</li>
</ul>
<p><strong>For solo travelers:</strong> Costa Maya is the easiest of the Mexican ports for an unstructured day. The pool complex inside the gated area is wheelchair-accessible, has shaded loungers, and is only 5 minutes from re-boarding. If you want a low-energy day to recover from Roatán snorkeling, this is the one.</p>
<p><strong>Pack for Costa Maya:</strong> swimsuit, reef-safe sunscreen, light cover-up, $40–60 USD cash, small backpack for shopping. You can return to the ship for lunch easily.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/costa-maya.html">Costa Maya port page</a>, its <a href="/ports/costa-maya.html#gallery">gallery</a>, and the <a href="/ports/costa-maya.html#logbook">Costa Maya logbook</a>.</p>
<h3 id="pk-day-cozumel">Day 5 — Wednesday, April 28 — Cozumel, Mexico</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/cozumel/cozumel-fom-1.webp" alt="Cozumel waterfront" />
<figcaption aria-hidden="true">Cozumel waterfront</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 9:00 AM. <strong>Depart:</strong> 7:00 PM (or later — Cozumel is often a late-departure port).</p>
<p>World America typically docks at one of three Cozumel piers — <strong>Punta Langosta</strong> (downtown), <strong>International Pier</strong>, or <strong>Puerta Maya</strong>. Check the MSC for Me app. Cozumel is the most heavily visited Caribbean port; expect 3–5 ships in port the same day during peak season.</p>
<p><strong>Cozumel — the Western Caribbean’s dive capital.</strong> This is the underwater destination of the Western Caribbean. The reef system off Cozumel — protected within Cozumel Reefs National Park since 1996 — delivers visibility consistently among the best in the Caribbean. If anyone in your group has ever wanted to try snorkeling, this is the day to do it. Above water, Cozumel feels touristed in a familiar way — it’s been a cruise stop for 50 years and the routine is well-established.</p>
<p><strong>Easy-day option (no excursion needed):</strong></p>
<ul>
<li>Stay near your pier. <strong>Punta Langosta</strong> puts you directly in downtown San Miguel — walk around, find a real Mexican lunch ($15–25/person at a non-tourist restaurant), shop at <strong>Mercado Municipal</strong> (the local market, NOT the tourist shops near the pier — locals shop there too). International and Puerta Maya are 5–10 minutes from downtown by taxi (~$10).</li>
</ul>
<p><strong>Half-day options:</strong></p>
<ul>
<li><strong>Chankanaab Beach Adventure Park</strong> (~$50/person entry, ~15 min by taxi). Calm water, snorkel rentals, dolphin program (paid extra), lounger and umbrella. Family-friendly; the calmest reef snorkeling.</li>
<li><strong>Paradise Beach</strong> (~$3 entry, free chairs with food/drink minimum, ~15 min by taxi). Lower-key alternative to Chankanaab with a real “Mexican beach club” feel.</li>
</ul>
<p><strong>Full-day options:</strong></p>
<ul>
<li><strong>Palancar Reef snorkel tour</strong> — <em>the iconic Cozumel experience.</em> Multiple operators on the pier offer this for $40–60/person (ship excursion: $80–110). Two-hour tour, calm water, abundant fish life. If you’ve never snorkeled in clear water, this is the trip that converts you. Bring an underwater camera.</li>
<li><strong>Tulum ruins</strong> (3-hour ferry + bus, $90–150 ship excursion or ~$80 independent). Long day. April afternoons can hit 90°F + humidity; heat-sensitive travelers should consider Chichén Itzá-Tulum tour timing.</li>
</ul>
<p><strong>A note on shopping:</strong> Cozumel’s pier shops sell you the same Mexican blanket, the same silver jewelry, and the same vanilla extract you can buy at any Caribbean cruise port. The interesting shopping is at <strong>Mercado Municipal</strong> in San Miguel (15-min walk from Punta Langosta) — vanilla, ceramics, leather, and food vendors at local-shopper prices.</p>
<p><strong>For wheelchair users and limited mobility:</strong> Cozumel is genuinely accessible at the piers. Punta Langosta connects directly to a paved boardwalk into San Miguel. Beach clubs have beach wheelchairs available; ask in advance. Snorkel <em>boats</em> are typically NOT accessible — book a beach-snorkel tour instead of a boat tour.</p>
<p><strong>Pack for Cozumel:</strong> swimsuit, reef-safe sunscreen, water shoes, sun hat, $60–80 USD cash for tour and lunch, small underwater camera if you have one.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/cozumel.html">Cozumel port page</a>, its <a href="/ports/cozumel.html#gallery">gallery</a>, and the <a href="/ports/cozumel.html#logbook">Cozumel logbook</a>.</p>
<p><strong>Wednesday evening:</strong> Late departure means the ship doesn’t leave until after dinner. If you didn’t make it onboard for lunch, no rush — the all-aboard call is ~6:30 PM.</p>
<h3 id="pk-day-ocean-cay">Day 7 — Friday, April 30 — Ocean Cay, Bahamas</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/ocean-cay/we-love-ocean-cay-boat-and-lighthouse.webp" alt="The signature view — a “WE ❤ OCEAN CAY” boat-bench on white sand with the red-and-white striped Marine Reserve lighthouse on the spit behind it, beach umbrellas flanking either side" />
<figcaption aria-hidden="true">The signature view — a “WE ❤ OCEAN CAY” boat-bench on white sand with the red-and-white striped Marine Reserve lighthouse on the spit behind it, beach umbrellas flanking either side</figcaption>
</figure>
<p><strong>Arrival:</strong> Typical pattern is 9:00 AM to evening; some sailings carry an overnight call. <strong>Verify your arrival/departure window in the MSC for Me app</strong> — the answer determines whether you’ll see the lighthouse evening show.</p>
<p>World America <strong>docks alongside</strong> Ocean Cay’s deep-water pier — no tender. Gangway to sand is about 5–10 minutes’ walk.</p>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/ocean-cay/msc-seaside-at-ocean-cay-pier.webp" alt="MSC Seaside (a sister-line ship in the same MSC berth) alongside Ocean Cay’s deep-water pier — World America uses the same dock; no tender" />
<figcaption aria-hidden="true">MSC Seaside (a sister-line ship in the same MSC berth) alongside Ocean Cay’s deep-water pier — World America uses the same dock; no tender</figcaption>
</figure>
<p><strong>Ocean Cay — from aragonite mine to private island.</strong> MSC’s private island — and only MSC’s. Located in the Bimini chain of the Bahamas, ~65 miles east of Miami and ~20 miles south of Bimini. Until 2015 the cay was an industrial aragonite-mining operation (calcium-carbonate sand dredged for cement and glass production). MSC bought it, spent ~$200 million and four years rebuilding it as a cruise-line private island, and opened it in December 2019. The transformation involved removing all industrial infrastructure, dredging the swim lagoon, planting thousands of palms, and building the striped lighthouse that anchors the island visually.</p>
<p><strong>Ocean Cay is deliberately different from CocoCay, Half Moon Cay, and Castaway Cay.</strong> No waterpark, no helium balloon, no zip line, no overwater cabanas. What it has instead: an engineered swim lagoon, the lighthouse (and an evening light-and-music show on overnight or late-departure calls), the Marine Conservation Center, and seven named beaches with distinct personalities. Smaller and quieter than CocoCay. First-timers expecting waterpark-and-fireworks will call it boring; veterans comparing private islands rate it highly for what it deliberately chooses not to be.</p>
<p><strong>Free with your cruise fare:</strong></p>
<ul>
<li><strong>All seven beaches</strong> — South Beach, Lighthouse Bay, Bimini Beach, Pineapple Beach, Seakers Family Cove, Sunset Beach, Ocean House Beach. All sand, all included, all walkable from the pier or via free tram.</li>
<li><strong>Loungers and umbrellas</strong> at the main beach areas.</li>
<li><strong>Tram service</strong> — runs the spine of the cay, free, accommodates wheelchairs and strollers.</li>
<li><strong>Buffet lunch</strong> at the Marketplace Buffet near the pier (and sit-down options at Boho House, Seakers, Smiling Fish — inclusion status varies by venue; verify in the MSC for Me app before counting on a complimentary sit-down).</li>
<li><strong>The Beach Shack</strong> at South Beach — chalkboard menu of cheeseburger, hot dog, fries, chicken nuggets, brownie. 11 AM to 4 PM.</li>
<li><strong>Lighthouse climb</strong> during posted hours.</li>
<li><strong>Marine Conservation Center tours</strong> — scheduled hours, free.</li>
</ul>
<p><strong>Paid add-ons:</strong></p>
<ul>
<li><strong>Cabana rentals</strong> — multiple tiers, beach-side to premium. Pre-book in the MSC for Me app (typically cheaper pre-cruise than dockside).</li>
<li><strong>Reserved beach beds</strong> at certain beaches.</li>
<li><strong>Snorkel-gear rental</strong> at the watersports hut.</li>
<li><strong>Specialty restaurant covers</strong> at the higher-end sit-down venues.</li>
<li><strong>Spa Ocean Cay</strong> treatments.</li>
</ul>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/ocean-cay/swim-lagoon-through-breakwater.webp" alt="The engineered swim lagoon viewed through the breakwater — calm, contained turquoise, with South Beach umbrellas visible at the far end" />
<figcaption aria-hidden="true">The engineered swim lagoon viewed through the breakwater — calm, contained turquoise, with South Beach umbrellas visible at the far end</figcaption>
</figure>
<p><strong>The beaches — quick read on personalities:</strong></p>
<ul>
<li><strong>South Beach</strong> — the center, the busiest, where the Beach Shack and the swim lagoon are. Default destination for first-timers.</li>
<li><strong>Seakers Family Cove</strong> — protected family swim area with reef structure creating shallow zones. Best for groups with mixed swimming abilities — no parent-split required.</li>
<li><strong>Bimini Beach and Pineapple Beach</strong> — twin beaches on the west side, calmer water, often less crowded than South Beach. Good for late-morning arrivals.</li>
<li><strong>Lighthouse Bay</strong> — east side, next to the tower. Quieter cove with photogenic views of the lighthouse. Best for evening-show seating if the show runs your night.</li>
<li><strong>Ocean House Beach</strong> (far north) — longest walk from the pier, least crowded. Worth the walk if you want serious quiet.</li>
<li><strong>Sunset Beach</strong> (south end) — still partly under construction; quieter end of the cay.</li>
</ul>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/ocean-cay/lighthouse-from-pier.webp" alt="Ocean Cay’s red-and-white striped lighthouse seen across the cruise pier, with the thatched-roof Lighthouse Bar at its base and the swim-zone buoy line in the channel — the first thing you see from the gangway" />
<figcaption aria-hidden="true">Ocean Cay’s red-and-white striped lighthouse seen across the cruise pier, with the thatched-roof Lighthouse Bar at its base and the swim-zone buoy line in the channel — the first thing you see from the gangway</figcaption>
</figure>
<p><strong>The lighthouse evening show.</strong> A 15-minute lighting-and-music performance synchronized to Bahamian instrumentation. The 98-foot striped tower lights in red-and-white bands, then blue, then climbing gold; projections climb the perforated metal cladding; Spanish guitar carries through the speakers. <strong>The show is free, no ticket required, and the show runs only on overnight or late-departure calls.</strong> Check your itinerary: if you’re a daytime-only call, the tower is lit but the full show doesn’t run. If your sailing has the show, the Lighthouse Bay beach seating area is where to watch from; the World Promenade deck of the ship is a workable backup. <em>(Our image archive is daytime-only — the show is best experienced in person.)</em></p>
<p><strong>The Marine Conservation Center.</strong> Real, not branding. The MSC Foundation operates it; coral nursery work, turtle-nesting protection on the cay’s beaches. Visitors tour during scheduled hours, free. ~6-minute walk from the pier. Ocean Cay carries a Mission Blue Hope Spot designation.</p>
<p><strong>Pack for Ocean Cay:</strong></p>
<ul>
<li><strong>MSC cruise card</strong> — required for entry and all purchases. <strong>Cash is not needed on the cay.</strong></li>
<li><strong>Reef-safe sunscreen</strong> — reapply often; Bahamian late-April sun is intense and the cay has limited natural shade away from the umbrellas.</li>
<li><strong>Waterproof phone case</strong> for swim-lagoon photos.</li>
<li><strong>Hat and sunglasses.</strong></li>
<li><strong>Flip-flops AND water shoes</strong> — the limestone shoreline gets rocky away from the swim cove.</li>
<li><strong>A swim shirt</strong> if you burn easily — the cay has limited natural shade.</li>
</ul>
<p><strong>Pitfalls and things to know:</strong></p>
<ul>
<li><strong>Limited natural shade.</strong> Bring a swim shirt or rent an umbrella early.</li>
<li><strong>Construction visible.</strong> The cay’s south spit is still under active expansion — expect crane and barge sightings.</li>
<li><strong>Beach Shack vs. sit-down venues.</strong> Beach Shack is hot-dogs-and-nuggets at lunch. The sit-down buffet and labeled restaurants have real food. Don’t let the chalkboard menu shape your expectation of what the cay’s food is.</li>
<li><strong>Inclusion status not always clearly posted.</strong> Verify in the MSC for Me app or ask a venue host before counting on complimentary status at a sit-down.</li>
<li><strong>No passport stamp.</strong> Ocean Cay is a private island; you don’t formally enter the Bahamas.</li>
</ul>
<p><strong>Worth a look:</strong> the <a href="/ports/ocean-cay.html">Ocean Cay port page</a> — extensive coverage of the cay’s history, the beach personalities, the lighthouse show, the accessibility design, and persona-style logbook entries from prior visitors.</p>
<h3 id="pk-day-8-saturday-may-1-portmiami-debarkation">Day 8 — Saturday, May 1 — PortMiami (debarkation)</h3>
<p><strong>The realistic timeline:</strong></p>
<ul>
<li><strong>6:00 – 8:00 AM:</strong> Breakfast available at the buffet (Il Mercato or La Brasserie). Eat now if your bag is in the hall already.</li>
<li><strong>7:00 AM:</strong> Customs clearance complete. Self-disembarkation begins for cruisers carrying their own bags.</li>
<li><strong>7:30 – 10:00 AM:</strong> Walk-off in waves. <strong>All passengers off the ship by 10:00 AM</strong> per MSC standard.</li>
</ul>
<p><strong>The bag situation.</strong> The night before, MSC asks you to place your checked luggage outside your cabin door by ~11 PM with the color-coded tag indicating your debark group. Bags are taken to the terminal overnight and you collect them in baggage claim before customs.</p>
<p><strong>Carry-on with you on debark morning:</strong> a change of clothes for the journey home, all medications, passport, phone charger, valuables, anything you can’t bear to lose if a bag is misrouted.</p>
<p><strong>Getting from PortMiami to MIA:</strong></p>
<ul>
<li><strong>Uber/Lyft:</strong> $30–45, 20–30 minutes. Surge-priced Saturday morning is real; pre-book if possible.</li>
<li><strong>Cruise Connections shared shuttle</strong> ($25–35/person, advance booking only) — formal port-to-airport option. Slower than Uber.</li>
<li><strong>Public transit (Metromover + Metrorail):</strong> Technically possible but the bag transfers between modes are rough. Not recommended for a cruise return.</li>
</ul>
<p><strong>MIA without an Uber.</strong> <strong>The simple answer: Uber/Lyft on a Saturday afternoon, $30–45, 25–30 minutes.</strong> The math works out.</p>
<p><strong>Airport-arrival timing.</strong> For a domestic flight after 4 PM, leave PortMiami by 1:30 PM. For an international flight after 6 PM, leave by 2:30 PM. MIA TSA lines run 30–60 min during the Saturday-afternoon cruise return rush.</p>
<p><strong>Killing 4–6 hours before an evening flight.</strong> If you’ve debarked at 8 AM and your flight isn’t until 5 PM, options:</p>
<ul>
<li><strong>Bayfront Park / Bayside Marketplace</strong> — 10-minute walk from PortMiami. Outdoor shopping/dining waterfront. Bag storage available at a few vendors.</li>
<li><strong>Pérez Art Museum Miami (PAMM)</strong> — 15-minute walk. $20 entry. Strong contemporary collection; air-conditioned.</li>
<li><strong>Brickell</strong> — short Uber. Cuban coffee at Versailles outpost, lunch at one of the new restaurants, take an Uber to MIA when you’re ready.</li>
<li><strong>Pre-paid airport lounge access</strong> — MIA has Priority Pass, American Express Centurion, and Delta Sky Club options if you have the credit cards or memberships. Worth it for a 4-hour layover with a meal and a shower.</li>
</ul>
<p><strong>Bag storage.</strong> If you need to ditch bags between debark and flight: PortMiami doesn’t run an official luggage-storage program, but vendors at Bayside Marketplace sometimes hold bags for $5–10/bag/day. Confirm before counting on it.</p>
