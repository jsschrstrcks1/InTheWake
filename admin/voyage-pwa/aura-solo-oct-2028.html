<h2 id="pk-section-1">Section 1 — Your Ship: Norwegian Aura</h2>
<h3 id="pk-a-new-ship-about-a-year-and-a-half-old-when-you-board">A new ship, about a year and a half old when you board</h3>
<p>Norwegian Aura is the largest ship NCL has ordered so far, and its own announcement in January 2026 put her at about 170,000 gross tons, almost 1,130 feet long, carrying 3,879 guests at two to a cabin. Gross tonnage is a measure of the ship’s enclosed volume, not her weight, so read it as “how much room there is,” not “how heavy she is.” If you want to see how she compares with other ships, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> lines them up side by side.</p>
<p>She’s being built by Fincantieri at Monfalcone, Italy, and was floated out there on April 16, 2026. Her first sailing is planned for May 21, 2027, from Trieste to Barcelona, and she’s due to start sailing from Miami on June 10, 2027. By your October 2028 cruise she’ll have about a year and a half of sailing behind her, so the crew will know the ship and the early kinks should be worked out.</p>
<p>NCL calls her a <strong>Prima Plus</strong> ship in its August 2026 announcement. Her older sisters in that class are <a href="/ships/norwegian/norwegian-aqua.html">Norwegian Aqua</a> (2025) and Norwegian Luna (2026). If you’ve sailed one of them, much of Aura will feel familiar.</p>
<p><strong>What NCL hasn’t announced yet:</strong> her godmother, her crew count, and an exact delivery date. Some travel sites print figures for these. This pack doesn’t, because NCL hasn’t.</p>
<h3 id="pk-whats-on-board-as-ncl-has-announced-it">What’s on board (as NCL has announced it)</h3>
<ul>
<li><strong>Ocean Heights, Decks 18 to 21.</strong> This is the big outdoor play area. NCL lists the <strong>Eclipse Racers</strong> (two side-by-side mat-racing waterslides, over 400 feet long), <strong>Aura Free Fall</strong> (the floor drops out and you fall 250 feet of slide), <strong>The Wave</strong> (a raft slide for up to four people), <strong>The Drop</strong> (a dry slide that runs ten decks, from Deck 18 down to Deck 8), a ropes course, a climbing wall, mini golf, and cabanas that hang out over the adults-only Vibe Beach Club. NCL hasn’t said which of these carry a fee. Check the NCL app once you can see your sailing’s details.</li>
<li><strong>Ocean Boulevard, Deck 8.</strong> The outdoor walkway that wraps the ship, with hot tubs, a bar and seating. NCL says it’s 11% longer on Aura than on Aqua and Luna. On a sea day it’s a good place to sit with coffee and watch the water.</li>
<li><strong><a href="/restaurants/ncl/vibe-beach-club.html">Vibe Beach Club</a>.</strong> Adults only. NCL says it’s 15% larger than the ones on Aqua and Luna. On other NCL ships Vibe is sold as a separate pass. NCL hasn’t published Aura’s price.</li>
<li><strong>Mandara Spa.</strong> Two decks, with a Thermal Suite that NCL calls the most expansive at sea, and a Sensory Rain Pool that it calls the first of its kind at sea. Those are NCL’s claims, quoted as NCL’s.</li>
<li><strong>The Haven.</strong> NCL’s suite area with its own restaurant, bar, lounge, pool and sundeck. Aura has 159 Haven suites, more than any NCL ship before her.</li>
<li><strong>Shows.</strong> NCL announced <em>Whitney: A Celebration of Whitney Houston</em>, a 45-minute show in the Aura Theatre &amp; Club, along with ILLUMINOX, The Vinyl Republic, Latin LIVE! and Aura FIRST NIGHT. <strong>LunaTique</strong> is adults-only and costs extra; NCL says it includes cocktails. Show schedules for October 2028 won’t be out until close to sailing.</li>
</ul>
<h3 id="pk-cabin-choice-the-solo-calculation">Cabin choice: the solo calculation</h3>
<p>The flyer has three prices. Here’s what each one is.</p>
<ul>
<li><strong>Solo Studio at $1,599.</strong> NCL’s own cabin for one person. On Aura, NCL’s deck plans list the Solo Studio at <strong>94 square feet, on Decks 12 and 13</strong>, with a full-size bed, and access to the <strong><a href="/restaurants/ncl/studio-lounge.html">Studio Lounge</a></strong>, which is only for Studio guests. NCL says Studios are “specifically designed and priced for solo travelers.” The Studio Lounge is where solo cruisers find each other, apart from anything the group plans. NCL hasn’t published how many Studios Aura has.</li>
<li><strong>Ocean View at $2,279.</strong> A window. That’s $680 more than the Studio. You get daylight and more room.</li>
<li><strong>Balcony at $2,669.</strong> Your own outdoor space. That’s $390 more than Ocean View. On a Caribbean week with two sea days, a balcony gets a lot of use.</li>
</ul>
<p>Prices are from the flyer and can change until you book. <strong>Ask Tina what each fare includes</strong>, because NCL’s package offers change. In November 2025 NCL replaced its “More at Sea” package with one called “Free at Sea” for new bookings. What Free at Sea includes in 2028 is something to confirm with her, not something to assume. Once you’ve picked a cabin, the <a href="/articles/cruise-cabin-organization.html">cabin organization guide</a> helps with small-space living.</p>
<h3 id="pk-dining">Dining</h3>
<p>NCL says Aura has 22 places to eat and drink. Here’s how they split, from NCL’s August 2026 announcement.</p>
<p><strong>Included with your fare:</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/hudsons.html">Hudson’s</a>.</strong> The main dining room, with what NCL calls 270-degree ocean views.</li>
<li><strong>The Panorama Room, Deck 6.</strong> NCL calls it “a completely reimagined complimentary dining experience.” It’s new, so there’s no page for it on this site yet.</li>
<li><strong><a href="/restaurants/ncl/indulge-food-hall.html">Indulge Food Hall</a>.</strong> Nine counters, including Mexican food inspired by Los Lobos, a new Middle Eastern counter, Q Texas Smokehouse, Planterie and Nudls. Good for a solo lunch: walk up, order, sit anywhere.</li>
<li><strong><a href="/restaurants/ncl/surfside-cafe.html">Surfside Café</a>.</strong> The buffet. NCL says it’s bigger on Aura and runs along both sides of the ship.</li>
<li><strong><a href="/restaurants/ncl/the-local.html">The Local Bar &amp; Grill</a>.</strong> Pub food nearly all day.</li>
</ul>
<p><strong>Specialty restaurants (extra charge, or part of a dining package):</strong></p>
<ul>
<li><strong>Tamara, Deck 8.</strong> NCL’s first Indian specialty restaurant. New on Aura.</li>
<li><strong><a href="/restaurants/ncl/cagneys-steakhouse.html">Cagney’s Steakhouse</a></strong>, <strong><a href="/restaurants/ncl/le-bistro.html">Le Bistro</a></strong> (Deck 7), <strong><a href="/restaurants/ncl/sukhothai.html">Sukhothai</a></strong> (Thai, Deck 7), <strong><a href="/restaurants/ncl/palomar.html">Palomar</a></strong> and <strong><a href="/restaurants/ncl/onda-by-scarpetta.html">Onda by Scarpetta</a></strong> (both Deck 8), <strong><a href="/restaurants/ncl/hasuki.html">Hasuki</a></strong> (hibachi) and <strong><a href="/restaurants/ncl/nama-sushi.html">Nama</a></strong> (sushi).</li>
</ul>
<p>NCL hasn’t published Aura’s specialty prices. If your fare includes specialty meals, book them as soon as NCL opens reservations for your sailing.</p>
<p><strong>Drinks.</strong> Whether drinks are included depends on your fare. Ask Tina. If you’re buying a package, <a href="/drink-calculator.html?line=ncl">put your own numbers into the drink calculator</a>. It’s set up for NCL, and it shows whether a package pays off for the way you actually drink.</p>
<h3 id="pk-getting-online">Getting online</h3>
<p>NCL sells Wi-Fi packages, and some fares include some Wi-Fi. The <a href="/internet-at-sea.html">internet at sea guide</a> explains how cruise Wi-Fi works and how to avoid roaming charges ashore.</p>
<p>For most people in this group:</p>
<ul>
<li>Use whatever Wi-Fi your fare includes, and don’t expect to stream video.</li>
<li>In port, your own phone plan may work. Check with your carrier before you go (more in <a href="/admin/voyage-pwa/guides/aura-solo-oct-2028-guide.html?v=d295cd47cc#section-8">Section 8</a>).</li>
<li>Send one short message a day to someone at home. See <a href="/admin/voyage-pwa/guides/aura-solo-oct-2028-guide.html?v=d295cd47cc#section-6">Section 6</a>.</li>
</ul>

<h3 id="pk-day-1-saturday-october-14-miami-embarkation">Day 1 — Saturday, October 14 — Miami (embarkation)</h3>
<p><strong>Terminal.</strong> NCL’s PortMiami terminal is at <strong>1015 N. America Way</strong>. NCL’s driving directions say to put <strong>1761 N. Cruise Blvd.</strong> into your GPS, and to park in <strong>Garage B</strong>, which NCL runs. NCL hadn’t said which terminal Aura uses when this was written; its other big ships use this one. <strong>Your boarding documents will name the terminal. Check it.</strong></p>
<p><strong>Fly in the day before.</strong> The ship leaves at 4:00 PM, and a same-day flight leaves no room for a delay. Friday October 13 is the sensible arrival day.</p>
<p><strong>The usual first afternoon:</strong></p>
<ul>
<li><strong>Before you leave home:</strong> do NCL’s online check-in and pick your arrival time.</li>
<li><strong>Board and eat.</strong> Cabins usually aren’t ready right away. Lunch at <a href="/restaurants/ncl/surfside-cafe.html">Surfside Café</a> or <a href="/restaurants/ncl/indulge-food-hall.html">Indulge Food Hall</a> passes the time.</li>
<li><strong>Muster drill.</strong> Required. Part of it is in the NCL app, and part is checking in at your assigned station.</li>
<li><strong>4:00 PM, sailaway.</strong> Your host will say where the group is meeting, in the group chat.</li>
<li><strong>Evening.</strong> The group’s dinner plan comes from your host. If you’re in a Studio, check the daily schedule in the app for a Studio Lounge get-together.</li>
</ul>
<p><strong>Keep in your carry-on:</strong> your <strong>passport</strong>, all medications, a swimsuit, a change of clothes, a phone charger. Checked bags can take until evening to reach your cabin.</p>
<p><strong>Money aboard.</strong> Your keycard is your room key and your charge card. Everything aboard is in US dollars.</p>
<h3 id="pk-day-puerto-plata">Day 3 — Monday, October 16 — Puerto Plata, Dominican Republic</h3>
<p><strong>In port:</strong> 7:00 AM to 3:00 PM. <strong>All aboard 2:00 PM.</strong></p>
<p><strong>Which pier.</strong> Puerto Plata has two cruise piers. <strong>Amber Cove</strong>, west of town, is used mostly by Carnival’s lines. <strong>Taino Bay</strong> sits at the edge of the old town, and port listings put NCL’s ships there. The Dominican government announced the first call of Aura’s sister ship, Norwegian Aqua, at Taino Bay. <strong>Nobody has published Aura’s pier for 2028.</strong> This pack assumes Taino Bay, but check the NCL app.</p>
<p><strong>If it’s Taino Bay:</strong> the old town is next door. Travel guides put the walk at 10 to 15 minutes.</p>
<p><strong>Things to know:</strong></p>
<ul>
<li><strong>Fortaleza San Felipe.</strong> The Dominican tourism ministry describes it as a fort the Spanish built in the 16th century to defend the north coast.</li>
<li><strong>The cable car up Mount Isabel de Torres</strong> has been closed since June 2024 for lack of a safety certificate, according to Dominican news reports. A rebuild started in October 2026, and the target for reopening is early 2028. <strong>Check before you plan on it.</strong></li>
<li><strong>NCL’s tours, with 2026 prices:</strong> Ocean World Day Pass (adults from $99.99, about 4½ hours, buffet lunch included) and Damajagua Waterfalls (adults from $119.99, about 4 hours, minimum age 8, closed-toe shoes required). The waterfalls are a drive inland, so on a day with a 2:00 PM all-aboard a ship tour is the safe choice. NCL says it always waits for its own tours to get back before sailing.</li>
</ul>
<p><strong>Money.</strong> The Dominican peso is the local money. The tourism ministry says businesses in tourist areas take dollars, but at a worse rate than the banks. Small US bills are fine for a short day.</p>
<p><strong>Documents.</strong> You need a passport. The Dominican Republic’s entry page asks for <strong>six months of validity</strong> left on it. There was a temporary exception for US citizens, but it ran only through December 31, 2026. For October 2028, make sure your passport is good <strong>through at least April 2029</strong> unless the rule has changed. Cruise passengers don’t fill out the e-ticket form.</p>
<p><strong>Emergency number:</strong> 911.</p>
<p><strong>Pack for today:</strong> passport, sunscreen, a hat, water shoes if you’re doing the waterfalls, some small US bills.</p>
<p>Build your day in the <a href="/tools/port-day-planner.html">Port Day Planner</a>, and log it afterward in the <a href="/tools/port-tracker.html">Port Logbook</a>. This site’s page for the other Puerto Plata pier, <a href="/ports/amber-cove.html">Amber Cove</a>, has more about the area.</p>
<h3 id="pk-day-st-thomas">Day 4 — Tuesday, October 17 — St. Thomas, U.S. Virgin Islands</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/st-thomas/city-view.webp" alt="Charlotte Amalie, St. Thomas: colorful Danish colonial buildings cascading down the hillside above the harbor" />
<figcaption aria-hidden="true">Charlotte Amalie, St. Thomas: colorful Danish colonial buildings cascading down the hillside above the harbor</figcaption>
</figure>
<p><strong>In port:</strong> 10:00 AM to 6:00 PM. <strong>All aboard 5:00 PM.</strong></p>
<p><strong>Which pier.</strong> Ships dock at either <strong>Havensight</strong> or <strong>Crown Bay</strong>, both near downtown Charlotte Amalie. Local news reports of the West Indian Company’s 2027 schedule put Aura at the <strong>WICO dock at Havensight</strong>. The 2028 schedule wasn’t out when this was written.</p>
<p><strong>What it is.</strong> A US territory. US dollars, and US phone plans work the way they do at home. <strong>They drive on the left.</strong></p>
<p><strong>Things to know (2026 prices):</strong></p>
<ul>
<li><strong>Magens Bay.</strong> The beach most people mean when they say St. Thomas. Entry is <strong>$7 for non-residents over 12</strong> (the Magens Bay Authority’s fee since October 2023). Taxis charge per person. A 2024 copy of the official rate card shows <strong>$15 for one person, $12 each for two or more</strong> between Magens Bay and Havensight.</li>
<li><strong>St. John.</strong> The public ferry from <strong>Red Hook</strong>, on the east end, runs every hour on the hour and takes about 20 minutes. The fare is <strong>$8.15 each way</strong> (VI Department of Public Works). <strong>Trunk Bay</strong> in the national park charges $5 for ages 16 and up. The ferry from downtown leaves at 10:00 AM, which is when the ship arrives, so Red Hook is the realistic route. Be back at Red Hook in time to make a 5:00 PM all-aboard. A ship tour is the no-worry way to do St. John.</li>
<li><strong>Downtown.</strong> Shopping on Main Street, and the old Danish buildings. The USVI tourism department says both piers are a short distance from downtown.</li>
</ul>
<p><strong>Emergency number:</strong> 911.</p>
<p><strong>Documents.</strong> US citizens don’t need a passport to visit the USVI, but you need one for the rest of this cruise, so carry it.</p>
<p>More on the <a href="/ports/st-thomas.html">St. Thomas port page</a>.</p>
<h3 id="pk-day-tortola">Day 5 — Wednesday, October 18 — Tortola, British Virgin Islands</h3>
<p><strong>In port:</strong> 7:00 AM to 2:00 PM. <strong>All aboard 1:00 PM.</strong> This is the short day.</p>
<p><strong>The pier.</strong> Ships dock at the cruise pier in Road Town, the capital. CruiseMapper says the pier takes two large ships, and when a third is in, one anchors and runs tenders. Pier Park, the shopping and restaurant area, is right at the pier, and travel guides put the walk into Road Town at 10 to 15 minutes.</p>
<p><strong>What it is.</strong> A British Overseas Territory that uses the US dollar.</p>
<p><strong>Things to know:</strong></p>
<ul>
<li><strong>Cane Garden Bay.</strong> A beach on the north side. A 2026 travel guide puts the taxi at <strong>$10 to $16 per person</strong>, about 20 minutes each way. A good half day that leaves room before 1:00 PM.</li>
<li><strong>The Baths, Virgin Gorda.</strong> The big boulders and sea pools, on another island. <strong>Don’t try it on your own this day.</strong> The public ferries work on paper, but one late boat means a missed ship. NCL sells a Virgin Gorda and The Baths tour, and NCL says it always waits for its own tours to get back before sailing.</li>
<li><strong>Road Town.</strong> Walkable from the pier.</li>
</ul>
<p><strong>Emergency number:</strong> 911 (the UK government’s travel advice; it also lists 767 for sea rescue).</p>
<p><strong>Documents.</strong> The BVI tourism board says a <strong>passport</strong> is required to enter and leave. Bring it.</p>
<p>More on the <a href="/ports/tortola.html">Tortola port page</a>.</p>
<h3 id="pk-day-great-stirrup-cay">Day 7 — Friday, October 20 — Great Stirrup Cay, Bahamas</h3>
<p><strong>In port:</strong> 10:00 AM to 6:00 PM. <strong>All aboard 5:00 PM.</strong></p>
<p><strong>The pier.</strong> NCL’s private island now has a pier, so you <strong>walk off the ship</strong>. No tender boats. The first ship docked there on December 28, 2025.</p>
<p><strong>Free with your fare</strong> (NCL’s island page): the beaches, the food, a resort-style pool, and a kids’ splash pad.</p>
<p><strong>Extra cost:</strong></p>
<ul>
<li><strong>Great Tides Waterpark.</strong> It opened September 4, 2026. NCL says it’s an extra cost, and that tickets and pricing “vary based on seasonality and availability.” NCL lets booked guests reserve passes in the app up to two days before sailing. NCL hasn’t published a price.</li>
<li><strong>Vibe Shore Club</strong> (adults only, a day pass), <strong>cabanas</strong>, and the <strong>Silver Cove</strong> villas.</li>
</ul>
<p><strong>Paying.</strong> NCL quotes a guest saying their room card worked on the island.</p>
<p><strong>Documents.</strong> The Bahamas is a foreign country, so carry your passport.</p>
<p><strong>Emergency.</strong> The ship’s medical team and NCL’s staff are on the island.</p>
<p>More on the <a href="/ports/great-stirrup-cay.html">Great Stirrup Cay port page</a>.</p>
<h3 id="pk-day-8-saturday-october-21-miami-debarkation">Day 8 — Saturday, October 21 — Miami (debarkation)</h3>
<p>The ship is due in at 7:00 AM. NCL will tell you the night before how bags and walk-off times work. Usually you put checked bags outside your door the night before, and keep your passport, medications and a change of clothes with you.</p>
<p><strong>Flights home:</strong> book a flight that leaves after midday. Getting off a big ship, through customs and to the airport takes time.</p>

ip before her. Shows. NCL announced Whitney: A Celebration of Whitney Houston , a 45-minute show in the Aura Theatre & Club, along with ILLUMINOX, The Vinyl Republic, Latin LIVE! and Aura FIRST NIGHT. LunaTique is adults-only and costs extra; NCL says it includes cocktails. Show schedules for October 2028 won’t be out until close to sailing."},{"t":"Cabin choice: the solo calculation","s":"ship","a":"pk-cabin-choice-the-solo-calculation","x":"The flyer has three prices. Here’s what each one is. Solo Studio at $1,599. NCL’s own cabin for one person. On Aura, NCL’s deck plans list the Solo Studio at 94 square feet, on Decks 12 and 13 , with a full-size bed, and access to the Studio Lounge , which is only for Studio guests. NCL says Studios are “specifically designed and priced for solo travelers.” The Studio Lounge is where solo cruisers find each other, apart from anything the group plans. NCL hasn’t published how many Studios Aura has. Ocean View at $2,279. A window. That’s $680 more than the Studio. You get daylight and more room. Balcony at $2,669. Your own outdoor space. That’s $390 more than Ocean View. On a Caribbean week with two sea days, a balcony gets a lot of use. Prices are from the flyer and can change until you book. Ask Tina what each fare includes , because NCL’s package offers change. In November 2025 NCL replaced its “More at Sea” package with one called “Free at Sea” for new bookings. What Free at Sea includes in 2028 is something to confirm with her, not something to assume. Once you’ve picked a cabin, the cabin organization guide helps with small-space living."},{"t":"Dining","s":"ship","a":"pk-dining","x":"NCL says Aura has 22 places to eat and drink. Here’s how they split, from NCL’s August 2026 announcement. Included with your fare: Hudson’s . The main dining room, with what NCL calls 270-degree ocean views. The Panorama Room, Deck 6. NCL calls it “a completely reimagined complimentary dining experience.” It’s new, so there’s no page for it on this site yet. Indulge Food Hall . Nine counters, including Mexican food inspired by Los Lobos, a new Middle Eastern counter, Q Texas Smokehouse, Planterie and Nudls. Good for a solo lunch: walk up, order, sit anywhere. Surfside Café . The buffet. NCL says it’s bigger on Aura and runs along both sides of the ship. The Local Bar & Grill . Pub food nearly all day. Specialty restaurants (extra charge, or part of a dining package): Tamara, Deck 8. NCL’s first Indian specialty restaurant. New on Aura. Cagney’s Steakhouse , Le Bistro (Deck 7), Sukhothai (Thai, Deck 7), Palomar and Onda by Scarpetta (both Deck 8), Hasuki (hibachi) and Nama (sushi). NCL hasn’t published Aura’s specialty prices. If your fare includes specialty meals, book them as soon as NCL opens reservations for your sailing. Drinks. Whether drinks are included depends on your fare. Ask Tina. If you’re buying a package, put your own numbers into the drink calculator . It’s set up for NCL, and it shows whether a package pays off for the way you actually drink."},{"t":"Getting online","s":"ship","a":"pk-getting-online","x":"NCL sells Wi-Fi packages, and some fares include some Wi-Fi. The internet at sea guide explains how cruise Wi-Fi works and how to avoid roaming charges ashore. For most people in this group: Use whatever Wi-Fi your fare includes, and don’t expect to stream video. In port, your own phone plan may work. Check with your carrier before you go (more in Section 8 ). Send one short message a day to someone at home. See Section 6 ."},{"t":"Section 2 — Day by Day","s":"guide","a":"section-2","x":"The times below come from cruise booking sites for this sailing. Check them in the NCL app before you sail. The departure time printed for each port is ship time. Before you walk off, check it again and set your watch to the ship. This is not your plan. What follows is one possible shape of the week, not a schedule to keep. Only a few things on it are actually fixed: the muster drill, sailaway, the ship’s arrival and all-aboard times in each port, and anything you have already booked. Everything else is a suggestion you are free to ignore, reorder, or sleep through. A day spent entirely on your balcony is not a day wasted, and nothing here is a commitment you have made to anyone."},{"t":"Day 1 — Saturday, October 14 — Miami (embarkation)","s":"ports","a":"pk-day-1-saturday-october-14-miami-embarkation","x":"Terminal. NCL’s PortMiami terminal is at 1015 N. America Way . NCL’s driving directions say to put 1761 N. Cruise Blvd. into your GPS, and to park in Garage B , which NCL runs. NCL hadn’t said which terminal Aura uses when this was written; its other big ships use this one. Your boarding documents will name the terminal. Check it. Fly in the day before. The ship leaves at 4:00 PM, and a same-day flight leaves no room for a delay. Friday October 13 is the sensible arrival day. The usual first afternoon: Before you leave home: do NCL’s online check-in and pick your arrival time. Board and eat. Cabins usually aren’t ready right away. Lunch at Surfside Café or Indulge Food Hall passes the time. Muster drill. Required. Part of it is in the NCL app, and part is checking in at your assigned station. 4:00 PM, sailaway. Your host will say where the group is meeting, in the group chat. Evening. The group’s dinner plan comes from your host. If you’re in a Studio, check the daily schedule in the app for a Studio Lounge get-together. Keep in your carry-on: your passport , all medications, a swimsuit, a change of clothes, a phone charger. Checked bags can take until evening to reach your cabin. Money aboard. Your keycard is your room key and your charge card. Everything aboard is in US dollars."},{"t":"Day 2 — Sunday, October 15 — At sea","s":"guide","a":"day-2-sunday-october-15-at-sea","x":"The first sea day. The ship is heading southeast toward the Dominican Republic. Some ideas, pick what suits you: Coffee on Ocean Boulevard (Deck 8) early, before it gets busy. Studio Lounge if you’re in a Studio. Ocean Heights (Decks 18 to 21) in the first hour it opens, when lines are short. The spa’s Thermal Suite , if you’ve bought a pass. Book specialty dinners if you haven’t. Whatever group activity your host plans."},{"t":"Day 3 — Monday, October 16 — Puerto Plata, Dominican Republic","s":"ports","a":"pk-day-puerto-plata","x":"In port: 7:00 AM to 3:00 PM. All aboard 2:00 PM. Which pier. Puerto Plata has two cruise piers. Amber Cove , west of town, is used mostly by Carnival’s lines. Taino Bay sits at the edge of the old town, and port listings put NCL’s ships there. The Dominican government announced the first call of Aura’s sister ship, Norwegian Aqua, at Taino Bay. Nobody has published Aura’s pier for 2028. This pack assumes Taino Bay, but check the NCL app. If it’s Taino Bay: the old town is next door. Travel guides put the walk at 10 to 15 minutes. Things to know: Fortaleza San Felipe. The Dominican tourism ministry describes it as a fort the Spanish built in the 16th century to defend the north coast. The cable car up Mount Isabel de Torres has been closed since June 2024 for lack of a safety certificate, according to Dominican news reports. A rebuild started in October 2026, and the target for reopening is early 2028. Check before you plan on it. NCL’s tours, with 2026 prices: Ocean World Day Pass (adults from $99.99, about 4½ hours, buffet lunch included) and Damajagua Waterfalls (adults from $119.99, about 4 hours, minimum age 8, closed-toe shoes required). The waterfalls are a drive inland, so on a day with a 2:00 PM all-aboard a ship tour is the safe choice. NCL says it always waits for its own tours to get back before sailing. Money. The Dominican peso is the local money. The tourism ministry says businesses in tourist areas take dollars, but at a worse rate than the banks. Small US bills are fine for a short day. Documents. You need a passport. The Dominican Republic’s entry page asks for six months of validity left on it. There was a temporary exception for US citizens, but it ran only through December 31, 2026. For October 2028, make sure your passport is good through at least April 2029 unless the rule has changed. Cruise passengers don’t fill out the e-ticket form. Emergency number: 911. Pack for today: passport, sunscreen, a hat, water shoes if you’re doing the waterfalls, some small US bills. Build your day in the Port Day Planner , and log it afterward in the Port Logbook . This site’s page for the other Puerto Plata pier, Amber Cove , has more about the area."},{"t":"Day 4 — Tuesday, October 17 — St. Thomas, U.S. Virgin Islands","s":"ports","a":"pk-day-st-thomas","x":"Charlotte Amalie, St. Thomas: colorful Danish colonial buildings cascading down the hillside above the harbor In port: 10:00 AM to 6:00 PM. All aboard 5:00 PM. Which pier. Ships dock at either Havensight or Crown Bay , both near downtown Charlotte Amalie. Local news reports of the West Indian Company’s 2027 schedule put Aura at the WICO dock at Havensight . The 2028 schedule wasn’t out when this was written. What it is. A US territory. US dollars, and US phone plans work the way they do at home. They drive on the left. Things to know (2026 prices): Magens Bay. The beach most people mean when they say St. Thomas. Entry is $7 for non-residents over 12 (the Magens Bay Authority’s fee since October 2023). Taxis charge per person. A 2024 copy of the official rate card shows $15 for one person, $12 each for two or more between Magens Bay and Havensight. St. John. The public ferry from Red Hook , on the east end, runs every hour on the hour and takes about 20 minutes. The fare is $8.15 each way (VI Department of Public Works). Trunk Bay in the national park charges $5 for ages 16 and up. The ferry from downtown leaves at 10:00 AM, which is when the ship arrives, so Red Hook is the realistic route. Be back at Red Hook in time to make a 5:00 PM all-aboard. A ship tour is the no-worry way to do St. John. Downtown. Shopping on Main Street, and the old Danish buildings. The USVI tourism department says both piers are a short distance from downtown. Emergency number: 911. Documents. US citizens don’t need a passport to visit the USVI, but you need one for the rest of this cruise, so carry it. More on the St. Thomas port page ."},{"t":"Day 5 — Wednesday, October 18 — Tortola, British Virgin Islands","s":"ports","a":"pk-day-tortola","x":"In port: 7:00 AM to 2:00 PM. All aboard 1:00 PM. This is the short day. The pier. Ships dock at the cruise pier in Road Town, the capital. CruiseMapper says the pier takes two large ships, and when a third is in, one anchors and runs tenders. Pier Park, the shopping and restaurant area, is right at the pier, and travel guides put the walk into Road Town at 10 to 15 minutes. What it is. A British Overseas Territory that uses the US dollar. Things to know: Cane Garden Bay. A beach on the north side. A 2026 travel guide puts the taxi at $10 to $16 per person , about 20 minutes each way. A good half day that leaves room before 1:00 PM. The Baths, Virgin Gorda. The big boulders and sea pools, on another island. Don’t try it on your own this day. The public ferries work on paper, but one late boat means a missed ship. NCL sells a Virgin Gorda and The Baths tour, and NCL says it always waits for its own tours to get back before sailing. Road Town. Walkable from the pier. Emergency number: 911 (the UK government’s travel advice; it also lists 767 for sea rescue). Documents. The BVI tourism board says a passport is required to enter and leave. Bring it. More on the Tortola port page ."},{"t":"Day 6 — Thursday, October 19 — At sea","s":"guide","a":"day-6-thursday-october-19-at-sea","x":"The second sea day, heading northwest toward the Bahamas. A good day for the spa, Ocean Heights, or a long lunch. It’s also a good day to settle your onboard account in the app, so the last morning is quieter."},{"t":"Day 7 — Friday, October 20 — Great Stirrup Cay, Bahamas","s":"ports","a":"pk-day-great-stirrup-cay","x":"In port: 10:00 AM to 6:00 PM. All aboard 5:00 PM. The pier. NCL’s private island now has a pier, so you walk off the ship . No tender boats. The first ship docked there on December 28, 2025. Free with your fare (NCL’s island page): the beaches, the food, a resort-style pool, and a kids’ splash pad. Extra cost: Great Tides Waterpark. It opened September 4, 2026. NCL says it’s an extra cost, and that tickets and pricing “vary based on seasonality and availability.” NCL lets booked guests reserve passes in the app up to two days before sailing. NCL hasn’t published a price. Vibe Shore Club (adults only, a day pass), cabanas , and the Silver Cove villas. Paying. NCL quotes a guest saying their room card worked on the island. Documents. The Bahamas is a foreign country, so carry your passport. Emergency. The ship’s medical team and NCL’s staff are on the island. More on the Great Stirrup Cay port page ."},{"t":"Day 8 — Saturday, October 21 — Miami (debarkation)","s":"ports","a":"pk-day-8-saturday-october-21-miami-debarkation","x":"The ship is due in at 7:00 AM. NCL will tell you the night before how bags and walk-off times work. Usually you put checked bags outside your door the night before, and keep your passport, medications and a change of clothes with you. Flights home: book a flight that leaves after midday. Getting off a big ship, through customs and to the airport takes time."},{"t":"Section 3 — Pre-Cruise Countdown","s":"guide","a":"section-3","x":""},{"t":"Now, when you book","s":"guide","a":"now-when-you-book","x":"Book through Maulsby Travel Co. That’s how you get into the group. Contact Tina Maulsby at tina@maulsbytravel.com or 910-528-5077. Ask Tina what your fare includes: drinks, Wi-Fi, specialty dining, and whether gratuities are prepaid. Check your passport. For the Dominican Republic it should be valid through at least April 2029 . Renew now if it isn’t. Buy travel insurance soon after you book. It’s hurricane season, and medical care aboard is billed to you."},{"t":"When NCL opens your reservation details","s":"guide","a":"when-ncl-opens-your-reservation-details","x":"Specialty dining , if your fare includes it or you plan to buy it. Shore tours. Damajagua in Puerto Plata and the Virgin Gorda tour from Tortola are the ones worth booking early. Great Tides Waterpark , if you want it. NCL lets you book passes up to two days before sailing."},{"t":"About a month before","s":"guide","a":"about-a-month-before","x":"Do NCL’s online check-in and choose an arrival time. Fill in the handoff card in Section 6 and give it to one person at home. Join the group chat , if you haven’t already. Count down with the countdown tool , if that helps."},{"t":"The week before","s":"guide","a":"the-week-before","x":"Check the hurricane outlook at the National Hurricane Center (nhc.noaa.gov). Download your boarding documents and keep a copy offline. Pack. See Section 4 ."},{"t":"The day before, Friday October 13","s":"guide","a":"the-day-before-friday-october-13","x":"Fly into Miami and stay the night."},{"t":"Section 4 — Packing List","s":"guide","a":"section-4","x":"This list fits a mid-October Eastern Caribbean week : hot days, warm nights, a real chance of showers, three port days, two sea days and an island day. NCL is a casual line. Evenings are relaxed, and NCL’s own description of its new dining room says casual dress is as welcome as a suit jacket. For more, see the packing lists ."},{"t":"Documents and money","s":"guide","a":"documents-and-money","x":"Passport , valid through at least April 2029 A copy of your passport, kept somewhere else Your insurance policy and its emergency number, printed Two cards, kept in different places Some small US bills for taxis and tips ashore Your NCL boarding documents, printed and saved offline"},{"t":"Carry-on","s":"guide","a":"carry-on","x":"All medications, in their original bottles Phone, charger, power bank Refillable water bottle Swimsuit A change of clothes Sunglasses, hat, sunscreen A light rain jacket"},{"t":"Daytime","s":"guide","a":"daytime","x":"Swimsuits (more than one, since things dry slowly in humid air) A cover-up Light shirts and shorts One long-sleeved shirt for sun, and for bugs inland A light sweater for the air conditioning Insect repellent"},{"t":"Evenings","s":"guide","a":"evenings","x":"Casual-smart outfits for dinner One dressier outfit if you like to dress up"},{"t":"Footwear","s":"guide","a":"footwear","x":"Walking shoes Closed-toe water shoes , required for Damajagua Waterfalls Sandals or flip-flops"},{"t":"Toiletries and health","s":"guide","a":"toiletries-and-health","x":"Prescriptions, plus a few days extra in case of delay Pain reliever, stomach medicine, and motion-sickness medicine if you use it Reef-safe sunscreen, after-sun lotion, lip balm with SPF"},{"t":"Leave at home","s":"guide","a":"leave-at-home","x":"Valuable jewelry. Before you pack an iron, a steamer or candles, check NCL’s list of prohibited items."},{"t":"Section 5 — Budget Breakdown","s":"guide","a":"section-5","x":"Prices here were checked in October 2026, for a cruise in October 2028. Expect them to change. Use them for planning, and check again at booking and before you sail. For your own total, the cruise budget calculator is set up for this."},{"t":"Usually in the fare","s":"guide","a":"usually-in-the-fare","x":"Your cabin Meals at Hudson’s, the Panorama Room, Indulge Food Hall, Surfside Café and The Local The main shows Pools, the gym, and the free parts of Ocean Heights Whatever your group fare adds. Ask Tina"},{"t":"What might cost extra","s":"guide","a":"what-might-cost-extra","x":"Item What we know (2026) NCL’s daily service charge $20 per person per day (7 nights = $140); $25 in The Haven and suites. NCL’s figure for bookings made from January 1, 2023 Drinks Depends on your fare. Ask Tina, then run the drink calculator Wi-Fi Depends on your fare Specialty dining Prices for Aura not yet published Puerto Plata tours (NCL) Ocean World from $99.99 adult; Damajagua from $119.99 adult St. Thomas Magens Bay $7 entry plus taxi ($15 one person, $12 each for two or more, per a 2024 rate card); St. John ferry $8.15 each way plus Trunk Bay $5 Tortola Cane Garden Bay taxi $10 to $16 per person each way; NCL’s Virgin Gorda and The Baths tour Great Stirrup Cay Waterpark, cabanas, Vibe Shore Club: prices not yet published LunaTique show Extra; price not yet published Travel insurance Depends on age and coverage Hotel the night before Depends on Miami prices that weekend"},{"t":"Tipping","s":"guide","a":"tipping","x":"NCL’s service charge covers the crew in general. Many people also tip a little in cash for service that stood out. The cruise tipping calculator does the arithmetic, and Cruise Tipping 2026 explains the custom."},{"t":"Section 6 — Emergency Contacts","s":"guide","a":"section-6","x":"Fill this in and give a copy to one person at home before you go. FAMILY HANDOFF — IN THE WAKE VOYAGE PACK ───────────────────────────────────────── CRUISER: ________________________ CABIN: ____________ SHIP: Norwegian Aura LINE: Norwegian Cruise Line (NCL) SAILING: October 14 – 21, 2028 FROM: Miami, Florida, USA ITINERARY: Miami → at sea → Puerto Plata (DR) → St. Thomas (USVI) → Tortola (BVI) → at sea → Great Stirrup Cay (Bahamas) → Miami GROUP: Maulsby Travel Co. hosted solo group Host: ____________________________ EMERGENCY (24/7): US Citizens Abroad — State Dept OCS: +1 (888) 407-4747 (from the US/Canada) +1 (202) 501-4444 (from abroad) Reach someone aboard — NCL: +1 (833) 810-7963 (US/Canada) +1 (321) 953-9006 (international) (a paid call; have a card ready) Booking — Tina Maulsby, Maulsby Travel Co.: 910-528-5077 tina@maulsbytravel.com EMERGENCY NUMBERS ASHORE: Miami, FL — 911 Puerto Plata, DR — 911 US Embassy Santo Domingo: do.usembassy.gov St. Thomas, USVI — 911 (US territory) Tortola, BVI — 911; sea rescue 767 US Embassy Bridgetown covers the BVI: bb.usembassy.gov Great Stirrup Cay — ship's medical team on the island US Embassy Nassau: bs.usembassy.gov CRUISER MEDICAL: Allergies: ________________________ Medications: ________________________ Conditions: ________________________ Insurance: ________________________ policy: ____________ WHERE IS THE SHIP: cruisinginthewake.com/tools/ship-tracker.html ─────────────────────────────────────────"},{"t":"What the person at home should do","s":"guide","a":"what-the-person-at-home-should-do","x":"If they don’t hear from you for a day or two: Don’t panic. Ship Wi-Fi is patchy. Silence usually means no signal. Call Tina at Maulsby Travel Co. (910-528-5077). She booked you and can reach your host. To get a message to the ship, call NCL’s line for reaching guests aboard: +1 (833) 810-7963 from the US or Canada, +1 (321) 953-9006 from elsewhere. It’s a paid call. If it’s serious, call the State Department’s Overseas Citizens Services: +1 (888) 407-4747. It’s free, it runs around the clock, and it works with cruise lines and embassies. To see where the ship is, use the ship tracker . The page on reaching someone at sea explains how all this works. Why no embassy phone numbers? The embassy sites couldn’t be read from where this pack was made, and a wrong emergency number is worse than none. Look up the numbers on the embassy sites above before you leave, and write them in."},{"t":"Section 7 — Seasickness and October Weather","s":"guide","a":"section-7","x":""},{"t":"Weather","s":"guide","a":"weather","x":"Below are typical figures for October 14 to 21, worked out from five years of weather records (2020 to 2024) for each port. They’re averages, not a forecast. The companion app shows a real forecast once your dates are about two weeks away. Port Typical high Typical low Days with rain Miami 82°F 72°F 68% Puerto Plata 87°F 76°F 50% St. Thomas 84°F 81°F 52% Tortola 84°F 81°F 48% Great Stirrup Cay 82°F 78°F 52% These come from Open-Meteo’s historical weather records, at the grid point the records use for each port. For small islands like St. Thomas and Tortola that point sits over the water, which is why their night-time lows look so close to the highs. Wet days means days with more than 1 mm of rain. Bring a light rain jacket. Hurricanes. NOAA says the season runs to November 30, and most activity happens between mid-August and mid-October. If a storm threatens, the cruise line can change ports or the order of the days. It’s their call, and it’s made for safety. That’s the main reason to carry travel insurance this week."},{"t":"Seasickness","s":"guide","a":"seasickness","x":"Nobody can promise how your body will feel at sea. If you’re prone to seasickness: Pick a cabin low and in the middle of the ship , where motion is least. Ask your doctor or pharmacist about meclizine (Bonine), dimenhydrinate (Dramamine) or a prescription scopolamine patch, and try anything new at home first. Ginger and acupressure bands help some people. Fresh air and a view of the horizon help most people. The ship’s medical center can treat seasickness. It bills you, and most US health plans don’t cover care at sea, so check yours."},{"t":"Section 8 — Practical Logistics","s":"guide","a":"section-8","x":""},{"t":"Phones","s":"guide","a":"phones","x":"At sea: use the ship’s Wi-Fi, and turn off cellular data to avoid charges from the ship’s network. Puerto Plata and Tortola: foreign countries. Some US plans include them and some charge a daily fee. Check with your carrier before you go. St. Thomas: a US territory, so most US plans work as they do at home. Great Stirrup Cay: don’t count on a signal."},{"t":"Money","s":"guide","a":"money","x":"Aboard: US dollars, charged to your keycard. Puerto Plata: pesos, though dollars are widely taken in tourist areas at a worse rate. St. Thomas and Tortola: US dollars. Great Stirrup Cay: your room card."},{"t":"Laundry","s":"guide","a":"laundry","x":"NCL’s packing page says plainly: “Please note that laundry is not self-service.” You can send clothes out through your cabin steward, for a charge. Packing a few things you can wash in the sink saves money."},{"t":"Smoking","s":"guide","a":"smoking","x":"NCL doesn’t allow smoking in cabins or on balconies, and charges a $250 cleaning fee if you do. Indoor public areas are smoke-free except the casino and cigar lounges."},{"t":"Accessibility","s":"guide","a":"accessibility","x":"If you use a wheelchair or a scooter, or need other help, tell Tina when you book so NCL can note it. Every port on this cruise is a docked port when things go to plan, so there are no tender boats on a normal day. At Tortola, if three ships are in, one has to tender. The accessibility guide on this site covers more."},{"t":"Section 9 — The Group Cruise Rhythm","s":"guide","a":"section-9","x":"Your host will run the group’s week, and the plan will come through the group chat. The flyer lists what’s included: A dedicated group host aboard Daily group dining Group shore excursion options Meetups and activities A private group chat , before and during the cruise So expect a sailaway meetup, a regular dinner time, and some group options in port. Nothing is required. You can show up for every dinner or for one. Most hosted groups are made up of people who came alone, so nobody needs a reason to sit down. If you’re shy: go to one dinner. That’s all it takes. Things grow from there."},{"t":"Section 10 — Solo Cruising Considerations","s":"guide","a":"section-10","x":"Aura has NCL’s solo cabins and the lounge that goes with them: Solo Studios , which NCL says are designed and priced for solo travelers. The Studio Lounge is for Studio guests only, with drinks and light snacks, and it’s where solo cruisers meet. Indulge Food Hall and the buffet are easy places to eat alone without asking for a table for one. Ocean Boulevard has room to sit by the water on your own, with plenty of people around. Safety, the same as at home: tell someone where you’re going ashore, keep your drink in sight, and use the ship’s tours if you’d rather not plan the day yourself. The solo cruising hub has more from people who’ve done it."},{"t":"Section 11 — First Cruise Notes","s":"guide","a":"section-11","x":"If this is your first cruise, the first-cruise guide goes deeper. A few things worth knowing ahead: Cabins are small. Even a balcony cabin is smaller than most hotel rooms. The NCL app is how you run the week. Download it and log in before you go. Be back early. Be back aboard before all-aboard time. If you’re late on your own, the ship can leave without you. NCL says it always waits for its own tours. You don’t have to do everything. The best part of a cruise is often the hour you didn’t plan. The cruise duck tradition is a small, friendly custom worth knowing about. If you like photos, the cruise tech and photography guide helps you pack the right gear."},{"t":"Closing","s":"guide","a":"closing","x":"This pack is a plain read on one week: a brand-new ship, four warm stops, and a group of people who came alone and don’t have to stay that way. Check the numbers before you go, book through Maulsby Travel Co., and enjoy it. Share or save. The companion app has a share button. If someone you know is thinking about this cruise, send them the link. Soli Deo Gloria. All work on this project is offered as a gift to God. The site that produced it is independent: no affiliate links, no commissions, no upsells. If it helped you, that’s the whole point. Last reviewed | 2026-10-05. Ship facts from NCL’s releases of January, April, August and September 2026; sailing times from booking sites; port facts as noted below | How facts here are checked | Every fact in this pack is listed with its source in the pack’s fact-check file. Ship facts come from Norwegian Cruise Line’s own newsroom and website. The sailing’s dates, port order and times come from two cruise booking sites (iCruise and CruiseWeb), because NCL’s own site hadn’t published per-day times for this sailing. Port facts come from government and port-authority sources where they could be read (the Dominican tourism ministry, the VI Department of Public Works, the National Park Service, the BVI tourism board, the UK government’s travel advice, US Customs and Border Protection, NOAA) and from named travel sites where they couldn’t. Weather averages were calculated from Open-Meteo’s historical weather records. Where sources disagreed, the pack says so or leaves the number out. | Accessibility | This pack is written to read straight through on a screen reader: headings in order, small labeled tables, and links named for where they go. If something here is hard for you to use, that’s a bug. Tell Tina and it’ll get back to me. | Sources | Ports on this site: Miami , Amber Cove , St. Thomas , Tortola , Great Stirrup Cay . Ship: Norwegian Cruise Line newsroom (January 15, April 16, August 19 and September 15, 2026) and NCL’s Aura deck plans, accommodations, dining and Haven pages; sister ship Norwegian Aqua . Venues: Hudson’s , Indulge Food Hall , Surfside Café , The Local , Cagney’s , Le Bistro , Sukhothai , Palomar , Onda by Scarpetta , Hasuki , Nama , Studio Lounge , Vibe Beach Club . Tools: drink calculator , cruise budget calculator , cruise tipping calculator , port day planner , port logbook , ship tracker , ship size atlas . Reference: solo cruising hub , first-cruise guide , countdown , packing lists , internet at sea , reaching someone at sea , disability at sea . Articles: cruise cabin organization , Cruise Tipping 2026 , cruise duck tradition , cruise tech and photography guide . Cover: the Maulsby Travel Co. flyer for this sailing. |"}]</script>
