. Costs at a glance (per person): Capital Transit city bus to Mendenhall ~$4 each way · M&M Tours Glacier Express $79 (3-hr tour incl. visitor-center admission) · Ship-sold Mendenhall excursion $80–130 · Mount Roberts Tramway $65 all-day independent at dock · Whale watching $130–180 · Mendenhall + whale combo ~$220 · Helicopter to Juneau Icefield $600–900 · Helicopter + dog sled $650+ . Bring $60–100 USD cash plus whatever the excursion line item is. For accessibility: Downtown sidewalks are good but the city is hilly — the path from cruise dock to State Capitol is uphill. The M&M Tours Glacier Express to Mendenhall is wheelchair-accessible (verify in advance). The Mount Roberts Tramway car is accessible. Whale-watching boats vary by operator — verify accessibility in advance. Pack for Juneau: layers (Juneau is wetter than Sitka or Skagway — count on rain), waterproof shell, sturdy walking shoes, daypack, $60–100 cash USD, plus whatever excursion-specific gear (binoculars for whale watching, hiking shoes for Mendenhall trails). For lived-day accounts of the Mendenhall walk in actual Juneau weather and the Mount Roberts views, see the Juneau port page and its logbook entries ."},{"t":"Day 6 — Saturday — Cruising south toward Victoria (sea day)","s":"guide","a":"day-6-saturday-cruising-south-toward-victoria-sea-day","x":"A recovery day between Alaska’s port intensity and Victoria’s evening stop. Ship sails south through Chatham Strait and Queen Charlotte Sound, threading the protected coastal route most of the day. Open-water exposure is minimal. Morning ideas: Sunrise on your balcony or in the Solarium (deck 14, heated, glass-roofed) — the best 30 minutes of any sea day on this ship. Spa morning — Vitality at Sea Spa’s thermal-suite day pass usually has a sea-day intro rate posted in the Cruise Compass . ~90 minutes is the right dose. Naturalist talks or lectures — Royal often schedules wildlife or Alaska-history programming on this day; check the daily program. Afternoon: Two70 (deck 5 aft) — wraparound windows, comfortable seating, watching the channel. The Café Two70 has decent coffee. The Solarium — quietest pool day of the week. Specialty dining walk-up — sea-day-evening reservations at Chops, Jamie’s, Wonderland, or Izumi fill earlier than you’d expect; mid-afternoon is the right window for a host stand. Evening — pack mentally for Victoria. Victoria’s arrival is short and evening; review the Inner Harbour walkable options before you arrive so you can step off the shuttle with a plan."},{"t":"Day 7 — Sunday — Victoria, British Columbia","s":"ports","a":"pk-day-7-sunday-victoria-british-columbia","x":"Arrival: Approximately 6:00 PM. Depart 11:59 PM. The ship docks at the Ogden Point breakwater, ~3 km from downtown. Free shuttle buses or a $10 round-trip cab/rideshare run between Ogden Point and the Inner Harbour. Why Victoria is on every Seattle-Alaska itinerary. The Passenger Vessel Services Act of 1886 prohibits foreign-flag vessels (which most large cruise ships are — Anthem of the Seas is Bahamian-flagged) from carrying passengers between two U.S. ports without a stop at a foreign port in between. A Seattle round-trip with stops in Sitka, Skagway, and Juneau is otherwise three U.S. ports back-to-back-to-back. Victoria is the nearest foreign port to Seattle, and the late-evening Sunday stop is the cheapest, shortest way for the cruise line to satisfy the requirement before returning to Seattle. Every Seattle-Alaska sailing across every line you’d be choosing between makes this call for the same reason. The wind-down framing fits the experience; the short evening window and the limited shore-time are the regulatory reason — usually unsaid. Victoria — the wind-down stop, not the headline. Provincial capital of British Columbia: Edwardian architecture, the Empress Hotel afternoon tea (~$95 CAD/person, reservations months ahead), the Royal BC Museum, and Butchart Gardens 30 minutes outside town. The evening port-call duration limits realistic options. Victoria isn’t trying to compete with Alaska; it’s the trip’s deceleration — and, structurally, the trip’s required foreign port. Free, walkable from a downtown drop-off: Inner Harbour — the iconic Parliament Buildings (lit up at night), the Empress Hotel exterior, harbor walking path, totem poles at Thunderbird Park. Beacon Hill Park — 30-minute walk from harbor, Victoria’s Central Park equivalent. Bastion Square / Old Town — walkable, restaurants, evening atmosphere. Paid (decide ahead): Butchart Gardens ($35 entry + transport ~$60 total) — world-famous gardens. Best in summer. Evening lighting is theatrical; the gardens stay open until 10:00 PM in summer. Requires getting out and back in a tight window — confirm sailing time before committing. Royal BC Museum ($30) — excellent provincial natural-history and First Nations collections. Closes 5–6 PM, so this works only if you arrive earlier than 6 PM (atypical for this itinerary). High tea at Empress Hotel (~$95 CAD) — book months ahead; book the earlier seating to make sailaway. Independent walking food tour (Hop on Hop off bus, etc.) — ~$45 for a 90-minute orientation if you have the time. If this is your first Victoria stop: treat it as the trip’s gentle decompression. Don’t over-plan it. A walk through Inner Harbour, a real Canadian dinner at a non-tourist-trap pub, a short stroll back, and you’re done. Save Butchart Gardens for a longer Victoria-specific trip. Sample evening shapes — the late arrival picks for you. Anthem docks Victoria at ~6 PM with an 11:59 PM departure; you get roughly five hours dockside. That’s enough for one substantial thing or two light ones. 2½ hours · the harbor walk. Free shuttle or $10 cab to Inner Harbour → walking loop past the Parliament Buildings (lit up after dark in late June) → dinner at a downtown pub → cab back. The lowest-friction Victoria. 3½ hours · Butchart Gardens at twilight. Pre-booked Butchart shuttle from Ogden Point → garden entry (open until 10 PM in summer; evening lighting is the move) → return shuttle. The single decisive thing to do in Victoria if it’s your only visit. Confirm your sailing time before committing; the window is tight. 3 hours · Empress tea at the early seating. Reserve months ahead → afternoon tea in the historic Tea Lobby → harbor walk → back. The most photographed Victoria evening on the itinerary. 2 hours · the food crawl. Cab to Bastion Square / Old Town → two small plates at two different walking-distance restaurants → back. The pack’s recommendation if dinner is your priority. Costs at a glance (per person): Inner Harbour shuttle from Ogden Point typically free (cruise line) or ~$10 r/t taxi · Butchart Gardens $35 entry + ~$25 round-trip shuttle = ~$60 all-in · Royal BC Museum $30 (closes 5–6 PM, so this works only on the rare earlier-arrival sailing) · Empress Hotel high tea ~$95 CAD (book months ahead) · Hop-on Hop-off bus orientation ~$45 for 90 minutes. Canadian dollars are local but USD and cards are universally accepted; you don’t need cash for a five-hour stop unless you prefer it. For accessibility: Inner Harbour is fully accessible (paved, level). The Ogden Point breakwater shuttle is accessible. Butchart Gardens is mostly accessible with some grade changes; verify with the gardens in advance if mobility is a concern. Pack for Victoria: dress slightly nicer than your Alaska-day uniform if you’re doing dinner downtown — Victoria has a quieter, more restrained vibe than the Alaska ports. A light jacket is plenty in late June. For lived accounts of evening Victoria — the Parliament lighting, the Butchart-on-a-tight-window dilemma — see the Victoria BC port page and its logbook entries."},{"t":"Day 8 — Monday — Seattle (debarkation)","s":"ports","a":"pk-day-8-monday-seattle-debarkation","x":"The realistic timeline: 6:00–8:00 AM: Breakfast available at Windjammer and main dining room. Eat now if your bag is in the hall already. 6:30 AM: Bags must be in the hall the night before (color-coded tags determine debarkation order). 8:00–10:00 AM: Walk-off in waves by tag color. Self-walk-off (you carry all bags off; first off the ship, around 7:00–7:30 AM) is the fastest if you have a flight to catch. 10:00 AM (latest): All passengers off the ship. If you’re staying in Seattle a night or two: Uber/Lyft from Pier 91 to Sea-Tac (SEA): ~$50–75, 25–35 minutes (price corrected — earlier $30–45 estimate was low; Pier 91 is in Magnolia and surge-prices on debark Saturdays) Light rail from downtown: $3.50 to SEA, ~40 minutes — but Pier 91 is not walking-distance from any Link station; you’d need a taxi or shuttle to Westlake or Pioneer Square first, which negates the savings Hotel options at Pioneer Square, Belltown, or near Pike Place keep you walking-distance from the city’s better dinners Walk Pike Place Market in the morning (it’s at its quietest before 9 AM) Port Valet — use it. The Port of Seattle’s free Port Valet service transfers your checked bag from the ship directly to your final-destination airline check-in. You walk off the ship with only your carry-on; your bag meets you in baggage claim at home. Available for most major airlines on most departure days; sign-up sheet is distributed onboard mid-cruise (typically Day 4 or 5 — watch the Cruise Compass ). Free. The piece of Seattle post-cruise logistics that saves the most luggage friction. Tipping at the end of the cruise. Royal’s auto-gratuity is added to your shipboard account daily — $18.50/day per person in standard staterooms; $21.00/day per person in suites (current rates effective November 2024). For the total-fare picture including auto-grats plus typical cash tips, the cruise-tipping-calculator gives a calibrated read. For the broader context of why cruise gratuities work the way they do across the major lines in 2026, Cruise Tipping 2026 is the longer read. Additional cash tips for outstanding service are appreciated: Stateroom attendant who went above and beyond: $20–40 cash in an envelope, end of cruise Dining-room waiter and assistant for excellent service: $20–30 cash each Bar staff or barista you saw repeatedly: $10–20 Killing time before an evening flight. Pier 91 has a Crew Center bag-storage service: $6/bag/day, pickup deadline 3 PM. Walk-on storage during disembarkation hours; bag tag matters. If you’d rather hand the bag off to your airline via Port Valet (above), do that. With four to six hours in Seattle, low-effort options: Pike Place Market (15-min Uber from Pier 91): the most-recommended-because-it-works walk. Coffee at the original Starbucks line is a tourist tax; the Crumpet Shop and Beecher’s are better food. Quietest before 9 AM, busy from 10. Seattle Center / Space Needle (10-min Uber from Pier 91): the Space Needle observation deck ($35) is a 45-minute experience; the Chihuly Garden next door ($35) is photogenic if you’ve never seen Chihuly glass in scale. Olympic Sculpture Park (waterfront walk from Pier 91 in good weather, free): a 30-minute outdoor loop overlooking Elliott Bay. Ballard Locks (15-min Uber): boats locking through, salmon ladder in season, quiet vs. downtown. Discovery Park (10-min Uber, free): if you want the Pacific Northwest landscape on the way out — Magnolia Bluffs, beach, lighthouse loop. Bring real shoes. SEA without an Uber. From downtown Seattle (not Pier 91 directly), the Link light rail is workable with luggage: $3.50, 40 min, no transfer if you board at Westlake or University Street. The catch is getting to a Link station from Pier 91 with luggage — a $15–20 short taxi to Westlake makes the math work if you’d rather not pay full Uber to the airport. Door-to-door from Pier 91, Uber/Lyft is the call: $50–75, 30 minutes. Shared shuttles (Quick Shuttle, Capital Aeroporter) run from Pier 91 on cruise debark days, $20–30/person, but routes are slow on Saturdays. Airport-arrival timing. For a domestic flight after 5 PM, leave Pier 91 by 2 PM. For an international flight after 7 PM, leave by 3 PM. SEA TSA lines run 30–60 min during Saturday afternoon cruise debark; SEA is a sprawling airport and your gate could be a 15-min walk from security."},{"t":"Section 3 — Pre-Cruise Countdown","s":"guide","a":"section-3-pre-cruise-countdown","x":"A staged checklist tied to typical cruise booking and travel windows. The countdown.html tool generates a personalized version once your sailing date is loaded."},{"t":"12+ months before — booking and big decisions","s":"guide","a":"months-before-booking-and-big-decisions","x":"Confirm Royal Caribbean booking with your travel agent or directly via royalcaribbean.com. Decide on cabin category (Interior / Oceanview / Balcony / Suite) — see Section 1 for the Alaska-specific math. Travel insurance . For an Alaska cruise specifically, “trip interruption” and “medical evacuation” coverage matter — you’re far from medical facilities and Alaska air ambulance flights are expensive. Allianz, Travel Guard, Travelex, Faye, or whatever your home insurance carrier offers as add-on. Decide and buy within 14 days of your initial deposit if you want pre-existing condition coverage. Book pre-cruise hotel in Seattle. The night-before hotel is non-negotiable for Alaska cruises out of Seattle."},{"t":"8 months before — soft logistics","s":"guide","a":"months-before-soft-logistics","x":"Plan flights to Seattle. Sea-Tac (SEA) is the only realistic option. Arrive at minimum the day before sailing. If routing through DEN, ORD, or DFW in summer, build a 3+ hour layover. Cabin number assignment. Royal often assigns specific cabin numbers 6–8 months out. Once assigned, run the stateroom-check tool — it surfaces the noise, motion, and view issues that don’t show on the deck plan. Begin “soft” packing list. Identify what you have vs. what you’ll need to buy (Alaska is a layering trip; don’t underestimate this)."},{"t":"6 months before — final commitments","s":"guide","a":"months-before-final-commitments","x":"Final payment to Royal Caribbean (typically 90–120 days before sailing — confirm exact date). Reserve dining in the Royal Caribbean app. Specialty restaurants book up early; My Time Dining versus traditional dining time slot. Reserve excursions in the Cruise Planner. Some Skagway White Pass railway slots and the better Juneau whale-watching boats fill up. Booking through Royal is convenient but ~20–40% pricier than independent operators in most cases. The “do I trust the ship to wait if I’m late” question argues for ship excursions for the railway specifically."},{"t":"3 months before — final prep window","s":"guide","a":"months-before-final-prep-window","x":"Online check-in opens 21–45 days before sailing. Get it done as soon as it opens. SeaPass / SetSail Pass. Print or save to phone (Royal’s check-in is mostly digital now). Print or save excursion confirmations as a backup. Review your packing list against the Alaska-specific items in Section 4."},{"t":"30 days before — packing window","s":"guide","a":"days-before-packing-window","x":"Start the packing list (see Section 4). Pull out and try on layered clothing now — not the night before. Confirm prescription refills. Cruise pharmacies are limited; bring 3+ days extra. If you’re doing the helicopter glacier-landing tour, double-check the weather-cancellation policy."},{"t":"14 days before — soft logistics","s":"guide","a":"days-before-soft-logistics","x":"Print or save digitally any documents you want as backup. Notify your bank and credit card issuers of the travel. Charge all devices, cameras, binoculars 2 days before."},{"t":"Day before — Seattle arrival","s":"guide","a":"day-before-seattle-arrival","x":"Arrive Sunday if your sailing is Monday. Light dinner. The Anthem dining room is open Day 1. Pre-pack your Day-1 carry-on (see Section 2 — Day 1). Sleep early; the embarkation morning is logistical."},{"t":"Section 4 — Packing List (calibrated for Alaska, 7 nights, June)","s":"guide","a":"section-4-packing-list-calibrated-for-alaska-7-nights-june","x":"This list is tuned for: Alaska summer (mid-June through late August) — generally 50–65°F with frequent rain, occasional 40°F mornings, and rare 75°F afternoons. One full glacier day (Endicott Arm) where you’ll want serious cold-weather layers. Three port days mostly walking. Inside Passage cruising with significant deck time. The Royal Caribbean dress culture (smart casual most evenings; one or two “smart elegant” nights — jacket suggested but not required). If you remember nothing else: the Alaska packing rule is layering . You’ll wear a thermal, a fleece, a shell, and a waterproof on the same morning. Pack for the worst case in each layer category and you can mix-and-match."},{"t":"Documents and money","s":"guide","a":"documents-and-money","x":"Passport (preferred over passport card + birth certificate). Passport must be valid for at least 6 months past your return date; confirm and renew if needed. SeaPass / SetSail Pass (printed and digital). Printed or app-saved excursion confirmations. Credit card you trust (notify the issuer of travel; international fees waived if available). ~$200 cash USD in $5/$10/$20 bills for tips and small port purchases. Smaller bills for taxi tips in Skagway/Juneau. Don’t bring CAD specifically — your card works fine in Victoria."},{"t":"Carry-on (must arrive on the ship with you)","s":"guide","a":"carry-on-must-arrive-on-the-ship-with-you","x":"All medications + 3-day buffer (NEVER in checked bags). Daily / scheduled / controlled-substance prescriptions all in original labeled bottles. Phone, charger, backup battery. Camera + extra battery + memory card (the Endicott Arm morning will drain your phone fast). Binoculars (8x42 or 10x42 are the cruise-standard format; rent onboard if you don’t have them). A fleece or light jacket for Pier 91. Reading material for Day 1’s pre-cabin window. Small refillable water bottle. Travel documents."},{"t":"Outerwear (this is the layering system)","s":"guide","a":"outerwear-this-is-the-layering-system","x":"Base layer: thermal long-sleeve top + thermal long underwear (for the Endicott Arm morning specifically — synthetic or merino, not cotton). Mid layer: fleece pullover or down sweater. Worn on most port days and the glacier morning. Outer shell: waterproof and windproof rain jacket. Not a soft fashion jacket — a real shell. This is the most important single item for an Alaska cruise. It rains in Sitka 220 days a year. Optional warmer outer: for the Endicott Arm morning specifically, a heavier insulated jacket worn over the fleece. A puffy or synthetic-down works. Hat (warm beanie, not a baseball cap). Light gloves. Scarf or buff."},{"t":"For the ship — daytime","s":"guide","a":"for-the-ship-daytime","x":"7 daily outfits — comfortable layers (jeans or cargo pants are fine; leggings work; lightweight wool is gold). 5–6 t-shirts or long-sleeve casual tops. 2 pairs jeans or comfortable pants. Lightweight long-sleeve shirts for sun protection on rare warm port days. Comfortable walking shoes (broken in! not new!). Sandals or flip-flops for the Solarium pool if you’ll use it."},{"t":"For the ship — evening","s":"guide","a":"for-the-ship-evening","x":"5–6 evening outfits — Royal Caribbean’s evening dress code is smart casual most nights. Examples that work: dressy jeans + a button-down or a sweater, a casual dress, dressy linen separates. Examples that don’t: shorts and a t-shirt for dinner at the main dining room, athleisure for Two70. 1 “Smart Elegant” outfit (Royal’s term). Jacket-and-trousers for men, cocktail dress or dressy separates for women. There are typically 1–2 of these nights on a 7-night sailing. 1 swimsuit (for the Solarium). For theme nights (see below) — pack a few specific pieces if you want to participate. None are mandatory."},{"t":"Theme nights — pack a few pieces if you want to play","s":"guide","a":"theme-nights-pack-a-few-pieces-if-you-want-to-play","x":"Royal’s pre-cruise communications for this sailing flag four themed evenings rotating across the week. The specific night each falls on is set in the Cruise Compass once you’re aboard; theme nights typically anchor sea days and the longer port-evenings (Skagway, Juneau) when most cruisers are on the ship. Participation is optional — Royal explicitly says so. Most cruisers join one or two and dress smart-casual for the others. The four themes (per Royal’s pre-cruise communication): 80s Night — leg warmers, fishnets, neon, bright colors, big hair. The most-photographed of the four. 70s Night — funk and disco. Bell-bottoms, platform shoes, sequins, funky sunglasses. The drinks at the silent disco run for hours. Caribbean Night — Caribbean Dance Party on the Royal Promenade. Tropical shirts, flowy dresses, anything floral. (Quietly funny on an Alaska sailing — Royal runs the same theme rotation regardless of itinerary.) Let’s Dance Street Party — Royal’s signature all-white outfit night. Royal Promenade transforms into a high-energy dance floor. One all-white outfit is the single most useful theme-night piece — it works for this night and for several Caribbean/Mediterranean sailings if you cruise Royal again. Practical packing approach: bring one all-white outfit (works for Street Party + doubles as a smart-casual option), and one single colorful accessory or piece that gestures toward 70s/80s/tropical (a bright scarf, sequined top, funky sunglasses, Hawaiian shirt) — that one piece will let you participate in whichever themes you feel like joining without packing four full costumes. If you’d rather skip them all: smart-casual works on theme nights too. The Royal Promenade is the only space that goes full-themed; the main dining rooms and most bars stay normal-dress. Royal’s own communication: “Feel free to sport some regular casual wear… jeans, polos, sundresses, and blouses are all the right amount of laid back.”"},{"t":"Beach/port gear","s":"guide","a":"beachport-gear","x":"Daypack (hiking-style, ~15–20L) — used every port day. Waterproof shoes or treated walking shoes — you will be walking in mud and on wet boardwalks. Sun hat / cap (the rare clear day at altitude burns fast). Sunglasses (polarized for water glare). Sunscreen (SPF 30+; reef-safe if going on whale-watching or sea-otter tour). Insect repellent (rare in mid-June; common in late August). Power bank for phone (cold drains batteries fast)."},{"t":"Solo / quiet items","s":"guide","a":"solo-quiet-items","x":"A book or e-reader for ship time. A pen for the customs-declaration form. A small lock for valuables (most cabin safes work; this is backup)."},{"t":"Optional but useful","s":"guide","a":"optional-but-useful","x":"Magnetic hooks (4–6) — Royal’s cabin walls are steel; stick hooks for jackets, backpacks, hats. Cheap and high-leverage; see cabin organization . A small folding chair or stadium cushion (for deck observation in Endicott Arm). Reusable rubber duck for the Royal Caribbean duck-tradition (yes, it’s a thing ; hide a duck somewhere on the ship for another guest to find). A travel mug (coffee from the room service feels different in your own cup). Compression packing cubes."},{"t":"Skip","s":"guide","a":"skip","x":"Hairdryer (cabin has one). Iron (not allowed; see “Laundry on board” in Section 7 — pressing service is available via the cabin steward). Heavy formal wear (smart casual is the norm; Royal is less formal than Cunard or Holland America). Snorkel gear (you’re not in Caribbean water). Beach umbrellas (it’s not a beach trip). Power strips with surge protection (banned by most cruise lines for safety; bring a USB-equipped charging cube instead)."},{"t":"Section 5 — Emergency Contacts","s":"guide","a":"section-5-emergency-contacts","x":"Every Voyage Pack ships with this section — a small but important piece. If you’re the cruiser preparing for the trip, fill in the handoff card and share it with one trusted person ashore. If you’re reading this offline at sea, every number below is callable from your cabin phone or once you’ve reached a port-day cell signal."},{"t":"The family handoff card","s":"guide","a":"the-family-handoff-card","x":"Copy this, fill in your specifics, and share with your at-home contact (printed or in their phone notes): FAMILY HANDOFF — IN THE WAKE VOYAGE PACK ───────────────────────────────────────── CRUISER: ________________________ CABIN: ____________ SHIP: Anthem of the Seas LINE: Royal Caribbean SAILING: ________ – ________, 2026 FROM: Pier 91, Port of Seattle, WA, USA ITINERARY: Seattle → Inside Passage → Sitka → Skagway → Endicott Arm → Juneau → Victoria → Seattle EMERGENCY (24/7) — RCL Care Team: +1 (305) 539-4107 (US/Canada) +1 (800) 256-6649 (toll-free) SHIP-TO-SHORE: In emergency, RCL relays to ship via above NEAREST EMBASSY/CONSULATE BY PORT: Sitka, AK — US domestic; call 911 or Coast Guard if needed Skagway, AK — US domestic; call 911 Juneau, AK — US domestic; call 911 or US Coast Guard Juneau +1 (907) 463-2980 Victoria, BC — US Consulate, Vancouver: +1 (604) 685-4311 Canada emergency: 911 CRUISER MEDICAL: Allergies: ________________________ Medications: ________________________ Conditions: ________________________ Insurance: ________________________ policy: ____________ MOST RECENT KNOWN POSITION: Track at: /tools/ship-tracker.html or marinetraffic.com (search \"Anthem of the Seas\") ─────────────────────────────────────────"},{"t":"What an at-home contact actually does","s":"guide","a":"what-an-at-home-contact-actually-does","x":"If they don’t hear from you for 36+ hours and they’re worried: Don’t panic. Cruise WiFi is unreliable and silence usually means signal, not emergency. Call the RCL Care Team (number above) and identify themselves as your at-home contact. RCL will confirm you boarded, and can relay messages to the ship. If RCL confirms you’re not aboard or there’s been an incident: Coast Guard for Alaska waters; US Consulate Vancouver for Victoria; Royal Caribbean’s onboard medical team for medical issues. Track the ship’s position using the link above for context."},{"t":"What you should pack for emergencies","s":"guide","a":"what-you-should-pack-for-emergencies","x":"Printed list of medications, allergies, and emergency contacts (in your cabin nightstand) Photocopy of passport (separate from the passport itself) Travel insurance policy number (printed) The handoff card above, in your phone’s notes app and shared with one trusted person"},{"t":"Section 6 — Seasickness on an Alaska Cruise","s":"guide","a":"section-6-seasickness-on-an-alaska-cruise","x":"Where the rough water actually is on this route. Seattle round-trips don’t sail the protected Inside Passage all the way north — Anthem rounds Cape Flattery and tracks open Pacific west of Vancouver Island on Day 2, joining sheltered Alaska waters farther up. That stretch can be lumpy in weather, and it’s where most cruisers on this itinerary will notice motion if they’re going to notice any. The southbound return through the Strait of Juan de Fuca on Day 7 evening is short and rarely rough. The good news: Anthem is built for that exposure. The Quantum-class hull was designed for North Atlantic and Asia-Pacific service — both of which include sustained heavy water as routine — with active fin stabilizers and the displacement to ride through swell smaller ships would feel hard. One first-hand data point for this hull family. The editor of this site crossed the Pacific on a Quantum-class sister (Australia → New Zealand → Hawaii → Los Angeles), including a Tasman Sea stretch in roughly 30-foot seas. The transit was comfortable throughout. Anthem is the same hull form and the same stabilizer architecture; the open-Pacific Day 2 stretch of this Seattle round-trip is well within her design envelope. Whether you will be seasick on this specific itinerary: if you’ve been seasick on a Caribbean cruise, you’ll likely be fine here — Caribbean ships are usually smaller and the routes are less sheltered north of the Bahamas than people think. If you’ve never been seasick, the most likely place to learn whether you’re prone is the Day 2 open-Pacific stretch. The ship isn’t the limit on whether that day is comfortable — your individual tolerance for motion is."},{"t":"What to bring","s":"guide","a":"what-to-bring","x":"Bonine (meclizine) or Dramamine Less Drowsy (also meclizine) — over-the-counter, take 1 hour before you expect motion. Buy a small box; you’ll use 1–4 doses on a 7-night cruise. Sea-Bands — pressure-point wristbands. Mixed evidence; some people swear by them, no harm in trying. Ginger candies or chews — backup for mild queasiness. Scopolamine patch — prescription-only; talk to your doctor if you’re a known severe sufferer. Effective for 72 hours per patch; can cause dry mouth and drowsiness."},{"t":"What helps once you feel it","s":"guide","a":"what-helps-once-you-feel-it","x":"Get on deck. Fresh air and the horizon both help. Eat something dry. Crackers, dry toast, plain pretzels. Avoid alcohol (ironic but true — alcohol exacerbates motion sickness). Take meclizine the moment you suspect it’s coming, not after it’s full-on. If you’re highly motion-sensitive and booked an Interior cabin, you don’t have horizon access from your cabin. Consider upgrading to an Oceanview or Balcony for an Alaska cruise; the visual horizon access materially helps motion-sensitive cruisers."},{"t":"Section 7 — Practical Logistics","s":"guide","a":"section-7-practical-logistics","x":""},{"t":"The Royal Caribbean app","s":"guide","a":"the-royal-caribbean-app","x":"Download it now (App Store / Google Play). Once your booking is final and you’ve checked in: Cruise Compass — daily program of activities, dining hours, show times. My Cruise Planner — pre-cruise booking of excursions, dining, drinks. Onboard navigation — the ship’s deck plans, “find venue” search. Royal IQ chat — onboard messaging between members of your party (no internet needed). Mobile check-in — the muster drill is partially completed via the app (watch the 5-minute video, complete check-in by visiting your assigned station Day 1). The app is functional, not great. It crashes occasionally; some features only work on the ship’s WiFi (not cellular). Plan accordingly."},{"t":"Onboard internet","s":"guide","a":"onboard-internet","x":"Royal’s Voom WiFi is the standard option. Two tiers: Voom Surf: social media, email, light browsing — sufficient for keeping in touch. Voom Surf+Stream: video streaming, larger downloads — for binge-watchers. Pre-cruise pricing is generally $5–10/day cheaper than onboard purchase. Don’t buy VOOM for the family — buy it for one person and share device-by-device if you must. Royal does NOT include any free Wi-Fi minutes in the base fare (unlike NCL’s Free at Sea). What IS free: the in-app Royal iQ chat messaging between guests in the app — works on ship Wi-Fi without buying a VOOM package. Everything else (browser, email, video) requires VOOM. The internet-at-sea page covers this in more detail across cruise lines."},{"t":"Cell service","s":"guide","a":"cell-service","x":"In US ports (Seattle, Sitka, Skagway, Juneau): your normal US carrier should work. AT&T and Verizon are best in Alaska; T-Mobile coverage is patchy in remote areas. In Canadian port (Victoria): roaming charges apply. T-Mobile’s “free roaming in Canada” actually works at low speeds; AT&T and Verizon charge $10/day or so. At sea: no cell service. The ship may have a Cellular at Sea satellite system (your phone shows “Cellular at Sea” in the carrier slot); rates are extortionate ($3+/minute, $0.50+/text). Default behavior should be airplane mode at sea."},{"t":"Tipping (everywhere on the trip)","s":"guide","a":"tipping-everywhere-on-the-trip","x":"On the ship: Royal’s auto-gratuity is added to your shipboard account daily — $18.50/person/day in standard staterooms; $21.00/person/day in suites (rates effective November 2024). Additional cash tips (envelope, end of cruise) for outstanding service: stateroom attendant $20–40, dining-room waiter $20–30. In port (excursion guides, taxi drivers, beach attendants): cash, in U.S. dollars, in $5 and $10 denominations. ~10–15% on tour cost; $1–2 per taxi ride. In Canada (Victoria): Canadian dollars or USD both work; 15–18% standard at restaurants."},{"t":"Money","s":"guide","a":"money","x":"Royal Caribbean uses your SeaPass card for all onboard charges; settle the account at debarkation via credit card. Bring USD cash for U.S. ports and tips. ~$200 in $5/$10/$20 bills is enough for most travelers. ATMs work in Sitka, Skagway, Juneau, and Victoria but charge fees ($3–5 per transaction). Bring cash from home if practical. Credit cards work everywhere except some smallest Sitka shops; carry a Visa or Mastercard backup."},{"t":"Laundry on board","s":"guide","a":"laundry-on-board","x":"Anthem has no self-service laundry rooms. Royal Caribbean reserves passenger DIY laundry for world cruises only; on regular itineraries — including this 7-night Alaska sailing — the only option is full-service via your cabin steward. Full-service laundry: per-item pricing, $3–9 per piece (T-shirts $3–4, shirts $6–8, pants $7–9). Bag picked up from cabin; 24-hour turnaround. Pressing service: $4–8 per item, 12–24 hour turnaround. Useful for any dressier night. Mid-cruise wash & fold bag special: Royal often runs a “stuff a bag for ~$30” deal mid-week (typically Day 4 or 5). Watch your Cruise Compass ; not always advertised in advance. Worth it if you packed light or got rained on in Sitka. Dry cleaning: $15–30 per item, 48-hour turnaround. Steam-the-wrinkles hack: hang a damp outfit in the cabin bathroom and run a hot shower for 5 minutes with the door closed. The steam relaxes most light wrinkles. Saves the pressing fee on items you don’t care about pressing perfectly. For a 7-night Alaska trip, the bag special on Day 4 or 5 is usually the right call — the layering rotation means you’ll have damp fleece and base layers building up by mid-week."},{"t":"Safety in the Alaska ports","s":"guide","a":"safety-in-the-alaska-ports","x":"Alaska’s cruise-port towns are among the safest stops in any cruise itinerary. Crime rates are low; “tourism crime” is mostly opportunistic theft, easily avoided. The bigger risks are weather (slip-and-fall on wet boardwalks; getting cold and wet) and wildlife (don’t approach bears; if a bear is on the trail in Skagway, walk slowly the other way; do not run). The disability-at-sea page covers more on accessible-transit considerations."},{"t":"Post-cruise — what to do if something is wrong with your trip after you’re home","s":"guide","a":"post-cruise-what-to-do-if-something-is-wrong-with-your-trip-after-youre-home","x":"Most cruises end and that’s the end of the paperwork. Some don’t. Four things go wrong often enough that a paying reader deserves the playbook before they’re standing in their kitchen wondering what to do. A charge on the final shipboard statement you don’t recognize. Royal emails the itemized statement on debarkation morning. Review it before leaving the ship; Guest Services on Deck 4 has the authority to reverse a charge while you’re aboard, and almost no one off-ship does as quickly. If you find the charge after you’re home, Royal Caribbean Guest Relations is the right starting point (the current customer-service number is in your booking confirmation and on royalcaribbean.com/contact-us — phone numbers move around enough that it’s worth checking rather than dialing one written here). A written dispute lined up against the itemized statement is the form that gets resolved fastest. Keep the original statement PDF and any related receipts. A shore excursion that didn’t deliver. Ship-sold excursions are refundable through Royal Caribbean for cause — operator no-show, weather cancellation, undelivered itinerary — within a window specified in the excursion’s own terms. Read the terms before you sail; pull the relevant paragraph into a notes app so you have it without the ship app. Independent excursions you booked directly with the operator are between you and the operator; your travel insurance may help if you have it. Lost luggage or items left in the cabin. Royal Caribbean holds lost-and-found items for a window stated in their post-cruise FAQ. Submit a lost-item form via royalcaribbean.com (the form is keyed to your booking number) and expect to pay shipping — the cruise line does not pay to mail items home. For items lost in port, contact the port authority directly (Sitka, Skagway, Juneau, and Victoria each have a tourist police or harbor information office near the dock). A travel-insurance claim. Every policy has a claim-filing window — read it the day the loss happens, before you forget. Get the documentation lined up in week one: the cruise contract, the shipboard statement, photos of any damaged items, the police report if there is one, and the medical records if there was an onboard medical visit. The insurer’s 24-hour assistance line is on your wallet card from Section 7’s insurance discussion; the claims line is usually a separate number on the back. Document the timeline of every conversation. Insurance claims are won by the side with the better paper trail."},{"t":"Section 8 — Accessibility Notes","s":"guide","a":"section-8-accessibility-notes","x":"Anthem of the Seas was built (2015) to Quantum-class accessibility standards and received routine systems updates during her March 2025 drydock at Tuas/Singapore. Key notes: Accessible cabins are available across categories (Interior through Junior Suite). Book early; Alaska sailings draw accessibility-focused groups. Elevators are abundant; the ship is laid out so most decks are reachable without stairs. The Main Dining Room is fully accessible. The Solarium is accessible (deck 14); the heated pool has a chair lift. The Royal Theatre has accessible seating sections. The Two70 venue is accessible. The North Star observation pod can accommodate one wheelchair user per ride; book in advance via Guest Services. The bumper cars and RipCord by iFly have specific accessibility considerations; check with onboard staff. For port days: Sitka: dock at Sitka Sound Cruise Terminal (~5 miles north of downtown); accessible shuttle bus into town — confirm wheelchair-lift availability at the shuttle booth. Downtown is mostly flat, paved. Skagway: dock; level walk to downtown. Wooden boardwalks have lip transitions. White Pass railway has step-up cars. Juneau: dock; some uphill walks downtown but Mendenhall via M&M Tours’ Glacier Express is accessible. Victoria: dock at Ogden Point; shuttle is accessible. Inner Harbour is fully accessible. The In the Wake disability-at-sea page covers cross-line accessibility considerations in more depth."},{"t":"Section 9 — Solo Traveler Notes","s":"guide","a":"section-9-solo-traveler-notes","x":"Alaska is a particularly good solo-traveler cruise. The cruisers who come for the scenery tend to want quiet over crowds — there’s plenty of activity that doesn’t need a partner (deck observation, lectures, the gym, the spa, the Solarium). Royal Caribbean’s solo culture is less developed than Norwegian’s (no dedicated Studio cabins on Anthem), but the ship rewards independent travelers. Practical solo notes: The single supplement on Royal is 200% standard (i.e., the solo cruiser pays the full double-occupancy price for the cabin). Periodic “solo savings” promotions bring this to 150–175%. If your fare seems double, that’s the baseline — not a mistake. Watch for occasional “solo savings” promotions (reduced supplement); they appear sporadically. The Solarium is a quiet corner where solo cruisers tend to gather. Café Promenade and Two70 are the social-but-not-loud venues for a solo coffee. The Centrum’s nightly aerial show is a great solo activity — buy a drink, find a seat, watch. Don’t feel obligated to do dinner in a group. The Royal main dining room is happy to seat solo travelers. For more depth on solo cruising specifically, the broader site has resources at /solo/solo-cruisers-companion.html . Sign up for the countdown.html helper for trip-specific solo prompts as your sailing approaches."},{"t":"Section 10 — First Cruise Notes","s":"guide","a":"section-10-first-cruise-notes","x":"If this is your first cruise of any kind (not just first Alaska), a few things that won’t be obvious: The ship is a small city. 4,000+ passengers, ~1,300 crew, 16 decks. You won’t see all of it. You won’t run into everyone you know from Day 1 again. Make peace with this. Embarkation is logistical, not magical. Day 1 is paperwork, lines, and finding things. The good part starts on Day 2. The buffet (Windjammer) is not the best food on the ship. It’s loud, busy, and fine. The Main Dining Room is the better meal. Eat there at least 4 of 7 nights. You’re going to forget your SeaPass card the first day. Everyone does. It’s fine. Get a lanyard. The first sea day, you’ll feel disoriented. That’s normal. Pick 2 things from the Cruise Compass, do them, sit down, stare at water. You’ll find the rhythm. The crew remembers you. Your stateroom attendant, your dining-room waiter — they learn your name, your drink preferences, your allergies. The relationship is real. It’s worth being kind, and it’s worth tipping in cash above the auto-gratuity if service warrants it. Shore excursions add up faster than you expect. The Skagway helicopter, the Juneau whale + Mendenhall combo, and the Sitka sea-otter boat each run $150–650 per person. Pick the one or two you actually want; pass on the rest. Walking days are not a lesser day. You’ll come home wanting to go back. Most first-time Alaska cruisers do. Plan accordingly — don’t book a second cruise during the first 48 hours back, but know it’s coming. For more first-cruise context across cruise lines, see the broader first-cruise guide ."},{"t":"Continue planning on the site","s":"guide","a":"continue-planning-on-the-site","x":"A few threads worth pulling on the rest of the site as your sailing date approaches."},{"t":"About your ship","s":"guide","a":"about-your-ship","x":"Video walkthroughs of Anthem of the Seas — short clips of public spaces, the North Star pod, the Solarium, and deck areas, gathered on her video highlights section . Logbook entries from other travelers — first-hand notes from guests who have sailed Anthem (in Europe, Cape Liberty, and Alaska seasons), on the Anthem logbook section . Deck plans and the first-look gallery for orientation before you board: first look and deck plans ."},{"t":"About the ports","s":"guide","a":"about-the-ports","x":"Each port (and scenic-cruising stop) has its own page on the site, with traveler observations, walking-distance notes, and excursion thinking: Seattle port page Sitka port page Skagway port page Endicott Arm port page (the scenic-cruising day) Juneau port page Victoria, BC port page"},{"t":"Other Voyage Packs","s":"guide","a":"other-voyage-packs","x":"The full Voyage Packs catalog lists every itinerary we’ve packed — useful if you’re considering a different ship, season, or audience."},{"t":"Closing","s":"guide","a":"closing","x":"Alaska is a different cruise than the Caribbean. The pace is slower, the deck-time is more meaningful, and the moments you’ll remember a year from now are the ones you weren’t expecting — a humpback breach you happened to look up for, the silence after a glacier calf falls, twilight at 10:45 PM with the light still on the water. The cruise itself is an opportunity for those moments to find you. The pack you’ve just read is meant to remove the planning friction that gets in the way. A few things worth remembering as your sailing date approaches: The balcony pays back. For an Alaska cruise on a Quantum-class ship, the price difference vs. an Interior cabin is the best single trip-quality investment you can make. Layers matter more than the right brand. A $30 fleece, a $50 rain shell, and a $20 thermal will keep you comfortable on every day of this trip. The independent shore excursions are usually as good or better. Save the ship-sold for the White Pass railway (where being late actually risks the sailing); take M&M Tours’ Glacier Express to Mendenhall, the local taxi to Skagway sights, the local boat operator to whale-watch. The crew makes the trip. Tip in cash, in envelopes, at the end. Royal pays them well; cash tips matter on top. If you want a one-line preflight reminder to yourself: the goal is calm. Pack early. Sleep before you fly. Get to Pier 91 with margin. You’re not racing the cruise; the cruise is the rest you wanted. Soli Deo Gloria. Pack version v0.1.4 (rcl-anthem-alaska-7n) Sailing template Anthem of the Seas, 7-night Alaska from Seattle, sample dates Mon Jun 29 – Mon Jul 6, 2026 Audience First-time Alaska cruisers from any background Last reviewed 2026-06-05 How facts here are checked Every number, date, price, distance, and statistic in this pack is checked against a primary source — Royal Caribbean’s published materials, National Park Service pages, port authorities, transit operators’ official timetables, ship-deployment manifests, or the editor’s own sailing log for the seasickness section’s Quantum-class hull data. Sources for each claim are kept in this pack’s research log. If a number can’t be sourced, it isn’t asserted here. Accessibility This pack and the site that produced it follow WCAG 2.1 AA. The Emergency Contacts section is offline-capable via PWA so a trusted contact ashore can keep the family handoff card available without an internet connection. Sources Ship: Anthem of the Seas . Ports: Seattle , Sitka , Skagway , Endicott Arm , Juneau , Victoria BC . Onboard venues: Two70 , Music Hall , Windjammer , Solarium Bistro , Sorrento’s , Café Promenade , Chops Grille , Jamie’s Italian , Wonderland , Izumi , Chef’s Table , Bionic Bar , Schooner Bar . Articles: stateroom-sanity-check , is-drink-package-worth-it , cruise-tipping-2026 , cruise-cabin-organization , cruise-tech-photography-guide , cruise-duck-tradition . Tools: drink-calculator , cruise-tipping-calculator , port-day-planner , port-tracker , ship-tracker , ship-size-atlas . Reference pages: first-cruise , countdown , packing-lists , internet-at-sea , disability-at-sea , stateroom-check . Image: Anthem at Liverpool Cruise Terminal photographed by Rodhullandemu / Phil Nash (CC BY-SA 4.0, Wikimedia Commons “Valued Image”). Original research: Wikipedia (Anthem of the Seas), Royal Caribbean Press Center, cruisedeckplans.com. Generator Voyage Pack v0.1.4 generator (Pandoc 3.1.3 + WeasyPrint 61.1) Pricing reminder Pricing in this document is approximate. Confirm current rates at royalcaribbean.com or with your travel agent Refunds & support Full refund within 14 days of purchase, no questions — and if a pack has a factual error at any time, email pack-support@cruisinginthewake.com and we’ll fix it Brand promise Independent. No display ads. No cruise-line affiliations. Soli Deo Gloria."}]</script>
