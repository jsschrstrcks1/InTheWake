<h2 id="pk-section-1-your-ship-ms-volendam">Section 1 — Your Ship: ms Volendam</h2>
<h3 id="pk-a-classic-mid-size-ship-which-is-the-point">A classic mid-size ship, which is the point</h3>
<p><a href="/ships/holland-america-line/volendam.html">Volendam</a> is a <strong>Rotterdam-class</strong> ship delivered by Fincantieri’s Marghera yard in 1999 — 61,214 gross tons, ten passenger decks, about 1,432 guests at double occupancy, with Zaandam (2000) as her near-identical sister. Tennis great <strong>Chris Evert</strong> christened her as godmother on November 12, 1999, the same day she sailed her maiden voyage — a Caribbean run out of Fort Lauderdale, which makes the port your 2028 departure shares with her first one. In a fleet era where new ships push past 200,000 tons and 7,000 guests, Volendam is roughly a quarter of that size, and Holland America chose her for this voyage deliberately: a hull this size reaches ports the mega-ships physically cannot — 16 of this itinerary’s calls are Mariners’ Collection ports (Easter Island, Walvis Bay, Réunion, and Cape Verde among them) that big ships skip.</p>
<p>What “classic HAL” means in practice: a promenade deck that wraps the whole ship, an art and fresh-flower budget instead of a go-kart track, live music over waterslides, and a passenger community that skews toward people who read the daily program and then actually go to the lecture. On a 7-night cruise those qualities are a preference. On a 129-day cruise they’re load-bearing — the ship is your home, your town, and your commute, and a calm, well-run mid-size town wears better over four months than a theme park does.</p>
<p>Long-voyage rhythm is Holland America’s institutional specialty — the line has operated Grand Voyages for decades, and the crew assignments, enrichment programming, and provisioning for these sailings reflect that. Expect guest lecturers, destination briefings before each region, and the small rituals (equator-crossing ceremony among them — you’ll cross twice) that give a long voyage its internal calendar.</p>
<h3 id="pk-aboard-the-ship">Aboard the ship</h3>
<p>Grounded in the ship’s own venue records on this site, the spaces you’ll live in:</p>
<ul>
<li><strong>Dining:</strong> the main Dining Room (the anchor of the evening); <strong>Pinnacle Grill</strong> (HAL’s signature steak-and-seafood specialty venue, extra charge); <strong>Canaletto</strong> (Italian, extra charge, tucked alongside the Lido); the <strong>Lido Market</strong> buffet; and the <strong>Explorations Café</strong> for coffee and the best casual reading corner on the ship.</li>
<li><strong>Bars and evenings:</strong> the <strong>Crow’s Nest</strong> (the forward-facing observation lounge — on this itinerary, the single best interior seat for Glacier Alley, the fjords, and the Antarctic days), the <strong>Ocean Bar</strong>, the <strong>Sea View Bar</strong> aft, the <strong>Explorer’s Lounge</strong>, the <strong>Mix Bar</strong>, the <strong>Piano Bar</strong>, the <strong>Wajang Theater</strong>, and the casino.</li>
<li><strong>Days at sea:</strong> two pools (<strong>Lido Pool</strong> midships with a sliding glass roof — indispensable across this voyage’s climate swings — and the adults-favored <strong>Sea View Pool</strong> aft), the hydropool and hot tubs, the <strong>Greenhouse Spa</strong> and fitness center, a <strong>pickleball / sport court</strong>, an <strong>art studio</strong>, a proper <strong>library</strong>, and a game room. The full walk-around promenade deck deserves its own mention: on a world cruise the daily promenade mile becomes a habit, a social hour, and the trip’s best free amenity all at once.</li>
</ul>
<p>There is no HAL-venue page section on this site yet, so venue names above aren’t cross-linked — they’re drawn from the ship’s venue record and Holland America’s own materials. For a video feel of her spaces and the firsthand notes of travelers who’ve sailed her, the <a href="/ships/holland-america-line/volendam.html">Volendam ship page</a> collects both, and the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> puts her 61,214 GT alongside whatever you’ve sailed before so you can calibrate expectations.</p>
<h3 id="pk-cabin-choice-world-cruise-edition">Cabin choice, world-cruise edition</h3>
<p>The cabin math changes when the trip is 129 days:</p>
<ul>
<li><strong>You will spend more waking hours in this cabin than in your living room this year.</strong> Storage, light, and a place to sit that isn’t the bed matter far more than on a week-long sailing. Book the cabin you can genuinely live in.</li>
<li><strong>Ocean View over Interior is a stronger argument here than on any short cruise.</strong> Four-plus months without natural light in your own room is a real quality-of-life cost, and on the scenic days (Antarctica, the fjords, the Beagle Channel) your window is a private observation post at 6 AM temperatures that make the open deck a commitment.</li>
<li><strong>Verandas earn their keep on the tropical legs</strong> — but know going in: on the Antarctic and Southern Ocean days a veranda is mostly a very cold storage locker. If the fare step to a veranda strains the budget, a well-placed Ocean View is the value pick on this particular itinerary.</li>
<li><strong>Location:</strong> midships and low remains the most motion-forgiving placement, and this voyage includes the Drake Passage and three ocean crossings (see <a href="/admin/voyage-pwa/guides/volendam-world-2028-guide.html?v=4ab7bbcf8f#section-7-seasickness-and-the-open-ocean-legs">Section 7</a>). If you’re motion-sensitive, prioritize placement over floor-plan perks.</li>
<li><strong>Laundry:</strong> confirm current laundry arrangements with HAL when you book — on a voyage this length, unlimited laundry packages (frequently bundled or discounted for Grand Voyage guests) change how much you pack. See <a href="/admin/voyage-pwa/guides/volendam-world-2028-guide.html?v=4ab7bbcf8f#section-4-packing-for-four-seasons-in-one-trip">Section 4</a>.</li>
</ul>
<p>Fares at booking opening started around <strong>$29,999 per person double occupancy for Interior, ~$34,499 Ocean View, ~$57,599 Suite</strong> — dynamic, and moving in one direction as the sailing fills. Early-booking bonuses (onboard credit, air offers) have applied to this voyage; your travel agent or hollandamerica.com has the current picture. <strong>Every dollar figure in this pack is approximate and time-stamped to mid-2026 — reconfirm at booking.</strong></p>

<h3 id="pk-leg-1-the-caribbean-and-the-brazilian-coast-roughly-days-122">Leg 1 — The Caribbean and the Brazilian coast (roughly days 1–22)</h3>
<p><strong>Fort Lauderdale → <a href="/ports/san-juan.html">San Juan</a> → <a href="/ports/barbados.html">Barbados</a> → Devil’s Island (French Guiana) → Belém → <a href="/ports/recife.html">Recife</a> → <a href="/ports/rio-de-janeiro.html">Rio de Janeiro</a> → <a href="/ports/montevideo.html">Montevideo</a> → <a href="/ports/buenos-aires.html">Buenos Aires</a></strong></p>
<p>The voyage opens gently on purpose: familiar Caribbean waters, warm January sun, and enough sea days to find your rhythm — your table, your deck chair, your walking loop, the crew who will know your coffee order by Aruba’s latitude. Use this leg to settle in rather than sprint; the trip will still be there in March.</p>
<ul>
<li><strong>Devil’s Island (Îles du Salut)</strong> is the first “you can’t do this on a normal cruise” stop — the former French penal colony of <em>Papillon</em> infamy. <strong>Read the name carefully: you don’t land on Devil’s Island.</strong> Île du Diable itself has no landing and never had one for visitors — prisoners reached it by cable. Ships anchor off and tender to <strong>Île Royale</strong>, the largest of the three islands, which held the general prison population and the administration, and which carries the ruins, the palms, and the agoutis and monkeys that took the place back. Devil’s Island is the small one you photograph across the channel. Tendering is sea-state dependent; if the swell wins, that’s the first lesson in world-cruise flexibility. There is a second, stranger way to lose this call: the islands sit under the launch corridor from Kourou, CNES has owned the archipelago since 1971, and they are <strong>evacuated and closed for every eastward launch</strong> under a prefectoral navigation ban — a ban that stays in force through a postponement. A slipped launch window can eat the day.</li>
<li><strong>Belém</strong> is the Amazon basin’s great port city — not on the Amazon proper but on the <strong>Pará River at Guajará Bay, roughly 100 km upriver from the Atlantic</strong>, so the approach is a long brown-water river transit rather than a sea arrival. <strong>Expect to tender, and expect to land a long way from the city.</strong> The downtown quay carries little more than seven metres and cannot take a ship of Volendam’s draft; ships anchor off <strong>Icoaraci</strong>, about 18–20 km from the historic centre — Volendam herself did exactly that in January 2026. A new deep berth at Outeiro was built for COP30, but the port authority has said low tide at cruise arrival and departure times makes Outeiro difficult and keeps Icoaraci the more viable option. That may change by 2028; assume the transfer until HAL says otherwise. The <strong>Ver-o-Peso</strong> market has traded since <strong>1625</strong>, when the Casa de Haver o Peso was established (the <em>Provisão Régia</em> of 1688 that most sources cite as its founding actually granted the city the market’s revenue, 63 years later). The municipality counts <strong>1,193 licensed traders and around 2,400 people working there daily</strong> — not the “2,000 stalls” repeated online. Note that the market was physically rebuilt for COP30: fish market September 2025, main fair November 2025, meat market January 2026, so any description written before 2025 is obsolete. <strong>Belém’s Theatro da Paz became a UNESCO World Heritage Site on 27 July 2026</strong> — not alone, but as one of the two components of the serial property <em>Amazonia Theatres</em>, with the Teatro Amazonas in Manaus. This is also where the tropics turn serious: equatorial heat and humidity, and the voyage’s <strong>first equator crossing</strong> falls on the run between Devil’s Island and here. If you’ve never been through a shellback ceremony, don’t schedule anything against it.</li>
<li><strong><a href="/ports/rio-de-janeiro.html">Rio de Janeiro</a></strong> — the route map marks an extended call here; Rio rewards it. Corcovado and Sugarloaf are the postcard pair, but they’re weather-gated: take the first clear window, not the “scheduled” day.</li>
<li><strong><a href="/ports/buenos-aires.html">Buenos Aires</a></strong> closes the leg with another extended call — steak, tango, and the last big-city provisioning stop before Patagonia. Anything you forgot to pack for the cold leg, fix it here.</li>
</ul>
<p><strong>Practical — the visa item most likely to catch a North American on this leg:</strong> <strong>Brazil reinstated visa requirements for US, Canadian and Australian citizens on 10 April 2025</strong>, and the requirement explicitly covers arrival by vessel. It is an e-Visa, around US$80.90 at the time of writing, and it is yours to obtain — not something the ship quietly handles. On a voyage whose passenger list is heavily North American this is the single most consequential piece of paperwork in the first month. French Guiana is a different trap in the same leg: it is part of France and of the EU, but it is <strong>not in the Schengen area</strong>, so a Schengen visa does not admit a visa-national — the sticker has to say <em>Valable pour la Guyane française</em>. Verify both against HAL’s pre-cruise documentation guidance for this sailing.</p>
<p>January in this leg runs hot — Caribbean low 80s°F, equatorial Brazil hotter — while your suitcase also carries an Antarctic kit you won’t touch for three weeks. Currencies flip fast (US dollar, EC-dollar zones, Brazilian real, Uruguayan and Argentine pesos); cards are broadly fine in the cities, and small-bill US dollars remain the universal tip currency. The <a href="/tools/port-day-planner.html">Port Day Planner</a> earns its keep from the first call, and the <a href="/tools/port-tracker.html">Port Logbook</a> is worth starting on Day 1 — over 45 ports, memory blurs faster than you think.</p>
<h3 id="pk-leg-2-patagonia-and-antarctica-roughly-days-2338">Leg 2 — Patagonia and Antarctica (roughly days 23–38)</h3>
<p><strong><a href="/ports/falkland-islands.html">Port Stanley (Falkland Islands)</a> → <a href="/ports/ushuaia.html">Ushuaia</a> → four-day Antarctic Experience → <a href="/ports/cape-horn.html">Cape Horn</a> → Beagle Channel &amp; <a href="/ports/glacier-alley.html">Glacier Alley</a> → <a href="/ports/punta-arenas.html">Punta Arenas</a> → Strait of Magellan → Sarmiento Channel → Amalia or Brujo Glacier → Chilean fjords → <a href="/ports/puerto-montt.html">Puerto Montt</a> → San Antonio (for Santiago)</strong></p>
<p>The emotional summit of the voyage, arriving in the Southern Hemisphere’s late summer — the only season this route is possible.</p>
<ul>
<li><strong><a href="/ports/falkland-islands.html">Port Stanley</a></strong> is a tender call into a town that feels like a Scottish village misfiled at 51° South; penguin-colony excursions (Gypsy Cove walkable, Volunteer Point the long overland haul) book out — decide early.</li>
<li><strong><a href="/ports/ushuaia.html">Ushuaia</a></strong> — long billed as the southernmost city in the world (Chile’s tiny Puerto Williams, granted city status in 2019, now contests the title across the Beagle Channel), gateway to Tierra del Fuego National Park, and the last land before the ice.</li>
<li><strong>The four-day Antarctic Experience</strong> is scenic cruising along the <a href="/ports/antarctic-peninsula.html">Peninsula</a> — Volendam does not land passengers in Antarctica; this is expedition-ship territory to see, not to step on, and the plain framing is: four days of the most stupefying scenery on the planet from a warm ship. The Crow’s Nest and your cabin window become prime real estate. Wildlife (whales, penguin rafts, seals on floes) appears on its own schedule — keep binoculars within reach at all hours; the announcement from the bridge comes when it comes.</li>
<li><strong><a href="/ports/cape-horn.html">Cape Horn</a></strong> — weather permitting, a sail-past of the most storied headland in maritime history. The Drake Passage earns its reputation in both directions; see <a href="/admin/voyage-pwa/guides/volendam-world-2028-guide.html?v=4ab7bbcf8f#section-7-seasickness-and-the-open-ocean-legs">Section 7</a> and pack accordingly.</li>
<li>The run north — <strong>Beagle Channel, Glacier Alley, the Strait of Magellan, the Sarmiento Channel, the Amalia/Brujo glacier approach, days of <a href="/ports/chilean-fjords.html">Chilean fjords</a></strong> — is the longest continuous stretch of scenic cruising on the itinerary. It out-Alaskas Alaska and asks nothing of you but a warm layer and a window seat.</li>
<li><strong>San Antonio</strong> is Santiago’s port — the gateway to Valparaíso’s UNESCO hills, the Casablanca valley wineries, and the capital itself about 1.5 hours inland. If you’re hoping family might join you for part of the voyage, a major-city port like this is the natural one to ask about — but <strong>ask HAL, don’t assume</strong>: as of mid-2026 Holland America had published no segment or partial-voyage options for this sailing, and whether any port allows mid-voyage embarkation is the cruise line’s call, not a geography question.</li>
</ul>
<p><strong>Practical:</strong> deck temperatures on the Antarctic days sit near freezing with real wind chill; the packing list in <a href="/admin/voyage-pwa/guides/volendam-world-2028-guide.html?v=4ab7bbcf8f#section-4-packing-for-four-seasons-in-one-trip">Section 4</a> treats the glacier kit as a full second wardrobe, and it is not optional. Hand warmers, a genuinely windproof shell, and warm waterproof footwear separate the people on deck for the calving from the people watching through glass.</p>
<h3 id="pk-leg-3-the-long-pacific-roughly-days-3956">Leg 3 — The long Pacific (roughly days 39–56)</h3>
<p><strong><a href="/ports/easter-island.html">Easter Island</a> → <a href="/ports/pitcairn.html">Pitcairn Island</a> → <a href="/ports/papeete.html">Papeete</a> → <a href="/ports/moorea.html">Moorea</a> → <a href="/ports/bora-bora.html">Bora Bora</a></strong></p>
<p>The Pacific is where the voyage changes character. The sea-day stretches get long — this is the leg that teaches you whether you’re a world cruiser or just someone on a long cruise, and nearly everyone discovers they’re the former. Routines deepen; the lecture series, the library, the promenade miles, and the friendships do the structural work.</p>
<ul>
<li><strong><a href="/ports/easter-island.html">Easter Island</a></strong> is the crown jewel and the open gamble of the leg: Rapa Nui is a Mariners’ Collection call precisely because almost no cruise ship can visit — and it’s an exposed tender operation in open Pacific swell. Ships miss this call some years. If the tender runs, the moai are worth every year you waited; if the swell wins, the ship typically offers a slow sail-past. Hold it loosely — it hurts less that way, and the odds are decent.</li>
<li><strong><a href="/ports/pitcairn.html">Pitcairn Island</a></strong> — home of the Bounty mutineers’ descendants, population under fifty. Calls here are typically a slow pass with islanders coming out by longboat; an extraordinary piece of living history either way.</li>
<li><strong>French Polynesia</strong> — <a href="/ports/papeete.html">Papeete</a> (with an evening in port marked on the route map), <a href="/ports/moorea.html">Moorea</a>’s serrated skyline, and <a href="/ports/bora-bora.html">Bora Bora</a>’s lagoon. Moorea and Bora Bora are tender ports with the South Pacific’s best water: snorkel gear from home pays for its suitcase space this week. One quiet map-fact of this leg: from Chile to New Zealand the entire run stays <strong>south</strong> of the equator — the voyage’s next crossing waits for the approach to Singapore, three legs away.</li>
</ul>
<p><strong>Practical:</strong> French Polynesia runs on the CFP franc, but cards and (less favorably) US dollars circulate easily in the cruise economy. Late February is cyclone season’s tail in the South Pacific — another “flexibility is the deal” region. Sun protection becomes a medical topic: this is equatorial UV over water for weeks.</p>
<h3 id="pk-leg-4-new-zealand-eight-days-six-ports-roughly-days-5764">Leg 4 — New Zealand: eight days, six ports (roughly days 57–64)</h3>
<p><strong><a href="/ports/auckland.html">Auckland</a> → <a href="/ports/tauranga.html">Tauranga</a> → New Plymouth → <a href="/ports/wellington.html">Wellington</a> → <a href="/ports/picton.html">Picton</a> → <a href="/ports/lyttelton.html">Lyttelton</a> (Christchurch)</strong></p>
<p>Eight days, six ports, both islands — the densest port stretch of the entire voyage, deliberately placed after the Pacific’s long quiet. New Zealand in early March is late summer: settled, mild, green.</p>
<ul>
<li><strong><a href="/ports/auckland.html">Auckland</a></strong> opens with a city day (route map marks an overnight); <strong><a href="/ports/tauranga.html">Tauranga</a></strong> is the gateway to Rotorua’s geothermal country and Hobbiton — the two headline excursions compete for the same day, so choose ahead.</li>
<li><strong>New Plymouth</strong> is the rarity — a Taranaki-coast call most itineraries skip, with the volcanic cone of Mt. Taranaki behind it on a clear day.</li>
<li><strong><a href="/ports/wellington.html">Wellington</a></strong> for Te Papa (one of the world’s great free museums), <strong><a href="/ports/picton.html">Picton</a></strong> for the Marlborough Sounds (and its sauvignon blanc country), <strong><a href="/ports/lyttelton.html">Lyttelton</a></strong> for Christchurch and the Canterbury plains.</li>
</ul>
<p><strong>Practical:</strong> this stretch is port-a-day intensity after weeks of sea days — pace yourself and pick one thing per port rather than three. NZ dollars, effortless card economy, and the easiest walking-off-the-ship logistics of the whole voyage. Biosecurity is serious here: declare all food, clean your shore shoes, and don’t test the beagle at the terminal.</p>
<h3 id="pk-leg-5-australia-and-indonesia-roughly-days-6584">Leg 5 — Australia and Indonesia (roughly days 65–84)</h3>
<p><strong><a href="/ports/sydney.html">Sydney</a> → <a href="/ports/brisbane.html">Brisbane</a> → Townsville → <a href="/ports/cairns.html">Cairns</a> → <a href="/ports/darwin.html">Darwin</a> → <a href="/ports/komodo.html">Komodo</a> → <a href="/ports/bali.html">Bali</a></strong></p>
<ul>
<li><strong><a href="/ports/sydney.html">Sydney</a></strong> — sailing into Sydney Harbour is one of cruising’s canonical arrivals, and the route map marks an overnight: an evening at the Opera House quarter without watching the clock.</li>
<li>Up the coast: <strong><a href="/ports/brisbane.html">Brisbane</a></strong>, then the Queensland reef towns — <strong>Townsville</strong> and <strong><a href="/ports/cairns.html">Cairns</a></strong>, the Great Barrier Reef’s front doors. If a reef trip is on your life list, Cairns is the operational base for it; book the marine-park operators early.</li>
<li>The ship then threads the <strong>Torres Strait</strong> (scenic pilotage waters marked on the route) and crosses the Top End to <strong><a href="/ports/darwin.html">Darwin</a></strong> — tropical-savanna Australia, saltwater-crocodile country, WWII history.</li>
<li><strong><a href="/ports/komodo.html">Komodo</a></strong> — a tender call into the national park for the dragons themselves; ranger-escorted walking only, and the rangers mean it. <strong><a href="/ports/bali.html">Bali</a></strong> closes the leg with temple country and the voyage’s re-entry into Asia.</li>
</ul>
<p><strong>Practical:</strong> Australia requires advance electronic travel authority for most nationalities and enforces the same biosecurity seriousness as NZ; Indonesia’s entry requirements for cruise passengers are typically handled through the ship — but <strong>verify every visa requirement on this voyage against HAL’s pre-cruise documentation guidance, which is authoritative for how <em>this</em> sailing is processed</strong> (see <a href="/admin/voyage-pwa/guides/volendam-world-2028-guide.html?v=4ab7bbcf8f#section-3-the-pre-cruise-year">Section 3</a>). April approaches in Darwin at the top of the wet season’s tail: heat, humidity, spectacular thunderheads.</p>
<h3 id="pk-leg-6-southeast-asia-and-the-indian-ocean-roughly-days-85100">Leg 6 — Southeast Asia and the Indian Ocean (roughly days 85–100)</h3>
<p><strong><a href="/ports/singapore.html">Singapore</a> → <a href="/ports/phuket.html">Phuket</a> → <a href="/ports/colombo.html">Colombo</a> → <a href="/ports/maldives.html">Malé</a> → <a href="/ports/mauritius.html">Port Louis (Mauritius)</a> → La Possession (Réunion)</strong></p>
<ul>
<li><strong><a href="/ports/singapore.html">Singapore</a></strong> — the run up from Bali brings the voyage’s <strong>second equator crossing</strong>, and the ship barely leaves the line’s neighborhood while it’s here (Singapore sits eighty miles north of it). Marked for an overnight on the route map, and the world’s easiest big city for a ship passenger: clean, safe, transit-perfect, food-obsessed. Hawker centers over hotel restaurants, every time. The <strong>third crossing</strong> follows southbound across the Indian Ocean on the long run to Mauritius.</li>
<li><strong><a href="/ports/phuket.html">Phuket</a></strong> for Thailand, <strong><a href="/ports/colombo.html">Colombo</a></strong> for Sri Lanka — the route map marks an evening in Colombo, and the temple-and-tea-country day trips are the draw.</li>
<li><strong><a href="/ports/maldives.html">Malé</a></strong> — the Maldives call, a tender into the most densely packed small capital on earth, ringed by atoll water that looks color-graded.</li>
<li><strong><a href="/ports/mauritius.html">Port Louis</a></strong> and <strong>La Possession</strong> — Mauritius and Réunion, the Mascarene pair; Réunion is another Mariners’ Collection rarity, a French overseas département whose interior is a UNESCO-listed volcanic amphitheater. Set expectations for the berth: Réunion’s cruise call is at <strong>Le Port / Pointe des Galets, a working commercial and container harbour</strong> with limited passenger amenities and nothing scenic in walking distance — you arrange transport or you stay aboard. If you rent one taxi-for-the-day on this leg, Réunion’s cirque viewpoints are where to spend it.</li>
</ul>
<p><strong>Practical:</strong> this is the leg with the widest currency spread of the trip (Singapore and Brunei dollars won’t be confused, but rupees, rufiyaa, Mauritian rupees, and euros on Réunion all rotate through in two weeks) — the card-plus-small-USD strategy carries it. It’s also the leg to mind the heat with intention: equatorial Asia in April is the hottest sustained stretch of the voyage.</p>
<h3 id="pk-leg-7-southern-and-west-africa-roughly-days-101117">Leg 7 — Southern and West Africa (roughly days 101–117)</h3>
<p><strong><a href="/ports/durban.html">Durban</a> → <a href="/ports/cape-town.html">Cape Town</a> (65 hours) → Lüderitz → <a href="/ports/walvis-bay.html">Walvis Bay</a> → Null Island sail-past → Takoradi (Ghana) → Abidjan (Côte d’Ivoire)</strong></p>
<ul>
<li><strong><a href="/ports/durban.html">Durban</a></strong> opens South Africa; some guests use the Durban–Cape Town gap for HAL’s multi-day overland safari add-on — if a Big Five reserve is on your list, this is the voyage’s built-in window for it.</li>
<li><strong><a href="/ports/cape-town.html">Cape Town</a></strong> gets <strong>65 hours</strong> — the longest single call of the voyage, and it needs every one: Table Mountain (cableway is wind-gated; take the first clear morning), the Cape Peninsula loop to the Cape of Good Hope, the winelands, Robben Island (book weeks ahead), and the V&amp;A Waterfront on the doorstep of the berth.</li>
<li><strong>Lüderitz</strong> — a German-colonial time capsule wedged between the Namib dunes and the South Atlantic. <strong>A tender call, and for a specific reason:</strong> the port has one 500 m berth carrying <strong>8.75 m on bedrock Namport says is not worth dredging</strong>, against Volendam’s 8.1 m draft — so the ship anchors in Robert Harbour and tenders to the Waterfront jetty, from which the little town is walkable. <strong>The one thing to plan in advance is a clock, not a distance.</strong> The sand-filled ghost town of <strong>Kolmanskop is only 10 km inland</strong>, but its <strong>guided tours run at 09:30 and 11:00 Monday–Saturday and 10:00 on Sundays and public holidays — that is the complete list — and the site closes at 13:00 at weekends and on public holidays, 15:00 on weekdays.</strong> It is a morning commitment tied to a fixed departure, not a half-day you can start when you like; book through the ship and take the earliest tender. Note too that <strong>Shark Island, a ten-minute walk from the jetty, was a German concentration camp from March 1905 to April 1907</strong> in which between 1,032 and 3,000 Herero and Nama people died; it is now a campsite, the principal memorial on it names the German garrison dead, and nothing at the gate will tell you any of that. <strong><a href="/ports/walvis-bay.html">Walvis Bay</a></strong> — flamingo lagoons and the dune sea, another Mariners’ Collection call, and a docked one.</li>
<li><strong>Null Island</strong> — the ship then arcs north across the Gulf of Guinea to <strong>0°N, 0°E</strong>, the point where the Equator meets the Prime Meridian — the voyage’s <strong>fourth and final equator crossing</strong>, made exactly at the null point. There is nothing there but a weather buoy and every mis-geocoded data point on earth, which is precisely the charm. Expect the bridge to make a ceremony of it; positional bragging rights don’t get purer.</li>
<li><strong>Takoradi</strong> and <strong>Abidjan</strong> — Ghana and Côte d’Ivoire, West African calls that almost no itinerary makes. Takoradi is a <strong>docked</strong> call, alongside a working cargo quay with no passenger terminal. From there, <strong>Cape Coast Castle and Elmina Castle sit about 81 km east, roughly 1¼ hours each way</strong>, which makes them a full-day commitment rather than the quick hop “nearby” would suggest. They carry the Atlantic slave trade’s heaviest history and deserve the gravity the sites ask; budget the whole day and go quiet rather than pairing them with anything else. <strong>One correction worth having:</strong> they are <strong>not two separate World Heritage Sites</strong> but two components of a single 1979 inscription — <em>Forts and Castles, Volta, Greater Accra, Central and Western Regions</em>, covering <strong>three castles and fifteen forts</strong> built between 1482 and 1786 along the coast from Keta to Beyin. Which means that if the 81 km run is more than you can manage, <strong>Fort San Sebastian at Shama is 20 km from the berth and is part of the same World Heritage property</strong> — a real alternative rather than a consolation.</li>
</ul>
<p><strong>Practical — the one hard requirement on this leg:</strong> <strong>Côte d’Ivoire requires proof of yellow fever vaccination from <em>every</em> traveller aged 9 months and over, regardless of where you have come from.</strong> It sits in the WHO’s “any country” column, not the “risk countries only” one, so there is no origin-based exemption. Since 11 July 2016 a yellow fever certificate is <strong>valid for life</strong> and a booster cannot be demanded of you — worth knowing because <strong>Ghana’s own published consular documentation still carries pre-2016 language about a ten-year limit</strong>, so carry the card and do not buy a booster you do not need. <strong>Ghana requires the certificate too</strong>, of everyone aged 9 months and over. Expect the line to check it at embarkation in Fort Lauderdale rather than at the gangway in Abidjan — which means a missing certificate is a problem in January, not April. Malaria prophylaxis across this leg is a <strong>medical decision, not a packing decision: consult a travel-medicine clinic well before sailing</strong> (see <a href="/admin/voyage-pwa/guides/volendam-world-2028-guide.html?v=4ab7bbcf8f#section-3-the-pre-cruise-year">Section 3</a>).</p>
<p><strong>And one genuinely unresolved item — ask HAL in writing.</strong> The UK Foreign Office states flatly that you must have a visa to enter Côte d’Ivoire, and the Ivorian e-visa is issued <strong>only for arrival at Abidjan airport</strong> and requires a return flight booking, which makes it structurally useless to a cruise passenger. Ships plainly do land passengers here — several recent calls have — evidently under a collective shore-pass arrangement made by the ship’s agent. But that is an arrangement between the line and the port, not a right you hold, and no Ivorian government source we could find documents a cruise exemption. Put it to HAL’s documentation desk explicitly, by name, and get the answer in writing.</p>
<p>This is also the leg where health-prep done a year earlier pays off. South Africa and Namibia are straightforward card economies; Ghana and Côte d’Ivoire are cash-friendlier — the ship’s shore-excursion desk smooths most of it.</p>
<h3 id="pk-leg-8-cape-verde-and-the-atlantic-home-roughly-days-118129">Leg 8 — Cape Verde and the Atlantic home (roughly days 118–129)</h3>
<p><strong><a href="/ports/praia.html">Praia</a> → <a href="/ports/mindelo.html">Mindelo</a> → Atlantic crossing → <a href="/ports/san-juan.html">San Juan</a> → Fort Lauderdale</strong></p>
<p>Cape Verde — <strong><a href="/ports/praia.html">Praia</a></strong> and <strong><a href="/ports/mindelo.html">Mindelo</a></strong>, morna music and Creole-Portuguese island culture, the final Mariners’ Collection calls — and then the long Atlantic run home with a last warm evening in <a href="/ports/san-juan.html">San Juan</a> before Port Everglades.</p>
<p>The crossing days at the end aren’t filler; ask anyone who’s done a Grand Voyage. They’re the decompression chamber — the packing, the address-swapping, the crew farewells, the first serious attempt to answer “so how was it?” Fair warning from every world-cruise memoir ever written: the answer takes longer than the crossing.</p>
