<h2 id="pk-section-1">Section 1 — Your Ship: Norwegian Encore</h2>
<h3 id="pk-a-breakaway-plus-ship-now-in-her-seventh-year">A Breakaway Plus ship now in her seventh year</h3>
<p><a href="/ships/norwegian/norwegian-encore.html">Norwegian Encore</a> was delivered October 30, 2019 by Meyer Werft at Papenburg, Germany — the <strong>fourth and youngest ship of NCL’s Breakaway Plus class</strong> (after Norwegian Escape 2015, Norwegian Joy 2017, and <a href="/ships/norwegian/norwegian-bliss.html">Norwegian Bliss</a> 2018). Her maiden voyage was a November 2, 2019 transatlantic from Southampton. She was christened November 21, 2019 at PortMiami by <strong>Kelly Clarkson</strong>, the Grammy-winning pop singer who performed at the ceremony. By your October 2026 sailing she is a few weeks short of seven years in service: settled, with crew rhythms long established.</p>
<p><strong>Before the Prima class</strong> (Prima 2022, Aqua 2025, Luna 2026) became NCL’s design statement, the Breakaway Plus ships were the line’s flagships. Encore is the apex of that older design language — bigger than Breakaway, smaller than Prima, but with the most refined version of NCL’s signature features: the <strong>two-level race track</strong> at the back (Encore’s is 1,150 feet long — the longest two-level go-kart track at sea when she launched in 2019 — partly enclosed, distinct from Bliss’s open-air version), the <strong>Aqua Park</strong> with slides, the <strong>Galaxy Pavilion</strong> with VR experiences, <strong>Vibe Beach Club</strong> adults-only enclave, the dedicated <strong>Studio cabin solo program</strong> with no-single-supplement Studios + Studio Lounge, and <strong>The Haven</strong> suite enclave.</p>
<p>If you’ve sailed <a href="/ships/norwegian/norwegian-bliss.html">Norwegian Bliss</a> before, <strong>Encore is a near-identical hull and general layout</strong> with a few refinements (different specialty restaurant mix; race track enclosed differently; Galaxy Pavilion more developed). If you’re new to Breakaway Plus, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> shows how she compares against the larger Prima Plus ships you may be considering for future sailings.</p>
<h3 id="pk-whats-distinctive-about-encore">What’s distinctive about Encore</h3>
<ul>
<li><strong>The two-level race track</strong> at the aft — Encore’s go-kart track is 1,150 feet long, the longest two-level track at sea when she launched in 2019 (the Breakaway Plus designs had the originals at sea; Prima’s three-LEVEL track was a later innovation). Paid: ~$15/race; the right call once.</li>
<li><strong>Galaxy Pavilion</strong> — virtual-reality and immersive games arcade. Paid per experience.</li>
<li><strong>Aqua Park</strong> with the <strong>Aqua Racer</strong> (twin twisting waterslides) and the <strong>Ocean Loops</strong> — the loop slide that goes UP a loop, free. Aqua Racer races two riders down twin-tube enclosed slides.</li>
<li><strong>Observation Lounge</strong> (Deck 15 forward) — wraparound glass-roof lounge; the day’s best move on any Pacific Coast sailing, especially the Big Sur coastline.</li>
<li><strong>Vibe Beach Club</strong> — adults-only enclave with private pool, two hot tubs, dedicated bar, shaded loungers. ~$99/day or $399/week pre-cruise.</li>
<li><strong>The Haven</strong> — ship-within-a-ship suite enclave with private restaurant, lounge, pool, butler service.</li>
<li><strong>Atmospheric dining at the included tier</strong> — Encore’s main dining rooms (<a href="/restaurants/ncl/the-manhattan-room.html">Manhattan Room</a>, Taste, Savor) are among the most atmospheric of NCL’s included rooms.</li>
</ul>
<h3 id="pk-whats-not-on-encore">What’s NOT on Encore</h3>
<ul>
<li><strong>No Indulge Food Hall</strong> — that’s a Prima-class signature. Encore predates it.</li>
<li><strong>No Penrose Atrium</strong> — also Prima class.</li>
<li><strong>No Aqua Slidecoaster</strong> — Prima Plus only (Aqua, Luna).</li>
<li><strong>No three-LEVEL go-kart track</strong> — Prima distinction; Encore’s is two-level (vertical layers), not three-level (separately racing).</li>
</ul>
<h3 id="pk-cabin-categories-the-solo-calculus">Cabin categories — the solo calculus</h3>
<p>The group flyer shows three price points: <strong>Solo Studio $889</strong>, <strong>Ocean View $1,038</strong>, <strong>Balcony $1,198</strong>. Honest reads on each:</p>
<ul>
<li><strong>Solo Studio at $889</strong> — NCL’s signature solo offering: roughly 100 sq ft, windowless, with <strong>no single supplement</strong> and <strong><a href="/restaurants/ncl/studio-lounge.html">Studio Lounge</a> access</strong> (free coffee, social space, scheduled hosted hours for solo cruisers). The Studio Lounge is the daily social anchor; solos cluster there independent of group meetups. <strong>At $889, this is the price-leader and the obvious choice if budget matters more than space.</strong></li>
<li><strong>Ocean View at $1,038</strong> — real upgrade over the Studio: a window cabin, daylight in the morning, the world feeling different. The $149 differential is small for what you get. <strong>The value pick for most solo cruisers</strong> who’d appreciate a window.</li>
<li><strong>Balcony at $1,198</strong> — a private outdoor space. On a Pacific Coast cruise where there’s significant scenic-cruising time (the California coast, the Vancouver-to-Victoria threading), a balcony genuinely matters. <strong>At a $160 differential over Ocean View, this is the splurge that pencils out</strong> if the math works.</li>
</ul>
<p><strong>Verify Interior (the lowest standard tier) separately with Tina</strong> if you’d rather book windowless and save further over Solo Studio. Standard Interior is typically the cheapest tier on Breakaway Plus ships.</p>
<p><strong>Before you commit, run the <a href="/stateroom-check.html">stateroom sanity check</a></strong> — give it your ship and cabin number and it tells you whether that cabin sits in a known trouble spot: under the pool deck, over the theater, by the galley or the elevator bank, far forward, behind a lifeboat, or on a connecting door. On most Norwegian ships its cabin list is still partial, and it says so on the result. The Pacific Coast cruise differs from Caribbean in one specific way: scenic-cruising days reward balconies more than Caribbean sea days do. That is a choice about the category; the check is about the cabin you pick within it. Once chosen, the <a href="/articles/cruise-cabin-organization.html">cabin organization guide</a> covers small-space pragmatics.</p>
<h3 id="pk-dining">Dining</h3>
<p>Encore’s dining map:</p>
<p><strong>Included with your fare (no extra charge):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/the-manhattan-room.html">Manhattan Room</a></strong> (Deck 7 aft) — main dining room with a small dance floor and live music most evenings. The most atmospheric of the included rooms.</li>
<li><strong>Taste</strong> and <strong>Savor</strong> — paired main dining rooms; same menu, different atmosphere.</li>
<li><strong><a href="/restaurants/ncl/garden-cafe.html">Garden Café</a></strong> (Deck 16) — buffet; long hours; upper-deck view earns its keep on scenic cruising days.</li>
<li><strong><a href="/restaurants/ncl/the-local.html">The Local</a></strong> — pub food + classics; long hours.</li>
<li><strong>Splash Academy Café</strong> — quick service near the kids’ club area.</li>
</ul>
<p><strong>Specialty dining (extra charge or via Specialty Dining Package):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/cagneys-steakhouse.html">Cagney’s Steakhouse</a></strong> — NCL’s standard steakhouse; reliably good.</li>
<li><strong><a href="/restaurants/ncl/le-bistro.html">Le Bistro</a></strong> — French; the most romantic specialty room on NCL ships.</li>
<li><strong><a href="/restaurants/ncl/teppanyaki.html">Teppanyaki</a></strong> — the showy hibachi room; group-friendly seating.</li>
<li><strong><a href="/restaurants/ncl/q-texas-smokehouse.html">Q Texas Smokehouse</a></strong> — Texas BBQ.</li>
<li><strong><a href="/restaurants/ncl/los-lobos.html">Los Lobos</a></strong> — modern Mexican.</li>
<li><strong><a href="/restaurants/ncl/ocean-blue.html">Ocean Blue</a></strong> — Geoffrey Zakarian-partnered seafood (verify whether still on Encore in 2026).</li>
<li><strong><a href="/restaurants/ncl/la-cucina.html">La Cucina</a></strong> — Italian.</li>
<li><strong><a href="/restaurants/ncl/food-republic.html">Food Republic</a></strong> — pan-Asian small plates; one of the most distinctive specialty rooms on NCL.</li>
</ul>
<p><strong>Drinks.</strong> NCL’s drink-package math: the Premium Beverage Package is commonly included in the <strong>“Free at Sea”</strong> promotional bundle when booking. If your group fare included Free at Sea, drinks may already be covered — <strong>verify what’s bundled with Tina</strong>. Otherwise the package runs ~$109/day per person + 20% gratuity at pre-cruise rates; breaks even at ~5–6 drinks per day. The <a href="/drink-calculator.html">drink-calculator</a> lets you put in your real consumption pattern and see the breakeven. The companion article <a href="/articles/is-drink-package-worth-it.html">Is the drink package worth it?</a> walks through the breakeven math with worked examples.</p>
<p><strong>The honest first-day mistake to avoid:</strong> Don’t sign up for an unlimited drink package at the front desk on Day 1 unless you’ve already done the drink-calculator math. Decide before you board, ideally as part of your Free At Sea bundle. Mid-sail upgrades cost more per day and give you fewer days of usage — and on a 6-night cruise, you have very few days to break even compared to a 7- or 8-night.</p>
<h3 id="pk-connectivity-at-sea">Connectivity at sea</h3>
<p>NCL’s Wi-Fi packages are tier-based and frequently bundled into Free at Sea. The <a href="/internet-at-sea.html">internet at sea guide</a> covers cross-line baselines.</p>
<p>For most solo cruisers in this group:</p>
<ul>
<li>Use included basic Wi-Fi if your fare bundles any</li>
<li>Don’t try to stream video at sea</li>
<li>Use port-day cellular when possible — Vancouver and Victoria use Canadian carriers (Rogers, Bell, Telus); San Francisco and LA use US carriers normally; <strong>Vancouver is in Canada — confirm your roaming plan with your US carrier before sailing</strong></li>
<li>Keep one trusted person ashore informed via a daily one-line message; see <a href="/admin/voyage-pwa/guides/encore-pacific-guide.html?v=4a42975bb0#section-6">Section 6</a></li>
</ul>
<hr />

<h3 id="pk-day-1-monday-october-12-vancouver-bc-embarkation-overnight">Day 1 — Monday, October 12 — Vancouver, BC (embarkation + overnight)</h3>
<p><strong>Terminal:</strong> <strong>Canada Place</strong> — the white sail-roofed cruise terminal on Vancouver’s downtown waterfront, and a photogenic place to start a cruise. Located on the harbor, walking distance to Gastown, Granville Street, and downtown shopping.</p>
<p><strong>Getting to Vancouver and to Canada Place:</strong></p>
<ul>
<li><strong>Vancouver International (YVR) → Canada Place:</strong> Taxi flat-rate ~CA$35–45, 30–40 min. <strong>Canada Line SkyTrain</strong> is the cheaper, often-faster option: ~CA$10, 30 minutes, transfer at Waterfront Station which is a 5-minute walk from Canada Place.</li>
<li><strong>From Bellingham (BLI) or Seattle (SEA) via land:</strong> Quick Coach / Quick Shuttle (Seattle ↔︎ Vancouver) is ~$60–75 USD one-way, 4 hours. Watch border-crossing congestion on cruise days.</li>
<li><strong>If driving from the US:</strong> the Pacific Highway / Peace Arch border crossing can run 30–90 minutes on cruise mornings.</li>
<li><strong>Embark window:</strong> Typically 11:00 AM – 4:00 PM. <strong>All-aboard 4:30 PM.</strong> Ship stays overnight in Vancouver.</li>
<li><strong>NCL online check-in via the NCL app</strong> — complete it before arrival to skip a 20-minute queue.</li>
</ul>
<p><strong>Pre-cruise hotel — strongly recommended.</strong> Vancouver is a great pre-cruise city in its own right and the weather in October is unpredictable. A Sunday-night stay puts you walking distance to embarkation Monday and gives you Saturday and Sunday in Vancouver if you arrived earlier. Best neighborhoods for pre-cruise:</p>
<ul>
<li><strong>Downtown / Coal Harbour</strong> — walking distance to Canada Place. Pan Pacific Vancouver is <em>attached</em> to the cruise terminal.</li>
<li><strong>Yaletown</strong> — converted warehouses, restaurants, ~15-min walk to Canada Place.</li>
<li><strong>Gastown</strong> — historic district with restaurants and the steam clock; ~10-min walk to terminal.</li>
</ul>
<p><strong>The realistic Day 1 timeline:</strong></p>
<ul>
<li><strong>11:00 AM:</strong> Terminal opens for arrivals.</li>
<li><strong>12:00 PM:</strong> Aboard. Cabins typically open by 1:30 PM; until then, lunch at Garden Café (Deck 16) or The Local (Deck 7).</li>
<li><strong>1:30 PM:</strong> Cabin open. Meet your stateroom steward; drop carry-ons.</li>
<li><strong>3:30 PM:</strong> Mandatory muster drill — NCL’s drill is partly app-based (watch the safety video in the NCL app) plus an in-person check-in at your assigned station.</li>
<li><strong>4:00 PM:</strong> Allison’s group sailaway gathering — <strong>verify location in her group communications</strong>; the Observation Lounge (Deck 15 forward, panoramic) is the natural NCL spot. Since the ship stays overnight, “sailaway” is more of a “settle-in” gathering than the usual departure event.</li>
<li><strong>5:30 – 8:00 PM:</strong> Dinner aboard. Or — since the ship is at the dock all night — <strong>go ashore for dinner in Vancouver</strong>. Gastown is a 10-minute walk; Yaletown is 15. Quick recommendations: Joe Fortes Seafood, Ask For Luigi, Salmon n’ Bannock (Indigenous-owned). <strong>You can stay out until ~midnight on a typical overnight call</strong> — verify all-aboard time in the NCL app, often 11:30 PM or 12:30 AM on overnight nights.</li>
</ul>
<p><strong>What to pack in your carry-on for Day 1:</strong> swimsuit (pools open before checked bags arrive), light jacket (Vancouver evenings can be 50°F in October), all medications, change of clothes, <strong>passport</strong> (required — Canada is a foreign country for US citizens), phone charger, refillable water bottle, embarkation paperwork. Your checked bags may not arrive until 7–9 PM.</p>
<p><strong>Money/card:</strong> Your NCL keycard is your ID, room key, and onboard charge. <strong>Currency aboard: US Dollar</strong> (despite embarking in Canada). Canadian dollars (CAD) are local off the ship; USD is widely accepted in Vancouver at a fair exchange but you’ll save 3–5% paying in CAD if you have local cash or a no-foreign-fee card.</p>
<h3 id="pk-day-2-tuesday-october-13-vancouver-departure-transit-toward-victoria">Day 2 — Tuesday, October 13 — Vancouver departure + transit toward Victoria</h3>
<p><strong>Depart Vancouver:</strong> Typically morning or early afternoon — verify in the NCL app. The departure passes under the <strong>Lions Gate Bridge</strong> and through <strong>Burrard Inlet</strong> — a scenic departure by any standard. Best viewing from the <strong>Observation Lounge</strong> (Deck 15 forward) or the <strong>bow of Deck 8 Waterfront</strong>.</p>
<p><strong>Transit to Victoria:</strong> Vancouver to Victoria is ~75 nautical miles by sea. Depending on departure time, the ship may arrive Victoria the same evening (~6:00 PM) or overnight to a Wednesday-morning Victoria call.</p>
<p><strong>Morning aboard:</strong></p>
<ul>
<li><strong>Observation Lounge</strong> at sunrise — Vancouver’s downtown skyline lit up at dawn against the Coast Mountains.</li>
<li><strong>Breakfast at Garden Café</strong> — upper-deck view of the Vancouver waterfront.</li>
<li><strong>Studio Lounge</strong> if you booked Studio — hosted Day 2 coffee hour is the NCL solo-cruiser tradition.</li>
</ul>
<p><strong>Afternoon — Lions Gate Bridge passage:</strong></p>
<p>The single most photogenic moment of the week. The ship passes under the Lions Gate Bridge — a suspension bridge completed in 1938 with a 1,552-foot main span and about 200 feet of vertical clearance — and threads First Narrows out of Burrard Inlet to open water. Stanley Park is on the port side as you transit out. <strong>Be on Deck 15 forward (Observation Lounge), Deck 8 Waterfront, or any forward deck for the passage.</strong> Allison may organize a group viewing — check her communications.</p>
<p><strong>Evening:</strong> Either dinner in Victoria (if you’ve docked) or aboard. The Manhattan Room is the atmospheric choice; Cagney’s is the celebration meal.</p>
<h3 id="pk-day-3-wednesday-october-14-victoria-bc">Day 3 — Wednesday, October 14 — Victoria, BC</h3>
<figure>
<img loading="lazy" decoding="async" src="/assets/ships/norwegian/norwegian-encore/Norwegian_Encore_docked_in_Victoria_BC.webp" alt="Norwegian Encore docked at Ogden Point breakwater in Victoria, BC — the exact dock this cruise will use, with the Seaspan Eagle tugboat alongside and the red-and-white Ogden Point lighthouse at the harbor entrance. Photo by Joe Mabel (CC BY-SA 4.0) via Wikimedia Commons, August 2023." />
<figcaption aria-hidden="true">Norwegian Encore docked at Ogden Point breakwater in Victoria, BC — the exact dock this cruise will use, with the Seaspan Eagle tugboat alongside and the red-and-white Ogden Point lighthouse at the harbor entrance. Photo by Joe Mabel (CC BY-SA 4.0) via Wikimedia Commons, August 2023.</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 8:00 AM (varies by sailing — some sailings call Victoria on Day 2 evening into Day 3 morning). <strong>Depart:</strong> typically 6:00 PM. Encore docks at <strong>Ogden Point</strong> breakwater, ~3 km from downtown. Free shuttle buses or a ~$10 round-trip cab/rideshare run between Ogden Point and the Inner Harbour.</p>
<p><strong>What Victoria is.</strong> Provincial capital of British Columbia; unapologetically charming small city — Edwardian architecture, the Empress Hotel, the Parliament Buildings, the famous <strong>Butchart Gardens</strong> 30 minutes outside town. Unlike most cruise stops, you get a full day here (versus the short evening stop that Alaska-itinerary ships make).</p>
<p><strong>Free, walkable from the Inner Harbour:</strong></p>
<ul>
<li><strong>Inner Harbour walk</strong> — Parliament Buildings (free 30-min tours), Empress Hotel exterior, the harbor walking path.</li>
<li><strong>Royal BC Museum</strong> (~$18–27 CAD adult entry; open daily — verify current hours) — one of the best ethnographic + natural history museums in western Canada. Worth half a day if it’s your thing.</li>
<li><strong>Beacon Hill Park</strong> — 30-min walk from downtown; home of the Mile 0 marker (the western terminus of the Trans-Canada Highway); good ocean views.</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>Butchart Gardens</strong> — 30 minutes outside town. Open year-round; mid-October has fading-but-still-impressive autumn blooms. Adult admission ~$45 CAD; transport ~$60–75 round trip. A 3–4 hour total experience. Worth it if you love gardens.</li>
<li><strong>Whale watching</strong> — peak season is May–October; mid-October catches the tail end. Operators run from the Inner Harbour; ~$130–180 CAD; 3 hours; orcas and minkes most commonly sighted.</li>
<li><strong>Craigdarroch Castle</strong> — Victorian mansion, 30-min walk from downtown; $20 CAD entry; ~90 minutes.</li>
</ul>
<p><strong>Tea at the Empress</strong> — the classic Victoria experience. ~$95 CAD per person; reservations required well in advance; 2-hour experience.</p>
<p><strong>For first-time Victoria:</strong> the Inner Harbour walk + Parliament Buildings + Empress Hotel tea is the highest-density “Victoria experience” half-day. If Butchart Gardens is the priority, plan an excursion via ship or pre-booked transport.</p>
<p><strong>Currency:</strong> Canadian dollar (CAD) is local. USD widely accepted at the harbor; credit/debit cards everywhere. No need to exchange large amounts.</p>
<p><strong>Pack for Victoria:</strong> layers (October Vancouver Island runs 45–60°F, often drizzly), rain shell, comfortable walking shoes, $40–60 CAD or USD cash for tips and small purchases, sunglasses, sun hat (the harbor sun can surprise you on a clear day).</p>
<p><strong>Worth a look on the way in:</strong> the <a href="/ports/victoria-bc.html">Victoria BC port page</a>, its <a href="/ports/victoria-bc.html#gallery">evening-harbour gallery</a>, and the <a href="/ports/victoria-bc.html#logbook">Victoria logbook</a>. Build your day in the <a href="/tools/port-day-planner.html">Port Day Planner</a>; record what actually happened in the <a href="/tools/port-tracker.html">Port Logbook</a>.</p>
<p><strong>Wednesday evening:</strong> Depart Victoria 6 PM-ish. Pacific Coast transit begins — a full day at sea before San Francisco on Friday morning. The Manhattan Room or Cagney’s for dinner.</p>
<h3 id="pk-day-5-friday-october-16-san-francisco-arrival-overnight-in-port">Day 5 — Friday, October 16 — San Francisco arrival + overnight in port</h3>
<p><strong>Arrival:</strong> Approximately 9:00 AM – 12:00 PM (varies by sailing). Encore typically docks at <strong>Pier 27 (San Francisco Cruise Terminal)</strong> on the Embarcadero — directly between Fisherman’s Wharf and the Bay Bridge, walking distance to almost everywhere worth being on foot.</p>
<p><strong>Approach worth waking up for:</strong> Most San Francisco cruise arrivals pass under or near the <strong>Golden Gate Bridge</strong> — typically before sunrise on a 9 AM arrival. <strong>Be on the Observation Lounge or the Deck 8 Waterfront before dawn if the Captain announces an approach time.</strong> This is the trip’s signature visual moment.</p>
<p><strong>Why this overnight is the trip.</strong> This is the highlight of the itinerary. Most cruises miss San Francisco entirely; this one gives you a full day, evening, night, and Saturday morning. Use it.</p>
<p><strong>Walking distance from Pier 27:</strong></p>
<ul>
<li><strong>Fisherman’s Wharf / Pier 39</strong> — 10-min walk west along the Embarcadero. The full tourist experience: sea lions at Pier 39, the historic ships, chowder bowls.</li>
<li><strong>Ferry Building</strong> — 15-min walk south along the Embarcadero. Saturday morning farmers market is exceptional (and Saturday morning fits perfectly if the ship doesn’t depart until evening).</li>
<li><strong>Coit Tower / Telegraph Hill</strong> — 20-min uphill walk; panoramic city views; the WPA murals inside.</li>
<li><strong>Embarcadero waterfront</strong> — flat, easy walking the entire 2.5 miles from Fisherman’s Wharf to Oracle Park.</li>
</ul>
<p><strong>Short ride from Pier 27:</strong></p>
<ul>
<li><strong>Cable cars</strong> — walk to the Powell-Hyde or Powell-Mason turntable at the foot of Powell Street (15-min walk or quick Uber); ~$9/ride one-way (Muni has been raising cable-car fares — budget up to ~$12); the Powell-Hyde line ends near Ghirardelli Square.</li>
<li><strong>Alcatraz Island tour</strong> — $50/adult; book WAY in advance (months); 2.5-hour total. Departs from Pier 33.</li>
<li><strong>Chinatown</strong> — 15-min walk; generally called the oldest Chinatown in North America. Grant Avenue is the touristy spine; Stockton Street is the working market street.</li>
<li><strong>Mission District</strong> — Uber/Lyft 15 min; the mural-and-burrito neighborhood. La Taqueria is the burrito stop most people name first.</li>
<li><strong>Golden Gate Bridge</strong> — Uber to the south pier ~15 min; walk across the bridge (1.7 miles each way, takes ~2 hours round-trip with photos).</li>
</ul>
<p><strong>Evening dining recommendations:</strong></p>
<ul>
<li><strong>Tadich Grill</strong> (downtown) — traces its founding to 1849 and calls itself California’s oldest restaurant; classic.</li>
<li><strong>Boulevard</strong> — fine dining on the Embarcadero.</li>
<li><strong>The Ferry Building</strong> — small-plates at Slanted Door (Vietnamese) or Hog Island Oyster Co.</li>
<li><strong>Fisherman’s Wharf</strong>: Scoma’s for crab, Boudin Bakery for sourdough bread bowls.</li>
</ul>
<p><strong>Saturday morning ideas (before depart):</strong> Ferry Building farmers market (8 AM – 2 PM; verify current hours). Ghirardelli Square is a short walk west of the Wharf. <strong>Verify all-aboard time</strong> — typical Saturday evening departure is 5:00–6:30 PM; some sailings depart Saturday morning.</p>
<p><strong>Pack for San Francisco:</strong> light jacket (October SF runs 55–68°F; can hit 70 on a clear day or 50 on a foggy one), walking shoes, layered clothing (microclimates within the city), $60–80 USD cash for cable cars and street food, a credit card with no foreign-transaction fee (San Francisco accepts cards everywhere).</p>
<p><strong>Worth a look:</strong> the <a href="/ports/san-francisco.html">San Francisco port page</a>, its <a href="/ports/san-francisco.html#gallery">gallery</a>, and the <a href="/ports/san-francisco.html#logbook">San Francisco logbook</a>.</p>
<h3 id="pk-day-6-saturday-october-17-san-francisco-departure-pacific-transit">Day 6 — Saturday, October 17 — San Francisco departure + Pacific transit</h3>
<p><strong>Depart San Francisco:</strong> typically 5:00 – 6:30 PM (verify). The departure passes back under or near the <strong>Golden Gate Bridge</strong> if the schedule is right — best viewing from the Observation Lounge or any forward deck. If the departure is later evening, the bridge passes at sunset, which is the trip’s most spectacular photograph if you can get it.</p>
<p><strong>Daytime in San Francisco:</strong> Full morning + afternoon if your sailing departs evening. Use it for whatever you missed Friday night.</p>
<p><strong>Evening:</strong> Pacific coast transit south toward LA. The California coast can be visible to port (eastward) at various points — Half Moon Bay area, Monterey Bay (likely too far inland to see), Big Sur if you’re lucky and conditions are right.</p>
<p><strong>Last-night dinner</strong> — the traditional group gathering. Allison may organize at one of the specialty rooms; check her communications.</p>
<h3 id="pk-day-7-sunday-october-18-los-angeles-san-pedro-world-cruise-center-debarkation">Day 7 — Sunday, October 18 — Los Angeles (San Pedro / World Cruise Center) debarkation</h3>
<p><strong>Arrival:</strong> Approximately 7:00 AM at the <strong>World Cruise Center, Berth 91-93, San Pedro, California</strong> — Los Angeles’s main cruise terminal. NOT in downtown LA; San Pedro is the port community ~25 miles south of LAX.</p>
<p><strong>The realistic timeline:</strong></p>
<ul>
<li><strong>6:00 – 8:00 AM:</strong> Breakfast at Garden Café or The Local. Eat now if your bag is in the hall.</li>
<li><strong>6:30 AM:</strong> Customs clearance complete. Self-disembarkation begins.</li>
<li><strong>7:00 – 10:00 AM:</strong> Walk-off in waves. <strong>All passengers off the ship by 10:30 AM</strong> per NCL standard.</li>
</ul>
<p><strong>The bag situation.</strong> The night before, NCL asks you to place your checked luggage outside your cabin door by ~11 PM with the color-coded tag indicating your debark group. Bags are taken to the terminal overnight and you collect them in baggage claim before customs.</p>
<p><strong>Carry-on with you on debark morning:</strong> change of clothes, all medications, passport, phone charger, valuables.</p>
<p><strong>Getting from San Pedro to LAX (or beyond):</strong></p>
<ul>
<li><strong>Uber/Lyft to LAX:</strong> $40–55, 30–45 minutes depending on traffic. <strong>LA traffic Sunday morning is moderate; Sunday afternoon can spike.</strong></li>
<li><strong>Karmel Shuttle</strong> (port-to-LAX shared shuttle): ~$25/person; advance booking recommended.</li>
<li><strong>Uber/Lyft to downtown LA:</strong> $50–70, 35–50 min.</li>
<li><strong>Long Beach Airport (LGB):</strong> $20–30 Uber, 15 min; small airport, fewer flights.</li>
</ul>
<p><strong>Killing 4–6 hours before an evening flight:</strong></p>
<ul>
<li><strong>Battleship USS Iowa Museum</strong> — 10-min walk from the cruise terminal. World War II battleship preserved as a museum. $25 entry, ~90 minutes.</li>
<li><strong>San Pedro Fish Market</strong> — 15-min Uber; massive seafood market and restaurant.</li>
<li><strong>Cabrillo Beach</strong> — 15-min Uber; quiet beach.</li>
<li><strong>Manhattan Beach / Hermosa Beach</strong> — 30-min Uber; classic Southern California beach towns.</li>
</ul>
<p><strong>Airport-arrival timing for LAX:</strong></p>
<table>
<thead>
<tr class="header">
<th>Flight</th>
<th>Leave San Pedro by</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Domestic, after 3 PM</td>
<td>11:30 AM</td>
</tr>
<tr class="even">
<td>International, after 6 PM</td>
<td>1:30 PM</td>
</tr>
</tbody>
</table>
<p>LAX TSA lines run 30–90 min on Sunday afternoons. <strong>LAX is notoriously congested</strong> — give yourself extra margin compared to most US airports.</p>
