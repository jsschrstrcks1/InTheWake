uary 1, 2023. Ten nights in a standard cabin is $200.", "You can prepay it up to 24 hours before sailing. NCL adds 20% to bar purchases and specialty dining."], "links": [{"t": "Cruise tipping calculator", "href": "/tools/cruise-tipping-calculator.html"}], "source": "ncl.com FAQ: onboard service charge, read 2026-10-11. Rates can change before 2027."}, {"q": "What's in Free at Sea?", "a": ["For bookings from November 5, 2025, NCL lists an open bar for guests 21 and over (on board and at Great Stirrup Cay), four specialty meals on a cruise this long, 150 Wi-Fi minutes, and a $50 shore excursion credit at each port for the first guest.", "The open bar isn't charge-free. NCL's Free at Sea flyer (December 2025) puts its gratuities at $28.50 per person per day for guests 21 and over, as the pre-cruise price, and says the onboard price will vary. Ten nights alone is about $285. Extra Wi-Fi is $29.99 a day per cabin, or $39.99 for streaming."], "links": [{"t": "Drink calculator (NCL)", "href": "/drink-calculator.html?line=ncl"}], "source": "ncl.com: Free at Sea page and NCL's Free at Sea vs. Free at Sea Plus flyer (12/25), read 2026-10-11."}, {"q": "Is there a cabin for one on Jewel?", "a": ["Yes. NCL's solo page lists Norwegian Jewel among the ships with Solo Inside, Solo Oceanview and Solo Balcony cabins, and says double occupancy rates don't apply in them.", "Jewel has no Studio cabins and no Studio Lounge. Those are on other NCL ships."], "links": [{"t": "Stateroom check", "href": "/stateroom-check.html"}], "source": "ncl.com: Studio and Solo staterooms; solo cruising, read 2026-10-11."}, {"q": "Are there meetups for solo travelers?", "a": ["In 2023 NCL said solo cruisers \"can enjoy activities scheduled for single travelers to mix and mingle.\" NCL's current pages don't say whether that happens on Jewel.", "On cruise forums, solo travelers describe meetups listed in the daily schedule on many NCL ships, often in the early evening. Look on your first day. Before you go, Cruise Critic's Roll Calls section has a thread for each sailing date."], "links": [{"t": "Solo cruising on In the Wake", "href": "/solo.html"}], "source": "NCL newsroom, 3 October 2023; ncl.com solo pages; travelers' reports on Cruise Critic, read 2026-10-11."}, {"q": "Does Jewel dock at Great Stirrup Cay?", "a": ["Probably. When the pier first opened in December 2025, NCL said all ships visiting the island will benefit from it, with \"guests no longer being required to tender.\" It was still being finished then, and that first day a Jewel-class sister, Norwegian Gem, tendered. In September 2026 Cruise Industry News reported that the new pier opened in August 2026.", "Check the app the day before. If you use a wheelchair or walk with difficulty, ask NCL when you book."], "links": [{"t": "Great Stirrup Cay port page", "href": "/ports/great-stirrup-cay.html"}], "source": "NCL newsroom; NCL statement quoted by Cruise Industry News (Dec 2025, Sep 2026); CruiseHive (Dec 2025), read 2026-10-11."}, {"q": "What's free at Great Stirrup Cay?", "a": ["The beaches, loungers and umbrellas, and the Splash Harbor splash pad. The Free at Sea open bar applies on the island.", "The Great Tides Waterpark (from $89 in October 2026), cabanas, the zipline and rentals cost extra."], "source": "NCL newsroom and the Great Tides ticket page, read 2026-10-11."}, {"q": "What is there to do at Cabo Rojo?", "a": ["NCL says the area is sparsely populated and has no recommended shopping. Its draw is Bahía de las Águilas, which NCL calls the country's most beautiful beach, in Jaragua National Park.", "The Dominican tourism ministry says you reach it by all-terrain vehicle or by boat from the shores of Cabo Rojo, and that there are no hotels, shops or restaurants and no shade. An NCL Shore Excursion handles the boat and the timing. This site doesn't have a Cabo Rojo page yet."], "source": "ncl.com: Cabo Rojo; godominicanrepublic.com: Bahía de Las Águilas, read 2026-10-11."}, {"q": "Is there self- <h2 id="pk-section-1">Section 1 — Your Ship: Norwegian Jewel</h2>
<h3 id="pk-the-first-of-her-class-freshened-up-in-2025">The first of her class, freshened up in 2025</h3>
<p><a href="/ships/norwegian/norwegian-jewel.html">Norwegian Jewel</a> was built by Meyer Werft in Papenburg, Germany, which handed her over to NCL on August 4, 2005. The shipyard’s release calls her “the first cruise ship out of a series of four new vessels” it built for NCL, and NCL’s own pages call them the Jewel class. NCL’s ship page lists her as refurbished in 2025, and an NCL press release from April 2026 mentions “the recently added Vibe Beach Club,” NCL’s adults-only sun deck.</p>
<p>Gross tonnage, 93,502 for her, isn’t a weight. The International Maritime Organization says it “is a function of the moulded volume of all enclosed spaces of the ship.” Divide it by NCL’s guest count and you get about 39 gross tons per guest. If you want to see how she compares with other ships, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> lines them up.</p>
<h3 id="pk-whats-on-board">What’s on board</h3>
<p>These come from NCL’s “What’s On Board” page for Jewel. Line-ups can change by 2027, so check the app.</p>
<ul>
<li><strong>Included restaurants:</strong> Azura and Tsar’s Palace (the main dining rooms, Deck 6), the <a href="/restaurants/ncl/garden-cafe.html">Garden Café</a> buffet and <a href="/restaurants/ncl/the-great-outdoors.html">The Great Outdoors</a> (Deck 12), Topsiders Bar &amp; Grill by the pool (Deck 12), and <a href="/restaurants/ncl/osheehans.html">O’Sheehan’s</a> (Deck 8), which NCL lists as open 24 hours.</li>
<li><strong>Specialty restaurants (extra):</strong> <a href="/restaurants/ncl/cagneys-steakhouse.html">Cagney’s Steakhouse</a>, <a href="/restaurants/ncl/moderno-churrascaria.html">Moderno Churrascaria</a>, <a href="/restaurants/ncl/la-cucina.html">La Cucina</a>, <a href="/restaurants/ncl/le-bistro.html">Le Bistro</a>, <a href="/restaurants/ncl/teppanyaki.html">Teppanyaki</a>, <a href="/restaurants/ncl/chin-chin.html">Chin Chin</a> and Sushi. NCL’s page gives a cover charge of $40 to $60 a person, and its gratuity FAQ adds a 20% charge to specialty dining.</li>
<li><strong>Bars:</strong> among others, <a href="/restaurants/ncl/maltings-whiskey-bar.html">Maltings</a>, <a href="/restaurants/ncl/shakers-martini-bar.html">Shaker’s</a>, <a href="/restaurants/ncl/bliss-ultra-lounge.html">Bliss Ultra Lounge</a>, the <a href="/restaurants/ncl/sugarcane-mojito-bar.html">Sugarcane Mojito Bar</a>, the Spinnaker Lounge, a <a href="/restaurants/ncl/sake-bar.html">Sake Bar</a> and a <a href="/restaurants/ncl/ncl-starbucks.html">Starbucks</a>.</li>
<li><strong>Shows</strong> are in the Stardust Theater.</li>
<li><strong>Pool, spa and fitness:</strong> the Sapphire Pools on Deck 12, the Mandara Spa, and the Pulse Fitness Center. The spa’s <strong>Thermal Suite</strong> is adults only and needs its own paid pass.</li>
<li><strong><a href="/restaurants/ncl/vibe-beach-club.html">Vibe Beach Club</a></strong> on Deck 14 is adults only and needs a paid pass.</li>
</ul>
<h3 id="pk-what-jewel-doesnt-have">What Jewel doesn’t have</h3>
<ul>
<li><strong>No Studio cabins and no Studio Lounge.</strong> NCL lists Studios on ten ships, and Jewel isn’t one of them. If you’ve read about NCL’s solo lounge, that’s on other ships.</li>
<li><strong>No self-service laundry.</strong> NCL’s packing page says “laundry is not self-service.” Fill in the order form in your cabin and your steward collects it. NCL offers express same-day service too. Prices are on the form.</li>
</ul>
<h3 id="pk-cabin-choice-sailing-solo">Cabin choice: sailing solo</h3>
<p>NCL sells <strong>Solo Inside, Solo Oceanview and Solo Balcony</strong> cabins, and its solo page lists Norwegian Jewel among the ships that have them. NCL says “double occupancy rates don’t apply” in those cabins.</p>
<p>If you book a regular cabin for one, expect to pay for two. NCL doesn’t publish a single-supplement rule, but its promotion terms speak of “singles paying 200%.” Price the solo cabins against a regular cabin before you choose. The <a href="/stateroom-check.html">stateroom check</a> can tell you about a specific cabin number on Jewel.</p>
<h3 id="pk-free-at-sea">Free at Sea</h3>
<p>For bookings made from November 5, 2025, NCL’s package is called <strong>Free at Sea</strong>. Per NCL’s Free at Sea page, read October 2026, it includes:</p>
<ul>
<li>An <strong>open bar</strong> for guests 21 and over, on board and at Great Stirrup Cay</li>
<li><strong>Specialty dining</strong>: four meals on a cruise of nine nights or more, so four on this one</li>
<li><strong>Wi-Fi</strong>: 150 minutes</li>
<li>A <strong>$50 shore excursion credit</strong> at each port, for the first guest in the cabin</li>
</ul>
<p>The open bar isn’t free of charges. NCL’s own Free at Sea flyer (December 2025) says: “Gratuities are $28.50/per person/per day for all Guests 21+. Please note this is the pre-cruise price. The onboard price will vary.” For ten nights alone, that’s <strong>$285</strong>, on top of the daily service charge. Guests 3 to 20 get soda and juice instead, for $12.50 a day. The <a href="/drink-calculator.html?line=ncl">drink calculator</a> uses the same $28.50. What’s included depends on when and how you book, so check your own confirmation.</p>
<h3 id="pk-connectivity">Connectivity</h3>
<p>NCL’s Wi-Fi runs on Starlink. Free at Sea includes 150 minutes. Beyond that, NCL’s Free at Sea page lists the <strong>Voyage Wi-Fi Pass at $29.99</strong> and the <strong>Streaming Voyage Wi-Fi Pass at $39.99</strong>, each per cabin per day, plus $14.99 a day for each extra device (October 2026). The <a href="/internet-at-sea.html">internet at sea guide</a> explains how ship Wi-Fi works.</p>

<h3 id="pk-day-1-monday-november-29-miami-embarkation">Day 1 — Monday, November 29 — Miami (embarkation)</h3>
<p><strong>Ship leaves:</strong> 4:00 PM. <strong>Be on board by 3:00 PM.</strong></p>
<ul>
<li><strong>The terminal.</strong> PortMiami lists Terminal B, “The Pearl of Miami,” as NCL’s terminal, and Terminal C as one that “serves ships from several cruise lines.” No terminal has been assigned for a 2027 sailing yet, so <strong>your eDocs name yours.</strong></li>
<li><strong>Parking.</strong> PortMiami lists Garage B, 1756 N. Cruise Blvd., at $35 a day (effective January 1, 2025). If your eDocs say Terminal C, Garage C is at 1648 N. Cruise Blvd., at $28 a day. Debit cards aren’t accepted.</li>
<li><strong>Arrival time.</strong> NCL asks guests who’ve checked in online to arrive at the terminal no later than one hour before their chosen boarding time.</li>
<li><strong>Carry-on.</strong> Keep your passport, medications, a swimsuit and a change of clothes with you. NCL asks you to carry a small bag with what you need on the first day “while your luggage is delivered” to your cabin.</li>
</ul>
<p>More on the <a href="/ports/miami.html">Miami port page</a>.</p>
<h3 id="pk-day-great-stirrup-cay">Day 2 — Tuesday, November 30 — Great Stirrup Cay, Bahamas</h3>
<p><strong>In port:</strong> 7:00 AM to 3:00 PM. <strong>All aboard 2:00 PM.</strong></p>
<p>This is NCL’s own island in the Berry Islands of the Bahamas.</p>
<ul>
<li><strong>The pier.</strong> NCL says a multi-ship pier debuted in December 2025. When it opened, NCL said all ships visiting the island will benefit from it, with “guests no longer being required to tender from ship to shore” (quoted by Cruise Industry News). It was still being finished then, and on that first day a Jewel-class sister, Norwegian Gem, anchored and tendered (CruiseHive). In September 2026 Cruise Industry News reported that “the new pier opened in August 2026.” So expect to walk ashore, and <strong>check the app</strong> the day before.</li>
<li><strong>What’s free:</strong> the beaches, loungers and umbrellas, and the Splash Harbor splash pad. The Free at Sea open bar applies on the island.</li>
<li><strong>What costs extra:</strong> the <strong>Great Tides Waterpark</strong>, which opened in September 2026, was “from $89” on NCL’s excursion page in October 2026. Also cabanas, the Vibe Shore Club day pass, the zipline, and snorkel and paddleboard rentals.</li>
<li><strong>Money.</strong> NCL’s ships use US dollars, charged to your shipboard account. NCL lists your key card among the things to bring to the waterpark.</li>
</ul>
<p>More on the <a href="/ports/great-stirrup-cay.html">Great Stirrup Cay port page</a>.</p>
<h3 id="pk-day-cabo-rojo">Day 4 — Thursday, December 2 — Cabo Rojo, Dominican Republic</h3>
<p><strong>In port:</strong> 9:00 AM to 4:00 PM. <strong>All aboard 3:00 PM.</strong></p>
<p>Cabo Rojo is a new cruise port in <strong>Pedernales Province</strong>, in the far southwest of the Dominican Republic. The Dominican Port Authority says its first cruise ship arrived on January 4, 2024.</p>
<ul>
<li><strong>What’s around it.</strong> NCL’s own page says the region is “sparsely populated” and that “there aren’t any recommended shopping areas.” Plan this day around an NCL Shore Excursion, or a quiet day near the port.</li>
<li><strong>Bahía de las Águilas.</strong> NCL calls it “the country’s most beautiful beach” and describes it as five miles long. It sits in <strong>Jaragua National Park</strong>, which NCL notes is a UNESCO Biosphere Reserve.</li>
<li><strong>Getting there.</strong> The Dominican tourism ministry says you reach it “by an all-terrain vehicle, or by boat from the shores of Cabo Rojo.” It also says the beach has “no hotels, shops, or restaurants” and no shade, so bring water and plenty of sun protection. An NCL Shore Excursion arranges the boat for you.</li>
<li><strong>Money.</strong> The Dominican peso. Ask before you pay in dollars.</li>
<li><strong>Emergency number:</strong> 911. The UK government notes that 911 “does not have full coverage across the country.”</li>
</ul>
<p>This site doesn’t have a Cabo Rojo page yet, so this pack doesn’t say more than NCL and the sources above do.</p>
<h3 id="pk-day-aruba">Day 5 — Friday, December 3 — Aruba (Oranjestad)</h3>
<p><strong>In port:</strong> 11:00 AM to 8:00 PM. <strong>All aboard 7:00 PM.</strong></p>
<p>A late-morning arrival and an evening departure, so you have the afternoon and the sunset.</p>
<ul>
<li><strong>The terminal.</strong> Aruba’s tourism office says Main Street is “a ten-minute walk from the cruise terminal” and Surfside Beach a 15-minute walk, and that “all of Aruba’s beaches are public and free.” The Aruba Ports Authority lists Fort Zoutman and the historical museum within walking distance.</li>
<li><strong>Arikok National Park.</strong> Aruba’s tourism office says “nearly 20% of Aruba is a designated National Park,” and that visitors “need to purchase a ticket” to enter. No official page gives the entry fee, and travel guides disagree ($11 or $22 a person), so check at the gate. The Aruba Conservation Foundation, which runs the park, lists guided hikes at $25, but they start between 6:00 and 8:00 AM, before your ship arrives. Travel guides also say the park closes in mid-afternoon, so if you go, go straight from the ship.</li>
<li><strong>Money.</strong> Aruba’s tourism office says the florin is the currency but “U.S. dollars are widely accepted,” you may get change in florins, and some businesses won’t take US $50 or $100 bills.</li>
<li><strong>Emergency numbers:</strong> 911 for ambulance and fire, <strong>100 for police</strong> (UK government travel advice).</li>
<li><strong>Arrival card.</strong> The written sources don’t agree. Aruba’s tourism site calls its online ED card “a mandatory requirement for all individuals… entering Aruba,” but its own page for cruise visitors doesn’t mention it, and a January 2025 Travel Market Report guide says it “does not… apply to cruise passengers.” When I called at Aruba by cruise ship in 2023, we were exempt. In my experience, when a port does require paperwork, the cruise line handles it or tells you when it can’t. Watch the NCL app.</li>
</ul>
<h3 id="pk-day-curacao">Day 6 — Saturday, December 4 — Curaçao (Willemstad)</h3>
<p><strong>In port:</strong> 7:00 AM to 7:00 PM. <strong>All aboard 6:00 PM.</strong></p>
<p>A long day in a walkable old town.</p>
<ul>
<li><strong>The Queen Emma Bridge.</strong> Curaçao’s tourism site says it was built in 1888 and swings open to let ships into the harbor. While it’s open, a small ferry called the ponchi carries people across free.</li>
<li><strong>The pier.</strong> The Curaçao Ports Authority says ships dock at the Mega Pier or the Otrobanda wharves on St. Anna Bay.</li>
<li><strong>Money.</strong> Curaçao’s currency is now the <strong>Caribbean guilder (XCG)</strong>, which took over on March 31, 2025. The old Netherlands Antillean guilder stopped being legal tender on July 1, 2025 (Deutsche Bundesbank notice).</li>
<li><strong>Emergency numbers:</strong> 911 for police and fire, <strong>912 for ambulance</strong> (UK government travel advice).</li>
<li><strong>Arrival card.</strong> Curaçao’s 2019 notice on its online immigration card describes it as required for “any person traveling to Curaçao by air.” It says nothing about cruise passengers. Watch the app for anything NCL asks you to fill in.</li>
</ul>
<h3 id="pk-day-falmouth">Day 8 — Monday, December 6 — Falmouth, Jamaica</h3>
<p><strong>In port:</strong> 7:00 AM to 5:00 PM. <strong>All aboard 4:00 PM.</strong></p>
<ul>
<li><strong>The pier and the town.</strong> The Jamaican government says the Falmouth cruise pier was developed by the Port Authority of Jamaica in the town itself, that Falmouth is “renowned for its beautiful Georgian architecture,” and that the town was declared a national monument on August 21, 1996. More on our <a href="/ports/falmouth.html">Falmouth port page</a>.</li>
<li><strong>Money.</strong> The Jamaican dollar. Ask before you pay in US dollars.</li>
<li><strong>Emergency numbers:</strong> <strong>119 for police, 110 for ambulance and fire</strong> (UK government travel advice). The US Embassy in Kingston’s after-hours line is 1 (876) 702-6000.</li>
<li><strong>Travel advisory.</strong> The US State Department rates Jamaica Level 2, “exercise increased caution” (June 2026). The companion’s Alerts tab keeps this current.</li>
</ul>
<h3 id="pk-day-grand-cayman">Day 9 — Tuesday, December 7 — Grand Cayman (George Town)</h3>
<p><strong>In port:</strong> 7:00 AM to 5:00 PM. <strong>All aboard 4:00 PM.</strong></p>
<ul>
<li><strong>It’s a tender port.</strong> George Town has no cruise pier: the Port Authority of the Cayman Islands sought bids for one in 2017, and travel guides describe ships anchoring and small boats carrying passengers ashore. Our <a href="/ports/grand-cayman.html">Grand Cayman port page</a> has more. The last tender back leaves before all-aboard time. The ship announces it, so <strong>listen for it and leave yourself extra time.</strong></li>
<li><strong>If you use a wheelchair or walk with difficulty,</strong> ask NCL about tendering before you book anything ashore.</li>
<li><strong>Money.</strong> The Cayman Islands dollar. Cayman’s tourism office says “we use U.S. currency interchangeably.”</li>
<li><strong>Emergency number:</strong> 911 (UK government travel advice).</li>
</ul>
<h3 id="pk-day-11-thursday-december-9-miami-debarkation">Day 11 — Thursday, December 9 — Miami (debarkation)</h3>
<p>The ship is due in at 7:00 AM. Keep your passport, medications and a change of clothes with you. The ship isn’t due in until 7:00 AM, so don’t book an early-morning flight.</p>

age gives a cover charge of $40 to $60 a person, and its gratuity FAQ adds a 20% charge to specialty dining. Bars: among others, Maltings , Shaker’s , Bliss Ultra Lounge , the Sugarcane Mojito Bar , the Spinnaker Lounge, a Sake Bar and a Starbucks . Shows are in the Stardust Theater. Pool, spa and fitness: the Sapphire Pools on Deck 12, the Mandara Spa, and the Pulse Fitness Center. The spa’s Thermal Suite is adults only and needs its own paid pass. Vibe Beach Club on Deck 14 is adults only and needs a paid pass."},{"t":"What Jewel doesn’t have","s":"ship","a":"pk-what-jewel-doesnt-have","x":"No Studio cabins and no Studio Lounge. NCL lists Studios on ten ships, and Jewel isn’t one of them. If you’ve read about NCL’s solo lounge, that’s on other ships. No self-service laundry. NCL’s packing page says “laundry is not self-service.” Fill in the order form in your cabin and your steward collects it. NCL offers express same-day service too. Prices are on the form."},{"t":"Cabin choice: sailing solo","s":"ship","a":"pk-cabin-choice-sailing-solo","x":"NCL sells Solo Inside, Solo Oceanview and Solo Balcony cabins, and its solo page lists Norwegian Jewel among the ships that have them. NCL says “double occupancy rates don’t apply” in those cabins. If you book a regular cabin for one, expect to pay for two. NCL doesn’t publish a single-supplement rule, but its promotion terms speak of “singles paying 200%.” Price the solo cabins against a regular cabin before you choose. The stateroom check can tell you about a specific cabin number on Jewel."},{"t":"Free at Sea","s":"ship","a":"pk-free-at-sea","x":"For bookings made from November 5, 2025, NCL’s package is called Free at Sea . Per NCL’s Free at Sea page, read October 2026, it includes: An open bar for guests 21 and over, on board and at Great Stirrup Cay Specialty dining : four meals on a cruise of nine nights or more, so four on this one Wi-Fi : 150 minutes A $50 shore excursion credit at each port, for the first guest in the cabin The open bar isn’t free of charges. NCL’s own Free at Sea flyer (December 2025) says: “Gratuities are $28.50/per person/per day for all Guests 21+. Please note this is the pre-cruise price. The onboard price will vary.” For ten nights alone, that’s $285 , on top of the daily service charge. Guests 3 to 20 get soda and juice instead, for $12.50 a day. The drink calculator uses the same $28.50. What’s included depends on when and how you book, so check your own confirmation."},{"t":"Connectivity","s":"ship","a":"pk-connectivity","x":"NCL’s Wi-Fi runs on Starlink. Free at Sea includes 150 minutes. Beyond that, NCL’s Free at Sea page lists the Voyage Wi-Fi Pass at $29.99 and the Streaming Voyage Wi-Fi Pass at $39.99 , each per cabin per day, plus $14.99 a day for each extra device (October 2026). The internet at sea guide explains how ship Wi-Fi works."},{"t":"Section 2 — Day by Day","s":"guide","a":"section-2","x":"Each port day has the times from NCL’s schedule, the all-aboard time, and a few things to know. The port pages on this site go deeper."},{"t":"Day 1 — Monday, November 29 — Miami (embarkation)","s":"ports","a":"pk-day-1-monday-november-29-miami-embarkation","x":"Ship leaves: 4:00 PM. Be on board by 3:00 PM. The terminal. PortMiami lists Terminal B, “The Pearl of Miami,” as NCL’s terminal, and Terminal C as one that “serves ships from several cruise lines.” No terminal has been assigned for a 2027 sailing yet, so your eDocs name yours. Parking. PortMiami lists Garage B, 1756 N. Cruise Blvd., at $35 a day (effective January 1, 2025). If your eDocs say Terminal C, Garage C is at 1648 N. Cruise Blvd., at $28 a day. Debit cards aren’t accepted. Arrival time. NCL asks guests who’ve checked in online to arrive at the terminal no later than one hour before their chosen boarding time. Carry-on. Keep your passport, medications, a swimsuit and a change of clothes with you. NCL asks you to carry a small bag with what you need on the first day “while your luggage is delivered” to your cabin. More on the Miami port page ."},{"t":"Day 2 — Tuesday, November 30 — Great Stirrup Cay, Bahamas","s":"ports","a":"pk-day-great-stirrup-cay","x":"In port: 7:00 AM to 3:00 PM. All aboard 2:00 PM. This is NCL’s own island in the Berry Islands of the Bahamas. The pier. NCL says a multi-ship pier debuted in December 2025. When it opened, NCL said all ships visiting the island will benefit from it, with “guests no longer being required to tender from ship to shore” (quoted by Cruise Industry News). It was still being finished then, and on that first day a Jewel-class sister, Norwegian Gem, anchored and tendered (CruiseHive). In September 2026 Cruise Industry News reported that “the new pier opened in August 2026.” So expect to walk ashore, and check the app the day before. What’s free: the beaches, loungers and umbrellas, and the Splash Harbor splash pad. The Free at Sea open bar applies on the island. What costs extra: the Great Tides Waterpark , which opened in September 2026, was “from $89” on NCL’s excursion page in October 2026. Also cabanas, the Vibe Shore Club day pass, the zipline, and snorkel and paddleboard rentals. Money. NCL’s ships use US dollars, charged to your shipboard account. NCL lists your key card among the things to bring to the waterpark. More on the Great Stirrup Cay port page ."},{"t":"Day 3 — Wednesday, December 1 — At sea","s":"guide","a":"day-3-wednesday-december-1-at-sea","x":"The first sea day. Book your specialty dinners and any shore excursions you still want, find the spa and the quiet corners, and sleep in if you like."},{"t":"Day 4 — Thursday, December 2 — Cabo Rojo, Dominican Republic","s":"ports","a":"pk-day-cabo-rojo","x":"In port: 9:00 AM to 4:00 PM. All aboard 3:00 PM. Cabo Rojo is a new cruise port in Pedernales Province , in the far southwest of the Dominican Republic. The Dominican Port Authority says its first cruise ship arrived on January 4, 2024. What’s around it. NCL’s own page says the region is “sparsely populated” and that “there aren’t any recommended shopping areas.” Plan this day around an NCL Shore Excursion, or a quiet day near the port. Bahía de las Águilas. NCL calls it “the country’s most beautiful beach” and describes it as five miles long. It sits in Jaragua National Park , which NCL notes is a UNESCO Biosphere Reserve. Getting there. The Dominican tourism ministry says you reach it “by an all-terrain vehicle, or by boat from the shores of Cabo Rojo.” It also says the beach has “no hotels, shops, or restaurants” and no shade, so bring water and plenty of sun protection. An NCL Shore Excursion arranges the boat for you. Money. The Dominican peso. Ask before you pay in dollars. Emergency number: 911. The UK government notes that 911 “does not have full coverage across the country.” This site doesn’t have a Cabo Rojo page yet, so this pack doesn’t say more than NCL and the sources above do."},{"t":"Day 5 — Friday, December 3 — Aruba (Oranjestad)","s":"ports","a":"pk-day-aruba","x":"In port: 11:00 AM to 8:00 PM. All aboard 7:00 PM. A late-morning arrival and an evening departure, so you have the afternoon and the sunset. The terminal. Aruba’s tourism office says Main Street is “a ten-minute walk from the cruise terminal” and Surfside Beach a 15-minute walk, and that “all of Aruba’s beaches are public and free.” The Aruba Ports Authority lists Fort Zoutman and the historical museum within walking distance. Arikok National Park. Aruba’s tourism office says “nearly 20% of Aruba is a designated National Park,” and that visitors “need to purchase a ticket” to enter. No official page gives the entry fee, and travel guides disagree ($11 or $22 a person), so check at the gate. The Aruba Conservation Foundation, which runs the park, lists guided hikes at $25, but they start between 6:00 and 8:00 AM, before your ship arrives. Travel guides also say the park closes in mid-afternoon, so if you go, go straight from the ship. Money. Aruba’s tourism office says the florin is the currency but “U.S. dollars are widely accepted,” you may get change in florins, and some businesses won’t take US $50 or $100 bills. Emergency numbers: 911 for ambulance and fire, 100 for police (UK government travel advice). Arrival card. The written sources don’t agree. Aruba’s tourism site calls its online ED card “a mandatory requirement for all individuals… entering Aruba,” but its own page for cruise visitors doesn’t mention it, and a January 2025 Travel Market Report guide says it “does not… apply to cruise passengers.” When I called at Aruba by cruise ship in 2023, we were exempt. In my experience, when a port does require paperwork, the cruise line handles it or tells you when it can’t. Watch the NCL app."},{"t":"Day 6 — Saturday, December 4 — Curaçao (Willemstad)","s":"ports","a":"pk-day-curacao","x":"In port: 7:00 AM to 7:00 PM. All aboard 6:00 PM. A long day in a walkable old town. The Queen Emma Bridge. Curaçao’s tourism site says it was built in 1888 and swings open to let ships into the harbor. While it’s open, a small ferry called the ponchi carries people across free. The pier. The Curaçao Ports Authority says ships dock at the Mega Pier or the Otrobanda wharves on St. Anna Bay. Money. Curaçao’s currency is now the Caribbean guilder (XCG) , which took over on March 31, 2025. The old Netherlands Antillean guilder stopped being legal tender on July 1, 2025 (Deutsche Bundesbank notice). Emergency numbers: 911 for police and fire, 912 for ambulance (UK government travel advice). Arrival card. Curaçao’s 2019 notice on its online immigration card describes it as required for “any person traveling to Curaçao by air.” It says nothing about cruise passengers. Watch the app for anything NCL asks you to fill in."},{"t":"Day 7 — Sunday, December 5 — At sea","s":"guide","a":"day-7-sunday-december-5-at-sea","x":"The second sea day. A good day for the Thermal Suite, a show, or a long lunch."},{"t":"Day 8 — Monday, December 6 — Falmouth, Jamaica","s":"ports","a":"pk-day-falmouth","x":"In port: 7:00 AM to 5:00 PM. All aboard 4:00 PM. The pier and the town. The Jamaican government says the Falmouth cruise pier was developed by the Port Authority of Jamaica in the town itself, that Falmouth is “renowned for its beautiful Georgian architecture,” and that the town was declared a national monument on August 21, 1996. More on our Falmouth port page . Money. The Jamaican dollar. Ask before you pay in US dollars. Emergency numbers: 119 for police, 110 for ambulance and fire (UK government travel advice). The US Embassy in Kingston’s after-hours line is 1 (876) 702-6000. Travel advisory. The US State Department rates Jamaica Level 2, “exercise increased caution” (June 2026). The companion’s Alerts tab keeps this current."},{"t":"Day 9 — Tuesday, December 7 — Grand Cayman (George Town)","s":"ports","a":"pk-day-grand-cayman","x":"In port: 7:00 AM to 5:00 PM. All aboard 4:00 PM. It’s a tender port. George Town has no cruise pier: the Port Authority of the Cayman Islands sought bids for one in 2017, and travel guides describe ships anchoring and small boats carrying passengers ashore. Our Grand Cayman port page has more. The last tender back leaves before all-aboard time. The ship announces it, so listen for it and leave yourself extra time. If you use a wheelchair or walk with difficulty, ask NCL about tendering before you book anything ashore. Money. The Cayman Islands dollar. Cayman’s tourism office says “we use U.S. currency interchangeably.” Emergency number: 911 (UK government travel advice)."},{"t":"Day 10 — Wednesday, December 8 — At sea","s":"guide","a":"day-10-wednesday-december-8-at-sea","x":"The last sea day. Check your onboard account in the app, settle anything you want to dispute, and pack your bags."},{"t":"Day 11 — Thursday, December 9 — Miami (debarkation)","s":"ports","a":"pk-day-11-thursday-december-9-miami-debarkation","x":"The ship is due in at 7:00 AM. Keep your passport, medications and a change of clothes with you. The ship isn’t due in until 7:00 AM, so don’t book an early-morning flight."},{"t":"Section 3 — Pre-Cruise Countdown","s":"guide","a":"section-3","x":""},{"t":"Now (more than a year out)","s":"guide","a":"now-more-than-a-year-out","x":"Check your documents. For a round trip from a US port, NCL accepts a valid passport, or a state-certified US birth certificate with a government photo ID. NCL also says it “strongly recommends all guests to obtain a passport.” If your passport would expire around the trip, renew it. Buy travel insurance when you book. Medical care on board is billed to you. Look at a Solo cabin before a regular one. See Section 1 ."},{"t":"When NCL opens your bookings","s":"guide","a":"when-ncl-opens-your-bookings","x":"Specialty dinners , if Free at Sea gives you four. Shore excursions. Cabo Rojo is the day where an organized trip matters most. Great Tides Waterpark tickets, if you want them."},{"t":"When NCL opens online check-in","s":"guide","a":"when-ncl-opens-online-check-in","x":"Check in in the NCL app, and choose your boarding time. Book your flight in for Sunday, November 28, 2027. It’s the Sunday after Thanksgiving, so book early."},{"t":"The week before","s":"guide","a":"the-week-before","x":"Fill in the handoff card in Section 6 and give it to one person at home. Count down with the countdown tool , if that helps."},{"t":"Section 4 — Packing List","s":"guide","a":"section-4","x":"This list fits early December in the southern Caribbean : warm days, a chance of showers, six port days and three sea days. The packing lists page has more."},{"t":"Documents and money","s":"guide","a":"documents-and-money","x":"Passport (or the birth certificate and photo ID NCL allows) A copy of your passport, kept somewhere else Your insurance policy and its emergency number, printed Two cards, kept in different places Some small US bills for taxis and tips ashore"},{"t":"Carry-on","s":"guide","a":"carry-on","x":"All medications, in their original bottles Phone, charger, power bank Refillable water bottle Swimsuit and a change of clothes"},{"t":"Daytime","s":"guide","a":"daytime","x":"Swimsuits and a cover-up Light shirts and shorts A light sweater for the air conditioning A light rain jacket Sunglasses, hat, reef-safe sunscreen"},{"t":"Evenings","s":"guide","a":"evenings","x":"NCL’s restaurant dress code: “shirts and footwear required,” and “swimwear should be saved for the pool.” Pack whatever makes you comfortable at dinner within that."},{"t":"Footwear","s":"guide","a":"footwear","x":"Walking shoes for Willemstad and Falmouth Water shoes for the beaches Sandals"},{"t":"Wine","s":"guide","a":"wine","x":"NCL lets you carry on bottles of wine and champagne, but not box wine or other alcohol. Its corkage fee is $15 per 750 ml bottle, waived if you have a drink package."},{"t":"Section 5 — Budget Breakdown","s":"guide","a":"section-5","x":"Prices here were checked in October 2026 , more than a year before you sail. Use them to plan, and check again before you go. For your own total, the cruise budget calculator is set up for this."},{"t":"Included in an NCL fare","s":"guide","a":"included-in-an-ncl-fare","x":"Your cabin Meals at the included restaurants (Azura, Tsar’s Palace, the Garden Café, The Great Outdoors, Topsiders, O’Sheehan’s) The shows in the Stardust Theater Pools and the fitness center At Great Stirrup Cay: the beaches, loungers and splash pad Whatever Free at Sea adds to your booking (see Section 1 )"},{"t":"What might cost extra","s":"guide","a":"what-might-cost-extra","x":"Item What we know (October 2026) Daily service charge $20 per person per day for cabins up to Club Balcony Suite; $25 for The Haven and suites (bookings from January 1, 2023). For 10 nights, about $200 in a standard cabin. It can be prepaid up to 24 hours before sailing Drink package service charge $28.50 per person per day for guests 21 and over with the Free at Sea open bar (NCL’s flyer, pre-cruise price; NCL says the onboard price will vary). About $285 for ten nights Drinks without a package NCL adds 20% to bar purchases Specialty dining $40 to $60 a person cover charge, plus 20%, beyond your Free at Sea meals Wi-Fi Beyond Free at Sea’s 150 minutes: $29.99 a day per cabin, or $39.99 for streaming; $14.99 a day per extra device Thermal Suite, Vibe Beach Club Paid passes Great Stirrup Cay Great Tides Waterpark from $89; cabanas and rentals extra Laundry Steward service, priced on the form in your cabin; express same-day available Parking Garage B, $35 a day (Garage C, $28, if you sail from Terminal C) Travel insurance Depends on age and coverage Hotel the night before Depends on Miami prices that weekend"},{"t":"Tipping","s":"guide","a":"tipping","x":"NCL’s daily service charge covers the crew in general. The cruise tipping calculator helps if you want to plan anything extra, and Cruise Tipping 2026 explains the custom."},{"t":"Section 6 — Emergency Contacts","s":"guide","a":"section-6","x":"Fill this in and give a copy to one person at home before you go. When you’re sailing alone, this card is how they find you. FAMILY HANDOFF — IN THE WAKE VOYAGE PACK ───────────────────────────────────────── CRUISER: ________________________ CABIN: ____________ SHIP: Norwegian Jewel LINE: Norwegian Cruise Line SAILING: November 29 – December 9, 2027 FROM: Miami, Florida, USA (PortMiami) ITINERARY: Miami → Great Stirrup Cay (Bahamas) → at sea → Cabo Rojo (DR) → Aruba → Curaçao → at sea → Falmouth (Jamaica) → Grand Cayman → at sea → Miami DAILY CHECK-IN: I'll message by ______ each evening (ship time). No message by ______ ? Follow the steps below. EMERGENCY (24/7): US Citizens Abroad — State Dept: +1 (888) 407-4747 (from the US/Canada) +1 (202) 501-4444 (from abroad) To reach someone aboard an NCL ship: 1-833-810-7963 (from the US/Canada) 1-321-953-9006 (international) (NCL says calls are paid by card) EMERGENCY NUMBERS ASHORE: Miami, FL — 911 Great Stirrup Cay — 911 or 919 (Bahamas) Cabo Rojo, DR — 911 (not full coverage) Aruba — 911 ambulance/fire, 100 police Curaçao — 911 police/fire, 912 ambulance Falmouth, Jamaica — 119 police, 110 ambulance/fire Grand Cayman — 911 US EMBASSIES AND CONSULATES (24/7 emergency lines): Bahamas — Embassy Nassau: 242-461-5025, ext 1 Dominican Republic — Embassy Santo Domingo: (809) 567-7775 Aruba and Curaçao — Consulate General Curaçao: +599 (9) 433-2200 +1 301-985-8733 (from the US) Jamaica and Cayman — Embassy Kingston: 1 (876) 702-6000 CRUISER MEDICAL: Allergies: ________________________ Medications: ________________________ Conditions: ________________________ Insurance: ________________________ policy: ____________ WHERE IS THE SHIP: cruisinginthewake.com/tools/ship-tracker.html ─────────────────────────────────────────"},{"t":"What the person at home should do","s":"guide","a":"what-the-person-at-home-should-do","x":"If they don’t hear from you by the check-in time: Don’t panic. A missed message isn’t, by itself, a sign of trouble. Wait for the next check-in. Then try your phone and messages. Call NCL’s ship number above. NCL says it’s paid by card. If it’s serious, call the State Department: +1 (888) 407-4747. US embassy sites say Americans who need help can call it 24/7. To see where the ship is, use the ship tracker . The page on reaching someone at sea explains how all this works. Where these numbers come from. The State Department numbers and the Curaçao, Kingston, Nassau and Santo Domingo lines are from each US embassy or consulate’s own website, read October 2026. NCL’s ship number is from NCL’s FAQ. The local emergency numbers are from the UK government’s travel advice. Check them again before you go."},{"t":"Section 7 — Weather and Seasickness","s":"guide","a":"section-7","x":""},{"t":"Weather","s":"guide","a":"weather","x":"Below are typical figures for November 29 to December 9, worked out from five years of weather records (2020 to 2024) for each stop. They’re averages, not a forecast. The companion app shows a real forecast as the dates get close. Stop Typical high Typical low Days with rain Miami 78°F 65°F 20% Great Stirrup Cay 77°F 74°F 15% Cabo Rojo 87°F 72°F 16% Aruba 85°F 79°F 60% Curaçao 85°F 78°F 58% Falmouth 83°F 73°F 47% Grand Cayman 83°F 78°F 42% “Days with rain” counts any day with more than 1 mm (about 0.04 inch) of rain at that point, so a short shower counts the same as a wet day. Read it as how often you might see rain, not how often a day is spoiled. Cabo Rojo has the warmest afternoons, and Aruba and Curaçao are the most likely to see a shower. Miami is the coolest at night. These come from Open-Meteo’s historical weather records, at the grid point the records use for each stop. For small islands that point can sit over the water, which keeps the night-time lows close to the highs. Hurricanes. NOAA says the season ends November 30, the day after you sail. NCL’s own terms say “itineraries are subject to change without notice.”"},{"t":"Seasickness","s":"guide","a":"seasickness","x":"Nobody can promise how your body will feel at sea. If you’re prone to seasickness: Think about where your cabin is. A ship pitches and rolls around its middle, so a cabin low and near the middle moves the least. Ask your doctor or pharmacist about meclizine, dimenhydrinate or a prescription scopolamine patch, which the CDC names, and try anything new at home first. Ginger and acupressure bands: the CDC says ginger has “only weak and contradictory supporting evidence,” and that bands are “no more effective than placebo” in laboratory trials. Fresh air and a view of the horizon: the CDC says a visible horizon gives “some protection” on ships, and suggests fresh air as a distraction. The ship’s medical center can treat seasickness. It bills you. Medicare’s own guide says it “doesn’t cover health care services you get when the ship is more than 6 hours away from a U.S. port,” so check what your plan covers."},{"t":"Section 8 — Practical Logistics","s":"guide","a":"section-8","x":""},{"t":"Phones","s":"guide","a":"phones","x":"At sea: use the ship’s Wi-Fi, and turn off cellular data so you don’t pay for the ship’s network. In port: every stop on this trip is outside the US. Some US plans include these islands, some charge a daily fee. Check with your carrier before you go."},{"t":"Money","s":"guide","a":"money","x":"Aboard: US dollars, on your shipboard account (NCL). Cabo Rojo: the Dominican peso. Aruba: the Aruban florin; US dollars “widely accepted” (Aruba’s tourism office). Curaçao: the Caribbean guilder, since March 31, 2025. Falmouth: the Jamaican dollar. Grand Cayman: the Cayman Islands dollar; US dollars used “interchangeably” (Cayman’s tourism office)."},{"t":"Travel advisories (US State Department)","s":"guide","a":"travel-advisories-us-state-department","x":"Read October 2026: The Bahamas: Level 2, “exercise increased caution” (July 2026). Dominican Republic: Level 2, “exercise increased caution” (June 2025). Aruba: Level 1, “exercise normal precautions” (August 2026). Curaçao: Level 1, “exercise normal precautions” (September 2026). Jamaica: Level 2, “exercise increased caution” (June 2026). Cayman Islands: Level 1, “exercise normal precautions” (May 2026). Levels change. The companion app’s Alerts tab shows the current level for each, refreshed daily."},{"t":"Laundry, smoking, and the rules","s":"guide","a":"laundry-smoking-and-the-rules","x":"Laundry. Not self-service. Use the order form in your cabin; express same-day service is available. Smoking in your cabin or on your balcony carries a $250 cleaning charge . NCL allows cigar smoking in the cigar lounge, cigarettes in the casino for active players, and smoking outdoors on Deck 13, forward, port side. Drinking age: 21 on sailings from the US."},{"t":"Accessibility","s":"guide","a":"accessibility","x":"If you use a wheelchair or a scooter, or need other help, tell NCL when you book. Grand Cayman is a tender port. Great Stirrup Cay now has a pier, but check the app that day (see Day 2 ). The accessibility guide on this site covers more."},{"t":"Section 9 — The Solo Cruise Rhythm","s":"guide","a":"section-9","x":"Ten nights alone at sea has a rhythm, and you get to set it. Pick one anchor a day. A port walk, a show, a dinner. The rest can stay loose. Eat where it’s easy. The Garden Café buffet, and O’Sheehan’s, which NCL lists as open 24 hours, let you eat on your own schedule. Use the sea days. Day 3, Day 7 and Day 10 are yours: the spa, a book, a long lunch. One message home a day. Tell your person where you’re going ashore, and that you’re back aboard."},{"t":"Section 10 — Sailing Solo on NCL","s":"guide","a":"section-10","x":"Solo cabins. Jewel has Solo Inside, Solo Oceanview and Solo Balcony cabins, where NCL says “double occupancy rates don’t apply.” No Studio Lounge on Jewel. NCL’s solo lounge comes with Studio cabins, and Jewel has none. Solo meetups. In 2023 NCL said solo cruisers “can enjoy activities scheduled for single travelers to mix and mingle.” NCL’s current pages don’t say whether that happens on Jewel. On cruise forums, solo travelers describe meetups listed in the ship’s daily schedule on many NCL ships, often in the early evening, and say they’re as good as the people who show up. Look in the daily schedule on your first day. Before you go, Cruise Critic’s message boards have a Roll Calls section with a thread for each sailing date, where people on the same cruise can say hello. Excursions. NCL’s Shore Excursions are an easy way to spend a port day with other people, especially at Cabo Rojo. Safety, the same as at home: tell someone where you’re going ashore, keep your drink in sight, and be back early. The solo cruising hub has more from people who’ve done it."},{"t":"Section 11 — First Cruise Notes","s":"guide","a":"section-11","x":"If this is your first cruise, the first-cruise guide goes deeper. A few things worth knowing ahead: Download the NCL app and log in before you go. Be back early. NCL says that if you miss the ship, “it will be the guest’s responsibility to pay all expenses incurred to rejoin the ship.” You don’t have to do everything. Ten nights is long enough to skip things. If you like photos, the cruise tech and photography guide helps you pack the right gear."},{"t":"Closing","s":"guide","a":"closing","x":"This pack is a plain read on ten nights: NCL’s first Jewel-class ship, two Dutch islands, a new port in the far southwest of the Dominican Republic, Jamaica, Grand Cayman, and NCL’s own island at the start. Check the numbers again before you go, set your own pace, and enjoy it. Share or save. The companion app has a share button. If someone you know is thinking about this cruise, send them the link. Soli Deo Gloria. All work on this project is offered as a gift to God. The site that produced it is independent: no affiliate links, no commissions, no upsells. If it helped you, that’s the whole point. Last reviewed | 2026-10-11, for a sailing on 2027-11-29. Sailing times and ship facts from NCL’s own pages; port facts as noted below | How facts here are checked | Every fact in this pack is listed with its source in the pack’s fact-check file. The sailing’s dates, port order and times come from NCL’s schedule for this voyage. Ship facts come from NCL’s ship page, deck plans, FAQ and press releases, with tonnage, builder and dates from the ship’s Wikipedia entry and VesselFinder. Port facts come from NCL, PortMiami, the US State Department and its embassy and consulate sites, the UK government’s travel advice, Aruba’s and Curaçao’s tourism sites, the Central Bank of Curaçao and Sint Maarten, and named travel sites where those had no answer. Weather averages were calculated from Open-Meteo’s historical weather records. Where sources disagreed, the pack says so or leaves the number out. | Accessibility | This pack is written to read straight through on a screen reader: headings in order, small labeled tables, and links named for where they go. If something here is hard for you to use, that’s a bug, and we want to hear about it. | Sources | Ship: Norwegian Jewel ; NCL ship page, deck plans, “What’s On Board”, FAQ, Free at Sea and solo pages, and press releases. Ports on this site: Miami , Great Stirrup Cay , Aruba , Curaçao , Falmouth , Grand Cayman . Venues: Garden Café , The Great Outdoors , O’Sheehan’s , Cagney’s , Moderno , La Cucina , Le Bistro , Teppanyaki , Chin Chin , Vibe Beach Club . Tools: drink calculator , stateroom check , cruise budget calculator , cruise tipping calculator , ship tracker , ship size atlas . Reference: solo cruising hub , first-cruise guide , countdown , packing lists , internet at sea , reaching someone at sea , disability at sea . Articles: Cruise Tipping 2026 , cruise tech and photography guide . |"}]</script>
