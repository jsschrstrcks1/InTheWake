<h2 id="pk-section-1">Section 1 — Your Ship: Norwegian Breakaway</h2>
<h3 id="pk-a-big-new-york-themed-ship-christened-by-the-rockettes">A big New-York-themed ship christened by the Rockettes</h3>
<p><a href="/ships/norwegian/norwegian-breakaway.html">Norwegian Breakaway</a> is a <strong>Breakaway-class ship</strong> — 145,655 gross tons, 1,068 feet, 18 decks, 3,963 guests, 1,657 crew. She was <strong>delivered April 25, 2013</strong> by Meyer Werft at Papenburg, Germany, the lead ship of her class (her sister, Norwegian Getaway, followed in 2014). She was <strong>christened May 8, 2013 in New York City, with the Radio City Rockettes as her godmothers</strong> — fitting for a ship whose whole identity is built around New York, from a Peter Max hull design to the Manhattan Room dining room.</p>
<p>This is a genuinely big ship, and on a <strong>fall foliage itinerary with three sea days and cool-weather ports, that scale is a feature, not a drawback</strong> — there’s plenty to do aboard on a grey, blustery afternoon. A few signatures worth knowing:</p>
<ul>
<li><strong>The Waterfront</strong> — an outdoor oceanfront promenade lined with bars and restaurants that wraps the ship at sea level. On a bright fall sea day it’s a fine place to watch the coastline.</li>
<li><strong>The Aqua Park + the ropes course</strong> — a multi-story sports complex high on the ship; weather-dependent this far north in autumn, but there on the sunnier days.</li>
<li><strong>678 Ocean Place</strong> — the three-deck atrium and social hub; the orienting landmark and a good group-gathering spot, and a warm place to be when it’s cold on deck.</li>
<li><strong>The Studio complex</strong> — NCL’s dedicated solo-cabin neighborhood with its own private <strong>Studio Lounge</strong>. More in <a href="/admin/voyage-pwa/guides/breakaway-fall-foliage-guide.html?v=35370f2e7c#section-10">Section 10</a>; it’s why this ship is a strong solo pick.</li>
<li><strong>The Cavern Club</strong> and the evening entertainment lineup — the indoor social heart of a cool-weather cruise.</li>
</ul>
<p>For a side-by-side sense of the Breakaway’s scale, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> shows the real proportions; <a href="/articles/caribbean-cruise-trends-2026.html">Caribbean Cruise Trends 2026</a> covers the wider NCL fleet picture.</p>
<h3 id="pk-dining">Dining</h3>
<p>The Breakaway’s dining map, confirmed against her current <a href="/ships/norwegian/norwegian-breakaway.html">In the Wake ship profile</a>:</p>
<p><strong>Included with your fare (no extra charge):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/the-manhattan-room.html">Manhattan Room</a></strong> — the ship’s grand two-deck main dining room, with a dance floor and floor-to-ceiling stern windows; multi-course, no cover.</li>
<li><strong><a href="/restaurants/ncl/savor.html">Savor</a></strong> and <strong><a href="/restaurants/ncl/taste.html">Taste</a></strong> — the two additional complimentary main dining rooms; same fare, different rooms, shorter waits.</li>
<li><strong><a href="/restaurants/ncl/garden-cafe.html">Garden Café</a></strong> — the buffet; long hours, reliable fallback.</li>
<li><strong><a href="/restaurants/ncl/osheehans.html">O’Sheehan’s</a></strong> — the pub, open essentially around the clock; wings, burgers, and comfort food at any hour. A warm, low-pressure solo meal on a cold night.</li>
</ul>
<p><strong>Specialty dining (extra charge, or via a Specialty Dining Package):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/ocean-blue.html">Ocean Blue</a></strong> — the upscale seafood room (a Geoffrey Zakarian concept); the Breakaway’s signature specialty meal — and a fitting one on a coast this proud of its lobster and scallops.</li>
<li><strong><a href="/restaurants/ncl/cagneys-steakhouse.html">Cagney’s Steakhouse</a></strong> — NCL’s reliable steakhouse.</li>
<li><strong><a href="/restaurants/ncl/le-bistro.html">Le Bistro</a></strong> — French; the most romantic room aboard and a fine solo-treat night.</li>
<li><strong><a href="/restaurants/ncl/la-cucina.html">La Cucina</a></strong> — Italian.</li>
<li><strong><a href="/restaurants/ncl/teppanyaki.html">Teppanyaki</a></strong> — Japanese hibachi cooked at your table; the communal-seating room where solo diners eat with a small group by design.</li>
<li><strong><a href="/restaurants/ncl/moderno-churrascaria.html">Moderno Churrascaria</a></strong> — Brazilian rodizio.</li>
</ul>
<p><strong>Teppanyaki is the smart solo-dining pick</strong> on the Breakaway: the communal table takes the “table for one” question off the table entirely.</p>
<p><strong>Drinks.</strong> NCL’s Premium Beverage Package is commonly bundled into the <strong>“Free at Sea”</strong> promotion at booking. If your group fare included Free at Sea, drinks may already be covered — <strong>verify what’s bundled with Tina.</strong> Bought separately, the package runs on the order of $100+/day per person plus 20% gratuity, breaking even at roughly 5–6 drinks a day. Put your real pattern into the <a href="/drink-calculator.html">drink-calculator</a>; the companion article <a href="/articles/is-drink-package-worth-it.html">Is the drink package worth it?</a> walks the math.</p>
<p><strong>The Day 1 mistake to avoid:</strong> don’t buy an unlimited drink package at the front desk on embarkation afternoon on impulse. Decide before you board, ideally as part of your Free at Sea bundle.</p>
<h3 id="pk-cabin-categories-the-solo-calculus">Cabin categories — the solo calculus</h3>
<p>The group flyer shows three solo tiers: <strong>Solo Studio $1,599 · Ocean View $2,149 · Balcony $2,789.</strong> The Studio is the story:</p>
<ul>
<li><strong>Solo Studio at $1,599</strong> — this is NCL’s flagship solo product and the reason to consider this ship first. Studios are compact (~100 sq ft), windowless cabins <strong>built for one, with no single supplement</strong> and <strong>private access to the Studio Lounge</strong> — a residents-only social space with free coffee, hosted hours, and scheduled solo meet-and-greets. The Studio is priced <em>below</em> the next tier because you aren’t paying a double-occupancy fare for one person. If budget matters and you sleep fine without a window, this is the clear pick — and on a cool-weather cruise where you’re not lounging on a balcony, the case is even stronger. The <a href="/articles/stateroom-sanity-check.html">stateroom sanity check</a> confirms in four questions whether a windowless Studio suits you.</li>
<li><strong>Ocean View at $2,149</strong> — a standard cabin with a window, priced at the solo rate. You gain daylight (nice for watching the coast slide by) and a bit more room; you lose the Studio Lounge and pay a real premium for sailing a two-person cabin alone.</li>
<li><strong>Balcony at $2,789</strong> — a private veranda at the solo rate. On a fall Maritime cruise a balcony is often too cold to sit out on for long; weigh the ~$1,190 premium over the Studio against how many hours you’ll actually spend outside in 50–60°F weather.</li>
</ul>
<p><strong>Verify what’s in each tier with Tina</strong> — Free at Sea inclusions can vary by cabin category, which changes the real value more than the sticker prices. Once chosen, the <a href="/articles/cruise-cabin-organization.html">cabin organization guide</a> covers small-space pragmatics, doubly useful in a compact Studio.</p>
<h3 id="pk-connectivity-at-sea">Connectivity at sea</h3>
<p>NCL Wi-Fi is tier-based and frequently bundled into Free at Sea. The <a href="/internet-at-sea.html">internet at sea guide</a> covers the baselines. For this itinerary: <strong>Boston, Eastport, and Portland are on your U.S. plan (no roaming); Saint John and Halifax are in Canada</strong> — check your carrier’s Canada day-pass or use port Wi-Fi. Keep your daily one-line message to a contact ashore going regardless — see <a href="/admin/voyage-pwa/guides/breakaway-fall-foliage-guide.html?v=35370f2e7c#section-6">Section 6</a>.</p>

<h3 id="pk-day-1-sunday-september-26-boston-embarkation">Day 1 — Sunday, September 26 — Boston (embarkation)</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/boston/boston-hero.webp" alt="Boston Harbor and the waterfront — embarkation day for the Norwegian Breakaway" />
<figcaption aria-hidden="true">Boston Harbor and the waterfront — embarkation day for the Norwegian Breakaway</figcaption>
</figure>
<p><strong>Terminal:</strong> <strong>Flynn Cruiseport Boston (Black Falcon Terminal)</strong>, in the South Boston seaport (confirm in the NCL app).</p>
<p><strong>Getting to the port:</strong></p>
<ul>
<li><strong>Logan International (BOS) → Black Falcon Terminal:</strong> about 15 minutes; rideshare typically $20–30. Boston is a rare port where the airport is genuinely close.</li>
<li><strong>If driving:</strong> the terminal has paid parking (reserve ahead in peak weeks — and fall foliage season <em>is</em> peak in New England).</li>
<li><strong>Embark window:</strong> typically early afternoon; the Breakaway sails <strong>~4 PM</strong> past the Boston Harbor Islands.</li>
</ul>
<p><strong>Pre-cruise time in Boston — especially worth it in fall.</strong> Boston in late September is beautiful: the Freedom Trail, Faneuil Hall and Quincy Market, the North End for Italian food, and the first turning leaves on the Common. Fly in Saturday Sep 25 (or earlier), stay downtown, and start the trip unhurried. Confirm Tina’s pre-cruise meetup plans first. The <a href="/ports/boston.html">Boston port page</a> covers the walkable core.</p>
<p><strong>The realistic Day 1 timeline:</strong></p>
<ul>
<li><strong>Check-in</strong> at your assigned window; complete NCL online check-in in advance to skip a queue.</li>
<li><strong>Aboard:</strong> drop carry-ons, lunch at the Garden Café or O’Sheehan’s while cabins are readied.</li>
<li><strong>Cabin ready:</strong> meet your steward; drop bags. Studio guests — find the Studio Lounge; the first meet-and-greet is usually Day 1.</li>
<li><strong>Muster drill:</strong> partly app-based plus an in-person station check-in.</li>
<li><strong>Sailaway ~4 PM:</strong> Tina’s group gathers beforehand — watch her communications for the spot. The harbor islands slide by as you head out.</li>
<li><strong>Dinner:</strong> join the group’s first dinner if Tina has set one, or eat casual. The night to find the Baby Boomers group meetup.</li>
</ul>
<p><strong>What to pack in your carry-on for Day 1:</strong> a <strong>warm layer</strong> (late-September Boston harbor evenings are cool), <strong>all medications</strong>, a change of clothes, your <strong>travel documents</strong> (see below), phone charger, refillable water bottle. Checked bags may not arrive until evening. <a href="/articles/cruise-embarkation-day-what-to-expect.html">Embarkation Day: What to Expect</a> is the fuller primer.</p>
<p><strong>Documents — the closed-loop rule.</strong> This is a <strong>closed-loop cruise</strong> (round-trip Boston) that visits Canada (Saint John and Halifax). U.S. citizens may technically sail on a <strong>birth certificate plus government photo ID</strong>, but a <strong>passport is strongly recommended</strong> — it’s the only document that lets you fly home cleanly if an emergency pulls you off the ship in Canada. Bring the passport.</p>
<p><strong>Money/card:</strong> your NCL keycard is your ID, room key, and onboard charge account. <strong>Currency aboard: US Dollar.</strong></p>
<h3 id="pk-day-eastport">Day 3 — Tuesday, September 28 — Eastport, Maine</h3>
<p><strong>A small, characterful Down East call.</strong> Eastport sits on Moose Island in Passamaquoddy Bay and is the <strong>easternmost <em>city</em> in the United States</strong> (the town of Lubec is a bit farther east, but Eastport holds the “city” title). It’s a tiny, weathered, genuinely-working Maine seaport — a very different scale from the big cruise ports, and that’s the charm. It’s a small dock/tender call; confirm the arrangement in the NCL app.</p>
<p><strong>What to do on the ground:</strong></p>
<ul>
<li><strong>Walk historic Water Street</strong> — the compact downtown of brick and clapboard, art galleries, and local shops, all a short stroll from the waterfront.</li>
<li><strong>See (or hear about) the Old Sow</strong> — just offshore, on the boundary between Eastport and Deer Island, is the <strong>Old Sow, the largest tidal whirlpool in the Western Hemisphere</strong>, churned up by the enormous Bay of Fundy tides. It’s strongest a couple of hours before high tide; ask locally about the day’s timing and the best vantage (Dog Island is a known spot).</li>
<li><strong>Shackford Head State Park</strong> — a short walk to coastal trails and big Passamaquoddy Bay views if you want to stretch your legs.</li>
<li><strong>Eat local</strong> — this is lobster and scallop country; a small-town Maine seafood lunch is the move.</li>
</ul>
<p><strong>For a small port like this, don’t over-plan.</strong> Eastport is a walk-around-and-soak-it-in morning, not a checklist. The <strong>huge Fundy tides</strong> are the through-line — the water can drop and rise more than 20 feet here, and watching a working harbor at the turn of the tide is the quiet highlight.</p>
<p><strong>Pack for Eastport:</strong> a warm layer and rain shell (Down East weather is changeable and cool), comfortable walking shoes for the hilly little streets, and a few dollars for the galleries and a lobster roll. (Eastport doesn’t yet have a dedicated In the Wake port page — this section is its coverage.)</p>
<h3 id="pk-day-saint-john">Day 4 — Wednesday, September 29 — Saint John, New Brunswick</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/saint-john/saint-john-1.webp" alt="Saint John, New Brunswick — the Bay of Fundy port city and its historic uptown" />
<figcaption aria-hidden="true">Saint John, New Brunswick — the Bay of Fundy port city and its historic uptown</figcaption>
</figure>
<p><strong>Saint John sits on the Bay of Fundy — home of the highest tides in the world</strong>, which can rise and fall up to roughly 50 feet. The ship docks within walking distance of the historic Uptown and the City Market.</p>
<p><strong>Free / walkable from the ship:</strong></p>
<ul>
<li><strong>The Saint John City Market</strong> — the <strong>oldest continuously operating farmers’ market in Canada</strong> (chartered 1785); a covered hall of local food, dulse (dried seaweed the Maritimers snack on), and crafts, a short walk uphill from the port.</li>
<li><strong>Historic Uptown</strong> — brick streets, the Loyalist history, and King’s Square.</li>
</ul>
<p><strong>Paid / ticketed:</strong></p>
<ul>
<li><strong>The Reversing Falls Rapids</strong> — the Bay of Fundy’s signature trick: the incoming tide is so powerful it forces the Saint John River to <strong>run backwards</strong> through a rocky gorge. There’s a viewing area, a skywalk, and jet-boat tours for the adventurous. Timing matters — the effect is dramatic at the tide change and calm at slack water, so check the day’s tide table.</li>
<li><strong>Rockwood Park or Irving Nature Park</strong> — city green space and coastal trails, good for fall color and a walk.</li>
<li><strong>Bay of Fundy coastal tours</strong> — the tides, the sea caves at St. Martins (a drive out), and the coast.</li>
</ul>
<p><strong>For first-time Saint John:</strong> the Reversing Falls at the right tide plus a wander through the City Market is a satisfying, walkable day. Worth a look: the <a href="/ports/saint-john.html">Saint John port page</a>, its <a href="/ports/saint-john.html#gallery">gallery</a>, and the <a href="/ports/saint-john.html#logbook">Saint John logbook</a>.</p>
<p><strong>Pack for Saint John:</strong> layers, a rain shell, comfortable walking shoes, and a little <strong>Canadian cash</strong> or a card for the City Market (Canada uses the Canadian dollar).</p>
<h3 id="pk-day-halifax">Day 6 — Friday, October 1 — Halifax, Nova Scotia</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/halifax/halifax-1.webp" alt="Halifax, Nova Scotia — the historic Atlantic harbour and waterfront boardwalk in fall" />
<figcaption aria-hidden="true">Halifax, Nova Scotia — the historic Atlantic harbour and waterfront boardwalk in fall</figcaption>
</figure>
<p><strong>Arrival:</strong> morning. The Breakaway docks <strong>downtown on the Halifax Seaport</strong>, steps from the waterfront boardwalk — one of the most walkable cruise arrivals anywhere.</p>
<p><strong>Halifax — Nova Scotia’s historic Atlantic capital.</strong> Cool and often overcast in early October, with fall color in the parks; dress in layers.</p>
<p><strong>Free / walkable from the ship:</strong></p>
<ul>
<li><strong>The Halifax Waterfront Boardwalk</strong> — one of the longest urban boardwalks in the world; cafés, buskers, harbour views, and local seafood shacks.</li>
<li><strong>The Halifax Public Gardens</strong> (Victorian gardens, good fall color) and the historic downtown, a short uphill walk.</li>
</ul>
<p><strong>Paid / ticketed:</strong></p>
<ul>
<li><strong>The Halifax Citadel</strong> — the star-shaped 19th-century fortress above the harbour; the noon gun and the best view in the city.</li>
<li><strong>The Maritime Museum of the Atlantic</strong> — the region’s finest <em>Titanic</em> collection and the Halifax Explosion exhibit; a strong rainy-day choice.</li>
<li><strong>Peggy’s Cove</strong> — the iconic lighthouse on the granite coast, ~45 minutes each way by tour or taxi; the postcard of Nova Scotia.</li>
<li><strong>The Titanic connection</strong> — Halifax recovered many of the <em>Titanic</em>’s victims in 1912, and 121 are buried at <strong>Fairview Lawn Cemetery</strong>. A quiet, moving stop for history readers.</li>
</ul>
<p><strong>For first-time Halifax:</strong> if the weather is fine, Peggy’s Cove is the signature half-day; if it’s raw and grey, the waterfront boardwalk plus the Maritime Museum keeps you near the ship. Worth a look: the <a href="/ports/halifax.html">Halifax port page</a>, its <a href="/ports/halifax.html#gallery">gallery</a>, and the <a href="/ports/halifax.html#logbook">Halifax logbook</a>.</p>
<p><strong>Pack for Halifax:</strong> layers (a fleece or light jacket), a compact rain shell, comfortable walking shoes, a little <strong>Canadian cash</strong> or a card.</p>
<h3 id="pk-day-portland">Day 7 — Saturday, October 2 — Portland, Maine</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/portland-maine/portland-maine-1.webp" alt="Portland, Maine — the cobblestone Old Port and the working waterfront" />
<figcaption aria-hidden="true">Portland, Maine — the cobblestone Old Port and the working waterfront</figcaption>
</figure>
<p><strong>Arrival:</strong> ~10 AM, in the <strong>Old Port</strong> on Portland’s working waterfront. This is the last port, and a lovely one — a walkable, brick-and-cobblestone New England city at the peak of lobster season.</p>
<p><strong>Free / walkable from the ship:</strong></p>
<ul>
<li><strong>The Old Port</strong> — cobblestone streets, independent shops and galleries, brewpubs, and lobster everywhere. Entirely walkable from the dock.</li>
<li><strong>The working waterfront</strong> — fishing wharves, the Casco Bay ferry terminal, and harbor views.</li>
</ul>
<p><strong>Paid / ticketed:</strong></p>
<ul>
<li><strong>Portland Head Light</strong> — at Cape Elizabeth, <strong>first lit in 1791</strong> and one of the most-photographed lighthouses in America, set in <strong>Fort Williams Park</strong>. A short drive or tour from downtown; the signature Portland excursion.</li>
<li><strong>A Casco Bay islands ferry</strong> — the mailboat run out to the Calendar Islands, if the timing works.</li>
<li><strong>A lobster-shack afternoon</strong> — the quintessential Maine meal, at its best right now.</li>
</ul>
<p><strong>For first-time Portland:</strong> Portland Head Light plus a lobster lunch in the Old Port is the classic day, and both are easy. Worth a look: the <a href="/ports/portland-maine.html">Portland (Maine) port page</a>, its <a href="/ports/portland-maine.html#gallery">gallery</a>, and the <a href="/ports/portland-maine.html#logbook">Portland logbook</a>.</p>
<p><strong>Pack for Portland:</strong> a warm layer, comfortable walking shoes for the cobbles, and an appetite. <strong>Currency here is U.S. dollars</strong> — you’re back in the States for the last port.</p>
<h3 id="pk-day-8-sunday-october-3-boston-debarkation">Day 8 — Sunday, October 3 — Boston (debarkation)</h3>
<p><strong>Arrival:</strong> ~8 AM at Flynn Cruiseport.</p>
<p><strong>The realistic timeline:</strong></p>
<ul>
<li><strong>Early breakfast</strong> at the Garden Café or O’Sheehan’s.</li>
<li><strong>Self-disembarkation</strong> after the ship clears; walk-off in waves, typically all guests off by mid-morning.</li>
</ul>
<p><strong>The bag situation.</strong> The night before, place tagged checked luggage outside your cabin door by the posted deadline; bags go ashore overnight and you collect them before customs. Keep a change of clothes, all medications, documents, and valuables in your carry-on.</p>
<p><strong>Getting from Black Falcon Terminal to BOS:</strong> rideshare/taxi ~15 minutes, $20–30 — one of the easiest cruise-to-airport transfers anywhere. If you have hours before a flight, the <a href="/ports/boston.html">Freedom Trail</a>, Faneuil Hall, or the North End are close, and the fall foliage on the Common is a fine send-off.</p>

<script type="application/json" id="pack-index">[{"t":"Welcome","s":"guide","a":"welcome","x":"Made for the solo cruiser who has already booked this specific sailing and wants one trusted read on the week — the ship, the four cool-weather ports, the group’s rhythm, and the honest picture of foliage and fall weather — in one place. This pack exists to make one specific cruise easier: the Norwegian Breakaway , sailing 7 nights round-trip from Boston, September 26 – October 3, 2027 , calling at Eastport (Maine), Saint John (New Brunswick), Halifax (Nova Scotia), and Portland (Maine) . It’s a hosted Baby Boomers group cruise for solo travelers , organized and on-ship-hosted by Tina Maulsby at Maulsby Travel Co. ."},{"t":"Two honest notes up front","s":"guide","a":"two-honest-notes-up-front","x":"On the ports: NCL has been adjusting some of its fall Canada/New England port calls for 2027. The four ports above are the published lineup for this sailing, but confirm your exact ports and times in the NCL app as the date nears — this is a route where a substitution is more likely than average. On the foliage: late September into early October is when color begins along this coast. Inland northern Maine and New Brunswick peak in this window; the coastal ports you’ll actually visit tend to run a week or two behind the inland peak, so expect early-turning color and crisp air rather than a guaranteed blaze of red. It’s a beautiful, genuinely autumn week — just calibrated expectations make it a better one."},{"t":"A note on what’s first-hand here and what isn’t","s":"guide","a":"a-note-on-whats-first-hand-here-and-what-isnt","x":"I haven’t sailed this itinerary on this ship. Tina is the host running it, and what’s framed as hers — her sailaway plan, her group meetups, her group-cruise rhythm — is from her own communications. Everything else comes from primary-source research: NCL’s own published materials and FAQ, Wikipedia for ship specs and the christening, the ship’s own In the Wake profile for its venue list, the U.S. Consulate for the Canadian-port consular contacts, and operator pages where excursions are quoted. If a number can’t be sourced, it isn’t asserted here. Tina is both your booking agent and your on-ship host. Use tina@maulsbytravel.com or 910-528-5077 for booking questions, what’s bundled with your group rate, and any pre-cruise logistics. Once aboard, she’s the in-person organizer — sailaway gathering, group dinners, the daily where-are-we-meeting rhythm. It is calm by design. There is no urgency, no upsell, no countdown timer. The site that produced this pack is independent — no cruise-line affiliations, no shore-excursion commissions, no display ads. (See our affiliate disclosure .) A note on the season. Late September / early October is the tail of Atlantic hurricane season. Direct hurricanes are rare this far north, but the season’s remnants occasionally track up the Eastern Seaboard as wind, rain, or a nor’easter, and NCL will route around any weather in play. The day-to-day story, though, is crisp, changeable fall Maritime weather — sun, fog, and the odd cold rain. See Section 7 . Includes an offline-capable Emergency Contacts section — a fillable family handoff card and the numbers tailored to this itinerary, available offline after first load via In the Wake ’s companion app. Designed to share with one trusted person ashore before sailing. If you’re sailing solo for the first time, you are not the only one in this group doing so. Tina’s solo cruising stories are worth reading whether before, during, or after this trip."},{"t":"At a Glance","s":"guide","a":"at-a-glance","x":"Ship Norwegian Breakaway (Breakaway-class) Cruise line Norwegian Cruise Line (NCL) Class Breakaway Class (2013 lead ship; sister: Norwegian Getaway 2014) Specifications 145,655 GT · 1,068 ft / 326 m · 18 decks · 3,963 guests · 1,657 crew · 1,604 staterooms + 350 suites Year built 2013 — delivered 25 April 2013 by Meyer Werft, Papenburg, Germany; IMO 9606912 Christening May 8, 2013, in New York City Godmothers The Rockettes — the Radio City Rockettes Departure port Flynn Cruiseport Boston (Black Falcon Terminal), Boston, Massachusetts Itinerary 7 nights / 8 days · Canada & New England fall foliage, round-trip from Boston Foreign stops Two — Saint John and (via Halifax) Nova Scotia, both in Canada Audience Solo travelers — a hosted Baby Boomers group Group host Tina Maulsby , Maulsby Travel Co. — tina@maulsbytravel.com · 910-528-5077 (on-ship + booking) Group solo rates Solo Studio $1,599 · Ocean View $2,149 · Balcony $2,789 (per the group flyer; verify with Tina) Dress code NCL smart-casual — no formal nights (one optional “Norwegian’s Night Out”) Currency aboard US Dollar"},{"t":"Ports of call","s":"guide","a":"ports-of-call","x":"The published Boston round-trip lineup for the September 26 – October 3, 2027 sailing ( confirm in the NCL app — see the note above): Boston, Massachusetts — embark Sun Sep 26 · sailaway ~4 PM Cruising at sea — Mon Sep 27 Eastport, Maine — Tue Sep 28 Saint John, New Brunswick — Wed Sep 29 Cruising at sea — Thu Sep 30 Halifax, Nova Scotia — Fri Oct 1 Portland, Maine — Sat Oct 2 (arrive ~10 AM) Boston, Massachusetts — disembark Sun Oct 3 Verify your specific times in the NCL app. Track the ship’s real position any time from the Ship Tracker . Eastport does not yet have a dedicated In the Wake port page; its coverage is in this pack."},{"t":"Section 1 — Your Ship: Norwegian Breakaway","s":"ship","a":"pk-section-1","x":""},{"t":"A big New-York-themed ship christened by the Rockettes","s":"ship","a":"pk-a-big-new-york-themed-ship-christened-by-the-rockettes","x":"Norwegian Breakaway is a Breakaway-class ship — 145,655 gross tons, 1,068 feet, 18 decks, 3,963 guests, 1,657 crew. She was delivered April 25, 2013 by Meyer Werft at Papenburg, Germany, the lead ship of her class (her sister, Norwegian Getaway, followed in 2014). She was christened May 8, 2013 in New York City, with the Radio City Rockettes as her godmothers — fitting for a ship whose whole identity is built around New York, from a Peter Max hull design to the Manhattan Room dining room. This is a genuinely big ship, and on a fall foliage itinerary with three sea days and cool-weather ports, that scale is a feature, not a drawback — there’s plenty to do aboard on a grey, blustery afternoon. A few signatures worth knowing: The Waterfront — an outdoor oceanfront promenade lined with bars and restaurants that wraps the ship at sea level. On a bright fall sea day it’s a fine place to watch the coastline. The Aqua Park + the ropes course — a multi-story sports complex high on the ship; weather-dependent this far north in autumn, but there on the sunnier days. 678 Ocean Place — the three-deck atrium and social hub; the orienting landmark and a good group-gathering spot, and a warm place to be when it’s cold on deck. The Studio complex — NCL’s dedicated solo-cabin neighborhood with its own private Studio Lounge . More in Section 10 ; it’s why this ship is a strong solo pick. The Cavern Club and the evening entertainment lineup — the indoor social heart of a cool-weather cruise. For a side-by-side sense of the Breakaway’s scale, the Ship Size Atlas shows the real proportions; Caribbean Cruise Trends 2026 covers the wider NCL fleet picture."},{"t":"Dining","s":"ship","a":"pk-dining","x":"The Breakaway’s dining map, confirmed against her current In the Wake ship profile : Included with your fare (no extra charge): Manhattan Room — the ship’s grand two-deck main dining room, with a dance floor and floor-to-ceiling stern windows; multi-course, no cover. Savor and Taste — the two additional complimentary main dining rooms; same fare, different rooms, shorter waits. Garden Café — the buffet; long hours, reliable fallback. O’Sheehan’s — the pub, open essentially around the clock; wings, burgers, and comfort food at any hour. A warm, low-pressure solo meal on a cold night. Specialty dining (extra charge, or via a Specialty Dining Package): Ocean Blue — the upscale seafood room (a Geoffrey Zakarian concept); the Breakaway’s signature specialty meal — and a fitting one on a coast this proud of its lobster and scallops. Cagney’s Steakhouse — NCL’s reliable steakhouse. Le Bistro — French; the most romantic room aboard and a fine solo-treat night. La Cucina — Italian. Teppanyaki — Japanese hibachi cooked at your table; the communal-seating room where solo diners eat with a small group by design. Moderno Churrascaria — Brazilian rodizio. Teppanyaki is the smart solo-dining pick on the Breakaway: the communal table takes the “table for one” question off the table entirely. Drinks. NCL’s Premium Beverage Package is commonly bundled into the “Free at Sea” promotion at booking. If your group fare included Free at Sea, drinks may already be covered — verify what’s bundled with Tina. Bought separately, the package runs on the order of $100+/day per person plus 20% gratuity, breaking even at roughly 5–6 drinks a day. Put your real pattern into the drink-calculator ; the companion article Is the drink package worth it? walks the math. The Day 1 mistake to avoid: don’t buy an unlimited drink package at the front desk on embarkation afternoon on impulse. Decide before you board, ideally as part of your Free at Sea bundle."},{"t":"Cabin categories — the solo calculus","s":"ship","a":"pk-cabin-categories-the-solo-calculus","x":"The group flyer shows three solo tiers: Solo Studio $1,599 · Ocean View $2,149 · Balcony $2,789. The Studio is the story: Solo Studio at $1,599 — this is NCL’s flagship solo product and the reason to consider this ship first. Studios are compact (~100 sq ft), windowless cabins built for one, with no single supplement and private access to the Studio Lounge — a residents-only social space with free coffee, hosted hours, and scheduled solo meet-and-greets. The Studio is priced below the next tier because you aren’t paying a double-occupancy fare for one person. If budget matters and you sleep fine without a window, this is the clear pick — and on a cool-weather cruise where you’re not lounging on a balcony, the case is even stronger. The stateroom sanity check confirms in four questions whether a windowless Studio suits you. Ocean View at $2,149 — a standard cabin with a window, priced at the solo rate. You gain daylight (nice for watching the coast slide by) and a bit more room; you lose the Studio Lounge and pay a real premium for sailing a two-person cabin alone. Balcony at $2,789 — a private veranda at the solo rate. On a fall Maritime cruise a balcony is often too cold to sit out on for long; weigh the ~$1,190 premium over the Studio against how many hours you’ll actually spend outside in 50–60°F weather. Verify what’s in each tier with Tina — Free at Sea inclusions can vary by cabin category, which changes the real value more than the sticker prices. Once chosen, the cabin organization guide covers small-space pragmatics, doubly useful in a compact Studio."},{"t":"Connectivity at sea","s":"ship","a":"pk-connectivity-at-sea","x":"NCL Wi-Fi is tier-based and frequently bundled into Free at Sea. The internet at sea guide covers the baselines. For this itinerary: Boston, Eastport, and Portland are on your U.S. plan (no roaming); Saint John and Halifax are in Canada — check your carrier’s Canada day-pass or use port Wi-Fi. Keep your daily one-line message to a contact ashore going regardless — see Section 6 ."},{"t":"Section 2 — Day by Day","s":"guide","a":"section-2","x":"The sequence below follows the published Breakaway Canada/New England pattern for these ports. Confirm your exact ports and times in the NCL app — fall Canada/New England lineups have seen 2027 adjustments. Build each port day in the Port Day Planner before you go ashore, and record what actually happened in the Port Logbook on the way back."},{"t":"Day 1 — Sunday, September 26 — Boston (embarkation)","s":"ports","a":"pk-day-1-sunday-september-26-boston-embarkation","x":"Boston Harbor and the waterfront — embarkation day for the Norwegian Breakaway Terminal: Flynn Cruiseport Boston (Black Falcon Terminal) , in the South Boston seaport (confirm in the NCL app). Getting to the port: Logan International (BOS) → Black Falcon Terminal: about 15 minutes; rideshare typically $20–30. Boston is a rare port where the airport is genuinely close. If driving: the terminal has paid parking (reserve ahead in peak weeks — and fall foliage season is peak in New England). Embark window: typically early afternoon; the Breakaway sails ~4 PM past the Boston Harbor Islands. Pre-cruise time in Boston — especially worth it in fall. Boston in late September is beautiful: the Freedom Trail, Faneuil Hall and Quincy Market, the North End for Italian food, and the first turning leaves on the Common. Fly in Saturday Sep 25 (or earlier), stay downtown, and start the trip unhurried. Confirm Tina’s pre-cruise meetup plans first. The Boston port page covers the walkable core. The realistic Day 1 timeline: Check-in at your assigned window; complete NCL online check-in in advance to skip a queue. Aboard: drop carry-ons, lunch at the Garden Café or O’Sheehan’s while cabins are readied. Cabin ready: meet your steward; drop bags. Studio guests — find the Studio Lounge; the first meet-and-greet is usually Day 1. Muster drill: partly app-based plus an in-person station check-in. Sailaway ~4 PM: Tina’s group gathers beforehand — watch her communications for the spot. The harbor islands slide by as you head out. Dinner: join the group’s first dinner if Tina has set one, or eat casual. The night to find the Baby Boomers group meetup. What to pack in your carry-on for Day 1: a warm layer (late-September Boston harbor evenings are cool), all medications , a change of clothes, your travel documents (see below), phone charger, refillable water bottle. Checked bags may not arrive until evening. Embarkation Day: What to Expect is the fuller primer. Documents — the closed-loop rule. This is a closed-loop cruise (round-trip Boston) that visits Canada (Saint John and Halifax). U.S. citizens may technically sail on a birth certificate plus government photo ID , but a passport is strongly recommended — it’s the only document that lets you fly home cleanly if an emergency pulls you off the ship in Canada. Bring the passport. Money/card: your NCL keycard is your ID, room key, and onboard charge account. Currency aboard: US Dollar."},{"t":"Day 2 — Monday, September 27 — Cruising at sea","s":"guide","a":"day-2-monday-september-27-cruising-at-sea","x":"Northeast up the Gulf of Maine toward Down East Maine. Cool, sometimes foggy coastal air. Morning: breakfast at the Garden Café or a main dining room; the spa thermal suite (sea-day intro rates); the Studio Lounge coffee hour if you’re in a Studio. Midday: the indoor options come into their own on a cool day — spa, casino, 678 Ocean Place, the Aqua Park if the sun’s out. The Eastport port talk. Evening: the group’s dinner if Tina has set one; a production show; the Cavern Club. This is the day the group forms. Teppanyaki, if you book it, is the easiest first solo-dining night."},{"t":"Day 3 — Tuesday, September 28 — Eastport, Maine","s":"ports","a":"pk-day-eastport","x":"A small, characterful Down East call. Eastport sits on Moose Island in Passamaquoddy Bay and is the easternmost city in the United States (the town of Lubec is a bit farther east, but Eastport holds the “city” title). It’s a tiny, weathered, genuinely-working Maine seaport — a very different scale from the big cruise ports, and that’s the charm. It’s a small dock/tender call; confirm the arrangement in the NCL app. What to do on the ground: Walk historic Water Street — the compact downtown of brick and clapboard, art galleries, and local shops, all a short stroll from the waterfront. See (or hear about) the Old Sow — just offshore, on the boundary between Eastport and Deer Island, is the Old Sow, the largest tidal whirlpool in the Western Hemisphere , churned up by the enormous Bay of Fundy tides. It’s strongest a couple of hours before high tide; ask locally about the day’s timing and the best vantage (Dog Island is a known spot). Shackford Head State Park — a short walk to coastal trails and big Passamaquoddy Bay views if you want to stretch your legs. Eat local — this is lobster and scallop country; a small-town Maine seafood lunch is the move. For a small port like this, don’t over-plan. Eastport is a walk-around-and-soak-it-in morning, not a checklist. The huge Fundy tides are the through-line — the water can drop and rise more than 20 feet here, and watching a working harbor at the turn of the tide is the quiet highlight. Pack for Eastport: a warm layer and rain shell (Down East weather is changeable and cool), comfortable walking shoes for the hilly little streets, and a few dollars for the galleries and a lobster roll. (Eastport doesn’t yet have a dedicated In the Wake port page — this section is its coverage.)"},{"t":"Day 4 — Wednesday, September 29 — Saint John, New Brunswick","s":"ports","a":"pk-day-saint-john","x":"Saint John, New Brunswick — the Bay of Fundy port city and its historic uptown Saint John sits on the Bay of Fundy — home of the highest tides in the world , which can rise and fall up to roughly 50 feet. The ship docks within walking distance of the historic Uptown and the City Market. Free / walkable from the ship: The Saint John City Market — the oldest continuously operating farmers’ market in Canada (chartered 1785); a covered hall of local food, dulse (dried seaweed the Maritimers snack on), and crafts, a short walk uphill from the port. Historic Uptown — brick streets, the Loyalist history, and King’s Square. Paid / ticketed: The Reversing Falls Rapids — the Bay of Fundy’s signature trick: the incoming tide is so powerful it forces the Saint John River to run backwards through a rocky gorge. There’s a viewing area, a skywalk, and jet-boat tours for the adventurous. Timing matters — the effect is dramatic at the tide change and calm at slack water, so check the day’s tide table. Rockwood Park or Irving Nature Park — city green space and coastal trails, good for fall color and a walk. Bay of Fundy coastal tours — the tides, the sea caves at St. Martins (a drive out), and the coast. For first-time Saint John: the Reversing Falls at the right tide plus a wander through the City Market is a satisfying, walkable day. Worth a look: the Saint John port page , its gallery , and the Saint John logbook . Pack for Saint John: layers, a rain shell, comfortable walking shoes, and a little Canadian cash or a card for the City Market (Canada uses the Canadian dollar)."},{"t":"Day 5 — Thursday, September 30 — Cruising at sea","s":"guide","a":"day-5-thursday-september-30-cruising-at-sea","x":"Rounding southwest Nova Scotia toward Halifax. A relaxed sea day with the coastline in view. Morning: a slow start; spa; the Halifax port talk. Midday: indoor social time (678 Ocean Place, the casino) or the deck if the sun cooperates. Evening: group dinner; a specialty night at Ocean Blue or Le Bistro; the theater."},{"t":"Day 6 — Friday, October 1 — Halifax, Nova Scotia","s":"ports","a":"pk-day-halifax","x":"Halifax, Nova Scotia — the historic Atlantic harbour and waterfront boardwalk in fall Arrival: morning. The Breakaway docks downtown on the Halifax Seaport , steps from the waterfront boardwalk — one of the most walkable cruise arrivals anywhere. Halifax — Nova Scotia’s historic Atlantic capital. Cool and often overcast in early October, with fall color in the parks; dress in layers. Free / walkable from the ship: The Halifax Waterfront Boardwalk — one of the longest urban boardwalks in the world; cafés, buskers, harbour views, and local seafood shacks. The Halifax Public Gardens (Victorian gardens, good fall color) and the historic downtown, a short uphill walk. Paid / ticketed: The Halifax Citadel — the star-shaped 19th-century fortress above the harbour; the noon gun and the best view in the city. The Maritime Museum of the Atlantic — the region’s finest Titanic collection and the Halifax Explosion exhibit; a strong rainy-day choice. Peggy’s Cove — the iconic lighthouse on the granite coast, ~45 minutes each way by tour or taxi; the postcard of Nova Scotia. The Titanic connection — Halifax recovered many of the Titanic ’s victims in 1912, and 121 are buried at Fairview Lawn Cemetery . A quiet, moving stop for history readers. For first-time Halifax: if the weather is fine, Peggy’s Cove is the signature half-day; if it’s raw and grey, the waterfront boardwalk plus the Maritime Museum keeps you near the ship. Worth a look: the Halifax port page , its gallery , and the Halifax logbook . Pack for Halifax: layers (a fleece or light jacket), a compact rain shell, comfortable walking shoes, a little Canadian cash or a card."},{"t":"Day 7 — Saturday, October 2 — Portland, Maine","s":"ports","a":"pk-day-portland","x":"Portland, Maine — the cobblestone Old Port and the working waterfront Arrival: ~10 AM, in the Old Port on Portland’s working waterfront. This is the last port, and a lovely one — a walkable, brick-and-cobblestone New England city at the peak of lobster season. Free / walkable from the ship: The Old Port — cobblestone streets, independent shops and galleries, brewpubs, and lobster everywhere. Entirely walkable from the dock. The working waterfront — fishing wharves, the Casco Bay ferry terminal, and harbor views. Paid / ticketed: Portland Head Light — at Cape Elizabeth, first lit in 1791 and one of the most-photographed lighthouses in America, set in Fort Williams Park . A short drive or tour from downtown; the signature Portland excursion. A Casco Bay islands ferry — the mailboat run out to the Calendar Islands, if the timing works. A lobster-shack afternoon — the quintessential Maine meal, at its best right now. For first-time Portland: Portland Head Light plus a lobster lunch in the Old Port is the classic day, and both are easy. Worth a look: the Portland (Maine) port page , its gallery , and the Portland logbook . Pack for Portland: a warm layer, comfortable walking shoes for the cobbles, and an appetite. Currency here is U.S. dollars — you’re back in the States for the last port."},{"t":"Day 8 — Sunday, October 3 — Boston (debarkation)","s":"ports","a":"pk-day-8-sunday-october-3-boston-debarkation","x":"Arrival: ~8 AM at Flynn Cruiseport. The realistic timeline: Early breakfast at the Garden Café or O’Sheehan’s. Self-disembarkation after the ship clears; walk-off in waves, typically all guests off by mid-morning. The bag situation. The night before, place tagged checked luggage outside your cabin door by the posted deadline; bags go ashore overnight and you collect them before customs. Keep a change of clothes, all medications, documents, and valuables in your carry-on. Getting from Black Falcon Terminal to BOS: rideshare/taxi ~15 minutes, $20–30 — one of the easiest cruise-to-airport transfers anywhere. If you have hours before a flight, the Freedom Trail , Faneuil Hall, or the North End are close, and the fall foliage on the Common is a fine send-off."},{"t":"Section 3 — Pre-Cruise Countdown","s":"guide","a":"section-3","x":"Work the countdown page alongside this list if you like a running checklist."},{"t":"6+ months before — booking and big decisions","s":"guide","a":"months-before-booking-and-big-decisions","x":"Confirm the booking with Tina. Cabin category, final price, and what’s in the group rate (Free at Sea — drinks tier, Wi-Fi minutes, specialty dining credits, excursion credit, gratuities). Buy travel insurance. Sensible for any cruise; standard trip-interruption/medical coverage. (Late Sept/early Oct is technically hurricane season, though direct northern impact is uncommon — a policy with weather coverage is reasonable.) Plan flights to Boston (BOS). Arrive at minimum the day before sailing (Saturday Sep 25, 2027). Fall foliage season books up New England hotels — reserve early. Passport check. Confirm your passport is valid well past October 2027 — strongly recommended for this Canada itinerary."},{"t":"4 months before — soft logistics","s":"guide","a":"months-before-soft-logistics","x":"NCL online check-in in the NCL app; complete the health questions close to sailing. Specialty dining reservations. Ocean Blue, Le Bistro, and Teppanyaki fill first. Book one for a sea day. Excursions. Book Halifax (Peggy’s Cove), Saint John (Reversing Falls / Fundy tours), and Portland (Portland Head Light) in advance; Eastport is a walk-around port that needs no booking. Confirm the port lineup. Given NCL’s 2027 fall-route adjustments, re-check your exact ports when the itinerary firms up."},{"t":"2 months before — final commitments","s":"guide","a":"months-before-final-commitments","x":"Confirm gratuities — pre-paid in your group rate or billed aboard (see Section 5 ). Drink / Wi-Fi packages if Free at Sea didn’t include the tier you want — decide with the drink-calculator . Confirm pre-cruise hotel and begin the packing list . The packing-lists hub has printable versions."},{"t":"1 month before — final prep window","s":"guide","a":"month-before-final-prep-window","x":"Photocopy your passport — keep the copy in your cabin, separate from the original. Print the emergency handoff card and share it with one trusted person ashore. Confirm Tina’s group rhythm — sailaway gathering, Day 1 dinner, any group excursions."},{"t":"14 days before","s":"guide","a":"days-before","x":"NCL online check-in closes ahead of sailing — complete it early. Save boarding documents offline in the NCL app. Begin physical packing — this is a cool-weather week throughout; layers, not beachwear."},{"t":"Day before — Boston arrival","s":"guide","a":"day-before-boston-arrival","x":"Fly into BOS Saturday Sep 25. Check into your hotel ; confirm Sunday-morning porter/rideshare timing."},{"t":"Section 4 — Packing List (calibrated for a cool-weather fall foliage sailing)","s":"guide","a":"section-4","x":"Unlike the warm-water cruises, this one is cool throughout — there’s no beach day to pack for. Late-September / early-October highs run in the upper 50s to mid 60s, evenings drop to the 40s, and Maritime weather turns fast. Pack for layers, rain, and comfort. Boston embarkation / debarkation: cool, bright (52–66°F). Eastport / Saint John / Halifax: cool, often overcast, changeable (46–60°F). Portland: crisp coastal fall (47–62°F). Sea days: cool North Atlantic, breezy on deck. Dress culture: NCL smart-casual; no formal nights."},{"t":"Documents and money","s":"guide","a":"documents-and-money","x":"Passport (strongly recommended for this Canada itinerary) Photocopy of your passport (separate location) Travel insurance policy + emergency phone number (printed) Credit card + debit card (separate locations) $150–250 USD cash for the U.S. ports plus a little Canadian cash (or a card) for Saint John and Halifax NCL boarding documents (saved offline in the NCL app) Group itinerary from Tina"},{"t":"Carry-on (must arrive on the ship with you)","s":"guide","a":"carry-on-must-arrive-on-the-ship-with-you","x":"All medications in original prescription bottles Phone + charger + power bank Refillable water bottle A warm layer and a packable rain shell (you’ll want both from Day 1) Change of clothes (in case a checked bag is delayed) Sunglasses (low fall sun is bright on the water)"},{"t":"Daytime — cool ports and sea days","s":"guide","a":"daytime-cool-ports-and-sea-days","x":"1 warm jacket or fleece (Halifax mornings, breezy deck, Eastport wind) A packable waterproof rain shell (Maritime weather turns fast) 3–4 long-sleeve shirts / light sweaters (layering is the whole game) 2–3 pairs long pants / jeans A warm hat and light gloves — an early-October morning on deck or at Peggy’s Cove can be genuinely cold with wind Genuinely comfortable, water-resistant walking shoes — Eastport’s hills, Halifax’s boardwalk, Portland’s cobbles, wet leaves"},{"t":"Evening — ship dining","s":"guide","a":"evening-ship-dining","x":"4–5 smart-casual outfits — NCL’s evening code is American smart casual 1 dressier outfit for “Norwegian’s Night Out” or a specialty night (no formalwear needed) Comfortable shoes for carpeted corridors"},{"t":"Toiletries","s":"guide","a":"toiletries","x":"All prescription medications (original bottles, carry-on) OTC standbys: Tylenol, Advil, Imodium, Benadryl, Bonine or Dramamine ( Section 7 ) Lip balm and hand cream (cool, dry, windy air); basic toiletries Sunscreen (yes, still — fall sun on the water burns)"},{"t":"Accessories and essentials","s":"guide","a":"accessories-and-essentials","x":"Small daypack for port days A compact umbrella (backup to the rain shell) Binoculars if you have them — lighthouses, coastline, seabirds, the occasional whale Power adapter (US outlets aboard; standard US plugs fine; Canada also uses US-style plugs) Pen + small notebook if you keep a logbook"},{"t":"Skip — what NOT to bring","s":"guide","a":"skip-what-not-to-bring","x":"Iron or steamer — prohibited in cabins; the ship provides facilities Candles — prohibited (fire hazard) Heavy jewelry — leave high-value pieces home Formalwear — no formal nights on NCL Beach gear — there’s no warm-water swimming day on this itinerary; the pools/hot tubs aboard are the only swim, and they’re brisk"},{"t":"Section 5 — Budget Breakdown","s":"guide","a":"section-5","x":"The numbers below are calibrated for this specific sailing. For a total tuned to your own cabin, drinking habits, excursion appetite, and tipping pattern, the cruise-budget-calculator builds a personalized figure — usually within about 5% of what you’ll actually spend if you input honestly."},{"t":"What’s included in your fare","s":"guide","a":"whats-included-in-your-fare","x":"The group rate covers: Your cabin (Solo Studio, Ocean View, or Balcony per the flyer) All meals at the Manhattan Room, Savor, Taste, the Garden Café, and O’Sheehan’s Soft drinks, juice, coffee, tea at most venues Onboard entertainment, pools, hot tubs, Aqua Park, ropes course, fitness center Cabin steward and dining-room service; Studio Lounge access for Studio guests If your group rate has Free at Sea attached: likely includes the Premium Beverage Package, Wi-Fi minutes, specialty dining credits (typically 2–4 meals), and shore-excursion credit. Verify with Tina."},{"t":"What’s NOT included","s":"guide","a":"whats-not-included","x":"Category Typical cost (per person, week) Auto-gratuity (if not pre-paid) ~$140 — $20/person/day × 7 (Studio/OV/Balcony); $25/day Haven/Suites Drinks package (if not in Free at Sea) $700+ at pre-cruise rates (~$100/day × 7 + 20% gratuity) Wi-Fi package (if not in Free at Sea) $120–280 — varies by tier Specialty dining (beyond Free at Sea credits) $0–300 — Ocean Blue, Cagney’s, Le Bistro, Teppanyaki, Moderno per meal Eastport $0–30 — a walk-around port; lunch + galleries Saint John excursion $0–90 — Reversing Falls viewing ~$10; jet-boat ~$60–90; City Market free Halifax excursion $0–90 — Peggy’s Cove tour $50–90; Citadel ~$12; Maritime Museum ~$10; waterfront free Portland excursion $0–70 — Portland Head Light tour $40–70; Old Port walk free; lobster lunch $25–40 Spa treatments $0–400 — massages $130–200; thermal day pass ~$40 (a real treat on a cold day) Travel insurance $70–160 per person Pre-cruise hotel (Boston) ~$200–320 (Boston + fall foliage season runs pricey) Airport transfers BOS ↔︎ port ~$40–60 round trip"},{"t":"A realistic mid-range solo budget (per person, on top of cruise fare)","s":"guide","a":"a-realistic-mid-range-solo-budget-per-person-on-top-of-cruise-fare","x":"Item Cost Auto-gratuity ($20 × 7) $140 Wi-Fi (if not bundled) $120 Drinks (if not bundled — moderate drinker) $400 Specialty dining (one Ocean Blue night) $60 Eastport: lunch + galleries $30 Saint John: Reversing Falls + City Market lunch $60 Halifax: Peggy’s Cove tour + lunch $80 Portland: Portland Head Light + lobster lunch $80 Travel insurance $100 Pre-cruise hotel (Boston) $250 Airport transfers $50 Total above fare ~$1,370 Frugal version (Studio cabin, Free at Sea bundles drinks + Wi-Fi, walk the ports on foot, packed lunches): ~$450 above fare . Splurge version (balcony already booked, spa days, private tours everywhere, the full drink package): $1,900–3,000 above fare . The cruise-tipping-calculator covers the gratuity math; Cruise Tipping 2026 is the broader 2026 context."},{"t":"Section 6 — Emergency Contacts","s":"guide","a":"section-6","x":"Every Voyage Pack ships with this section. Fill in the handoff card and share it with one trusted person ashore."},{"t":"The family handoff card","s":"guide","a":"the-family-handoff-card","x":"FAMILY HANDOFF — IN THE WAKE VOYAGE PACK ───────────────────────────────────────── CRUISER: ________________________ CABIN: ____________ SHIP: Norwegian Breakaway LINE: Norwegian Cruise Line (NCL) SAILING: September 26 – October 3, 2027 FROM: Flynn Cruiseport Boston (Black Falcon Terminal), Boston, MA, USA ITINERARY: Boston → Eastport (ME) → Saint John (Canada) → Halifax (Canada) → Portland (ME) → Boston GROUP HOST: Tina Maulsby, Maulsby Travel Co. tina@maulsbytravel.com · 910-528-5077 EMERGENCY (24/7) — US State Dept, Overseas Citizens Services (can locate the ship and contact NCL through official channels): +1 (888) 407-4747 (US/Canada) +1 (202) 501-4444 (from abroad) SHIP-TO-SHORE (non-emergency messages only): NCL paid ship-phone relay: +1 (888) 627-4477 (credit card required; per-minute rate) NEAREST CONSULATE / EMERGENCY BY PORT: Boston, MA — US domestic; call 911 Eastport, ME — US domestic; call 911 Portland, ME — US domestic; call 911 Saint John, NB — US Consulate General Halifax (covers the Maritimes): +1 (902) 429-2480 Halifax, NS — US Consulate General Halifax: +1 (902) 429-2480 (Canada local emergency: 911) CRUISER MEDICAL: Allergies: ________________________ Medications: ________________________ Conditions: ________________________ Insurance: ________________________ policy: ____________ MOST RECENT KNOWN POSITION: Track at: /tools/ship-tracker.html or marinetraffic.com (search \"Norwegian Breakaway\") ─────────────────────────────────────────"},{"t":"What an at-home contact does","s":"guide","a":"what-an-at-home-contact-does","x":"If they don’t hear from you for 36+ hours: Don’t panic. Cruise Wi-Fi is unreliable; silence usually means signal, not emergency. (Three of five ports here are in the U.S. on normal cell service.) For a true emergency, call the State Department’s Overseas Citizens Services line (above) — they can locate the ship and reach NCL through official channels at no cost. For a non-urgent message, NCL’s paid ship-phone relay connects to the onboard phone system. Reach Tina at tina@maulsbytravel.com or 910-528-5077 — she’s both your booking agent and your on-ship host. If there’s been an incident: US Coast Guard for US waters; US Consulate General Halifax for the Canadian ports; ship’s medical for health emergencies. Track the ship’s position at /tools/ship-tracker.html ."},{"t":"What you should pack for emergencies","s":"guide","a":"what-you-should-pack-for-emergencies","x":"Printed list of medications, allergies, and emergency contacts (in your cabin) Photocopy of your passport (separate from the passport) Travel insurance policy number (printed) This handoff card, in your phone’s notes app and shared with one trusted person ashore"},{"t":"Section 7 — Seasickness + Fall Maritime Weather","s":"guide","a":"section-7","x":""},{"t":"What the weather actually does this week","s":"guide","a":"what-the-weather-actually-does-this-week","x":"It’s cool and changeable, not warm. Upper 50s to mid 60s by day, 40s at night, with fog, sun, and cold rain all possible in one afternoon. Layers and a rain shell are not optional. Hurricane season is technically open (through November 30), but direct hurricanes this far north are uncommon in early October; the season’s remnants occasionally track up the Eastern Seaboard as wind and rain, and NCL routes around anything active. The more likely disruptor is an ordinary autumn storm or a nor’easter. Fog is a Maritime feature — Eastport and the Fundy ports especially. It can delay a tender or a scenic approach; it usually burns off. The Gulf of Maine and the open stretches can carry a fall swell, particularly if a system is offshore."},{"t":"Seasickness onboard","s":"guide","a":"seasickness-onboard","x":"A big Breakaway-class ship is stable, but a fall North Atlantic can move it more than a summer Caribbean would. If you’re motion-sensitive, start your remedy the evening before a sea day rather than waiting. Bonine (meclizine) — once-daily, less drowsy than Dramamine. Sea-Bands (acupressure wristbands) — many find them effective. Ginger (capsules, tea, candies) — mild but real. Scopolamine patches (prescription, behind-the-ear) — the strongest option; 3-day duration. Stay mid-ship and low in your cabin choice — mid-ship, lower-to-middle decks feel the least motion. The article Cruise Seasickness: What Actually Works goes deeper on timing and options."},{"t":"If weather changes a port","s":"guide","a":"if-weather-changes-a-port","x":"Fog or a fall storm is the most likely disruptor here, and small Eastport is the most weather-sensitive call. If a port is skipped, NCL typically refunds prepaid ship-sold excursions to your onboard account; independent-operator bookings are between you and the operator, so screenshot every confirmation before you sail. Given NCL’s 2027 fall-route adjustments, treat the itinerary as firm-but-not-guaranteed and keep your plans flexible."},{"t":"Section 8 — Practical Logistics","s":"guide","a":"section-8","x":""},{"t":"Cell service and roaming","s":"guide","a":"cell-service-and-roaming","x":"At sea — ship Wi-Fi only; keep airplane mode ON. Boston, Eastport, Portland — your regular U.S. plan, no roaming (three of the five ports). Saint John and Halifax, Canada — foreign roaming; check your carrier’s Canada day-pass (T-Mobile often includes Canada; Verizon/AT&T sell ~$10/day passes), or use port Wi-Fi. The internet at sea guide has the cross-line detail."},{"t":"Currency","s":"guide","a":"currency","x":"Aboard: US Dollar. Eastport and Portland, Maine: US Dollar, cards everywhere. Saint John and Halifax, Canada: Canadian dollar (CAD); cards widely accepted, a little cash handy for the City Market and buskers. USD is sometimes accepted but at a poor rate — use CAD or a card."},{"t":"Tipping ashore","s":"guide","a":"tipping-ashore","x":"Maine (Eastport, Portland): standard U.S. tipping — 18–20% on restaurant bills, a few dollars for guides and drivers. Canada (Saint John, Halifax): the same North American norms — 15–20% on bills, a few dollars for tour guides and drivers, a coin for buskers."},{"t":"Onboard tipping","s":"guide","a":"onboard-tipping","x":"NCL’s daily service charge for bookings made on or after January 1, 2023 is $20 per person, per day for standard cabins (Club Balcony Suite and below — which covers Solo Studio, Ocean View, and Balcony on this sailing) and $25 per person, per day for The Haven and Suites. Verify with Tina whether your group rate has it pre-paid. NCL also adds a 20% gratuity automatically to beverages, specialty dining, and spa. Extra cash for standout service is appreciated but not expected: Stateroom attendant: $20–40 cash at the end of the week A bartender who remembers your order: $1–2 per drink in cash The cruise-tipping-calculator runs the total; Cruise Tipping 2026 is the broader 2026 context."},{"t":"Section 9 — The Group Cruise Rhythm","s":"guide","a":"section-9","x":"Tina is both your booking agent and your on-ship host, and this sailing is framed as a Baby Boomers group — a solo-cruiser group with a cohort that tends to skew toward retirees and near-retirees, an unhurried pace, and a shared-generation ease. She sets the rhythm. The typical pattern: Day 1 sailaway — Tina hosts a gathering before the ~4 PM departure. Watch her communications for the spot and time. A standing group dinner — Tina usually anchors the group with a nightly dinner (often at one of the main dining rooms) so people can find each other. Show up to whichever nights work; free with your fare, no per-night reservation. Group activities — she may add a specialty dinner, hosted trivia, or a group excursion (a shared Peggy’s Cove or Portland Head Light van is a natural one); check her communications. Studio Lounge — if you’re in a Studio, solo cruisers cluster here regardless of who’s hosting; NCL schedules a Studio meet-and-greet on Day 1. Last-night dinner — the Saturday-night gathering (after Portland) is the traditional send-off. How to find Tina on Day 1. Watch her email or Facebook for the sailaway spot and time. If you don’t see anything before boarding, the Studio Lounge (for Studio guests) or 678 Ocean Place near sailaway is the likeliest place to find the group."},{"t":"How the group actually works — the unwritten part","s":"guide","a":"how-the-group-actually-works-the-unwritten-part","x":"The schedule above is the written part. The unwritten part is what most first-time hosted-group cruisers actually wonder about, so here it is plainly: Every event is opt-in, and opting out costs you nothing. Skip tomorrow’s dinner to eat at O’Sheehan’s with a book? Nobody logs it. The standing dinner exists so the group can find each other at a predictable time — not so attendance can be taken. “No thanks, I’m doing my own thing today” is a complete sentence. On a solo group cruise, everyone aboard has needed alone-time — they recognize it and don’t take it personally. Tina won’t either. Dinner-table norms. Sit anywhere the group is sitting; no fixed seating, no group menu. On nights you skip the group, O’Sheehan’s and the Garden Café make solo dining low-friction, and Teppanyaki seats you with others by design. Port-day friendliness is not a port-week commitment. Sharing a van to Peggy’s Cove doesn’t obligate you to anyone’s Portland plan. Pairings form and re-form all week; that’s the design. A group this size produces a few real connections, not a crowd of them. A hosted solo week tends to yield two or three friendships that outlast the trip and a circle of friendly faces. Don’t measure the week against “everyone became best friends.”"},{"t":"Section 10 — Solo Cruising Considerations","s":"guide","a":"section-10","x":"The Breakaway is one of the strongest ships at sea for solo cruising, because of the Studio complex — a dedicated neighborhood of solo cabins with a private lounge: Studio cabins with no single supplement — you pay for one person, not a double-occupancy fare (that’s why the flyer’s Studio price is below the other tiers). The strongest solo-value cabin product in the fleet. The Studio Lounge — a residents-only space with free coffee, hosted hours, and scheduled solo meet-and-greets. On a cool-weather cruise, a warm indoor social anchor is worth a lot. O’Sheehan’s — always open, no table-for-one question at any hour. Teppanyaki — communal seating means you dine with others whether or not you booked alone. 678 Ocean Place and the indoor lounges — big, warm, populated spaces where you can be alone in company on a cold afternoon. For first-time solo cruisers: Tina runs welcoming, low-pressure group cruises. Show up when you want, skip when you want. The Studio meet-and-greet (Day 1) is the easiest way to find your people in the first 24 hours. The Solo Cruising Practical Guide covers the broader rhythm and the small social moves that make a solo week feel right. Solo cruising stories. Tina has written extensively on solo cruising — her solo cruising hub collects the practical, the emotional, and the social rhythms across multiple sailings. Worth reading whether before, during, or after this trip."},{"t":"If you’re sailing this one to mark a transition","s":"guide","a":"if-youre-sailing-this-one-to-mark-a-transition","x":"Some readers of this pack are solo because of where life has put them — a recent loss, a marriage that ended, a long stretch of caregiving that finally has a quiet week in it. Fall is a fitting season for that kind of trip: the turning of the year, cool bright mornings, unhurried days, and a group whose cohort has likely walked through some of the same seasons of life. There’s room here to be quiet and room to be found. Tina’s broader writing on the solo hub — particularly In the Wake of Grief — names this directly; this pack won’t repeat what she’s already said well. If that’s why you booked, the resources are there to read at your pace."},{"t":"Solo safety — cabin and onboard","s":"guide","a":"solo-safety-cabin-and-onboard","x":"Solo cruising is overwhelmingly safe — cruise ships are among the most surveilled travel environments anywhere, with CCTV in common areas, 24-hour security, controlled deck access, and crew trained in emergency response. The Cruise Vessel Security and Safety Act (US federal law since 2010) mandates camera coverage and reporting obligations. None of this makes risk zero, but the baseline is high. A few habits still make sense: Your cabin door. Use the deadbolt and privacy latch at night. Some solo cruisers add a portable door wedge — under $10, takes no space, and calming for anyone who sleeps uneasily in an unfamiliar room. Ashore — easy, safe ports. Boston, Portland, Saint John, Halifax, and tiny Eastport are all low-crime, walkable, friendly places; the usual travel sense (well-lit streets at night, an eye on your bag) is plenty. The bigger ashore risk here is weather and footing — wet leaves, cold rain, and uneven cobbles ; sensible waterproof shoes matter more than anything else. Share your itinerary before sailing. Send the day-by-day to one trusted person ashore, with your cabin number once assigned and your insurance policy number. The family handoff card in Section 6 is built for exactly that. Friendliness is not obligation. A good conversation in the Studio Lounge is not an invitation to dinner; a shared dinner is not an invitation to a port day. You set the pace, and on a hosted solo cruise declining doesn’t fracture anything — see Section 9 . If something feels off, Guest Services and the 24-hour security desk respond fast. Most solo cruisers go a lifetime without needing this; the option exists if you do."},{"t":"Section 11 — First Cruise Notes","s":"guide","a":"section-11","x":"If this is your first cruise of any kind, the first-cruise guide is the deeper read. A few foundational notes: The cabin is small. A Studio is genuinely compact; even a balcony cabin is smaller than a budget hotel room. You’re not living in it; you’re sleeping in it. The ship is your living room — and on a ship this big, that living room is enormous, which matters a lot on cold days. You can’t get lost. Every elevator lobby has a deck map, and any crew member can point you. On an 18-deck ship it takes a day to learn; 678 Ocean Place (mid-ship) is the orienting landmark. You don’t need to book everything ahead. Most days unfold with significant unplanned time. That’s by design. Tipping is built in. Beyond the daily service charge you don’t need to tip every interaction; a few dollars to a great bartender or steward at the end of the week is appreciated, not expected. Don’t try to do everything. Four ports in a week is a full itinerary; pick one real thing per port and let the rest be. A relaxed lobster lunch beats a rushed checklist. The thing nobody tells first-timers: the best moments are usually unplanned — the fog lifting off the Fundy shore, the smell of a Portland lobster shack, the busker on the Halifax boardwalk, the conversation at O’Sheehan’s at midnight. The Cruising Duck tradition is the one piece of cruise culture worth knowing in advance — bring or hide a few rubber ducks if you want a friendly, accidental social ritual. Leave room for that."},{"t":"Closing","s":"guide","a":"closing","x":"This pack is the calm read on one specific week — yours. Soli Deo Gloria. All work on this project is offered as a gift to God. The site that produced it is independent — no affiliate links, no commissions, no upsells. If it helped you, that’s the whole point. Safe sailing. Last reviewed | 2026-07-06 | How facts here are checked | Every ship spec, price, date, contact number, and currency claim in this pack is checked against a primary or authoritative source — NCL’s own published FAQ (service charge), Wikipedia and Meyer Werft/registry records for ship specs and the christening, the ship’s own In the Wake profile for its venue list, the U.S. Consulate in Halifax for the Canadian-port consular contact, Wikipedia for the Eastport / Old Sow facts, and operator pages where excursions are quoted. Sources for each claim are kept in this pack’s factcheck sidecar. If a number can’t be sourced, it isn’t asserted here. Tina’s communications about her group’s rhythm are quoted as hers. | Accessibility | This pack and the site that produced it follow WCAG 2.1 AA. The Emergency Contacts section is offline-capable via the companion app so a trusted contact ashore can keep the family handoff card available without an internet connection. See also the disability-at-sea guide . | Sources | Ship: Norwegian Breakaway ; scale via Ship Size Atlas , fleet context via ships hub . Ports: Boston , Eastport (Maine — no ITW page yet), Saint John , Halifax , Portland (Maine) . Host + agent: Tina Maulsby , Maulsby Travel Co. . Onboard venues: Savor , Taste , Garden Café , O’Sheehan’s , Ocean Blue , Cagney’s Steakhouse , Le Bistro , La Cucina , Teppanyaki , Moderno Churrascaria . Articles: stateroom-sanity-check , is-drink-package-worth-it , cruise-tipping-2026 , caribbean-cruise-trends-2026 , cruise-cabin-organization , cruise-tech-photography-guide , cruise-seasickness-what-works , cruise-embarkation-day-what-to-expect , cruise-duck-tradition . Tools: drink-calculator , cruise-budget-calculator , cruise-tipping-calculator , port-day-planner , port-tracker , ship-tracker , ship-size-atlas . Reference pages: solo cruising hub , Solo Cruising Practical Guide , In the Wake of Grief , first-cruise , countdown , packing-lists , internet-at-sea , disability-at-sea , affiliate-disclosure . Original research: ncl.com onboard-service-charge FAQ, en.wikipedia.org/wiki/Norwegian_Breakaway, en.wikipedia.org/wiki/Eastport,_Maine, the Norwegian Breakaway In the Wake profile. |"}]</script>
