<h2 id="pk-section-1-your-ship-anthem-of-the-seas">Section 1 — Your Ship: Anthem of the Seas</h2>
<h3 id="pk-a-quantum-class-ship-in-her-second-life-as-an-alaska-sailer">A Quantum-class ship in her second life as an Alaska sailer</h3>
<p><a href="/ships/rcl/anthem-of-the-seas.html">Anthem of the Seas</a> is the second of Royal Caribbean’s five <strong>Quantum-class</strong> ships, delivered by Meyer Werft at Papenburg, Germany in April 2015. Her sisters are Quantum of the Seas (2014, Asia-based), Ovation of the Seas (2016, Australia and Alaska), Spectrum of the Seas (2019, Asia-only), and Odyssey of the Seas (2021, the Quantum Ultra subclass). She launched as a year-round European ship out of Southampton, then spent seasons at Cape Liberty (Bayonne, NJ) for North American Atlantic sailings, then a 2024–25 winter in Southeast Asia. <strong>Summer 2025 was her inaugural Alaska season</strong> from Seattle’s Pier 91 — announced November 1, 2023; repositioned via a 15-night Yokohama → Seattle transpacific in spring 2025 after a March 2025 drydock at Tuas/Singapore. The 2026 sailing covered by this pack continues that Alaska program.</p>
<p>By your June 2026 sailing she’ll be 11 years old — well past any new-ship issues, with her crew rhythms long settled. Quantum-class ships were Royal’s first move into “smart-ship” territory: digital wayfinding, the Two70 venue with the Vistarama screen wall, the <strong>North Star</strong> observation pod that swings out from deck 15, <strong>RipCord by iFly</strong> (the indoor skydiving simulator — yes, actually on a cruise ship), the SeaPlex multi-purpose court, and bumper cars. Many of these features are surprising on an Alaska ship; Anthem’s design centers around indoor weather contingencies, which earns its keep in the Inside Passage.</p>
<h3 id="pk-what-makes-anthem-suit-the-alaska-itinerary">What makes Anthem suit the Alaska itinerary</h3>
<p>Alaska summer cruising means weather contingencies are the rule, not the exception. A day can include rain, hail, sun, and 70°F all before lunch. Anthem’s indoor architecture handles this in ways an open-deck Caribbean ship doesn’t:</p>
<ul>
<li><strong>Solarium</strong> — adults-only, glass-roofed pool, deck 14. Heated. Open in any weather. The room you’ll come back to most on an Alaska sailing.</li>
<li><strong>North Star</strong> observation pod (deck 15, free) — glass capsule that lifts to 300 ft above the sea, with 360° views. On a cloudy day the views are fjord-floor moss and seabirds; on a clear day, mountain ranges across the strait.</li>
<li><strong><a href="/restaurants/two70.html">Two70</a></strong> (deck 5 aft) — three-story-tall windows facing the ship’s wake, which is what makes the room feel architectural; turns into a performance venue at night with the Vistarama wraparound screens.</li>
<li><strong><a href="/restaurants/music-hall.html">Music Hall</a></strong> (deck 3) — live music almost every evening; loud enough that you can hear the crowd even on a sea day.</li>
<li><strong>Centrum</strong> (deck 4–7 atrium) — the social heart of the ship; aerial shows from the rotunda, the Captain’s parties, and a place to be when you don’t want to be in your cabin.</li>
<li><strong>The Royal Theatre</strong> (deck 4–5) — Broadway-style production shows; “We Will Rock You” was Anthem’s signature show for years and may still be running.</li>
</ul>
<p>What’s NOT on Anthem (because she’s a Quantum, not an Oasis): the Boardwalk, Central Park, the AquaTheater, the Ultimate Abyss slide. If you’re shopping based on those Royal Caribbean signatures from Symphony / Wonder / Icon, Anthem is a different ship in a different ocean.</p>
<h3 id="pk-cabin-categories-the-alaska-specific-calculus">Cabin categories — the Alaska-specific calculus</h3>
<p><strong>Before you commit, run the <a href="/stateroom-check.html">stateroom sanity check</a></strong> — give it your ship and cabin number and it tells you whether that cabin sits in a known trouble spot: under the pool deck, over the theater, by the galley or the elevator bank, far forward, behind a lifeboat, or on a connecting door. The balcony-or-interior choice matters most on Alaska sailings, where deck time is the trip.</p>
<p>The standard Royal Caribbean cabin hierarchy applies (Interior → Oceanview → Balcony → Suite). For Alaska specifically, the math leans <strong>strongly toward Balcony</strong>. Here’s why:</p>
<ul>
<li>The ship spends hours threading the Inside Passage, Stephens Passage, and Tracy/Endicott Arm. The view from the deck is the trip.</li>
<li>Balcony staterooms let you watch the scenery in pajamas with coffee at 6 AM — when much of the most magical light is happening — without committing to standing on a public deck for an hour.</li>
<li>Many of Anthem’s Interior cabins are her “Virtual Balcony” type (a real-time HD view of outside on a wall screen). The technology is good but it isn’t the same as a balcony.</li>
<li>Glacier morning specifically: a port-side or starboard-side balcony (depending on sailing direction) gives you a private viewing seat.</li>
</ul>
<p><strong>Decision rule:</strong> for an Alaska sailing on a Quantum-class ship, a balcony is a practical purchase, not a luxury one. Save here only if you’re confident you’ll spend most days off the ship or in public areas.</p>
<p>The <a href="/index.html">In the Wake</a> <a href="/stateroom-check.html">stateroom-check</a> tool lets you cross-reference your booked cabin number against deck-plan layout, noise concerns, motion considerations, and the things that don’t show in the booking diagram. Run it once your cabin number is confirmed.</p>
<p>For a feel of how big Anthem is compared to the other Royal ships you might have sailed, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> compares her side-by-side. You can also follow her live position throughout your sailing in the <a href="/tools/ship-tracker.html">Ship Logbook</a>, which is a small but real comfort if family ashore wants to know where you are.</p>
<h3 id="pk-dining">Dining</h3>
<p>Anthem follows Royal’s standard structure: included main dining rooms (the Anthem main dining room runs across decks 3–4 with dynamic dining as an option), included casual venues (<a href="/restaurants/windjammer.html">Windjammer</a> buffet, <a href="/restaurants/solarium-bistro.html">Solarium Bistro</a>, <a href="/restaurants/sorrentos.html">Sorrento’s</a> Pizza, <a href="/restaurants/cafe-promenade.html">Café Promenade</a>), and paid specialty restaurants. The specialty venues on Anthem typically include <strong><a href="/restaurants/chops.html">Chops Grille</a></strong> (steakhouse), <strong><a href="/restaurants/jamies-italian.html">Jamie’s Italian</a></strong> (when in service), <strong><a href="/restaurants/wonderland.html">Wonderland</a></strong> (theatrical), <strong><a href="/restaurants/izumi.html">Izumi</a></strong> (sushi/Japanese), and <strong><a href="/restaurants/chefs-table.html">Chef’s Table</a></strong> (~$150 small-group tasting). Specialty packages are commonly $150–250 for the week if you eat at three of them. The <strong><a href="/restaurants/bionic-bar.html">Bionic Bar</a></strong> (robot bartenders) and <strong><a href="/restaurants/schooner-bar.html">Schooner Bar</a></strong> (piano bar) are Royal staples worth visiting at least once.</p>
<p>For Alaska specifically, the <a href="/restaurants/solarium-bistro.html">Solarium Bistro</a> breakfast is underrated — quieter than Windjammer, with a glass-roof view, ideal for a leisurely morning before a port day.</p>
<p>The included Main Dining Room food at Royal Caribbean is the underrated meal of the week. The “buffet ship” headlines miss that Royal’s main dining is one of the stronger sit-down operations in the mass-market segment. You don’t need specialty dining to eat well on Anthem.</p>
<h3 id="pk-drinks">Drinks</h3>
<p>Royal’s drink package math: the Deluxe Beverage Package runs roughly $77–95/day per person on Quantum-class ships depending on dynamic pricing, plus 18% gratuity (fleet floor is ~$55 on Grandeur; ceiling ~$125 on Icon-class). <strong>At those numbers, the Deluxe pays off only if you drink more than 5–6 cocktails or wines per day.</strong> For most cruisers — particularly first-time Alaska cruisers, where port days don’t lend themselves to drinking from breakfast — pay-as-you-go runs cheaper. The <a href="/drink-calculator.html">drink-calculator</a> lets you put in your real consumption pattern and see the breakeven. The companion article <a href="/articles/is-drink-package-worth-it.html">Is the drink package worth it?</a> walks through the breakeven math with worked examples — and Alaska is one of the itineraries where the answer most often comes out “no.”</p>
<p>Buy the package only if you’ve mapped your week and the per-day numbers show it pays. Don’t buy it because of FOMO at embarkation lunch.</p>

<h3 id="pk-day-1-monday-seattle-embarkation-day">Day 1 — Monday — Seattle (embarkation day)</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/seattle/seattle-hero.webp" alt="Seattle skyline at twilight from Kerry Park" />
<figcaption aria-hidden="true">Seattle skyline at twilight from Kerry Park</figcaption>
</figure>
<p><strong>Arrival:</strong> Anthem sails from <strong>Pier 91</strong> at the Port of Seattle, on the Magnolia/Interbay waterfront — about 15 minutes from downtown by car/Uber, 20 from Sea-Tac (SEA) airport. Embark window typically 11:30 AM – 4:30 PM; ship departs ~4:00–5:00 PM.</p>
<p><strong>Pre-cruise overnight strongly recommended.</strong> Flying in same-day to a 4:30 PM all-aboard call is risky — Sea-Tac delays in summer are real, and missing a Pier 91 sailing means flying to the next port (Sitka) on your own dime. Spend Sunday night at a Seattle hotel near Pioneer Square, Belltown, or Ballard. Use your Sunday afternoon to walk Pike Place Market (a half-day is the right amount), or the Olympic Sculpture Park, or the Chihuly Garden and Glass next to the Space Needle.</p>
<p><strong>The realistic timeline (sample sailing):</strong></p>
<ul>
<li><strong>11:30 AM–1:00 PM:</strong> First-wave embarkation at Pier 91. Drop bags with porter at curb (tip $1–2/bag in cash). Proceed through security and check-in. Pier 91 has a purpose-built modern terminal; flow is generally smooth.</li>
<li><strong>1:00–2:00 PM:</strong> Cabins typically NOT ready until 1 PM. Carry-on with you to the Windjammer (deck 14) or Solarium Bistro for a low-key lunch.</li>
<li><strong>1:00 PM:</strong> Cabins open. Find your cabin. Introduce yourself to your stateroom attendant — they remember names, and the relationship makes the week.</li>
<li><strong>2:30–4:00 PM:</strong> Light exploration. Don’t try to see everything. Find your nearest elevator bank, your closest bar, and the Solarium (you’ll be there a lot).</li>
<li><strong>3:30 PM:</strong> Mandatory muster drill — now done via the Royal Caribbean app and a brief in-person check-in at your assigned station (~10 minutes total).</li>
<li><strong>4:30 PM:</strong> Sailaway. Best viewing from deck 14 forward, the Solarium, or your balcony if you have one. The Elliott Bay departure past West Seattle puts Mount Rainier on your starboard quarter on a clear day.</li>
<li><strong>6:00 PM or 8:30 PM:</strong> Dinner. Main dining room or your specialty reservation.</li>
</ul>
<p><strong>What to pack in your carry-on for Day 1:</strong> a fleece or light jacket (Pier 91 evenings can be 55°F even in late June), all medications, change of clothes, passport or birth-cert + state ID, phone charger, refillable water bottle, any embarkation paperwork. Your checked bags may not arrive until 7–9 PM.</p>
<p><strong>Money/card:</strong> Your SeaPass card is your ID, room key, and onboard charge. You’ll receive it at check-in. Keep it on a lanyard.</p>
<p><strong>The Day 1 mistake to avoid:</strong> Don’t sign up for the Deluxe Drink Package mid-sail unless you’ve already done the <a href="/drink-calculator.html">drink-calculator</a> math. Decide before you board. Mid-sail upgrades are pricier and give you fewer days of usage.</p>
<h3 id="pk-day-2-tuesday-cruising-the-inside-passage">Day 2 — Tuesday — Cruising the Inside Passage</h3>
<p>This is the day Alaska reveals itself.</p>
<p>The Inside Passage is the protected sea corridor between Vancouver Island, the British Columbia coast, and the Alaska panhandle. The ship spends the day winding through it. On a clear day you can see <strong>bald eagles</strong>, <strong>humpback whales</strong>, <strong>orcas</strong>, <strong>Dall’s porpoises</strong>, <strong>sea otters</strong>, and the occasional <strong>brown bear</strong> along distant shores. The Captain or naturalist often comes on the PA to announce wildlife sightings — keep a casual ear out.</p>
<p><strong>Morning:</strong> Coffee. The included coffee at Café Promenade (deck 5) is fine; the paid specialty coffee at Café 270 / Two70 (when running) or in-cabin via room service is better. The Solarium Bistro does a quiet buffet breakfast.</p>
<p><strong>Mid-morning to lunch — pick ONE:</strong></p>
<ul>
<li><strong>The North Star ride.</strong> Free; reservations open in the Cruise Planner before sailing or at Guest Services on Day 1. Try for late morning when sun (if any) is over the channel rather than behind it.</li>
<li><strong>A spa thermal-suite day pass.</strong> Sea-day mornings are when introductory rates appear. The thermal suite (heated stone loungers, sauna, steam) is a fair-value buy for an Alaska body that wants to thaw.</li>
<li><strong>The bridge tour or behind-the-scenes ship tour</strong> if the Cruise Planner is offering it for this sailing.</li>
<li><strong>Reading on your balcony with binoculars.</strong> This is not a joke. The most underrated activity of the week.</li>
</ul>
<p><strong>Afternoon:</strong></p>
<ul>
<li>The Solarium pool deck (heated, glass-roofed, adults-only). Alaska’s most-used Anthem amenity.</li>
<li>A theater show or trivia (the Cruise Compass / Royal Caribbean app shows the day’s schedule).</li>
<li>Two70 in afternoon mode — wraparound windows, comfortable seating, watching the channel.</li>
</ul>
<p><strong>Evening:</strong></p>
<ul>
<li>Dinner at your assigned time. The Royal main dining production is good; eat there at least 4 of 7 nights.</li>
<li>The headliner show in the Royal Theatre. Anthem’s flagship production is typically a Broadway-quality musical. Reserve via the app.</li>
</ul>
<p><strong>If this is your first cruise:</strong> Sea days early in the week can feel disorienting if you’re used to a scheduled life. Royal’s daily app/Cruise Compass program lays out the next day’s events; pick 2–3 things and let the rest go. You don’t need to do everything.</p>
<h3 id="pk-day-3-wednesday-sitka-alaska">Day 3 — Wednesday — Sitka, Alaska</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/sitka/sitka-hero.webp" alt="Sitka harbor in a Library of Congress archive photograph — the town’s Russian-Tlingit heritage shows in any era" />
<figcaption aria-hidden="true">Sitka harbor in a Library of Congress archive photograph — the town’s Russian-Tlingit heritage shows in any era</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 7:00 AM. Depart 3:00 PM. Anthem docks at the <strong>Sitka Sound Cruise Terminal</strong> at Halibut Point (~5 miles north of downtown) — a deep-water cruise dock expanded in 2021 that handles up to two large ships at once. <strong>A free shuttle runs continuously between the terminal and downtown</strong> (330 Harbor Drive) during port hours — a 10–15 minute ride, reservation-managed on busy days at reservation.sitkadock.com, with the last shuttle leaving downtown 30 minutes before all-aboard. Plan the shuttle ride into your timing.</p>
<p><strong>Sitka — the most historically dense port of the week.</strong> Capital of Russian America from 1808 until the 1867 sale of Alaska to the United States; home of the first Russian Orthodox cathedral in North America (St. Michael’s, rebuilt after a 1966 fire); sitting inside Tlingit ancestral land that shaped its first centuries before Russian contact. Most Alaska itineraries skip Sitka in favor of Ketchikan; if your itinerary includes it, take advantage. The walkable downtown is small (under a mile end-to-end) and the <a href="https://www.nps.gov/sitk/index.htm">Sitka National Historical Park</a> totem trail is among the most affecting easy walks in southeast Alaska.</p>
<p><strong>Free, walkable once the shuttle drops you downtown:</strong></p>
<ul>
<li><strong>St. Michael’s Cathedral</strong> — the rebuilt Russian Orthodox cathedral; the first Russian Orthodox cathedral on the North American continent (consecrated 1848), seat of the Russian Orthodox Diocese of North America from 1840 until the diocese moved south in 1872. Small donation suggested for entry.</li>
<li><strong>Sitka National Historical Park</strong> — totem-pole trail through old-growth forest, 30-minute walk from downtown. Free entry. The Tlingit and Russian-era exhibits at the visitor center are quietly excellent.</li>
<li><strong>Sheldon Jackson Museum</strong> — Alaska’s oldest museum, with one of the best ethnographic collections of Alaska Native material culture in the state.</li>
<li><strong>Sitka Historical Museum</strong> at Harrigan Centennial Hall.</li>
</ul>
<p><strong>Paid (extra cost, decide ahead):</strong></p>
<ul>
<li><strong>Sea otter and wildlife boat tour</strong> (~$120–180/person) — Sitka has the densest sea-otter population in southeast Alaska. Worth it if wildlife is your trip priority.</li>
<li><strong>Fortress of the Bear</strong> sanctuary tour (~$50–80) — rescued bears in semi-natural habitat. Ethically run; not a roadside zoo.</li>
<li><strong>Russian Bishop’s House tour</strong> (NPS, ~$5) — for history readers.</li>
<li><strong>Independent transit:</strong> the local Visitor Transit Bus runs a $9 day pass between downtown, the park, Fortress of the Bear, and the cruise dock area. Cheaper than ship excursions for most travelers.</li>
</ul>
<p><strong>For first-timers:</strong> Sitka is small. You can see the cathedral, walk the totem trail, eat a salmon lunch, and be back to the shuttle with time to spare. Don’t over-plan; Alaska ports aren’t designed for the “see five things” Caribbean rhythm.</p>
<p><strong>Sample day shapes — pick one.</strong> Sitka’s small footprint makes these all walkable from a single shuttle drop-off.</p>
<ul>
<li><strong>2 hours · low-energy walk.</strong> Shuttle downtown → St. Michael’s Cathedral → unhurried walk along Lincoln Street → coffee or salmon bowl → shuttle back. Light, dry-feet day.</li>
<li><strong>4 hours · the standard Sitka.</strong> Shuttle downtown → St. Michael’s → walk to Sitka National Historical Park (30 min) → totem trail loop → return for lunch and the Sheldon Jackson Museum → shuttle back. This is the day most cruisers do; it’s the right shape if you want the totem trail’s slow weight.</li>
<li><strong>6 hours · the full visit.</strong> Buy the Visitor Transit Bus $9 day pass instead of the cruise-terminal shuttle. Cathedral + NHP + Sheldon Jackson + Fortress of the Bear sanctuary (~30 min by transit bus, ~$50–80 entry). Full day; pack a thermal layer because the Fortress is exposed.</li>
</ul>
<p><strong>Costs at a glance (per person):</strong> terminal-to-downtown shuttle free (reservation-managed) · Visitor Transit Bus $9 day pass · St. Michael’s small donation · Sitka NHP free · Sheldon Jackson Museum modest entry · Sea otter and wildlife boat tour $120–180 · Fortress of the Bear $50–80 · Russian Bishop’s House (NPS) ~$5. Bring $40–60 USD cash for transit and small purchases.</p>
<p>For the lived day-of-trip read from cruisers who’ve actually walked these paths in real Sitka weather, the <a href="/ports/sitka.html">Sitka port page on this site</a> and its <a href="/ports/sitka.html#logbook">logbook entries</a> are where firsthand accounts collect. The <a href="/tools/port-day-planner.html">Port Day Planner</a> builds an hour-by-hour timeline from your priorities; the <a href="/tools/port-tracker.html">Port Logbook</a> gives you a place to record what you actually did at the end of the day.</p>
<p><strong>For accessibility:</strong> The downtown is mostly flat with sidewalks; the totem trail is paved and accessible-graded but does have grade changes. Anthem docks at the cruise terminal (no tender step-up); the terminal-to-downtown shuttle is accessible — confirm wheelchair-lift availability at the shuttle ticket booth.</p>
<p><strong>Pack for Sitka:</strong> rain jacket (it rains in Sitka 220+ days per year — your day might be one), waterproof or treated walking shoes, fleece layer, light gloves if mornings are cold, $40–60 USD cash for transit and tips. <strong>Skip the umbrella</strong> — Sitka’s coastal wind turns them inside out within a block; a hooded shell does the job better.</p>
<h3 id="pk-day-4-thursday-skagway-alaska">Day 4 — Thursday — Skagway, Alaska</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/skagway/skagway-hero.webp" alt="Skagway in a 1915 panoramic photograph — the gold-rush town footprint is largely unchanged today" />
<figcaption aria-hidden="true">Skagway in a 1915 panoramic photograph — the gold-rush town footprint is largely unchanged today</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 7:00 AM. Depart 8:30 PM (this is a long port day — built for the White Pass railway turnaround). Skagway’s cruise dock is a 5-minute walk from downtown.</p>
<p><strong>Skagway exists because of the 1898 Klondike Gold Rush.</strong> It was the staging town for prospectors heading over the White Pass into the Yukon. The town today is still architecturally a gold-rush town — wooden boardwalks, false-front buildings, the <a href="https://www.nps.gov/klgo/index.htm">Klondike Gold Rush National Historical Park</a> preserving much of the original waterfront. Population ~1,200 in winter, swells with cruise tourism in summer. It’s small, walkable, and easy to read in a day.</p>
<p><strong>Free, walkable from the cruise dock:</strong></p>
<ul>
<li><strong>Klondike Gold Rush NHP visitor center</strong> — free orientation; ranger-led walking tours are first-come most days. The film inside is worth the 30 minutes.</li>
<li><strong>Broadway (the main street)</strong> — wooden boardwalks, some shops are over-touristed jewelry stores, others are real (Skagway News Depot for a coffee, Alaska Geographic bookshop, the Mascot Saloon Museum).</li>
<li><strong>Gold Rush Cemetery</strong> — 1.5-mile walk uphill out of town. “Soapy” Smith and Frank Reid (the rival who killed him) are both buried here. Real prospector graves alongside.</li>
<li><strong>Reid Falls</strong> — a short hike past the cemetery. Free.</li>
</ul>
<p><strong>Paid (extra cost, decide ahead):</strong></p>
<ul>
<li><strong>White Pass &amp; Yukon Route Railway</strong> — narrow-gauge railway over White Pass to Fraser, BC and back. <strong>Direct booking at wpyr.com: Summit Excursion $155/adult with 24+ hour advance purchase, $165/adult day-of (~3 hours).</strong> Longer Fraser Meadows / Bennett Scenic Journey trips run $195–250. Cruise-line ship-sold tickets typically $225–249 with markup — the upside is the railway holds the train for late ship arrivals if cruise-line-booked. <strong>This is the one Skagway excursion most cruisers do, and the $70 markup on the ship-sold ticket is buying the late-return insurance, not a better seat.</strong> Book a window seat on the right side going up. Steel cantilever bridges, the gorge at Dead Horse Gulch, and short stretches of the original Chilkoot Trail visible from the cars.</li>
<li><strong>Helicopter glacier landing</strong> (~$500–700) — most expensive excursion in Skagway; goes to a remote icefield, walks on glacier ice. Once-in-a-lifetime if budget allows. The local operator is <strong>TEMSCO</strong> (temscoair.com); ship-sold and direct-booked tickets both fly with them.</li>
<li><strong>Gold-rush themed tours, dog sled summer camps, etc.</strong> — variable quality. The free NPS-led walking tour is the better history primer.</li>
</ul>
<p><strong>For first-timers:</strong> if you do nothing else paid in Skagway, consider the White Pass railway. The history of the gold rush isn’t optional context — it’s the whole reason this town exists, and the railway is how you feel that history.</p>
<p><strong>Sample day shapes — pick one.</strong></p>
<ul>
<li><strong>3 hours · the walking day.</strong> Off the ship → NPS visitor center for the film and the free ranger walk → Broadway boardwalks → cemetery hike or coffee at Skagway News Depot → back to the ship by lunch. No tickets, no logistics, just the town on foot. The strongest budget day on this itinerary.</li>
<li><strong>4½ hours · the headline ride.</strong> Off the ship → walk to the railway depot → <strong>White Pass Summit Excursion</strong> ($155 direct / $225 ship-sold) → back to dock with the early afternoon open. The pack’s strongest single recommendation on the cost-paid-vs-experience curve.</li>
<li><strong>All-day · railway plus history.</strong> White Pass Summit Excursion (morning) → light lunch on Broadway → NPS visitor center and ranger walk in the afternoon. You’ll be tired by the 8:30 PM departure but Skagway will be in your bones.</li>
<li><strong>Splurge day · the helicopter.</strong> Helicopter glacier landing with <strong>TEMSCO</strong> (~$500–700) → afternoon recovery walk through downtown. Once-in-a-lifetime category; budget call.</li>
</ul>
<p><strong>Costs at a glance (per person):</strong> White Pass Summit Excursion direct via wpyr.com <strong>$155</strong> advance / <strong>$165</strong> day-of · ship-sold White Pass <strong>$225–249</strong> (the $70 markup buys late-return insurance, not a better seat) · Longer Fraser Meadows / Bennett Scenic Journey trips <strong>$195–250</strong> · Helicopter glacier landing <strong>$500–700</strong> · NPS visitor center <strong>free</strong> · NPS ranger walking tour <strong>free</strong> · Cemetery &amp; Reid Falls hike <strong>free</strong>. Bring $80–120 USD cash for the day’s small purchases if independent.</p>
<p><strong>For accessibility:</strong> Downtown is mostly flat with sidewalks but the wooden boardwalks have lips. Most train cars on White Pass are step-up; advance accommodation is possible but requires booking the specific railway directly. The NPS visitor center is fully accessible.</p>
<p><strong>Pack for Skagway:</strong> layers (rare hot day in late June can hit 75°F; rare cold day can stay 50°F), sturdy walking shoes, raincoat, small daypack for water and a snack, $80–120 cash USD for the day if doing independent activities.</p>
<p>For firsthand cruiser accounts of the White Pass railway view and the Skagway boardwalk pace, the <a href="/ports/skagway.html">Skagway port page</a> and its <a href="/ports/skagway.html#logbook">logbook entries</a> are the lived-day-of-trip read.</p>
<h3 id="pk-day-5-pm-friday-juneau-alaska-afternoon-arrival">Day 5 (PM) — Friday — Juneau, Alaska (afternoon arrival)</h3>
<p>The ship exits Endicott Arm around midday and transits north up Stephens Passage to Juneau. Typical arrival is mid-afternoon (~3:00–4:00 PM) for a partial port day; departure 10:00–11:00 PM. <strong>Some Adventure sailings split Endicott Arm and Juneau into separate full days (Day 5 Endicott, Day 6 Juneau) with a sea day later in the week</strong> — verify your specific arrival and departure times in the Royal Caribbean app. The Juneau content below applies either way; only the timing changes.</p>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/juneau/juneau-hero.webp" alt="Juneau seen from Mount Roberts, with cruise ships docked along the waterfront" />
<figcaption aria-hidden="true">Juneau seen from Mount Roberts, with cruise ships docked along the waterfront</figcaption>
</figure>
<p><strong>Arrival:</strong> Mid-afternoon on the combined-day sailing (~3:00–4:00 PM after Endicott Arm transit), or 10:00 AM on the split-day variant. Depart typically 9:00–11:00 PM either way. Anthem docks at the <strong>AJ Dock</strong> or <strong>Cruise Ship Terminal</strong>, both within a short walk of downtown. <strong>Verify your exact arrival in the Royal Caribbean app.</strong></p>
<p><strong>Juneau — the only U.S. state capital you can’t reach by road.</strong> Reachable only by ship, plane, or float plane. Population ~32,000 year-round; ~17,000 daily cruise passengers in peak summer. Downtown is built into a near-vertical mountainside; the Mount Roberts Tramway (separate from the ship’s excursions) is the standard up-the-mountain ride.</p>
<p><strong>Free, walkable from the cruise dock:</strong></p>
<ul>
<li><strong>Downtown Juneau</strong> — South Franklin Street’s bars, the Red Dog Saloon (touristy but historic), state-museum-quality Sealaska Heritage Institute (free; among the best Alaska Native cultural exhibits in the state), Alaska State Capitol (free 30-minute tours weekdays), the Governor’s Mansion (exterior only).</li>
<li><strong>Last Chance Mining Museum</strong> — short walk uphill, free, gold-mining history.</li>
</ul>
<p><strong>Paid (extra cost, decide ahead):</strong></p>
<ul>
<li><strong>Mendenhall Glacier visit</strong> — three transit options at very different price points: <strong>(1) M&amp;M Tours’ Glacier Express</strong> ($79 adult — a 3-hour tour including round-trip transport and visitor-center admission; the successor to the old “Blue Bus” shuttle, which no longer exists as a shuttle-only product — sells out weeks ahead in peak season). <strong>(2) Capital Transit city bus</strong> (route 3 + route 8 combo, ~$4 each way; slowest but cheapest — locals’ route). <strong>(3) Ship excursion</strong> (~$80–130 depending on what’s bundled with the visit). The glacier is 13 miles from downtown; you can’t walk to it. The visitor center, Nugget Falls hike, and shore views are the standard reward; 1.5–2 hours is enough.</li>
<li><strong>Mount Roberts Tramway</strong> ($65 all-day pass, independent at the dock) — 1,800-foot vertical tram up Mount Roberts. Easy hiking trails at the top. Eagle viewing common.</li>
<li><strong>Whale watching</strong> (~$130–180/person) — humpback whale season peaks June–September; Auke Bay departures. Among the highest-quality wildlife excursions on this itinerary; success rate is very high. <strong>Dress for it like glacier viewing, not like a port walk</strong> — a small boat at 20 knots in 55°F air feels like 35°F at the rail, salt spray is constant, and breach-splash carries 20 feet. Full layers, waterproof shell, hat that won’t blow off, hand warmers, non-slip shoes.</li>
<li><strong>Helicopter to Juneau Icefield + glacier landing</strong> ($600–900) — if budget is no object, this is the “Alaska that’s hard to imagine” excursion.</li>
<li><strong>Dog-sledding on glacier</strong> (~$650+) — heli + dog-sled combination.</li>
</ul>
<p><strong>For first-timers:</strong> if you have to pick one paid Juneau experience, it’s either <strong>Mendenhall Glacier (independent bus)</strong> for the budget-conscious or <strong>whale watching</strong> for the wildlife-focused. A combined Mendenhall + whale-watching package via Harv &amp; Marv’s or similar local operators (~$220) is a strong day.</p>
<p><strong>Sample day shapes — pick one.</strong> Juneau’s afternoon-arrival timing on this sailing compresses the day; the 4-hour shape is the realistic standard.</p>
<ul>
<li><strong>3 hours · downtown-only.</strong> Off the ship → Sealaska Heritage Institute (free) → State Capitol tour (free, weekdays) → coffee → back to ship. The most underrated low-cost Juneau day on this itinerary.</li>
<li><strong>4 hours · Mendenhall on the city bus.</strong> Off the ship → Capital Transit bus combo to the glacier (slow but ~$8 round-trip) → visitor center + Nugget Falls hike → bus back to downtown. The cheapest way to see the glacier.</li>
<li><strong>4½ hours · Mendenhall on M&amp;M Tours’ Glacier Express.</strong> Off the ship → M&amp;M Tours Glacier Express ($79, incl. visitor-center admission) → visitor center + Nugget Falls → afternoon return. Faster than transit; books up weeks ahead.</li>
<li><strong>5 hours · whale watching.</strong> Off the ship → Harv &amp; Marv’s or Allen Marine to Auke Bay → ~3-hour humpback search → return downtown for an hour of walking. The pack’s strongest wildlife recommendation if the budget allows.</li>
<li><strong>All-day · the Mendenhall + whale combination.</strong> Combined operator package (~$220) hits both signature Juneau experiences in a single tightly-timed day. The schedule is the friction; the day is the reward.</li>
</ul>
<p><strong>Costs at a glance (per person):</strong> Capital Transit city bus to Mendenhall <strong>~$4 each way</strong> · M&amp;M Tours Glacier Express <strong>$79</strong> (3-hr tour incl. visitor-center admission) · Ship-sold Mendenhall excursion <strong>$80–130</strong> · Mount Roberts Tramway <strong>$65 all-day</strong> independent at dock · Whale watching <strong>$130–180</strong> · Mendenhall + whale combo <strong>~$220</strong> · Helicopter to Juneau Icefield <strong>$600–900</strong> · Helicopter + dog sled <strong>$650+</strong>. Bring $60–100 USD cash plus whatever the excursion line item is.</p>
<p><strong>For accessibility:</strong> Downtown sidewalks are good but the city is hilly — the path from cruise dock to State Capitol is uphill. The M&amp;M Tours Glacier Express to Mendenhall is wheelchair-accessible (verify in advance). The Mount Roberts Tramway car is accessible. Whale-watching boats vary by operator — verify accessibility in advance.</p>
<p><strong>Pack for Juneau:</strong> layers (Juneau is wetter than Sitka or Skagway — count on rain), waterproof shell, sturdy walking shoes, daypack, $60–100 cash USD, plus whatever excursion-specific gear (binoculars for whale watching, hiking shoes for Mendenhall trails).</p>
<p>For lived-day accounts of the Mendenhall walk in actual Juneau weather and the Mount Roberts views, see the <a href="/ports/juneau.html">Juneau port page</a> and its <a href="/ports/juneau.html#logbook">logbook entries</a>.</p>
<h3 id="pk-day-7-sunday-victoria-british-columbia">Day 7 — Sunday — Victoria, British Columbia</h3>
<p><strong>Arrival:</strong> Approximately 6:00 PM. Depart 11:59 PM. The ship docks at the <strong>Ogden Point</strong> breakwater, ~3 km from downtown. Free shuttle buses or a $10 round-trip cab/rideshare run between Ogden Point and the Inner Harbour.</p>
<p><strong>Why Victoria is on every Seattle-Alaska itinerary.</strong> The <strong>Passenger Vessel Services Act of 1886</strong> prohibits foreign-flag vessels (which most large cruise ships are — Anthem of the Seas is Bahamian-flagged) from carrying passengers between two U.S. ports without a stop at a foreign port in between. A Seattle round-trip with stops in Sitka, Skagway, and Juneau is otherwise three U.S. ports back-to-back-to-back. Victoria is the nearest foreign port to Seattle, and the late-evening Sunday stop is the cheapest, shortest way for the cruise line to satisfy the requirement before returning to Seattle. Every Seattle-Alaska sailing across every line you’d be choosing between makes this call for the same reason. The wind-down framing fits the experience; the short evening window and the limited shore-time are the regulatory reason — usually unsaid.</p>
<p><strong>Victoria — the wind-down stop, not the headline.</strong> Provincial capital of British Columbia: Edwardian architecture, the Empress Hotel afternoon tea (~$95 CAD/person, reservations months ahead), the Royal BC Museum, and <strong>Butchart Gardens</strong> 30 minutes outside town. The evening port-call duration limits realistic options. Victoria isn’t trying to compete with Alaska; it’s the trip’s deceleration — and, structurally, the trip’s required foreign port.</p>
<p><strong>Free, walkable from a downtown drop-off:</strong></p>
<ul>
<li><strong>Inner Harbour</strong> — the iconic Parliament Buildings (lit up at night), the Empress Hotel exterior, harbor walking path, totem poles at Thunderbird Park.</li>
<li><strong>Beacon Hill Park</strong> — 30-minute walk from harbor, Victoria’s Central Park equivalent.</li>
<li><strong>Bastion Square / Old Town</strong> — walkable, restaurants, evening atmosphere.</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>Butchart Gardens</strong> ($35 entry + transport ~$60 total) — world-famous gardens. Best in summer. Evening lighting is theatrical; the gardens stay open until 10:00 PM in summer. Requires getting out and back in a tight window — confirm sailing time before committing.</li>
<li><strong>Royal BC Museum</strong> ($30) — excellent provincial natural-history and First Nations collections. Closes 5–6 PM, so this works only if you arrive earlier than 6 PM (atypical for this itinerary).</li>
<li><strong>High tea at Empress Hotel</strong> (~$95 CAD) — book months ahead; book the earlier seating to make sailaway.</li>
<li><strong>Independent walking food tour</strong> (Hop on Hop off bus, etc.) — ~$45 for a 90-minute orientation if you have the time.</li>
</ul>
<p><strong>If this is your first Victoria stop:</strong> treat it as the trip’s gentle decompression. Don’t over-plan it. A walk through Inner Harbour, a real Canadian dinner at a non-tourist-trap pub, a short stroll back, and you’re done. Save Butchart Gardens for a longer Victoria-specific trip.</p>
<p><strong>Sample evening shapes — the late arrival picks for you.</strong> Anthem docks Victoria at ~6 PM with an 11:59 PM departure; you get roughly five hours dockside. That’s enough for one substantial thing or two light ones.</p>
<ul>
<li><strong>2½ hours · the harbor walk.</strong> Free shuttle or $10 cab to Inner Harbour → walking loop past the Parliament Buildings (lit up after dark in late June) → dinner at a downtown pub → cab back. The lowest-friction Victoria.</li>
<li><strong>3½ hours · Butchart Gardens at twilight.</strong> Pre-booked Butchart shuttle from Ogden Point → garden entry (open until 10 PM in summer; evening lighting is the move) → return shuttle. The single decisive thing to do in Victoria if it’s your only visit. Confirm your sailing time before committing; the window is tight.</li>
<li><strong>3 hours · Empress tea at the early seating.</strong> Reserve months ahead → afternoon tea in the historic Tea Lobby → harbor walk → back. The most photographed Victoria evening on the itinerary.</li>
<li><strong>2 hours · the food crawl.</strong> Cab to Bastion Square / Old Town → two small plates at two different walking-distance restaurants → back. The pack’s recommendation if dinner is your priority.</li>
</ul>
<p><strong>Costs at a glance (per person):</strong> Inner Harbour shuttle from Ogden Point typically <strong>free</strong> (cruise line) or <strong>~$10</strong> r/t taxi · Butchart Gardens <strong>$35 entry + ~$25 round-trip shuttle = ~$60</strong> all-in · Royal BC Museum <strong>$30</strong> (closes 5–6 PM, so this works only on the rare earlier-arrival sailing) · Empress Hotel high tea <strong>~$95 CAD</strong> (book months ahead) · Hop-on Hop-off bus orientation <strong>~$45</strong> for 90 minutes. Canadian dollars are local but USD and cards are universally accepted; you don’t need cash for a five-hour stop unless you prefer it.</p>
<p><strong>For accessibility:</strong> Inner Harbour is fully accessible (paved, level). The Ogden Point breakwater shuttle is accessible. Butchart Gardens is mostly accessible with some grade changes; verify with the gardens in advance if mobility is a concern.</p>
<p><strong>Pack for Victoria:</strong> dress slightly nicer than your Alaska-day uniform if you’re doing dinner downtown — Victoria has a quieter, more restrained vibe than the Alaska ports. A light jacket is plenty in late June.</p>
<p>For lived accounts of evening Victoria — the Parliament lighting, the Butchart-on-a-tight-window dilemma — see the <a href="/ports/victoria-bc.html">Victoria BC port page</a> and its logbook entries.</p>
<h3 id="pk-day-8-monday-seattle-debarkation">Day 8 — Monday — Seattle (debarkation)</h3>
<p><strong>The realistic timeline:</strong></p>
<ul>
<li><strong>6:00–8:00 AM:</strong> Breakfast available at Windjammer and main dining room. Eat now if your bag is in the hall already.</li>
<li><strong>6:30 AM:</strong> Bags must be in the hall the night before (color-coded tags determine debarkation order).</li>
<li><strong>8:00–10:00 AM:</strong> Walk-off in waves by tag color. <strong>Self-walk-off</strong> (you carry all bags off; first off the ship, around 7:00–7:30 AM) is the fastest if you have a flight to catch.</li>
<li><strong>10:00 AM (latest):</strong> All passengers off the ship.</li>
</ul>
<p><strong>If you’re staying in Seattle a night or two:</strong></p>
<ul>
<li>Uber/Lyft from Pier 91 to Sea-Tac (SEA): ~$50–75, 25–35 minutes (price corrected — earlier $30–45 estimate was low; Pier 91 is in Magnolia and surge-prices on debark Saturdays)</li>
<li>Light rail from downtown: $3.50 to SEA, ~40 minutes — but Pier 91 is not walking-distance from any Link station; you’d need a taxi or shuttle to Westlake or Pioneer Square first, which negates the savings</li>
<li>Hotel options at Pioneer Square, Belltown, or near Pike Place keep you walking-distance from the city’s better dinners</li>
<li>Walk Pike Place Market in the morning (it’s at its quietest before 9 AM)</li>
</ul>
<p><strong>Port Valet — use it.</strong> The Port of Seattle’s free Port Valet service transfers your checked bag from the ship directly to your final-destination airline check-in. You walk off the ship with only your carry-on; your bag meets you in baggage claim at home. Available for most major airlines on most departure days; sign-up sheet is distributed onboard mid-cruise (typically Day 4 or 5 — watch the <em>Cruise Compass</em>). Free. The piece of Seattle post-cruise logistics that saves the most luggage friction.</p>
<p><strong>Tipping at the end of the cruise.</strong> Royal’s auto-gratuity is added to your shipboard account daily — <strong>$18.50/day per person in standard staterooms; $21.00/day per person in suites</strong> (current rates effective November 2024). For the total-fare picture including auto-grats plus typical cash tips, the <a href="/tools/cruise-tipping-calculator.html">cruise-tipping-calculator</a> gives a calibrated read. For the broader context of why cruise gratuities work the way they do across the major lines in 2026, <a href="/articles/cruise-tipping-2026.html">Cruise Tipping 2026</a> is the longer read. Additional cash tips for outstanding service are appreciated:</p>
<ul>
<li>Stateroom attendant who went above and beyond: $20–40 cash in an envelope, end of cruise</li>
<li>Dining-room waiter and assistant for excellent service: $20–30 cash each</li>
<li>Bar staff or barista you saw repeatedly: $10–20</li>
</ul>
<p><strong>Killing time before an evening flight.</strong> Pier 91 has a Crew Center bag-storage service: $6/bag/day, pickup deadline 3 PM. Walk-on storage during disembarkation hours; bag tag matters. If you’d rather hand the bag off to your airline via Port Valet (above), do that.</p>
<p>With four to six hours in Seattle, low-effort options:</p>
<ul>
<li><strong>Pike Place Market</strong> (15-min Uber from Pier 91): the most-recommended-because-it-works walk. Coffee at the original Starbucks line is a tourist tax; the Crumpet Shop and Beecher’s are better food. Quietest before 9 AM, busy from 10.</li>
<li><strong>Seattle Center / Space Needle</strong> (10-min Uber from Pier 91): the Space Needle observation deck ($35) is a 45-minute experience; the Chihuly Garden next door ($35) is photogenic if you’ve never seen Chihuly glass in scale.</li>
<li><strong>Olympic Sculpture Park</strong> (waterfront walk from Pier 91 in good weather, free): a 30-minute outdoor loop overlooking Elliott Bay.</li>
<li><strong>Ballard Locks</strong> (15-min Uber): boats locking through, salmon ladder in season, quiet vs. downtown.</li>
<li><strong>Discovery Park</strong> (10-min Uber, free): if you want the Pacific Northwest landscape on the way out — Magnolia Bluffs, beach, lighthouse loop. Bring real shoes.</li>
</ul>
<p><strong>SEA without an Uber.</strong> From downtown Seattle (not Pier 91 directly), the <strong>Link light rail</strong> is workable with luggage: $3.50, 40 min, no transfer if you board at Westlake or University Street. The catch is getting to a Link station from Pier 91 with luggage — a $15–20 short taxi to Westlake makes the math work if you’d rather not pay full Uber to the airport. Door-to-door from Pier 91, <strong>Uber/Lyft is the call: $50–75, 30 minutes.</strong> Shared shuttles (Quick Shuttle, Capital Aeroporter) run from Pier 91 on cruise debark days, $20–30/person, but routes are slow on Saturdays.</p>
<p><strong>Airport-arrival timing.</strong> For a domestic flight after 5 PM, leave Pier 91 by 2 PM. For an international flight after 7 PM, leave by 3 PM. SEA TSA lines run 30–60 min during Saturday afternoon cruise debark; SEA is a sprawling airport and your gate could be a 15-min walk from security.</p>

, it points to that logbook entry rather than impersonating it. If a number, date, or price can’t be sourced, it isn’t asserted here. Includes an offline-capable Emergency Contacts section — a fillable family handoff card, cruise-line and embassy numbers tailored to this itinerary, available offline after first load via In the Wake ’s PWA. Designed to share with one trusted person ashore before sailing. This pack is written for first-time Alaska cruisers. If this is also your first cruise, the first-cruise guide is the right read alongside this pack. If you’ve sailed Caribbean before and are wondering whether Alaska is “more of the same” — it isn’t. A different climate, a different rhythm, a different reason to go on deck."},{"t":"At a Glance","s":"guide","a":"at-a-glance","x":"Ship Anthem of the Seas (second of five Quantum-class ships; sisters: Quantum 2014, Ovation 2016, Spectrum 2019, Odyssey 2021) Cruise line Royal Caribbean Class Quantum Specifications 168,666 GT · 1,138 ft / 347 m · 16 decks (14 passenger-accessible) · ~4,180 double occupancy / ~4,905 max guests · ~1,300 crew Year built 2015 (Meyer Werft, Papenburg, Germany); Nassau, Bahamas registry Maiden voyage April 22, 2015 Christening April 20, 2015 in Southampton, England Godmother Emma Wilby — a 27-year-old British travel agent (Thomson) from Sunderland, military wife, sings in the Military Wives Choir at Kinloss, Scotland. Chosen by Royal Caribbean from a search specifically for a travel agent who could sing — a trade-channel selection rather than a celebrity pick (a quietly distinctive choice in cruise-line christening history). Departure port Pier 91, Port of Seattle , Washington Itinerary length 7 nights / 8 days Itinerary type Alaska round-trip (“Seattle Closed Loop”) Sample sailing Mon June 29 – Mon July 6, 2026 (verify your specific date) Audience First-time Alaska cruisers from any background Avg starting price ~$1,609 per person (interior, double occupancy, taxes & fees included; verify current rates) Currency aboard US Dollar"},{"t":"Ports of call","s":"guide","a":"ports-of-call","x":"A representative sequence. The exact day-by-day order varies by sailing — confirm yours in the Royal Caribbean Cruise Planner once your booking is final: Seattle, Washington — embark Mon afternoon · see /ports/seattle.html Cruising the Inside Passage — Tue (sea day) Sitka , Alaska — Wed Skagway , Alaska — Thu Endicott Arm & Dawes Glacier + Juneau — Fri (Endicott Arm scenic cruising AM; ship reaches Juneau by afternoon for a partial port day) Cruising south toward Victoria — Sat (sea day) Victoria , British Columbia — Sun (typically late afternoon / evening; required foreign-port stop under the Passenger Vessel Services Act) Seattle, Washington — disembark Mon morning Verify your specific sailing’s day order in the Royal Caribbean app. Some Anthem Alaska Adventure sailings split Endicott Arm (Fri) and Juneau (Sat) into two days with a sea day later in the week; other sailings combine them on Day 5 as shown above. Your booking confirmation is the authoritative reference. The pack covers both ports either way."},{"t":"Section 1 — Your Ship: Anthem of the Seas","s":"ship","a":"pk-section-1-your-ship-anthem-of-the-seas","x":""},{"t":"A Quantum-class ship in her second life as an Alaska sailer","s":"ship","a":"pk-a-quantum-class-ship-in-her-second-life-as-an-alaska-sailer","x":"Anthem of the Seas is the second of Royal Caribbean’s five Quantum-class ships, delivered by Meyer Werft at Papenburg, Germany in April 2015. Her sisters are Quantum of the Seas (2014, Asia-based), Ovation of the Seas (2016, Australia and Alaska), Spectrum of the Seas (2019, Asia-only), and Odyssey of the Seas (2021, the Quantum Ultra subclass). She launched as a year-round European ship out of Southampton, then spent seasons at Cape Liberty (Bayonne, NJ) for North American Atlantic sailings, then a 2024–25 winter in Southeast Asia. Summer 2025 was her inaugural Alaska season from Seattle’s Pier 91 — announced November 1, 2023; repositioned via a 15-night Yokohama → Seattle transpacific in spring 2025 after a March 2025 drydock at Tuas/Singapore. The 2026 sailing covered by this pack continues that Alaska program. By your June 2026 sailing she’ll be 11 years old — well past any new-ship issues, with her crew rhythms long settled. Quantum-class ships were Royal’s first move into “smart-ship” territory: digital wayfinding, the Two70 venue with the Vistarama screen wall, the North Star observation pod that swings out from deck 15, RipCord by iFly (the indoor skydiving simulator — yes, actually on a cruise ship), the SeaPlex multi-purpose court, and bumper cars. Many of these features are surprising on an Alaska ship; Anthem’s design centers around indoor weather contingencies, which earns its keep in the Inside Passage."},{"t":"What makes Anthem suit the Alaska itinerary","s":"ship","a":"pk-what-makes-anthem-suit-the-alaska-itinerary","x":"Alaska summer cruising means weather contingencies are the rule, not the exception. A day can include rain, hail, sun, and 70°F all before lunch. Anthem’s indoor architecture handles this in ways an open-deck Caribbean ship doesn’t: Solarium — adults-only, glass-roofed pool, deck 14. Heated. Open in any weather. The room you’ll come back to most on an Alaska sailing. North Star observation pod (deck 15, free) — glass capsule that lifts to 300 ft above the sea, with 360° views. On a cloudy day the views are fjord-floor moss and seabirds; on a clear day, mountain ranges across the strait. Two70 (deck 5 aft) — three-story-tall windows facing the ship’s wake, which is what makes the room feel architectural; turns into a performance venue at night with the Vistarama wraparound screens. Music Hall (deck 3) — live music almost every evening; loud enough that you can hear the crowd even on a sea day. Centrum (deck 4–7 atrium) — the social heart of the ship; aerial shows from the rotunda, the Captain’s parties, and a place to be when you don’t want to be in your cabin. The Royal Theatre (deck 4–5) — Broadway-style production shows; “We Will Rock You” was Anthem’s signature show for years and may still be running. What’s NOT on Anthem (because she’s a Quantum, not an Oasis): the Boardwalk, Central Park, the AquaTheater, the Ultimate Abyss slide. If you’re shopping based on those Royal Caribbean signatures from Symphony / Wonder / Icon, Anthem is a different ship in a different ocean."},{"t":"Cabin categories — the Alaska-specific calculus","s":"ship","a":"pk-cabin-categories-the-alaska-specific-calculus","x":"Before you commit, run the stateroom sanity check — give it your ship and cabin number and it tells you whether that cabin sits in a known trouble spot: under the pool deck, over the theater, by the galley or the elevator bank, far forward, behind a lifeboat, or on a connecting door. The balcony-or-interior choice matters most on Alaska sailings, where deck time is the trip. The standard Royal Caribbean cabin hierarchy applies (Interior → Oceanview → Balcony → Suite). For Alaska specifically, the math leans strongly toward Balcony . Here’s why: The ship spends hours threading the Inside Passage, Stephens Passage, and Tracy/Endicott Arm. The view from the deck is the trip. Balcony staterooms let you watch the scenery in pajamas with coffee at 6 AM — when much of the most magical light is happening — without committing to standing on a public deck for an hour. Many of Anthem’s Interior cabins are her “Virtual Balcony” type (a real-time HD view of outside on a wall screen). The technology is good but it isn’t the same as a balcony. Glacier morning specifically: a port-side or starboard-side balcony (depending on sailing direction) gives you a private viewing seat. Decision rule: for an Alaska sailing on a Quantum-class ship, a balcony is a practical purchase, not a luxury one. Save here only if you’re confident you’ll spend most days off the ship or in public areas. The In the Wake stateroom-check tool lets you cross-reference your booked cabin number against deck-plan layout, noise concerns, motion considerations, and the things that don’t show in the booking diagram. Run it once your cabin number is confirmed. For a feel of how big Anthem is compared to the other Royal ships you might have sailed, the Ship Size Atlas compares her side-by-side. You can also follow her live position throughout your sailing in the Ship Logbook , which is a small but real comfort if family ashore wants to know where you are."},{"t":"Dining","s":"ship","a":"pk-dining","x":"Anthem follows Royal’s standard structure: included main dining rooms (the Anthem main dining room runs across decks 3–4 with dynamic dining as an option), included casual venues ( Windjammer buffet, Solarium Bistro , Sorrento’s Pizza, Café Promenade ), and paid specialty restaurants. The specialty venues on Anthem typically include Chops Grille (steakhouse), Jamie’s Italian (when in service), Wonderland (theatrical), Izumi (sushi/Japanese), and Chef’s Table (~$150 small-group tasting). Specialty packages are commonly $150–250 for the week if you eat at three of them. The Bionic Bar (robot bartenders) and Schooner Bar (piano bar) are Royal staples worth visiting at least once. For Alaska specifically, the Solarium Bistro breakfast is underrated — quieter than Windjammer, with a glass-roof view, ideal for a leisurely morning before a port day. The included Main Dining Room food at Royal Caribbean is the underrated meal of the week. The “buffet ship” headlines miss that Royal’s main dining is one of the stronger sit-down operations in the mass-market segment. You don’t need specialty dining to eat well on Anthem."},{"t":"Drinks","s":"ship","a":"pk-drinks","x":"Royal’s drink package math: the Deluxe Beverage Package runs roughly $77–95/day per person on Quantum-class ships depending on dynamic pricing, plus 18% gratuity (fleet floor is ~$55 on Grandeur; ceiling ~$125 on Icon-class). At those numbers, the Deluxe pays off only if you drink more than 5–6 cocktails or wines per day. For most cruisers — particularly first-time Alaska cruisers, where port days don’t lend themselves to drinking from breakfast — pay-as-you-go runs cheaper. The drink-calculator lets you put in your real consumption pattern and see the breakeven. The companion article Is the drink package worth it? walks through the breakeven math with worked examples — and Alaska is one of the itineraries where the answer most often comes out “no.” Buy the package only if you’ve mapped your week and the per-day numbers show it pays. Don’t buy it because of FOMO at embarkation lunch."},{"t":"Section 2 — Day by Day","s":"guide","a":"section-2-day-by-day","x":"Sheer granite walls and a calving tidewater glacier in Endicott Arm fjord, southeast Alaska — the kind of scenery Day 5 morning is built around. Wikimedia Commons, CC BY-SA. A representative day-by-day rhythm. Verify your exact dates and port order in the Royal Caribbean app once your booking is final. This is not your plan. What follows is one possible shape of the week, not a schedule to keep. Only a few things on it are actually fixed: the muster drill, sailaway, the ship’s arrival and all-aboard times in each port, and anything you have already booked. Everything else is a suggestion you are free to ignore, reorder, or sleep through. A day spent entirely on your balcony is not a day wasted, and nothing here is a commitment you have made to anyone."},{"t":"Day 1 — Monday — Seattle (embarkation day)","s":"ports","a":"pk-day-1-monday-seattle-embarkation-day","x":"Seattle skyline at twilight from Kerry Park Arrival: Anthem sails from Pier 91 at the Port of Seattle, on the Magnolia/Interbay waterfront — about 15 minutes from downtown by car/Uber, 20 from Sea-Tac (SEA) airport. Embark window typically 11:30 AM – 4:30 PM; ship departs ~4:00–5:00 PM. Pre-cruise overnight strongly recommended. Flying in same-day to a 4:30 PM all-aboard call is risky — Sea-Tac delays in summer are real, and missing a Pier 91 sailing means flying to the next port (Sitka) on your own dime. Spend Sunday night at a Seattle hotel near Pioneer Square, Belltown, or Ballard. Use your Sunday afternoon to walk Pike Place Market (a half-day is the right amount), or the Olympic Sculpture Park, or the Chihuly Garden and Glass next to the Space Needle. The realistic timeline (sample sailing): 11:30 AM–1:00 PM: First-wave embarkation at Pier 91. Drop bags with porter at curb (tip $1–2/bag in cash). Proceed through security and check-in. Pier 91 has a purpose-built modern terminal; flow is generally smooth. 1:00–2:00 PM: Cabins typically NOT ready until 1 PM. Carry-on with you to the Windjammer (deck 14) or Solarium Bistro for a low-key lunch. 1:00 PM: Cabins open. Find your cabin. Introduce yourself to your stateroom attendant — they remember names, and the relationship makes the week. 2:30–4:00 PM: Light exploration. Don’t try to see everything. Find your nearest elevator bank, your closest bar, and the Solarium (you’ll be there a lot). 3:30 PM: Mandatory muster drill — now done via the Royal Caribbean app and a brief in-person check-in at your assigned station (~10 minutes total). 4:30 PM: Sailaway. Best viewing from deck 14 forward, the Solarium, or your balcony if you have one. The Elliott Bay departure past West Seattle puts Mount Rainier on your starboard quarter on a clear day. 6:00 PM or 8:30 PM: Dinner. Main dining room or your specialty reservation. What to pack in your carry-on for Day 1: a fleece or light jacket (Pier 91 evenings can be 55°F even in late June), all medications, change of clothes, passport or birth-cert + state ID, phone charger, refillable water bottle, any embarkation paperwork. Your checked bags may not arrive until 7–9 PM. Money/card: Your SeaPass card is your ID, room key, and onboard charge. You’ll receive it at check-in. Keep it on a lanyard. The Day 1 mistake to avoid: Don’t sign up for the Deluxe Drink Package mid-sail unless you’ve already done the drink-calculator math. Decide before you board. Mid-sail upgrades are pricier and give you fewer days of usage."},{"t":"Day 2 — Tuesday — Cruising the Inside Passage","s":"ports","a":"pk-day-2-tuesday-cruising-the-inside-passage","x":"This is the day Alaska reveals itself. The Inside Passage is the protected sea corridor between Vancouver Island, the British Columbia coast, and the Alaska panhandle. The ship spends the day winding through it. On a clear day you can see bald eagles , humpback whales , orcas , Dall’s porpoises , sea otters , and the occasional brown bear along distant shores. The Captain or naturalist often comes on the PA to announce wildlife sightings — keep a casual ear out. Morning: Coffee. The included coffee at Café Promenade (deck 5) is fine; the paid specialty coffee at Café 270 / Two70 (when running) or in-cabin via room service is better. The Solarium Bistro does a quiet buffet breakfast. Mid-morning to lunch — pick ONE: The North Star ride. Free; reservations open in the Cruise Planner before sailing or at Guest Services on Day 1. Try for late morning when sun (if any) is over the channel rather than behind it. A spa thermal-suite day pass. Sea-day mornings are when introductory rates appear. The thermal suite (heated stone loungers, sauna, steam) is a fair-value buy for an Alaska body that wants to thaw. The bridge tour or behind-the-scenes ship tour if the Cruise Planner is offering it for this sailing. Reading on your balcony with binoculars. This is not a joke. The most underrated activity of the week. Afternoon: The Solarium pool deck (heated, glass-roofed, adults-only). Alaska’s most-used Anthem amenity. A theater show or trivia (the Cruise Compass / Royal Caribbean app shows the day’s schedule). Two70 in afternoon mode — wraparound windows, comfortable seating, watching the channel. Evening: Dinner at your assigned time. The Royal main dining production is good; eat there at least 4 of 7 nights. The headliner show in the Royal Theatre. Anthem’s flagship production is typically a Broadway-quality musical. Reserve via the app. If this is your first cruise: Sea days early in the week can feel disorienting if you’re used to a scheduled life. Royal’s daily app/Cruise Compass program lays out the next day’s events; pick 2–3 things and let the rest go. You don’t need to do everything."},{"t":"Day 3 — Wednesday — Sitka, Alaska","s":"ports","a":"pk-day-3-wednesday-sitka-alaska","x":"Sitka harbor in a Library of Congress archive photograph — the town’s Russian-Tlingit heritage shows in any era Arrival: Approximately 7:00 AM. Depart 3:00 PM. Anthem docks at the Sitka Sound Cruise Terminal at Halibut Point (~5 miles north of downtown) — a deep-water cruise dock expanded in 2021 that handles up to two large ships at once. A free shuttle runs continuously between the terminal and downtown (330 Harbor Drive) during port hours — a 10–15 minute ride, reservation-managed on busy days at reservation.sitkadock.com, with the last shuttle leaving downtown 30 minutes before all-aboard. Plan the shuttle ride into your timing. Sitka — the most historically dense port of the week. Capital of Russian America from 1808 until the 1867 sale of Alaska to the United States; home of the first Russian Orthodox cathedral in North America (St. Michael’s, rebuilt after a 1966 fire); sitting inside Tlingit ancestral land that shaped its first centuries before Russian contact. Most Alaska itineraries skip Sitka in favor of Ketchikan; if your itinerary includes it, take advantage. The walkable downtown is small (under a mile end-to-end) and the Sitka National Historical Park totem trail is among the most affecting easy walks in southeast Alaska. Free, walkable once the shuttle drops you downtown: St. Michael’s Cathedral — the rebuilt Russian Orthodox cathedral; the first Russian Orthodox cathedral on the North American continent (consecrated 1848), seat of the Russian Orthodox Diocese of North America from 1840 until the diocese moved south in 1872. Small donation suggested for entry. Sitka National Historical Park — totem-pole trail through old-growth forest, 30-minute walk from downtown. Free entry. The Tlingit and Russian-era exhibits at the visitor center are quietly excellent. Sheldon Jackson Museum — Alaska’s oldest museum, with one of the best ethnographic collections of Alaska Native material culture in the state. Sitka Historical Museum at Harrigan Centennial Hall. Paid (extra cost, decide ahead): Sea otter and wildlife boat tour (~$120–180/person) — Sitka has the densest sea-otter population in southeast Alaska. Worth it if wildlife is your trip priority. Fortress of the Bear sanctuary tour (~$50–80) — rescued bears in semi-natural habitat. Ethically run; not a roadside zoo. Russian Bishop’s House tour (NPS, ~$5) — for history readers. Independent transit: the local Visitor Transit Bus runs a $9 day pass between downtown, the park, Fortress of the Bear, and the cruise dock area. Cheaper than ship excursions for most travelers. For first-timers: Sitka is small. You can see the cathedral, walk the totem trail, eat a salmon lunch, and be back to the shuttle with time to spare. Don’t over-plan; Alaska ports aren’t designed for the “see five things” Caribbean rhythm. Sample day shapes — pick one. Sitka’s small footprint makes these all walkable from a single shuttle drop-off. 2 hours · low-energy walk. Shuttle downtown → St. Michael’s Cathedral → unhurried walk along Lincoln Street → coffee or salmon bowl → shuttle back. Light, dry-feet day. 4 hours · the standard Sitka. Shuttle downtown → St. Michael’s → walk to Sitka National Historical Park (30 min) → totem trail loop → return for lunch and the Sheldon Jackson Museum → shuttle back. This is the day most cruisers do; it’s the right shape if you want the totem trail’s slow weight. 6 hours · the full visit. Buy the Visitor Transit Bus $9 day pass instead of the cruise-terminal shuttle. Cathedral + NHP + Sheldon Jackson + Fortress of the Bear sanctuary (~30 min by transit bus, ~$50–80 entry). Full day; pack a thermal layer because the Fortress is exposed. Costs at a glance (per person): terminal-to-downtown shuttle free (reservation-managed) · Visitor Transit Bus $9 day pass · St. Michael’s small donation · Sitka NHP free · Sheldon Jackson Museum modest entry · Sea otter and wildlife boat tour $120–180 · Fortress of the Bear $50–80 · Russian Bishop’s House (NPS) ~$5. Bring $40–60 USD cash for transit and small purchases. For the lived day-of-trip read from cruisers who’ve actually walked these paths in real Sitka weather, the Sitka port page on this site and its logbook entries are where firsthand accounts collect. The Port Day Planner builds an hour-by-hour timeline from your priorities; the Port Logbook gives you a place to record what you actually did at the end of the day. For accessibility: The downtown is mostly flat with sidewalks; the totem trail is paved and accessible-graded but does have grade changes. Anthem docks at the cruise terminal (no tender step-up); the terminal-to-downtown shuttle is accessible — confirm wheelchair-lift availability at the shuttle ticket booth. Pack for Sitka: rain jacket (it rains in Sitka 220+ days per year — your day might be one), waterproof or treated walking shoes, fleece layer, light gloves if mornings are cold, $40–60 USD cash for transit and tips. Skip the umbrella — Sitka’s coastal wind turns them inside out within a block; a hooded shell does the job better."},{"t":"Day 4 — Thursday — Skagway, Alaska","s":"ports","a":"pk-day-4-thursday-skagway-alaska","x":"Skagway in a 1915 panoramic photograph — the gold-rush town footprint is largely unchanged today Arrival: Approximately 7:00 AM. Depart 8:30 PM (this is a long port day — built for the White Pass railway turnaround). Skagway’s cruise dock is a 5-minute walk from downtown. Skagway exists because of the 1898 Klondike Gold Rush. It was the staging town for prospectors heading over the White Pass into the Yukon. The town today is still architecturally a gold-rush town — wooden boardwalks, false-front buildings, the Klondike Gold Rush National Historical Park preserving much of the original waterfront. Population ~1,200 in winter, swells with cruise tourism in summer. It’s small, walkable, and easy to read in a day. Free, walkable from the cruise dock: Klondike Gold Rush NHP visitor center — free orientation; ranger-led walking tours are first-come most days. The film inside is worth the 30 minutes. Broadway (the main street) — wooden boardwalks, some shops are over-touristed jewelry stores, others are real (Skagway News Depot for a coffee, Alaska Geographic bookshop, the Mascot Saloon Museum). Gold Rush Cemetery — 1.5-mile walk uphill out of town. “Soapy” Smith and Frank Reid (the rival who killed him) are both buried here. Real prospector graves alongside. Reid Falls — a short hike past the cemetery. Free. Paid (extra cost, decide ahead): White Pass & Yukon Route Railway — narrow-gauge railway over White Pass to Fraser, BC and back. Direct booking at wpyr.com: Summit Excursion $155/adult with 24+ hour advance purchase, $165/adult day-of (~3 hours). Longer Fraser Meadows / Bennett Scenic Journey trips run $195–250. Cruise-line ship-sold tickets typically $225–249 with markup — the upside is the railway holds the train for late ship arrivals if cruise-line-booked. This is the one Skagway excursion most cruisers do, and the $70 markup on the ship-sold ticket is buying the late-return insurance, not a better seat. Book a window seat on the right side going up. Steel cantilever bridges, the gorge at Dead Horse Gulch, and short stretches of the original Chilkoot Trail visible from the cars. Helicopter glacier landing (~$500–700) — most expensive excursion in Skagway; goes to a remote icefield, walks on glacier ice. Once-in-a-lifetime if budget allows. The local operator is TEMSCO (temscoair.com); ship-sold and direct-booked tickets both fly with them. Gold-rush themed tours, dog sled summer camps, etc. — variable quality. The free NPS-led walking tour is the better history primer. For first-timers: if you do nothing else paid in Skagway, consider the White Pass railway. The history of the gold rush isn’t optional context — it’s the whole reason this town exists, and the railway is how you feel that history. Sample day shapes — pick one. 3 hours · the walking day. Off the ship → NPS visitor center for the film and the free ranger walk → Broadway boardwalks → cemetery hike or coffee at Skagway News Depot → back to the ship by lunch. No tickets, no logistics, just the town on foot. The strongest budget day on this itinerary. 4½ hours · the headline ride. Off the ship → walk to the railway depot → White Pass Summit Excursion ($155 direct / $225 ship-sold) → back to dock with the early afternoon open. The pack’s strongest single recommendation on the cost-paid-vs-experience curve. All-day · railway plus history. White Pass Summit Excursion (morning) → light lunch on Broadway → NPS visitor center and ranger walk in the afternoon. You’ll be tired by the 8:30 PM departure but Skagway will be in your bones. Splurge day · the helicopter. Helicopter glacier landing with TEMSCO (~$500–700) → afternoon recovery walk through downtown. Once-in-a-lifetime category; budget call. Costs at a glance (per person): White Pass Summit Excursion direct via wpyr.com $155 advance / $165 day-of · ship-sold White Pass $225–249 (the $70 markup buys late-return insurance, not a better seat) · Longer Fraser Meadows / Bennett Scenic Journey trips $195–250 · Helicopter glacier landing $500–700 · NPS visitor center free · NPS ranger walking tour free · Cemetery & Reid Falls hike free . Bring $80–120 USD cash for the day’s small purchases if independent. For accessibility: Downtown is mostly flat with sidewalks but the wooden boardwalks have lips. Most train cars on White Pass are step-up; advance accommodation is possible but requires booking the specific railway directly. The NPS visitor center is fully accessible. Pack for Skagway: layers (rare hot day in late June can hit 75°F; rare cold day can stay 50°F), sturdy walking shoes, raincoat, small daypack for water and a snack, $80–120 cash USD for the day if doing independent activities. For firsthand cruiser accounts of the White Pass railway view and the Skagway boardwalk pace, the Skagway port page and its logbook entries are the lived-day-of-trip read."},{"t":"Day 5 (AM) — Friday — Endicott Arm & Dawes Glacier (scenic cruising)","s":"guide","a":"day-5-am-friday-endicott-arm-dawes-glacier-scenic-cruising","x":"Endicott Arm fjord with floating ice from the Dawes Glacier Approach: Approximately 6:00 AM the ship enters Stephens Passage and turns into Endicott Arm. The Captain typically narrates the approach via the public-address system, with marine biologists or naturalists adding context. Approach to Dawes Glacier is approximately 8:00–11:00 AM. Reverse out of the fjord ~11:00 AM – 1:00 PM. Resume normal routing toward Juneau in the afternoon. This is not a port day. There is no off-ship excursion. The day’s experience is the day itself. Dress for cold — the fjord traps cold air, even in summer wind chills can drop into the 30s°F at the rail. The glacier face creates its own micro-climate: Endicott Arm typically runs 10–15°F colder than the previous day’s ports, and standing still on deck for 2–3 hours of viewing (not generating body heat from walking) compounds the cold. Bring binoculars if you have them; rent them onboard if you don’t. The glacier morning routine: 5:30 AM: Coffee in your cabin or from in-room service ordered the night before. The first hour of approach is the magic light. 6:00–7:30 AM: On deck or balcony as the ship enters the fjord. The walls rise. Waterfalls everywhere. Bergy bits and growlers (small icebergs) start to appear. 8:00 AM: Approach to Dawes Glacier. The ship will hold position 0.5–1.0 nautical miles off the glacier face for 30–45 minutes — the safety distance is set by ice fall risk. Calving (large pieces of ice breaking off and crashing into the sea) is unpredictable but common; the sound carries half a mile. 9:30 AM: Naturalist commentary in Two70 or another venue if you want a warm seat. 11:00 AM: Reverse out of the fjord. The light has changed; the second pass shows different walls. Afternoon: Cruising toward Juneau. Bald eagles at the rail, occasional whales. Best viewing locations on Anthem: Your own balcony (warm coffee, your own pace). Deck 14 forward (open to the bow but very cold and windy). The Solarium (heated, glass-roofed, sheltered — best of both worlds). The Two70 windows (deck 5 aft, comfortable, but back-of-ship views). Pack for the glacier morning: thermal layer, fleece, waterproof shell, hat, gloves, scarf, air-activated hand warmers (1–2 pairs in your pockets — for 2–3 hours of static deck viewing they’re the difference between comfort and suffering), hot coffee in a thermal mug, binoculars (or rent), camera or phone with battery topped up (cold drains them fast). A folded camp chair earns its space in the bag once you’re standing for an hour."},{"t":"Day 5 (PM) — Friday — Juneau, Alaska (afternoon arrival)","s":"ports","a":"pk-day-5-pm-friday-juneau-alaska-afternoon-arrival","x":"The ship exits Endicott Arm around midday and transits north up Stephens Passage to Juneau. Typical arrival is mid-afternoon (~3:00–4:00 PM) for a partial port day; departure 10:00–11:00 PM. Some Adventure sailings split Endicott Arm and Juneau into separate full days (Day 5 Endicott, Day 6 Juneau) with a sea day later in the week — verify your specific arrival and departure times in the Royal Caribbean app. The Juneau content below applies either way; only the timing changes. Juneau seen from Mount Roberts, with cruise ships docked along the waterfront Arrival: Mid-afternoon on the combined-day sailing (~3:00–4:00 PM after Endicott Arm transit), or 10:00 AM on the split-day variant. Depart typically 9:00–11:00 PM either way. Anthem docks at the AJ Dock or Cruise Ship Terminal , both within a short walk of downtown. Verify your exact arrival in the Royal Caribbean app. Juneau — the only U.S. state capital you can’t reach by road. Reachable only by ship, plane, or float plane. Population ~32,000 year-round; ~17,000 daily cruise passengers in peak summer. Downtown is built into a near-vertical mountainside; the Mount Roberts Tramway (separate from the ship’s excursions) is the standard up-the-mountain ride. Free, walkable from the cruise dock: Downtown Juneau — South Franklin Street’s bars, the Red Dog Saloon (touristy but historic), state-museum-quality Sealaska Heritage Institute (free; among the best Alaska Native cultural exhibits in the state), Alaska State Capitol (free 30-minute tours weekdays), the Governor’s Mansion (exterior only). Last Chance Mining Museum — short walk uphill, free, gold-mining history. Paid (extra cost, decide ahead): Mendenhall Glacier visit — three transit options at very different price points: (1) M&M Tours’ Glacier Express ($79 adult — a 3-hour tour including round-trip transport and visitor-center admission; the successor to the old “Blue Bus” shuttle, which no longer exists as a shuttle-only product — sells out weeks ahead in peak season). (2) Capital Transit city bus (route 3 + route 8 combo, ~$4 each way; slowest but cheapest — locals’ route). (3) Ship excursion (~$80–130 depending on what’s bundled with the visit). The glacier is 13 miles from downtown; you can’t walk to it. The visitor center, Nugget Falls hike, and shore views are the standard reward; 1.5–2 hours is enough. Mount Roberts Tramway ($65 all-day pass, independent at the dock) — 1,800-foot vertical tram up Mount Roberts. Easy hiking trails at the top. Eagle viewing common. Whale watching (~$130–180/person) — humpback whale season peaks June–September; Auke Bay departures. Among the highest-quality wildlife excursions on this itinerary; success rate is very high. Dress for it like glacier viewing, not like a port walk — a small boat at 20 knots in 55°F air feels like 35°F at the rail, salt spray is constant, and breach-splash carries 20 feet. Full layers, waterproof shell, hat that won’t blow off, hand warmers, non-slip shoes. Helicopter to Juneau Icefield + glacier landing ($600–900) — if budget is no object, this is the “Alaska that’s hard to imagine” excursion. Dog-sledding on glacier (~$650+) — heli + dog-sled combination. For first-timers: if you have to pick one paid Juneau experience, it’s either Mendenhall Glacier (independent bus) for the budget-conscious or whale watching for the wildlife-focused. A combined Mendenhall + whale-watching package via Harv & Marv’s or similar local operators (~$220) is a strong day. Sample day shapes — pick one. Juneau’s afternoon-arrival timing on this sailing compresses the day; the 4-hour shape is the realistic standard. 3 hours · downtown-only. Off the ship → Sealaska Heritage Institute (free) → State Capitol tour (free, weekdays) → coffee → back to ship. The most underrated low-cost Juneau day on this itinerary. 4 hours · Mendenhall on the city bus. Off the ship → Capital Transit bus combo to the glacier (slow but ~$8 round-trip) → visitor center + Nugget Falls hike → bus back to downtown. The cheapest way to see the glacier. 4½ hours · Mendenhall on M&M Tours’ Glacier Express. Off the ship → M&M Tours Glacier Express ($79, incl. visitor-center admission) → visitor center + Nugget Falls → afternoon return. Faster than transit; books up weeks ahead. 5 hours · whale watching. Off the ship → Harv & Marv’s or Allen Marine to Auke Bay → ~3-hour humpback search → return downtown for an hour of walking. The pack’s strongest wildlife recommendation if the budget allows. All-day · the Mendenhall + whale combination. Combined operator package (~$220) hits both signature Juneau experiences in a single tightly-timed day. The schedule is the friction; the day is the reward
