 door from opening even with a master key). Use both at night. The deadbolt is the primary security feature; the privacy latch adds a second physical barrier and prevents the cabin attendant from entering during turn-down service if you’re inside. Some solo cruisers add a portable doorstop or door wedge under the door at night — cheap (under $10), takes no space, and provides an additional barrier and some peace-of-mind. For travelers who experience anxiety in unfamiliar sleeping environments, the wedge is calming, separate from any actual security improvement. There’s also no shame in using the security chain on the inside of the door if your cabin has one. Share your itinerary before sailing. Send a copy of the day-by-day to one trusted person ashore — adult child, sibling, close friend. Include the ship name, your cabin number once assigned, your travel insurance policy number, and Tina’s contact. Most importantly, share the U.S. State Department’s Overseas Citizens Services line as the right call for any true at-sea emergency: +1-888-407-4747 (from U.S./Canada) or +1-202-501-4444 (from abroad), 24 hours a day, every day. The State Department can locate the ship, contact NCL through official channels, and coordinate consular services if needed — at no cost to your family. NCL also publishes a paid ship-phone relay for non-emergency communication at 1-888-627-4477 from the U.S./Canada (per NCL’s official FAQ, this requires a MasterCard, Visa, or American Express; per-minute rate applies); it connects to the ship’s onboard phone system and is appropriate for non-urgent messages, not for delivering crisis news. (Separately, pre-cruise flight delay or rebooking: NCL’s Flight Assistance Hotline is 1-800-456-7179 , 24/7 from the U.S./Canada — keep that one for the airport, not for at-sea emergencies.) This isn’t paranoia; it’s the same hand-off you’d give if you were going on any extended solo trip. Send a brief sea-day update via cruise-line WiFi just to say “we’re doing fine”; for family who worry, this is meaningful and free. Photo copies of essential documents. Before sailing, photograph or scan: passport ID page, driver’s license, all credit cards (front and back), travel insurance card, medication list with prescribing doctors. Email these to yourself and to your trusted contact ashore. If the original is lost or stolen, U.S. Embassy replacement is dramatically faster with a digital copy already in hand. Keep the originals in your cabin safe; carry only what you need to the port. In port, walk with another group member when possible. This is one of the underrated benefits of a hosted group cruise — you naturally have travel companions for port days. The arithmetic is simple: tour vendors and pickpockets target solo cruisers more than pairs or groups. If you can’t find a partner for the day, stay in well-trafficked tourist areas, especially on the first port (when you don’t yet know the rhythm). Tell Tina or the group what your day plan is; if you’re not back by all-aboard, someone will know. Onboard friendliness does not equal obligation. Solo cruise dynamics include a particular pressure: cruise activities are designed to encourage social bonding, and on a hosted group cruise the bonding is even more visible. A friendly conversation at trivia is not an invitation to dinner. A friendly dinner is not an invitation to a port-day. A port-day is not an invitation to anything else. You set the pace; “no thanks, I’m enjoying the quiet today” is always available, and on a hosted cruise specifically, declining isn’t going to fracture the group — every solo cruiser there has had moments of needing alone-time, and they recognize it in others. Boundaries with romantic interest. Solo cruises are sometimes described as singles cruises or hookup environments; the Hosted Solo Cruisers Group Cruise is not that. Tina screens her group toward people who are seeking community, not dating. That said, romantic chemistry happens on cruises. The framework that solo cruisers report works: be willing to share a meal with a fellow passenger; not willing to share your cabin number; willing to exchange contact information after the cruise; not willing to invite anyone into your cabin during the cruise. You don’t owe an explanation; the framework is the explanation. If something feels off. The ship has 24-hour security at a desk in the main lobby and at multiple secondary stations on different decks. They respond fast. If a fellow passenger is being intrusive, if a crew member is overstepping, if you feel followed in a corridor, security can intervene immediately. Most solo cruisers go a lifetime without needing to use security; the option exists if you do. Guest Services can also reassign your cabin if your assigned cabin neighbor is the source of a problem (extremely rare, but it has happened; the protocol exists). Specific to the Studio cabin neighborhood. The Studio cabins on Aqua are clustered together on a single deck, with the Studio Lounge in the same neighborhood. This means your fellow Studio cabin neighbors are also solo cruisers — no honeymooners loud above your cabin, no kid noise next door. The community is self-reinforcing in this respect. The Studio coordinator (a crew member assigned specifically to the Studio neighborhood) is a real resource if you need help: late-arriving luggage, a request for a specific dietary accommodation, a question about a hosted group event. Use them."},{"t":"A note for grieving solo cruisers","s":"guide","a":"a-note-for-grieving-solo-cruisers","x":"If this trip is a “getting back to normal” trip after loss, the Observation Lounge and the library on Aqua are the gentlest spaces on the ship. Sea days are for rest, not for forced socializing. You don’t have to do anything you don’t want to do. The point is movement and quiet water, not performance. Tina knows this; the group will respect it."},{"t":"A small joy: cruise ducks","s":"guide","a":"a-small-joy-cruise-ducks","x":"There’s a tradition on cruise ships of bringing small rubber ducks and hiding them around the ship for fellow passengers to find. Veterans and solo cruisers often find this cheerfully ridiculous — which is the point. If you want to participate, see the cruise duck tradition article . The site that produced this pack also runs a Duck Club affinity tier of supporters who find the tradition meaningful. (No pressure to join; just mentioned because it’s of-a-piece with the spirit of group cruising.)"},{"t":"Continue planning on the site","s":"guide","a":"continue-planning-on-the-site","x":"A few threads worth pulling on the rest of the site between now and December 2027."},{"t":"About your ship","s":"guide","a":"about-your-ship","x":"Video walkthroughs of Norwegian Aqua — short clips of public spaces and deck areas as the ship has been observed by other travelers, gathered on her video highlights section . Logbook entries from other travelers — first-hand notes from guests aboard Aqua, on the Aqua logbook section of her ship page. Deck plans and the first-look gallery for orientation before you board: first look and deck plans ."},{"t":"About the ports","s":"guide","a":"about-the-ports","x":"Each port has its own page on the site, with restaurant pointers, walking-distance notes, and traveler observations: Ocho Rios port page (and the Jamaica alternates: Falmouth , Montego Bay ) Grand Cayman port page Cozumel port page"},{"t":"About Tina and her solo work","s":"guide","a":"about-tina-and-her-solo-work","x":"Tina Maulsby’s author page — her bio, her hosting style, and the way she runs a group. Tina’s solo articles index — the broader writing on solo cruising that surrounds this trip."},{"t":"Other Voyage Packs","s":"guide","a":"other-voyage-packs","x":"The full Voyage Packs catalog lists every itinerary we’ve packed — useful if you’re considering a different ship or itinerary alongside this one."},{"t":"Closing","s":"guide","a":"closing","x":"This pack exists to make one specific cruise easier. It’s calmer than most planning content, by design, because the audience deserves that calm. The cruise itself is a real opportunity: a hosted group of veterans and solo cruisers, on a brand-new NCL ship, sailing one of the better itineraries the Caribbean has to offer, hosted by someone who knows solo travel firsthand. Most cruises don’t have this much going for them. What I’d want a friend to know, if they were preparing: Trust Tina. She has a solo cruiser’s instinct and a hosted-group’s discipline. She will not over-program and she will not under-prepare. Pack the medication buffer. The single most-recommended action in this pack. Say yes to the first dinner invitation. It compounds. Remember that Cozumel and Jamaica are different countries. USD works most places; bring small bills; respect cultural differences. Don’t try to do everything. The Aqua is comfortable enough that “doing nothing” on a sea day is a valid use of the day. The Studio is small but the Studio Lounge is generous. If you’re solo, this trade-off works. Take photos. Or don’t. The point isn’t the photos. Veterans Day was a month ago, and Pearl Harbor Day was last week. The point of this trip isn’t anniversary-marking; it’s camaraderie. But moments will happen. Let them."},{"t":"A note about family and multi-generational travelers","s":"guide","a":"a-note-about-family-and-multi-generational-travelers","x":"This pack assumes you’re traveling solo (in a Studio or paired with one travel companion). Some veterans bring grandchildren, adult children, or other family on a group cruise — the format works for that too, but you’ll need: Different cabin category (Studios are single-occupancy only; pick Oceanview or Balcony for shared cabin) Family activities: NCL’s youth programs (Splash Academy, Entourage for teens) keep grandkids engaged on sea days; Tina’s hosted events are usually adult-focused but kids are welcome at most public spaces Day-by-day adjustments: kids dictate port-day pace; the easy-day options in this pack become the default rather than the fallback If multi-gen travel is your situation, mention it to Tina at booking — she’ll connect you with NCL’s family-cruise specialist for the cabin/dining/activity coordination. Share or save. The HTML version of this pack has a floating share bar (lower-right on desktop) — copy a link, ping a fellow veteran on WhatsApp, or generate a QR code if you’re showing the page to someone in person at the VFW or the Studio Lounge. If the trip is the start of a veterans-specific cruise community for you, an Instagram or X post tagged with the cruise line and Tina’s handle ( @maulsbytravel — confirm with her before posting) helps the next solo veteran find groups like this one. If this Voyage Pack is the right shape for your trip but the wrong itinerary, more Voyage Packs cover other lines and routes. The site’s editorial audit log shows how content here gets reviewed if you want to see the trail. Soli Deo Gloria. Have a good week at sea."},{"t":"About this document","s":"guide","a":"about-this-document","x":"Voyage Pack version v0.1.2 prototype Prepared for Internal review (not yet for sale) Itinerary Hosted Solo Cruisers Group Cruise — Norwegian Aqua, Port Canaveral, Dec 12–19, 2027 Group host Tina Maulsby , Maulsby Travel Co. Sources Norwegian Aqua , Cozumel , Grand Cayman , Ocho Rios , Tina Maulsby , Tina’s solo articles , accessibility-at-sea , /internet-at-sea.html , /drink-calculator.html , /articles/cruise-cabin-organization.html , /articles/cruise-tech-photography-guide.html , /packing-lists.html , /first-cruise.html , /countdown.html , assets/data/ship-deployments.json Last reviewed 2026-06-05 Pricing reminder All prices in this document are approximate. Confirm in your NCL Cruise Planner or with Tina at tina@maulsbytravel.com / 910-528-5077 Cross-link audit 30+ internal links to existing site content, demonstrating the pack as a curated entry-point into the broader In the Wake authority surface Content gap Great Stirrup Cay port page does not yet exist on the site; Day 3/4 content is hand-written from public information. A port page should be commissioned for v0.2 of this pack and the broader site Funding model This site is independent. See /affiliate-disclosure.html and /support.html for details. The pack is a one-time purchase; cruise booking is handled separately by Maulsby Travel Co."}]</script>
