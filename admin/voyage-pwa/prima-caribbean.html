<h2 id="pk-section-1">Section 1 — Your Ship: Norwegian Prima</h2>
<h3 id="pk-the-original-prima-class-ship-now-in-her-fifth-year">The original Prima Class ship — now in her fifth year</h3>
<p><a href="/ships/norwegian/norwegian-prima.html">Norwegian Prima</a> was delivered August 2022 by Fincantieri at Marghera, Italy. She’s the <strong>lead ship of NCL’s Prima Class</strong> — the design that introduced the Indulge Food Hall, the Penrose Atrium, the three-deck go-kart Speedway, the Ocean Boulevard wraparound walkway, and the Vibe Beach Club adults-only enclave that have all become NCL signatures. By your September 2026 sailing she’s just over four years old: well past any new-ship teething, her crew rhythms long settled.</p>
<p>Her <strong>godmother is Katy Perry</strong>, who performed at and christened the ship in <strong>Reykjavík on August 27, 2022</strong> — the first major cruise ship christening ever held in the Icelandic capital, attended by ~2,500 guests. (The maiden voyage itself had departed Amsterdam ten days earlier, on August 17, 2022.)</p>
<p>If you’ve sailed <a href="/ships/norwegian/norwegian-aqua.html">Norwegian Aqua</a> (2025) or you’re planning Norwegian Luna (2026), Prima is their <strong>smaller, older sister</strong>. Aqua and Luna are the larger Prima Plus class — roughly 10% bigger, with the Aqua Slidecoaster and a few other refinements. The core experience is the same: same Indulge concept, same Penrose Atrium, same Ocean Boulevard, same Vibe and Haven enclaves. The difference is scale, not design.</p>
<p>For broader context on where the major lines are pointing their newest Caribbean ships, <a href="/articles/caribbean-cruise-trends-2026.html">Caribbean Cruise Trends 2026</a> covers the deployment shifts. For a side-by-side feel of Prima against the other megaships you may have sailed (Symphony of the Seas, MSC World America, Carnival Mardi Gras), the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> shows the actual relative scale.</p>
<h3 id="pk-whats-distinctive-about-prima">What’s distinctive about Prima</h3>
<figure>
<img loading="lazy" decoding="async" src="/assets/ships/norwegian/norwegian-prima/Norwegian_Prima_entering_Kiel_XX.webp" alt="Norwegian Prima entering Kiel for the first time, September 2022 — the NCL letters on the funnel, the spiral structure on the port side (Aqua Park slides or Speedway curves), the signature swirling hull livery, and the bow nameplate. Photo by HenSti (CC BY-SA 4.0) via Wikimedia Commons." />
<figcaption aria-hidden="true">Norwegian Prima entering Kiel for the first time, September 2022 — the NCL letters on the funnel, the spiral structure on the port side (Aqua Park slides or Speedway curves), the signature swirling hull livery, and the bow nameplate. Photo by HenSti (CC BY-SA 4.0) via Wikimedia Commons.</figcaption>
</figure>
<p>A few signature features that mattered to her launch and still matter to your experience:</p>
<ul>
<li><strong>The Penrose Atrium</strong> — a three-deck central social space anchored by a glass spiral staircase. The orienting landmark; the group-gathering venue; the place to be when you don’t want to be in your cabin.</li>
<li><strong><a href="/restaurants/ncl/indulge-food-hall.html">Indulge Food Hall</a></strong> (Deck 8 aft) — 11 concepts under one roof: Tamara (Indian), The Gardens (salads + add-ons), Texas Q Steakhouse (BBQ), Seaside Rotisserie, The Latin Quarter (in an Airstream trailer), Coco’s (desserts), Starbucks, and others. <strong>Nearly all complimentary — Coco’s and Starbucks are the paid exceptions.</strong> The right call when you don’t want to commit to a sit-down meal.</li>
<li><strong>Ocean Boulevard</strong> — the outdoor wraparound walkway on Deck 8 that puts you at sea-level rail along the ship’s perimeter. Sunrise coffee, sailaway viewing, and the right place to watch a port approach.</li>
<li><strong>The Rush</strong> — two side-by-side dry racing slides (“dueling slides”) that drop 10 stories. Race a friend to the bottom. Part of the three-deck Aqua Park on Deck 18. Free; the first hour after opening usually has the shortest line.</li>
<li><strong>The Drop</strong> — the <strong>world’s first freefall dry slide at sea</strong>, alongside The Rush. Open-air, gravity-only, adult-rated. The signature Prima attraction.</li>
<li><strong>Vibe Beach Club</strong> — adults-only enclave with a private pool, two hot tubs, dedicated bar, and shaded loungers. NCL prices it per sailing in your myNCL account rather than publishing a rate; 2026 reports put a full-cruise pass on 7-night Caribbean sailings at roughly $250 to 300, with day passes, when offered at all, near $99. The right call if you’re avoiding the family pool deck and the spend is workable.</li>
<li><strong>The Haven by Norwegian</strong> — the ship-within-a-ship suite enclave with private restaurant, lounge, pool, and butler service.</li>
<li><strong>Prima Speedway</strong> — the <strong>world’s first three-level go-kart track at sea</strong>, spanning Deck 18–20. (NCL’s Breakaway-Plus ships introduced go-karts at sea earlier — Norwegian Joy 2017 — but Prima’s is the first three-level configuration.) Paid; verify pricing onboard, typically ~$15/race.</li>
</ul>
<h3 id="pk-whats-not-on-prima">What’s NOT on Prima</h3>
<p>Things you might expect from a 144K-ton ship that she doesn’t have, or that Aqua/Luna do better:</p>
<ul>
<li><strong>No Aqua Slidecoaster</strong> — the rollercoaster-style waterslide is a Prima Plus signature (Aqua, Luna), not Prima.</li>
<li><strong>No named neighborhoods</strong> — Prima is laid out as one conventional hull without the named districts that Symphony or World America use for wayfinding. The Penrose Atrium is the landmark instead.</li>
</ul>
<h3 id="pk-cabin-categories-the-solo-calculus">Cabin categories — the solo calculus</h3>
<p>The group is built around two cabin types: <strong>Solo Studio</strong> and <strong>Balcony</strong>. Two quick reads:</p>
<ul>
<li><strong>Solo Studio</strong> — NCL’s signature solo offering: roughly 100 sq ft, windowless, with <strong>no single supplement</strong> and <strong><a href="/restaurants/ncl/studio-lounge.html">Studio Lounge</a> access</strong> (free coffee, social space, scheduled hosted hours for solo cruisers). The Studio Lounge is the daily social anchor; solos cluster there independent of group meetups. It’s the obvious choice if space matters less to you than the social setup.</li>
<li><strong>Balcony</strong> — a real private outdoor space, which on a Caribbean cruise matters more than on Alaska: sea-day sunrises with coffee, port-day return-from-shore decompression, evenings on the balcony with a book. If you’ll be in the cabin only to sleep, Studio wins. If you’d appreciate a private deck, Balcony changes the texture of the week.</li>
</ul>
<p><strong>Ask Tina about Interior and Ocean View</strong> if neither of those two fits; she knows what the group block holds.</p>
<p><strong>Before you commit, run the <a href="/articles/stateroom-sanity-check.html">stateroom sanity check</a></strong> — a four-question filter that catches the bookings most likely to leave a cruiser unhappy. Studios screen well for confident sleepers; the filter flags the few cases where the windowless interior is a problem. Once chosen, the <a href="/articles/cruise-cabin-organization.html">cabin organization guide</a> covers small-space pragmatics (over-the-door organizers, magnetic hooks for the steel walls).</p>
<h3 id="pk-dining">Dining</h3>
<p>Prima’s dining map:</p>
<p><strong>Included with your fare (no extra charge):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/indulge-food-hall.html">Indulge Food Hall</a></strong> (Deck 8) — 11 quick-casual concepts; the all-included variety play. Open long hours; quietest hour is just after main dining starts (around 7:00 PM).</li>
<li><strong><a href="/restaurants/ncl/the-local.html">The Local</a></strong> — pub food + classics; long hours; a fallback for any time.</li>
<li><strong><a href="/restaurants/ncl/surfside-cafe.html">Surfside Café</a></strong> (Deck 17) — buffet; the upper-deck breakfast view is underrated.</li>
<li><strong><a href="/restaurants/ncl/hudsons.html">Hudson’s</a></strong> (Deck 7, aft) — the main dining room. Multi-course; longer than the buffet but no extra charge.</li>
<li><strong>The Commodore Room</strong> — the second main dining room.</li>
<li><strong>Surfside Grill</strong> beside the buffet on Deck 17 — quick service for daytime.</li>
</ul>
<p><strong>Specialty dining (extra charge or via Specialty Dining Package):</strong></p>
<ul>
<li><strong><a href="/restaurants/ncl/cagneys-steakhouse.html">Cagney’s Steakhouse</a></strong> — NCL’s standard steakhouse; reliably good.</li>
<li><strong><a href="/restaurants/ncl/le-bistro.html">Le Bistro</a></strong> — French; the most romantic specialty room on NCL ships.</li>
<li><strong><a href="/restaurants/ncl/onda-by-scarpetta.html">Onda by Scarpetta</a></strong> — modern Italian, Scott Conant partnership.</li>
<li><strong><a href="/restaurants/ncl/hasuki.html">Hasuki</a></strong> — Japanese teppanyaki (the showy hibachi room).</li>
<li><strong><a href="/restaurants/ncl/palomar.html">Palomar</a></strong> — Mediterranean fusion.</li>
<li><strong><a href="/restaurants/ncl/los-lobos.html">Los Lobos</a></strong> — modern Mexican.</li>
</ul>
<p><strong>Drinks.</strong> NCL’s drink-package math: the Unlimited Open Bar package is bundled in <strong>“Free at Sea”</strong>, which NCL brought back for bookings made on or after November 5, 2025 (bookings made under the 2025 “More at Sea” program keep those terms). Under Free at Sea you pay a daily pre-paid service charge on the package rather than its list price; <strong>verify with Tina what your group fare bundles and what that charge comes to</strong>. Bought on board instead, NCL’s current published rate is $45 per person per day plus 20% gratuity if you buy in the first two days, which breaks even at roughly five drinks a day. The <a href="/drink-calculator.html?line=ncl">drink-calculator</a> opens on Norwegian, with a switch for Free at Sea, and lets you put in your real consumption pattern and see the breakeven. The companion article <a href="/articles/is-drink-package-worth-it.html">Is the drink package worth it?</a> walks through the math with worked examples.</p>
<p><strong>The Day 1 mistake to avoid:</strong> Don’t sign up for an unlimited drink package at the front desk on Day 1 unless you’ve already done the <a href="/drink-calculator.html?line=ncl">drink-calculator</a> math. Decide before you board, ideally as part of your Free At Sea bundle. Mid-sail upgrades cost more per day and give you fewer days of usage.</p>
<h3 id="pk-connectivity-at-sea">Connectivity at sea</h3>
<p>NCL’s Wi-Fi packages are tier-based (basic browsing / streaming / streaming + voice) and frequently bundled into Free at Sea. The <a href="/internet-at-sea.html">internet at sea guide</a> covers cross-line baselines and how to avoid cellular roaming charges in port.</p>
<p>For most solo cruisers in the group:</p>
<ul>
<li>Use included basic Wi-Fi if your fare bundles any</li>
<li>Don’t try to stream video at sea</li>
<li>Use port-day cellular when possible (Jamaica uses Digicel/Flow; Grand Cayman uses Flow/Digicel; Mexico uses Telcel/AT&amp;T-Mexico; Great Stirrup Cay has no terrestrial carriers)</li>
<li>Keep one trusted person ashore informed via a daily one-line message — see <a href="/admin/voyage-pwa/guides/prima-caribbean-guide.html?v=d9d0ec85fe#section-6">Section 6</a></li>
</ul>

<h3 id="pk-day-1-sunday-september-27-port-canaveral-embarkation">Day 1 — Sunday, September 27 — Port Canaveral (embarkation)</h3>
<p><strong>Terminal:</strong> <strong>Port Canaveral, Cruise Terminal 5</strong> per the Port Authority’s 2026 master cruise schedule (Prima alternates between Terminals 5 and 6 this fall, and the schedule puts your return on October 4 at Terminal 6). Confirm the terminal in the NCL app before you leave the hotel.</p>
<p><strong>Getting to Port Canaveral:</strong></p>
<ul>
<li><strong>Orlando International (MCO) → Port Canaveral:</strong> Uber/Lyft $60–80, 45–60 min. Shared cruise shuttle ~$30/person, slower.</li>
<li><strong>If driving:</strong> Port Canaveral garage ~$17–22/day (significantly cheaper than PortMiami at $35/day); reservable in advance via the Port Canaveral website.</li>
<li><strong>Embark window:</strong> Typically 12:00 – 3:30 PM. <strong>All-aboard 3:00 PM.</strong> NCL’s published itinerary for this fall’s Western sailings shows a 4:00 PM departure; the Port Authority’s master schedule lists 6:00 PM for this date. NCL’s rule is that you must be aboard one hour before the departure time on your cruise documents, so plan to the app, not to either page.</li>
</ul>
<p><strong>Pre-cruise hotel — strongly recommended.</strong> Same-day flights to a 3:30 PM all-aboard are risky in central Florida — September afternoon thunderstorms can ground MCO arrivals with little notice. Two viable bases:</p>
<ul>
<li><strong>Cocoa Beach</strong> (15 min from port) — beach town energy, walking distance to the pier and the beach. Hotels are simpler but the location is the right one if you want to be near the port.</li>
<li><strong>Orlando</strong> (45 min from port) — more hotel options, more variety, but a longer Sunday-morning transfer.</li>
</ul>
<p><strong>Saturday Sept 26 — fly in.</strong> Friday earlier if your flight is risky. Confirm Tina’s pre-cruise meetup plans before booking your hotel.</p>
<p><strong>The realistic Day 1 timeline:</strong></p>
<ul>
<li><strong>11:00 AM:</strong> Terminal opens for arrivals. NCL online check-in via the NCL app — complete it before arrival to skip a 20-minute queue.</li>
<li><strong>12:00 PM:</strong> Aboard. Cabins typically open by 1:30 PM; until then, lunch at the buffet (Surfside, Deck 17) or Indulge Food Hall (Deck 8).</li>
<li><strong>1:30 PM:</strong> Cabin open. Meet your stateroom steward; drop carry-ons.</li>
<li><strong>3:00 PM:</strong> Mandatory muster drill — NCL’s drill is partly app-based (watch the safety video in the NCL app) plus an in-person check-in at your assigned station.</li>
<li><strong>4:00 PM:</strong> <strong>Sailaway.</strong> Tina’s group gathers at the <strong>Penrose Atrium</strong> or <strong>Ocean Boulevard Deck 8 aft</strong> — verify in her communications. Port Canaveral departures pass close to the cargo and cruise terminal piers; the lighthouse and the early-evening Florida coastline are quietly beautiful.</li>
<li><strong>5:30 – 8:00 PM:</strong> Dinner. Tina’s nightly group dinner is at <strong><a href="/restaurants/ncl/hudsons.html">Hudson’s</a> at 5:30 PM</strong> (her standard rhythm) — show up to whichever nights work for you. Or eat solo at Indulge.</li>
<li><strong>Later evening:</strong> NCL hosts a <strong>Studio meet-and-greet</strong> sometime on Day 1 in the <a href="/restaurants/ncl/studio-lounge.html">Studio Lounge</a> — check the NCL app’s daily program for the exact time.</li>
</ul>
<p><strong>What to pack in your carry-on for Day 1:</strong> swimsuit (pools open before checked bags arrive), light layer (Florida September evenings can hit a humid 78°F outdoors but ship interior runs ~72°F), all medications, change of clothes, <strong>passport</strong> (preferred — Jamaica + Cayman + Mexico are foreign ports and passport is the cleanest documentation), phone charger, refillable water bottle. Your checked bags may not arrive until 7–9 PM.</p>
<p><strong>Money/card:</strong> Your NCL keycard is your ID, room key, and onboard charge account. You’ll receive it at check-in. <strong>Currency aboard: US Dollar.</strong></p>
<h3 id="pk-day-great-stirrup-cay">Day 2 — Monday, September 28 — Great Stirrup Cay, Bahamas</h3>
<p><strong>Arrival:</strong> Approximately 8:00 AM. <strong>Depart:</strong> 5:00 PM. Prima docks at the <strong>new $150M pier</strong>, which first took a ship on December 28, 2025 — no tendering. NCL closed the pier on April 1, 2026 to build out a second berth (tenders ran through the summer) and reopened it in August. Both berths are now in use: the pier took its first double call the weekend of September 12–13, and the two ships alongside were Norwegian Prima and Norwegian Getaway (Cruise Industry News, September 16). For your Monday call the cay’s published schedule shows Prima alone. If a Bahamas storm threatens the cay, tendering can return as a contingency; the NCL app tells you the evening before.</p>
<p><strong>Great Stirrup Cay in September 2026 — what’s actually on the ground.</strong> NCL’s 270-acre private island in the <strong>Berry Islands of the Bahamas</strong>, in NCL’s hands since 1977 (leased at first, bought outright in 1986) — the oldest cruise-line private destination in the Caribbean, now in its biggest transformation under a ~$150M plan. <strong>The headline new attraction — Great Tides Waterpark — opened September 4, 2026, twenty-four days before your call.</strong> It’s a separately purchased pass; buy it in your myNCL account or the Norwegian Cruise Line app pre-cruise.</p>
<p><strong>Great Tides Waterpark and the new Great Life Lagoon</strong> (per NCL’s published materials):</p>
<ul>
<li><strong>Great Life Lagoon</strong> — the new central pool area (NCL has described it both as a 1.4-acre area and as a 28,000-square-foot pool surface — the larger number is the whole zone with decking and surrounds; the smaller is the water). Beach-style entry, swim-up bars, ocean views. Free with cruise fare.</li>
<li><strong>Tidal Tower</strong> (paid) — racing slides, sea-themed.</li>
<li><strong>Wandering River</strong> (paid) — lazy river with surprise elements.</li>
<li><strong>Cliffside Cove</strong> (paid) — platform-jumping into clear pools. Height/swim ability requirements.</li>
<li><strong>Splash Cay</strong> (paid) — splash pad for younger kids.</li>
<li><strong>Grotto Bar</strong> — cocktail bar inside the family-pad zone so adults can drink while kids play. Verify cost in the Norwegian Cruise Line app.</li>
<li><strong>Roughly 19 slides</strong> across the park complex.</li>
</ul>
<p>Waterpark access requires a pass bought in advance through your myNCL account or the Norwegian Cruise Line app. <strong>Day-of walk-up may be limited on opening-window sailings — book early.</strong></p>
<p><strong>Free with your cruise fare:</strong></p>
<ul>
<li><strong>Beach access</strong> — multiple beach zones; the main beach is the most developed.</li>
<li><strong>Buffet lunch</strong> — typically open 11:30 AM – 2:30 PM at the open-air pavilion.</li>
<li><strong>Lounge chairs and umbrellas</strong> — first-come; walk off early for the shaded ones.</li>
<li><strong>Great Life Lagoon</strong> (the new central pool with swim-up bars and beach-style entry).</li>
<li><strong>Tram service</strong> around the developed area; runs from the new Welcome Plaza arrival area.</li>
<li><strong>Restrooms and shower facilities.</strong></li>
</ul>
<p><strong>Paid add-ons (decide ahead — reserve in the Norwegian Cruise Line app or myNCL):</strong></p>
<ul>
<li><strong>Great Tides Waterpark</strong> — see above; reservation-based pricing varies by date.</li>
<li><strong>Flighthouse Zipline</strong> — the existing ten-line zipline complex anchored by the “Flighthouse” tower take-off; ~$20 for the multi-line option.</li>
<li><strong>Underwater Snorkel Garden</strong> — guided reef-snorkel at a curated underwater garden offshore.</li>
<li><strong>Beachfront villa / cabana rentals</strong> — premium beach spaces.</li>
<li><strong>Snorkel-gear rental</strong> at the watersports hut.</li>
<li><strong>Kayak tours and waverunners</strong> — small-group; ~$50–80/person.</li>
<li><strong>Jet-ski rentals</strong> and various paid water-sports.</li>
<li><strong>Silver Cove</strong> — separate ultra-premium adults-only zone with private cove, lagoon villas, spa, and bar. Day passes available; full villas are the splurge option.</li>
</ul>
<p><strong>Arrival logistics.</strong> You’ll come ashore at the <strong>Welcome Plaza</strong> — NCL’s new arrival area at the pier that opened alongside the waterpark expansion in 2026. Tram service runs from Welcome Plaza along the spine of the cay to the beach zones and the waterpark.</p>
<p><strong>For first-time Great Stirrup Cay:</strong> the beach + buffet day is the right default if you don’t want to commit to a paid attraction. If the waterpark is open and the budget works, <strong>Great Tides is the headline reason to be on this sailing</strong> — it’s NCL’s most significant private-destination addition since 2017. The cay’s history (NCL’s lease from 1977, the 1863 Great Stirrup lighthouse) is more interesting than the beach if you’re a history reader.</p>
<p><strong>Hurricane-season note:</strong> September 28 falls in peak Atlantic hurricane season. Great Stirrup Cay is the call most commonly skipped or relocated if a storm is in the Bahamas chain. <strong>Have a sea-day mental model as backup.</strong></p>
<p><strong>Pack for Great Stirrup Cay:</strong> swimsuit (worn aboard or in your beach bag), reef-safe sunscreen (Bahamas appreciates it), sun hat, $20–30 cash for tipping at the bars (gratuities bundled, but $1–2 to a bartender who took care of you matters), refillable water bottle, water shoes (some beach areas are coral-fragment), waterproof phone pouch.</p>
<h3 id="pk-day-falmouth">Day 4 — Wednesday, September 30 — Falmouth, Jamaica</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/falmouth/falmouth-hero.webp" alt="Falmouth, Jamaica — the Georgian-era Historic Town and the Royal Caribbean / NCL cruise port" />
<figcaption aria-hidden="true">Falmouth, Jamaica — the Georgian-era Historic Town and the Royal Caribbean / NCL cruise port</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 7:00 AM. <strong>Depart:</strong> 4:00 PM (NCL asks you aboard an hour before). Prima docks at the <strong>Historic Falmouth Cruise Port</strong> — the modern cruise terminal complex Royal Caribbean built in 2011 that NCL also uses. The terminal is fully developed with shops, restaurants, and excursion meeting points; the Historic Town of Falmouth (Georgian architecture, walking distance) is the second-layer experience.</p>
<p><strong>Falmouth — the Georgian-era town the cruise port restored.</strong> Founded in 1769 as a sugar-trade hub, Falmouth has one of the best-preserved collections of Georgian architecture in the Caribbean. The town has been actively restoring its historic core since the cruise port opened. <strong>Outside the cruise-port complex</strong>, you’ll see a working Jamaican town — neither cruise-port-polished nor “dangerous”; just a real place. The cruise port itself is highly developed.</p>
<p><strong>Free, walkable from the cruise port:</strong></p>
<ul>
<li>The <strong>cruise port complex</strong> — shops, restaurants, beach access at Pier 1.</li>
<li><strong>Historic Falmouth walking tour</strong> — self-guided through the Georgian core; the Court House, the Parish Church, the William Knibb Memorial Church (significant in Jamaica’s emancipation history). Free if self-guided; guided tours $10–20 from the port.</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>Dunn’s River Falls</strong> (about an hour’s drive each way on the North Coast Highway, roughly 42 miles) — Jamaica’s most famous attraction. Falmouth adds most of an hour over an Ocho Rios departure; with a 4:00 PM sail it is still a workable day, but not a lingering one. Ship excursion $80–110; independent $40–60.</li>
<li><strong>Mystic Mountain bobsled + skyride</strong> (Ocho Rios; ~$120 ship) — high-energy day-tour. Similar length issue from Falmouth.</li>
<li><strong>Luminous Lagoon</strong> — bioluminescent water tour (evening); not feasible from a daytime Falmouth call, but ask if NCL offers a private extension.</li>
<li><strong>Glistening Waters</strong> — daytime alternative; calmer.</li>
<li><strong>Falmouth highlights + Greenwood Great House</strong> — historic plantation tour, ~$60–80; closer to Falmouth and the cultural-history alternative to Dunn’s.</li>
<li><strong>Bamboo Beach Club</strong> — beach day with all-inclusive drinks/food, ~$95; the lower-stress option.</li>
</ul>
<p><strong>For first-time Falmouth:</strong> if you’ve been to Jamaica before and seen Dunn’s, the Greenwood Great House + Historic Falmouth walk is the more interesting day. If this is your first Jamaica call, the lure of Dunn’s River is real but two hours of the day go to the road — consider whether you’d rather a closer, calmer day at a beach club.</p>
<p><strong>Pack for Jamaica:</strong> swimsuit (if doing a beach excursion), water shoes (Dunn’s requires them; many beaches benefit), sunscreen, sun hat, light cover-up, $40–60 USD cash in small bills (USD widely accepted; Jamaican dollar not necessary), a small day-pack you don’t mind getting wet, your phone in a waterproof pouch.</p>
<p><strong>Worth a look on the way in:</strong> the <a href="/ports/falmouth.html">Falmouth port page</a>. Build your day in the <a href="/tools/port-day-planner.html">Port Day Planner</a> before you go ashore; record what actually happened in the <a href="/tools/port-tracker.html">Port Logbook</a> on the way back.</p>
<h3 id="pk-day-grand-cayman">Day 5 — Thursday, October 1 — Grand Cayman</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/grand-cayman/grand-cayman-4.webp" alt="George Town, Grand Cayman — the cruise tender port and the Seven Mile Beach beyond" />
<figcaption aria-hidden="true">George Town, Grand Cayman — the cruise tender port and the Seven Mile Beach beyond</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 7:00 AM. <strong>Depart:</strong> 3:30 PM (aboard by 2:30 PM). <strong>Tender port</strong> — Grand Cayman has no cruise pier; ships anchor offshore and tenders run to George Town. Plan for a 20–30 minute end-to-end tender process at peak. <strong>Earlier tenders are faster.</strong></p>
<p><strong>Grand Cayman — the most expensive port of the week, and the one with the strongest currency.</strong> A British Overseas Territory; the 2021 census counted about 71,000 people across the Cayman Islands, nearly all of them on Grand Cayman. The Caymans use the <strong>Cayman Islands dollar (KYD)</strong>, <strong>pegged at 1 KYD = 1.20 USD</strong> since 1974 — meaning the Cayman dollar is <em>stronger</em> than the U.S. dollar. USD is universally accepted, but most businesses give change in KYD at a practical rate of $1 USD ≈ $0.80 KYD; if you pay in USD and the bill is $20 KYD, you’ll hand over $24 USD. George Town (the capital) is the cruise hub; <strong>Seven Mile Beach</strong> is the postcard stretch of west-coast white sand running north from George Town. The day-tour pricing reflects the territory’s standard of living.</p>
<p><strong>Free, walkable from George Town:</strong></p>
<ul>
<li><strong>George Town walking</strong> — the duty-free shopping district at the cruise tender drop, the Cayman Islands National Museum ($10), and the small downtown waterfront.</li>
<li><strong>Pirates Week souvenir shops</strong> — touristy but easy.</li>
</ul>
<p><strong>Paid (decide ahead):</strong></p>
<ul>
<li><strong>Stingray City Sandbar</strong> — the iconic Grand Cayman experience. A sandbar in the North Sound where you stand in waist-deep clear water surrounded by tame Southern stingrays. Independent operators run tours from the Cayman Islands Yacht Club for ~$60/person; ship excursions $80–130. 2–3 hours total.</li>
<li><strong>Seven Mile Beach</strong> — ~$5 #1 bus from George Town to multiple stops along the beach, or $20 taxi each way. Free entry (it’s a public beach); chairs at any beach club $10–20. The lower-effort half-day.</li>
<li><strong>Cayman Turtle Centre</strong> — formerly a turtle farm, now a conservation + interaction park; ~$45 entry; full-day with shuttle.</li>
<li><strong>Bioluminescent kayak tour</strong> (evening) — not feasible from a daytime call.</li>
</ul>
<p><strong>For first-time Grand Cayman:</strong> Stingray City is the trip-defining experience. If you’ve done it before, Seven Mile Beach (cheap via bus or taxi) is the easy default. The Cayman Islands National Museum is a quiet half-hour if it rains.</p>
<p><strong>Pack for Grand Cayman:</strong> swimsuit, water shoes (Stingray City sandbar is wading-friendly but the surrounding reef has coral), reef-safe sunscreen (Cayman reef is protected), sun hat, $60–80 USD cash, underwater camera if you have one.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/grand-cayman.html">Grand Cayman port page</a>, its <a href="/ports/grand-cayman.html#gallery">photo gallery</a>, and the <a href="/ports/grand-cayman.html#logbook">Grand Cayman logbook</a>.</p>
<h3 id="pk-day-cozumel">Day 6 — Friday, October 2 — Cozumel, Mexico</h3>
<figure>
<img loading="lazy" decoding="async" src="/ports/img/cozumel/cozumel-fom-1.webp" alt="Cozumel’s coastal road and the reef offshore — the Western Caribbean’s signature snorkel destination" />
<figcaption aria-hidden="true">Cozumel’s coastal road and the reef offshore — the Western Caribbean’s signature snorkel destination</figcaption>
</figure>
<p><strong>Arrival:</strong> Approximately 9:30 AM. <strong>Depart:</strong> 5:30 PM (aboard by 4:30 PM); this is not one of Cozumel’s late-departure calls. NCL most often uses <strong>Punta Langosta</strong> (downtown), with the <strong>International Pier</strong> on busy days; the pier is confirmed in the NCL app the evening before. Cozumel is the most heavily visited Caribbean port; expect 3–5 ships in port the same day during peak season.</p>
<p><strong>Cozumel — the underwater destination of the Western Caribbean.</strong> The reef system off Cozumel — protected within Cozumel Reefs National Park since 1996 — delivers visibility consistently among the best in the Caribbean. If anyone in your group has ever wanted to try snorkeling, <strong>this is the day to do it</strong>. Above water, Cozumel feels touristed in a familiar way — it’s been a cruise stop for 50 years and the routine is well-established.</p>
<p><strong>Easy-day option (no excursion):</strong></p>
<ul>
<li>Stay near your pier. <strong>Punta Langosta</strong> puts you directly in downtown San Miguel — walk around, find a real Mexican lunch ($15–25/person at a non-tourist restaurant), shop at <strong>Mercado Municipal</strong> (the local market, NOT the tourist shops near the pier — locals shop there too). International and Puerta Maya piers are 5–10 minutes from downtown by taxi (~$10).</li>
</ul>
<p><strong>Half-day options:</strong></p>
<ul>
<li><strong>Chankanaab Beach Adventure Park</strong> (~$50/person entry, ~15 min by taxi). Calm water, snorkel rentals, dolphin program (paid extra), lounger and umbrella. Family-friendly; calmest reef snorkeling.</li>
<li><strong>Paradise Beach</strong> (~$3 entry with food/drink minimum, ~15 min by taxi). Lower-key alternative with a real “Mexican beach club” feel.</li>
</ul>
<p><strong>Full-day options:</strong></p>
<ul>
<li><strong>Palancar Reef snorkel tour</strong> — <em>the iconic Cozumel experience.</em> Multiple operators on the pier offer this for $40–60/person (ship excursion: $80–110). Two-hour tour, calm water, abundant fish life. <strong>The trip that converts non-snorkelers.</strong> Bring an underwater camera.</li>
<li><strong>Tulum ruins</strong> (3-hour ferry + bus, $90–150 ship excursion or ~$80 independent). Long day. October afternoons can hit 90°F + humidity; heat-sensitive travelers should consider timing carefully.</li>
</ul>
<p><strong>A note on shopping:</strong> Cozumel’s pier shops sell the same Mexican blanket, the same silver jewelry, and the same vanilla extract you can buy at any Caribbean cruise port. The interesting shopping is at <strong>Mercado Municipal</strong> in San Miguel (15-min walk from Punta Langosta) — vanilla, ceramics, leather, food vendors at local-shopper prices.</p>
<p><strong>For first-time Cozumel:</strong> Palancar Reef snorkel tour. Even if you’ve never snorkeled, this is the day for it. Bring underwater camera if you can — the <a href="/articles/cruise-tech-photography-guide.html">cruise-tech and photography guide</a> covers waterproof cases, GoPro mounts, and the right cables for charging at sea if you want to think it through before packing. If snorkeling isn’t possible, Chankanaab is the easiest beach day with reef access.</p>
<p><strong>For wheelchair users and limited mobility:</strong> Cozumel’s piers are accessible. Punta Langosta connects directly to a paved boardwalk into San Miguel. Many beach clubs have beach wheelchairs; ask in advance. Snorkel <em>boats</em> are typically NOT accessible — book a beach-snorkel tour instead.</p>
<p><strong>Pack for Cozumel:</strong> swimsuit, reef-safe sunscreen (locally enforced), water shoes, sun hat, $60–80 USD cash for tour and lunch, small underwater camera if you have one.</p>
<p><strong>Worth a look:</strong> the <a href="/ports/cozumel.html">Cozumel port page</a>, its <a href="/ports/cozumel.html#gallery">gallery</a>, and the <a href="/ports/cozumel.html#logbook">Cozumel logbook</a>.</p>
<p><strong>Friday evening:</strong> Back aboard by 4:30 PM, so the day ends early enough for a shower before Hudson’s at 5:30. Tomorrow is a sea day; tonight is not the last gathering.</p>
<h3 id="pk-day-8-sunday-october-4-port-canaveral-debarkation">Day 8 — Sunday, October 4 — Port Canaveral (debarkation)</h3>
<p><strong>The realistic timeline:</strong></p>
<ul>
<li><strong>6:00 – 8:00 AM:</strong> Breakfast at Indulge Food Hall or Surfside Café. Eat now if your bag is in the hall already.</li>
<li><strong>7:00 AM:</strong> Ship alongside at Cruise Terminal 6, per the Port Authority schedule. Self-disembarkation begins once the ship is cleared, usually within the hour.</li>
<li><strong>7:30 – 9:30 AM:</strong> Walk-off in waves. <strong>All passengers off the ship by 10:00 AM</strong> per NCL standard.</li>
</ul>
<p><strong>The bag situation.</strong> The night before, NCL asks you to place your checked luggage outside your cabin door by ~11 PM with the color-coded tag indicating your debark group. Bags are taken to the terminal overnight and you collect them in baggage claim before customs.</p>
<p><strong>Carry-on with you on debark morning:</strong> a change of clothes, all medications, passport, phone charger, valuables.</p>
<p><strong>Getting from Port Canaveral to MCO:</strong></p>
<ul>
<li><strong>Uber/Lyft:</strong> $60–80, 45–60 minutes.</li>
<li><strong>Cocoa Beach Shuttle</strong> ($30/person, advance booking) — formal port-to-airport option; slower than Uber.</li>
<li><strong>Public transit:</strong> Not realistic for cruise return.</li>

<p><strong>Killing 4–6 hours before an evening flight:</strong></p>
<ul>
<li><strong>Cocoa Beach pier</strong> — 15-min Uber. Beach walk + casual lunch.</li>
<li><strong>Kennedy Space Center</strong> — 20-min Uber, $77 adult entry in 2026. Half-day minimum if you want to do it properly.</li>
<li><strong>Cocoa Village</strong> — historic small-town main street; lunch + shops.</li>
