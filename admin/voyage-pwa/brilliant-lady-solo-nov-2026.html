<h2 id="pk-section-1">Section 1 — Your Ship: Brilliant Lady</h2>
<h3 id="pk-the-youngest-lady-built-to-fit-the-panama-canal">The youngest Lady, built to fit the Panama Canal</h3>
<p><a href="/ships/virgin-voyages/brilliant-lady.html">Brilliant Lady</a> is the fourth ship of Virgin Voyages’ fleet, after <a href="/ships/virgin-voyages/scarlet-lady.html">Scarlet Lady</a>, <a href="/ships/virgin-voyages/valiant-lady.html">Valiant Lady</a> and <a href="/ships/virgin-voyages/resilient-lady.html">Resilient Lady</a>. Fincantieri built her in Italy. Virgin’s fact sheet says she “launched in September 2025 from New York City,” and she arrived in Miami for the first time in October 2025.</p>
<p>She’s built to the same plan as her sisters, with one difference you’d never notice from a deck chair. Virgin’s March 2026 announcement says her sisters “were never able to transit the Panama Canal,” so Brilliant Lady got a lifeboat system that pulls the boats further inboard, and the overhang at the back of Deck 7 was removed. In late October 2026 she sails the canal from Los Angeles to Miami. Your cruise is one of her first from Miami after that trip.</p>
<p>Gross tonnage, about 110,000 for her, is a measure of the ship’s enclosed volume, not her weight. If you want to see how she compares with other ships, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> lines them up.</p>
<p>Her mermaid artwork on the hull is by Toronto illustrator Janice Sung, according to Virgin’s fact sheet. Virgin hasn’t named a godmother for her in anything checked for this pack, so this pack doesn’t name one.</p>
<h3 id="pk-how-virgin-is-different-from-other-lines">How Virgin is different from other lines</h3>
<ul>
<li><strong>Adults only.</strong> Nobody under 18 sails.</li>
<li><strong>No buffet, and the restaurants are included.</strong> Virgin says “all meals at our 20+ eateries are included.” A few “Treat Yourself” menu items and two dinner shows, Another Rose and It’s a Ship Show, cost extra.</li>
<li><strong>Soda and water are included</strong>, sparkling water too. Alcohol is not. Virgin has no drink packages. Instead you can pre-pay a <strong>Bar Tab</strong>, which is onboard credit for drinks, on the ship or at the Bimini Beach Club, up to 24 hours before you sail. Unused Bar Tab isn’t refunded.</li>
<li><strong>Wi-Fi is included,</strong> at a level that depends on your fare (Basic, Classic or Premium).</li>
<li><strong>Gratuities.</strong> This changed in 2025, so read carefully. For bookings made from October 7, 2025, Virgin adds <strong>$22 per person per night</strong> to your onboard account, or <strong>$20 per night if you pre-pay</strong> before the cruise. Some older Virgin pages still say tips are included, and those are out of date. <strong>Ask Tina whether gratuities are in your group fare.</strong></li>
<li><strong>Dress.</strong> Virgin’s own words: “Dress Up. Dress Down. Just Dress.” One night is <strong>Scarlet Night</strong>, Virgin’s party where the theme is red.</li>
<li><strong>The app runs everything.</strong> It’s called the Virgin Voyages app. Dinner reservations, shore trips (Virgin calls them “Shore Things”) and your terminal arrival time are all booked there.</li>
</ul>
<h3 id="pk-cabin-choice-the-solo-calculation">Cabin choice: the solo calculation</h3>
<p>The flyer has two solo prices.</p>
<ul>
<li><strong>Interior at $1,715.</strong> Virgin has cabins built for one person, called <strong>Solo Insider</strong>, which its fact sheet says are “designed and priced exclusively for the solo traveler.” <strong>Ask Tina whether your interior is a Solo Insider or a regular inside cabin booked for one.</strong> Virgin doesn’t publish the Solo Insider’s size or count for Brilliant Lady.</li>
<li><strong>Balcony at $2,316.</strong> That’s $601 more. Virgin calls balconies “Sea Terraces,” and its cabin page says almost all of them have a hammock. Brilliant Lady also has a category no sister has: the <strong>Slightly Smaller Sea Terrace</strong>, mid-ship on Deck 8, with two hammocks.</li>
</ul>
<p>Prices are from the flyer and can change until you book. Once you’re in your cabin, the <a href="/articles/cruise-cabin-organization.html">cabin organization guide</a> helps with small-space living.</p>
<h3 id="pk-dining">Dining</h3>
<p>Everything below is included, except where marked. This list comes from Virgin’s dining pages.</p>
<ul>
<li><strong>Rojo by Razzle Dazzle.</strong> Virgin says it’s on Brilliant Lady only: Spanish tapas and small plates.</li>
<li><strong><a href="/restaurants/virgin/razzle-dazzle.html">Razzle Dazzle</a></strong>, <strong><a href="/restaurants/virgin/pink-agave.html">Pink Agave</a></strong> (Mexican), <strong><a href="/restaurants/virgin/extra-virgin.html">Extra Virgin</a></strong> (Italian), <strong><a href="/restaurants/virgin/gunbae.html">Gunbae</a></strong> (Korean barbecue on tabletop grills), <strong><a href="/restaurants/virgin/the-test-kitchen.html">The Test Kitchen</a></strong> and <strong><a href="/restaurants/virgin/the-wake.html">The Wake</a></strong> (steak and seafood).</li>
<li><strong><a href="/restaurants/virgin/the-galley.html">The Galley</a></strong> is the food hall, Virgin’s answer to a buffet: walk up, order, sit anywhere. <strong><a href="/restaurants/virgin/the-pizza-place.html">The Pizza Place</a></strong> and <strong><a href="/restaurants/virgin/lick-me-till-ice-cream.html">Lick Me Till Ice Cream</a></strong> are there for in-between.</li>
<li><strong>Juice Sea</strong>, a wellness bar on Deck 7, is also new on Brilliant Lady.</li>
<li><strong>Room delivery (ShipEats)</strong> has a $10 delivery charge, waived on orders of $10 or more.</li>
</ul>
<p><strong>Book dinners in the app as soon as Virgin opens them.</strong> How early depends on your fare: Virgin says 15 days before sailing for the lowest fares and up to 60 days for Premium. Ask Tina which you have.</p>
<h3 id="pk-shows">Shows</h3>
<p>Virgin’s Brilliant Lady page lists: Disco Circus, Up With a Twist, Murder in the Manor, Duets, Electric, Red Hot, Out of Time and The Diva Goes West. Virgin’s FAQ names Another Rose and It’s a Ship Show as the dinner shows that cost extra. Whether any Brilliant Lady show other than those costs extra, check in the app.</p>
<h3 id="pk-getting-online">Getting online</h3>
<p>Wi-Fi is part of every Virgin fare. What level you get depends on the fare, so ask Tina. The <a href="/internet-at-sea.html">internet at sea guide</a> covers how cruise Wi-Fi works and how to avoid roaming charges in port.</p>

<h3 id="pk-day-1-monday-november-30-miami-embarkation">Day 1 — Monday, November 30 — Miami (embarkation)</h3>
<p><strong>Terminal V</strong>, 718 N. Cruise Blvd. For GPS, Virgin’s own story page says to enter <strong>1015 North America Way, Miami, FL 33132</strong>, then follow the signs. Parking is in <strong>PortMiami’s Garage G</strong>, $25 a day as of October 2026 (PortMiami’s rate).</p>
<p><strong>How boarding works at Virgin.</strong> You pick a <strong>terminal arrival time</strong> in the app, and Virgin asks you not to arrive before it. Luggage drop opens at 9:00 AM, so you can drop bags and wander until your time. Virgin’s FAQ says boarding generally starts around 2:15 PM. The ship leaves at 5:00 PM.</p>
<p><strong>Fly in the day before,</strong> Sunday November 29. That’s the Sunday after Thanksgiving, so book early, and a same-day flight leaves no room for a delay. Miami International is about 9 miles from the port, according to the airport. Taxis there run on the meter, with a $15 minimum.</p>
<p><strong>The first afternoon:</strong></p>
<ul>
<li>Board, eat, find your muster station.</li>
<li><strong>Sailaway at 5:00 PM.</strong> Tina will say where the group meets, in the group chat.</li>
<li><strong>Group dinner.</strong> The flyer promises group dining each night. Tina sets the time and place.</li>
<li>Virgin runs <strong>solo meetups</strong>. Its FAQ names an Evening Meet-Up, a Morning Meet-Up and a “Let’s Set Sail” event. Check the app for times.</li>
</ul>
<p><strong>Keep in your carry-on:</strong> passport, medications, a swimsuit, a change of clothes, a charger. Bags can take until evening to arrive.</p>
<h3 id="pk-day-st-maarten">Day 4 — Thursday, December 3 — St. Maarten (Philipsburg)</h3>
<p><strong>In port:</strong> 8:00 AM to 6:00 PM. <strong>All aboard 5:00 PM.</strong></p>
<p><strong>What it is.</strong> The Dutch side of the island, Sint Maarten. The French side is Saint-Martin.</p>
<p><strong>Getting around.</strong> The local hotel and tourism association says you can walk from the port to town in about 10 minutes. The St. Maarten Tourism Bureau publishes taxi fares from the cruise port. For one or two people: <strong>Philipsburg $10, Maho Beach $25, the airport $25.</strong> For three to five people the fare is per person: Philipsburg $4 each, Maho $9 each. There’s a 25% surcharge between 10 PM and 6 AM and on public holidays.</p>
<p><strong>Things to know:</strong></p>
<ul>
<li><strong>Great Bay beach and the Philipsburg boardwalk.</strong> Walking distance and free.</li>
<li><strong>Maho Beach</strong>, at the end of the airport runway, is $25 by taxi for one or two.</li>
<li><strong>Fort Amsterdam</strong>, behind Little Bay Beach, is open to walk around.</li>
<li><strong>Rainforest Adventures</strong> at Rockland Estate: the Sky Explorer chairlift from $59 a person, and the Flying Dutchman zipline from $109 (their prices, read October 2026).</li>
</ul>
<p><strong>Money.</strong> US dollars are accepted. The local currency is the Caribbean guilder, which replaced the old Antillean guilder in 2025.</p>
<p><strong>Emergency numbers:</strong> police 911, ambulance 912 (the island’s tourism bureau and government).</p>
<p><strong>Documents.</strong> Carry your passport.</p>
<p>More on the <a href="/ports/st-maarten.html">St. Maarten port page</a>, and the <a href="/ports/philipsburg.html">Philipsburg page</a>.</p>
<h3 id="pk-day-tortola">Day 5 — Friday, December 4 — Tortola, British Virgin Islands</h3>
<p><strong>In port:</strong> 9:00 AM to 6:00 PM. <strong>All aboard 5:00 PM.</strong> A long day here, which opens up more choices than most ships get at Tortola.</p>
<p><strong>The pier.</strong> Ships use the cruise pier in Road Town, the capital. Pier Park, with its shops and restaurants, is right at the pier, and travel guides put the walk into town at 10 to 15 minutes. CruiseMapper says the pier takes two large ships. When a third is in, one anchors and tenders.</p>
<p><strong>Things to know:</strong></p>
<ul>
<li><strong>Cane Garden Bay.</strong> A beach on the north side. A 2026 travel guide puts the taxi at $10 to $16 per person each way, about 20 minutes.</li>
<li><strong>The Baths on Virgin Gorda.</strong> The boulder beach and sea pools, on another island. With a 9:00 AM arrival and a 5:00 PM all-aboard, a Virgin Shore Thing is the simpler way. On your own, a local news report of the April 2026 Road Town Fast Ferry schedule shows a 10:00 AM boat out and a 1:30 PM boat back, which fits the day. Check the schedule before you count on it, because a missed boat means a missed ship.</li>
<li><strong>Road Town</strong> is walkable from the pier.</li>
</ul>
<p><strong>Money.</strong> The BVI uses the US dollar.</p>
<p><strong>Emergency numbers:</strong> 911; sea rescue 767 (the UK government’s travel advice).</p>
<p><strong>Documents.</strong> The BVI tourism board says a <strong>passport</strong> is required to enter and leave.</p>
<p>More on the <a href="/ports/tortola.html">Tortola port page</a>.</p>
<h3 id="pk-day-st-croix">Day 6 — Saturday, December 5 — St. Croix, U.S. Virgin Islands</h3>
<p><strong>In port:</strong> 8:00 AM to 6:00 PM. <strong>All aboard 5:00 PM.</strong></p>
<p><strong>The pier.</strong> Virgin says the ship docks at <strong>Frederiksted</strong>, on the west end. The Virgin Islands Port Authority calls the Ann E. Abramson Pier there “the only cruise ship port on St. Croix,” with shopping within walking distance.</p>
<p><strong>What it is.</strong> A US territory, so US dollars, and most US phone plans work as at home. <strong>They drive on the left.</strong></p>
<p><strong>Things to know:</strong></p>
<ul>
<li><strong>Fort Frederik</strong>, in Frederiksted, is walkable from the pier. A local visitor site lists admission at $5, and kids 16 and under free with an adult. It says the fort is open when cruise ships are in.</li>
<li><strong>Buck Island Reef National Monument.</strong> The National Park Service charges no entry fee. The boats leave from Christiansted, on the other side of the island, so this means a taxi across first. The Park Service says the trip out is 40 minutes to an hour and a half, depending on the boat. One operator, Big Beard’s, lists a half-day trip at $95 a person. It takes most of the day, so book a Shore Thing or start early.</li>
<li><strong>Christiansted.</strong> The National Park Service runs the old Danish fort there, Fort Christiansvaern: $10 for ages 16 and up, card only.</li>
</ul>
<p><strong>Emergency number:</strong> 911.</p>
<p><strong>Documents.</strong> US citizens don’t need a passport for the USVI, but you need one for the rest of this cruise, so carry it.</p>
<p>More on the <a href="/ports/st-croix.html">St. Croix port page</a>.</p>
<h3 id="pk-day-san-juan">Day 7 — Sunday, December 6 — San Juan, Puerto Rico</h3>
<p><strong>In port:</strong> 8:00 AM to 5:00 PM. <strong>All aboard 4:00 PM</strong>, the earliest of the trip.</p>
<p><strong>The pier.</strong> San Juan has several cruise piers. Some are in Old San Juan and some across the bay at the Pan American pier, which needs a taxi. <strong>Nobody has published which one Virgin uses for this sailing.</strong> Check the app.</p>
<p><strong>Things to know:</strong></p>
<ul>
<li><strong>El Morro and San Cristóbal</strong>, the two Spanish forts. The National Park Service charges <strong>$10 per person for ages 16 and up</strong>, good for 24 hours at both forts. <strong>The park does not take cash.</strong></li>
<li><strong>Old San Juan</strong> is best seen on foot. Wear real shoes.</li>
<li><strong>The free trolley.</strong> Several sources say it hasn’t run for some time. Don’t count on it.</li>
</ul>
<p><strong>What it is.</strong> A US territory: US dollars, US phone plans, 911.</p>
<p>More on the <a href="/ports/san-juan.html">San Juan port page</a>.</p>
<h3 id="pk-day-puerto-plata">Day 8 — Monday, December 7 — Puerto Plata, Dominican Republic</h3>
<p><strong>In port:</strong> 10:00 AM to 7:00 PM. <strong>All aboard 6:00 PM.</strong></p>
<p><strong>The pier.</strong> The port operator’s own schedule shows Brilliant Lady at <strong>Taíno Bay</strong> on December 7, 10:00 to 19:00. Taíno Bay is at the edge of Puerto Plata’s old town, and travel guides put the walk into town at 10 to 15 minutes.</p>
<p><strong>Things to know:</strong></p>
<ul>
<li><strong>Fortaleza San Felipe.</strong> The Dominican tourism ministry describes it as a fort the Spanish built in the 16th century to defend the north coast.</li>
<li><strong>The cable car up Mount Isabel de Torres is closed.</strong> Dominican news reports say it closed in June 2024, a rebuild started in October 2026, and reopening is targeted for early 2028.</li>
<li><strong>The old town and the malecón</strong> (the seafront walk) are free.</li>
<li><strong>Waterfalls and other inland trips:</strong> look at the Shore Things in the app, and keep the 6:00 PM all-aboard in mind.</li>
</ul>
<p><strong>Money.</strong> The Dominican peso. The tourism ministry says tourist businesses take dollars, at a worse rate than the banks.</p>
<p><strong>Emergency number:</strong> 911 (the Dominican tourism ministry).</p>
<p><strong>Documents.</strong> Passport. Cruise passengers don’t fill out the Dominican e-ticket form.</p>
<p>This site’s page for the other Puerto Plata pier, <a href="/ports/amber-cove.html">Amber Cove</a>, has more about the area.</p>
<h3 id="pk-day-bimini">Day 10 — Wednesday, December 9 — The Beach Club at Bimini, Bahamas</h3>
<p><strong>In port:</strong> 9:00 AM to 6:00 PM. <strong>All aboard 5:00 PM.</strong></p>
<p><strong>Getting there.</strong> Virgin’s page says a free tram runs “every few minutes between the cruise dock and the Beach Club.”</p>
<p><strong>Included</strong> (Virgin’s Beach Club page): Wi-Fi, the pools, loungers and umbrellas, lockers and showers, Bahamian food all day, soda and water, and morning yoga on the beach.</p>
<p><strong>Extra cost:</strong> cocktails (your Bar Tab works here), cabanas and the Airstream rentals, and Shore Things like watersports.</p>
<p><strong>Money.</strong> The Bahamas tourism office says Bahamian and US dollars are used interchangeably.</p>
<p><strong>Documents.</strong> The Bahamas is a foreign country. Carry your passport.</p>
<p><strong>A note on the advisory.</strong> The US State Department rates The Bahamas Level 2, “exercise increased caution,” because of crime. It says most of that crime is in Nassau and Freeport, not Bimini. See <a href="/admin/voyage-pwa/guides/brilliant-lady-solo-nov-2026-guide.html?v=d3e62728fa#section-8">Section 8</a>.</p>
<p>More on the <a href="/ports/bimini.html">Bimini port page</a>.</p>
<h3 id="pk-day-11-thursday-december-10-miami-debarkation">Day 11 — Thursday, December 10 — Miami (debarkation)</h3>
<p>The ship is due in at 6:30 AM. Virgin’s itinerary page says to allow up to an hour for the gangway to open. The app tells you how bags and walk-off times work.</p>
<p><strong>Flights home:</strong> book a flight that leaves after midday.</p>

 interior is a Solo Insider or a regular inside cabin booked for one. Virgin doesn’t publish the Solo Insider’s size or count for Brilliant Lady. Balcony at $2,316. That’s $601 more. Virgin calls balconies “Sea Terraces,” and its cabin page says almost all of them have a hammock. Brilliant Lady also has a category no sister has: the Slightly Smaller Sea Terrace , mid-ship on Deck 8, with two hammocks. Prices are from the flyer and can change until you book. Once you’re in your cabin, the cabin organization guide helps with small-space living."},{"t":"Dining","s":"ship","a":"pk-dining","x":"Everything below is included, except where marked. This list comes from Virgin’s dining pages. Rojo by Razzle Dazzle. Virgin says it’s on Brilliant Lady only: Spanish tapas and small plates. Razzle Dazzle , Pink Agave (Mexican), Extra Virgin (Italian), Gunbae (Korean barbecue on tabletop grills), The Test Kitchen and The Wake (steak and seafood). The Galley is the food hall, Virgin’s answer to a buffet: walk up, order, sit anywhere. The Pizza Place and Lick Me Till Ice Cream are there for in-between. Juice Sea , a wellness bar on Deck 7, is also new on Brilliant Lady. Room delivery (ShipEats) has a $10 delivery charge, waived on orders of $10 or more. Book dinners in the app as soon as Virgin opens them. How early depends on your fare: Virgin says 15 days before sailing for the lowest fares and up to 60 days for Premium. Ask Tina which you have."},{"t":"Shows","s":"ship","a":"pk-shows","x":"Virgin’s Brilliant Lady page lists: Disco Circus, Up With a Twist, Murder in the Manor, Duets, Electric, Red Hot, Out of Time and The Diva Goes West. Virgin’s FAQ names Another Rose and It’s a Ship Show as the dinner shows that cost extra. Whether any Brilliant Lady show other than those costs extra, check in the app."},{"t":"Getting online","s":"ship","a":"pk-getting-online","x":"Wi-Fi is part of every Virgin fare. What level you get depends on the fare, so ask Tina. The internet at sea guide covers how cruise Wi-Fi works and how to avoid roaming charges in port."},{"t":"Section 2 — Day by Day","s":"guide","a":"section-2","x":"The times below are from Virgin’s itinerary page for this voyage. Check them in the Virgin Voyages app before you sail. Ship time can differ from local time, so check the departure time again on your way off the ship. This is not your plan. What follows is one possible shape of the week, not a schedule to keep. Only a few things on it are actually fixed: the muster drill, sailaway, the ship’s arrival and all-aboard times in each port, and anything you have already booked. Everything else is a suggestion you are free to ignore, reorder, or sleep through. A day spent entirely on your balcony is not a day wasted, and nothing here is a commitment you have made to anyone."},{"t":"Day 1 — Monday, November 30 — Miami (embarkation)","s":"ports","a":"pk-day-1-monday-november-30-miami-embarkation","x":"Terminal V , 718 N. Cruise Blvd. For GPS, Virgin’s own story page says to enter 1015 North America Way, Miami, FL 33132 , then follow the signs. Parking is in PortMiami’s Garage G , $25 a day as of October 2026 (PortMiami’s rate). How boarding works at Virgin. You pick a terminal arrival time in the app, and Virgin asks you not to arrive before it. Luggage drop opens at 9:00 AM, so you can drop bags and wander until your time. Virgin’s FAQ says boarding generally starts around 2:15 PM. The ship leaves at 5:00 PM. Fly in the day before, Sunday November 29. That’s the Sunday after Thanksgiving, so book early, and a same-day flight leaves no room for a delay. Miami International is about 9 miles from the port, according to the airport. Taxis there run on the meter, with a $15 minimum. The first afternoon: Board, eat, find your muster station. Sailaway at 5:00 PM. Tina will say where the group meets, in the group chat. Group dinner. The flyer promises group dining each night. Tina sets the time and place. Virgin runs solo meetups . Its FAQ names an Evening Meet-Up, a Morning Meet-Up and a “Let’s Set Sail” event. Check the app for times. Keep in your carry-on: passport, medications, a swimsuit, a change of clothes, a charger. Bags can take until evening to arrive."},{"t":"Days 2 and 3 — Tuesday and Wednesday, December 1 and 2 — At sea","s":"guide","a":"days-2-and-3-tuesday-and-wednesday-december-1-and-2-at-sea","x":"Two quiet days heading southeast. Good days to: Book any dinners and Shore Things you haven’t yet. Try the Redemption Spa ’s Thermal Suite (a day pass costs extra) or a free fitness class. Walk the outdoor running track, or go to sunrise yoga at The Perch on Deck 17. Show up to whatever Tina’s group has planned."},{"t":"Day 4 — Thursday, December 3 — St. Maarten (Philipsburg)","s":"ports","a":"pk-day-st-maarten","x":"In port: 8:00 AM to 6:00 PM. All aboard 5:00 PM. What it is. The Dutch side of the island, Sint Maarten. The French side is Saint-Martin. Getting around. The local hotel and tourism association says you can walk from the port to town in about 10 minutes. The St. Maarten Tourism Bureau publishes taxi fares from the cruise port. For one or two people: Philipsburg $10, Maho Beach $25, the airport $25. For three to five people the fare is per person: Philipsburg $4 each, Maho $9 each. There’s a 25% surcharge between 10 PM and 6 AM and on public holidays. Things to know: Great Bay beach and the Philipsburg boardwalk. Walking distance and free. Maho Beach , at the end of the airport runway, is $25 by taxi for one or two. Fort Amsterdam , behind Little Bay Beach, is open to walk around. Rainforest Adventures at Rockland Estate: the Sky Explorer chairlift from $59 a person, and the Flying Dutchman zipline from $109 (their prices, read October 2026). Money. US dollars are accepted. The local currency is the Caribbean guilder, which replaced the old Antillean guilder in 2025. Emergency numbers: police 911, ambulance 912 (the island’s tourism bureau and government). Documents. Carry your passport. More on the St. Maarten port page , and the Philipsburg page ."},{"t":"Day 5 — Friday, December 4 — Tortola, British Virgin Islands","s":"ports","a":"pk-day-tortola","x":"In port: 9:00 AM to 6:00 PM. All aboard 5:00 PM. A long day here, which opens up more choices than most ships get at Tortola. The pier. Ships use the cruise pier in Road Town, the capital. Pier Park, with its shops and restaurants, is right at the pier, and travel guides put the walk into town at 10 to 15 minutes. CruiseMapper says the pier takes two large ships. When a third is in, one anchors and tenders. Things to know: Cane Garden Bay. A beach on the north side. A 2026 travel guide puts the taxi at $10 to $16 per person each way, about 20 minutes. The Baths on Virgin Gorda. The boulder beach and sea pools, on another island. With a 9:00 AM arrival and a 5:00 PM all-aboard, a Virgin Shore Thing is the simpler way. On your own, a local news report of the April 2026 Road Town Fast Ferry schedule shows a 10:00 AM boat out and a 1:30 PM boat back, which fits the day. Check the schedule before you count on it, because a missed boat means a missed ship. Road Town is walkable from the pier. Money. The BVI uses the US dollar. Emergency numbers: 911; sea rescue 767 (the UK government’s travel advice). Documents. The BVI tourism board says a passport is required to enter and leave. More on the Tortola port page ."},{"t":"Day 6 — Saturday, December 5 — St. Croix, U.S. Virgin Islands","s":"ports","a":"pk-day-st-croix","x":"In port: 8:00 AM to 6:00 PM. All aboard 5:00 PM. The pier. Virgin says the ship docks at Frederiksted , on the west end. The Virgin Islands Port Authority calls the Ann E. Abramson Pier there “the only cruise ship port on St. Croix,” with shopping within walking distance. What it is. A US territory, so US dollars, and most US phone plans work as at home. They drive on the left. Things to know: Fort Frederik , in Frederiksted, is walkable from the pier. A local visitor site lists admission at $5, and kids 16 and under free with an adult. It says the fort is open when cruise ships are in. Buck Island Reef National Monument. The National Park Service charges no entry fee. The boats leave from Christiansted, on the other side of the island, so this means a taxi across first. The Park Service says the trip out is 40 minutes to an hour and a half, depending on the boat. One operator, Big Beard’s, lists a half-day trip at $95 a person. It takes most of the day, so book a Shore Thing or start early. Christiansted. The National Park Service runs the old Danish fort there, Fort Christiansvaern: $10 for ages 16 and up, card only. Emergency number: 911. Documents. US citizens don’t need a passport for the USVI, but you need one for the rest of this cruise, so carry it. More on the St. Croix port page ."},{"t":"Day 7 — Sunday, December 6 — San Juan, Puerto Rico","s":"ports","a":"pk-day-san-juan","x":"In port: 8:00 AM to 5:00 PM. All aboard 4:00 PM , the earliest of the trip. The pier. San Juan has several cruise piers. Some are in Old San Juan and some across the bay at the Pan American pier, which needs a taxi. Nobody has published which one Virgin uses for this sailing. Check the app. Things to know: El Morro and San Cristóbal , the two Spanish forts. The National Park Service charges $10 per person for ages 16 and up , good for 24 hours at both forts. The park does not take cash. Old San Juan is best seen on foot. Wear real shoes. The free trolley. Several sources say it hasn’t run for some time. Don’t count on it. What it is. A US territory: US dollars, US phone plans, 911. More on the San Juan port page ."},{"t":"Day 8 — Monday, December 7 — Puerto Plata, Dominican Republic","s":"ports","a":"pk-day-puerto-plata","x":"In port: 10:00 AM to 7:00 PM. All aboard 6:00 PM. The pier. The port operator’s own schedule shows Brilliant Lady at Taíno Bay on December 7, 10:00 to 19:00. Taíno Bay is at the edge of Puerto Plata’s old town, and travel guides put the walk into town at 10 to 15 minutes. Things to know: Fortaleza San Felipe. The Dominican tourism ministry describes it as a fort the Spanish built in the 16th century to defend the north coast. The cable car up Mount Isabel de Torres is closed. Dominican news reports say it closed in June 2024, a rebuild started in October 2026, and reopening is targeted for early 2028. The old town and the malecón (the seafront walk) are free. Waterfalls and other inland trips: look at the Shore Things in the app, and keep the 6:00 PM all-aboard in mind. Money. The Dominican peso. The tourism ministry says tourist businesses take dollars, at a worse rate than the banks. Emergency number: 911 (the Dominican tourism ministry). Documents. Passport. Cruise passengers don’t fill out the Dominican e-ticket form. This site’s page for the other Puerto Plata pier, Amber Cove , has more about the area."},{"t":"Day 9 — Tuesday, December 8 — At sea","s":"guide","a":"day-9-tuesday-december-8-at-sea","x":"The last sea day, heading northwest. Settle your onboard account in the app, and leave room for the group."},{"t":"Day 10 — Wednesday, December 9 — The Beach Club at Bimini, Bahamas","s":"ports","a":"pk-day-bimini","x":"In port: 9:00 AM to 6:00 PM. All aboard 5:00 PM. Getting there. Virgin’s page says a free tram runs “every few minutes between the cruise dock and the Beach Club.” Included (Virgin’s Beach Club page): Wi-Fi, the pools, loungers and umbrellas, lockers and showers, Bahamian food all day, soda and water, and morning yoga on the beach. Extra cost: cocktails (your Bar Tab works here), cabanas and the Airstream rentals, and Shore Things like watersports. Money. The Bahamas tourism office says Bahamian and US dollars are used interchangeably. Documents. The Bahamas is a foreign country. Carry your passport. A note on the advisory. The US State Department rates The Bahamas Level 2, “exercise increased caution,” because of crime. It says most of that crime is in Nassau and Freeport, not Bimini. See Section 8 . More on the Bimini port page ."},{"t":"Day 11 — Thursday, December 10 — Miami (debarkation)","s":"ports","a":"pk-day-11-thursday-december-10-miami-debarkation","x":"The ship is due in at 6:30 AM. Virgin’s itinerary page says to allow up to an hour for the gangway to open. The app tells you how bags and walk-off times work. Flights home: book a flight that leaves after midday."},{"t":"Section 3 — Pre-Cruise Countdown","s":"guide","a":"section-3","x":""},{"t":"Now","s":"guide","a":"now","x":"Book through Maulsby Travel Co. That’s how you get into the group. Contact Tina Maulsby at tina@maulsbytravel.com or 910-528-5077. Ask Tina whether gratuities are in your fare, which Wi-Fi level you have, and whether your interior is a Solo Insider. Check your passport. Virgin’s travel page asks for a passport that’s valid at least six months after the cruise ends , so through June 10, 2027 . Virgin allows other papers for some round trips from Miami, but the BVI asks for a passport, so bring one. Buy travel insurance. Medical care aboard is billed to you. Book your flight in for Sunday November 29. It’s Thanksgiving weekend."},{"t":"When Virgin opens your bookings","s":"guide","a":"when-virgin-opens-your-bookings","x":"Dinner reservations in the app. When they open depends on your fare. Shore Things. St. Croix’s Buck Island and Tortola’s Virgin Gorda trip are the ones worth booking early. Bar Tab , if you want one. It can be bought up to 24 hours before sailing."},{"t":"The week before","s":"guide","a":"the-week-before","x":"Choose your terminal arrival time in the app. Fill in the handoff card in Section 6 and give it to one person at home. Count down with the countdown tool , if that helps."},{"t":"Section 4 — Packing List","s":"guide","a":"section-4","x":"This list fits early December in the Caribbean : warm days, a chance of showers, five port days, three sea days, and an adults-only line where nobody checks your outfit. The packing lists page has more."},{"t":"Documents and money","s":"guide","a":"documents-and-money","x":"Passport , valid through at least June 10, 2027 A copy of your passport, kept somewhere else Your insurance policy and its emergency number, printed Two cards, kept in different places Some small US bills for taxis and tips ashore A card for San Juan: the forts don’t take cash"},{"t":"Carry-on","s":"guide","a":"carry-on","x":"All medications, in their original bottles Phone, charger, power bank Refillable water bottle Swimsuit and a change of clothes"},{"t":"Daytime","s":"guide","a":"daytime","x":"Swimsuits and a cover-up Light shirts and shorts A light sweater for the air conditioning A light rain jacket Sunglasses, hat, reef-safe sunscreen"},{"t":"Evenings","s":"guide","a":"evenings","x":"Whatever you like to wear. Virgin’s rule is “Just Dress.” Something red for Scarlet Night , if you want to join in."},{"t":"Footwear","s":"guide","a":"footwear","x":"Walking shoes for Old San Juan Water shoes for the beaches Sandals"},{"t":"Leave at home","s":"guide","a":"leave-at-home","x":"Irons. Virgin says “clothing irons are a no go on board.” Valuable jewelry."},{"t":"Section 5 — Budget Breakdown","s":"guide","a":"section-5","x":"Prices here were checked in October 2026. Use them to plan, and check again before you sail. For your own total, the cruise budget calculator is set up for this."},{"t":"Included in a Virgin fare","s":"guide","a":"included-in-a-virgin-fare","x":"Your cabin Meals at every restaurant (a few “Treat Yourself” items aside) Soda and water, including sparkling Wi-Fi, at your fare’s level Fitness classes The shows (except the paid dinner shows) At Bimini: food, soda, water, Wi-Fi and the pools Whatever your group fare adds. Ask Tina"},{"t":"What might cost extra","s":"guide","a":"what-might-cost-extra","x":"Item What we know (October 2026) Gratuities $22 per person per night on board ($220 for 10 nights), or $20 per night pre-paid ($200), for bookings from Oct 7, 2025. Ask Tina whether yours are included Drinks Pay as you go, or pre-pay a Bar Tab. No packages Dinner shows Another Rose and It’s a Ship Show cost extra Spa Thermal Suite day passes cost extra ShipEats delivery $10, waived on orders of $10 or more St. Maarten Taxi to Maho Beach $25 for one or two; Rainforest Adventures from $59 Tortola Cane Garden Bay taxi $10 to $16 per person each way St. Croix Fort Frederik $5; Buck Island trip from about $95 (one operator) plus the taxi across; Christiansted fort $10 San Juan El Morro and San Cristóbal $10 (card only) Bimini Cocktails, cabanas, Airstreams, watersports Travel insurance Depends on age and coverage Hotel the night before Depends on Miami prices that weekend"},{"t":"Tipping","s":"guide","a":"tipping","x":"Virgin’s gratuity covers the crew in general. Its FAQ says “there’s no need to tip for drinks, dining, or spa treatments.” The cruise tipping calculator helps if you want to plan anything extra, and Cruise Tipping 2026 explains the custom."},{"t":"Section 6 — Emergency Contacts","s":"guide","a":"section-6","x":"Fill this in and give a copy to one person at home before you go. FAMILY HANDOFF — IN THE WAKE VOYAGE PACK ───────────────────────────────────────── CRUISER: ________________________ CABIN: ____________ SHIP: Brilliant Lady LINE: Virgin Voyages SAILING: November 30 – December 10, 2026 FROM: Miami, Florida, USA (Terminal V) ITINERARY: Miami → at sea → at sea → St. Maarten → Tortola (BVI) → St. Croix (USVI) → San Juan (PR) → Puerto Plata (DR) → at sea → Bimini (Bahamas) → Miami GROUP HOST: Tina Maulsby, Maulsby Travel Co. 910-528-5077 tina@maulsbytravel.com EMERGENCY (24/7): US Citizens Abroad — State Dept OCS: +1 (888) 407-4747 (from the US/Canada) +1 (202) 501-4444 (from abroad) Virgin Voyages Sailor Services: +1 (954) 488-2955 (US) EMERGENCY NUMBERS ASHORE: Miami, FL — 911 St. Maarten — police 911, ambulance 912 Tortola, BVI — 911; sea rescue 767 St. Croix, USVI — 911 San Juan, PR — 911 Puerto Plata, DR — 911 Bimini, Bahamas — ship's team and Beach Club staff US EMBASSIES AND CONSULATES (write in the number from the official site before you go): St. Maarten — Consulate General Curaçao: cw.usconsulate.gov ________________________ BVI — Embassy Bridgetown: bb.usembassy.gov ________________________ Dominican Republic — Embassy Santo Domingo: do.usembassy.gov ________________________ Bahamas — Embassy Nassau: bs.usembassy.gov ________________________ CRUISER MEDICAL: Allergies: ________________________ Medications: ________________________ Conditions: ________________________ Insurance: ________________________ policy: ____________ WHERE IS THE SHIP: cruisinginthewake.com/tools/ship-tracker.html ─────────────────────────────────────────"},{"t":"What the person at home should do","s":"guide","a":"what-the-person-at-home-should-do","x":"If they don’t hear from you for a day or two: Don’t panic. Ship Wi-Fi is patchy, and silence usually means no signal. Call Tina at Maulsby Travel Co. (910-528-5077). She’s aboard with the group and can be reached through Maulsby. Call Virgin Voyages Sailor Services at +1 (954) 488-2955. Virgin doesn’t publish a separate number for reaching someone aboard. If it’s serious, call the State Department’s Overseas Citizens Services: +1 (888) 407-4747. It’s free, it runs around the clock, and it works with cruise lines and embassies. To see where the ship is, use the ship tracker . The page on reaching someone at sea explains how all this works. Why no embassy phone numbers? The embassy and consulate sites couldn’t be read from where this pack was made. The only numbers found were in a 2022 Virgin document that still says “Netherland Antilles,” a country that ended in 2010. A wrong emergency number is worse than none. Look the numbers up on the sites above before you leave, and write them in. Watch out for fake numbers. A search for “Virgin Voyages ship to shore number” turns up a number on pages that aren’t Virgin’s. Use only numbers from virginvoyages.com."},{"t":"Section 7 — Seasickness and Early-December Weather","s":"guide","a":"section-7","x":""},{"t":"Weather","s":"guide","a":"weather","x":"Below are typical figures for November 30 to December 10, worked out from five years of weather records (2020 to 2024) for each stop. They’re averages, not a forecast. The companion app shows a real forecast once your dates are about two weeks away. Stop Typical high Typical low Days with rain Miami 78°F 65°F 20% St. Maarten 81°F 78°F 25% Tortola 81°F 79°F 27% St. Croix 83°F 78°F 29% San Juan 84°F 74°F 44% Puerto Plata 81°F 72°F 58% Bimini 76°F 73°F 22% These come from Open-Meteo’s historical weather records, at the grid point the records use for each stop. For small islands like St. Maarten and Tortola that point sits over the water, which is why their night-time lows look so close to the highs. Hurricanes. NOAA says the season ends November 30, the day you sail, and that storms “sometimes” form after the official dates. If one threatens, the cruise line can change ports or the order of the days."},{"t":"Seasickness","s":"guide","a":"seasickness","x":"Nobody can promise how your body will feel at sea. If you’re prone to seasickness: Pick a cabin low and in the middle of the ship , where motion is least. Ask your doctor or pharmacist about meclizine (Bonine), dimenhydrinate (Dramamine) or a prescription scopolamine patch, and try anything new at home first. Ginger and acupressure bands help some people. Fresh air and a view of the horizon help most people. The ship’s medical center can treat seasickness. It bills you, and most US health plans don’t cover care at sea, so check yours."},{"t":"Section 8 — Practical Logistics","s":"guide","a":"section-8","x":""},{"t":"Phones","s":"guide","a":"phones","x":"At sea: use the ship’s Wi-Fi, and turn off cellular data so you don’t pay for the ship’s network. St. Croix and San Juan: US territories. Most US plans work as at home. St. Maarten, Tortola and Puerto Plata: foreign. Some US plans include them, some charge a daily fee. Check with your carrier before you go. Bimini: the Beach Club has free Wi-Fi."},{"t":"Money","s":"guide","a":"money","x":"Aboard: US dollars, charged to your account. St. Maarten: US dollars accepted; local currency is the Caribbean guilder. Tortola, St. Croix, San Juan: US dollars. Puerto Plata: pesos; dollars taken in tourist areas at a worse rate. Bimini: Bahamian and US dollars, interchangeably."},{"t":"Travel advisories (US State Department)","s":"guide","a":"travel-advisories-us-state-department","x":"Sint Maarten: Level 1, “exercise normal precautions” (reissued August 2024). The Bahamas: Level 2, “exercise increased caution,” because of crime (July 2026). It says most crime is in Nassau and Freeport. Dominican Republic: Level 2, “exercise increased caution” (reissued June 2025). British Virgin Islands: Level 1, “exercise normal precautions” (May 2026). St. Croix and San Juan are US territory. The companion app’s Alerts tab shows the current level for each, refreshed daily."},{"t":"Laundry, smoking, and the rules","s":"guide","a":"laundry-smoking-and-the-rules","x":"Laundry. Virgin’s words: “While we don’t have a self-service launderette on board, we do offer full laundry service.” It costs extra. Smoking is allowed only in The Smoking Room on Deck 6 and a marked area on Deck 16. Smoking or vaping anywhere else, including your balcony, carries a $500 fee . Irons aren’t allowed."},{"t":"Accessibility","s":"guide","a":"accessibility","x":"If you use a wheelchair or a scooter, or need other help, tell Tina when you book so Virgin can note it. Virgin’s pages describe the ship docking at St. Croix and at Bimini, with a tram at Bimini. Ask Virgin about the other piers, and note that Tortola tenders one ship when three are in. The accessibility guide on this site covers more."},{"t":"Section 9 — The Group Cruise Rhythm","s":"guide","a":"section-9","x":"Tina is your host, and the plan comes through the group chat. The flyer lists what’s included: A host just for this group Group dining each night Daily meetups and activities Optional group shore excursions A private group chat , before and during the cruise Games and surprises along the way So expect a sailaway meetup, a dinner every night you want one, and some group options in port. Nothing is required. You can show up for every dinner, or for one. If you’re shy: go to the first dinner. Everybody at that table came alone. That’s the whole point of the group."},{"t":"Section 10 — Solo Cruising Considerations","s":"guide","a":"section-10","x":"Virgin is a good line for sailing alone, and Brilliant Lady has the pieces: Solo Insider cabins , which Virgin says are “designed and priced exclusively for the solo traveler.” Solo meetups run by Virgin itself: an Evening Meet-Up, a Morning Meet-Up, and the “Let’s Set Sail” event. Dinner is booked in the app, restaurant by restaurant, and the group has its own dinner each night. The Galley food hall is an easy place to eat alone. Adults only. Every other Sailor aboard is a grown-up. Safety, the same as at home: tell someone where you’re going ashore, keep your drink in sight, and book Shore Things if you’d rather not plan the day yourself. The solo cruising hub has more from people who’ve done it."},{"t":"Section 11 — First Cruise Notes","s":"guide","a":"section-11","x":"If this is your first cruise, the first-cruise guide goes deeper. A few things worth knowing ahead: Cabins are small. Even a balcony cabin is smaller than most hotel rooms. The Virgin Voyages app runs the week. Download it and log in before you go. Be back early. Be back aboard before all-aboard time. If you’re late on your own, the ship can leave without you. You don’t have to do everything. Ten days is long enough to skip things. The cruise duck tradition is a small, friendly custom worth knowing about. If you like photos, the cruise tech and photography guide helps you pack the right gear."},{"t":"Closing","s":"guide","a":"closing","x":"This pack is a plain read on ten days: Virgin’s youngest ship, six warm stops, and a table every night of people who came alone and don’t have to stay that way. Check the numbers before you go, book through Maulsby Travel Co., and enjoy it. Share or save. The companion app has a share button. If someone you know is thinking about this cruise, send them the link. Soli Deo Gloria. All work on this project is offered as a gift to God. The site that produced it is independent: no affiliate links, no commissions, no upsells. If it helped you, that’s the whole point. Last reviewed | 2026-10-05. Sailing times and ship facts from Virgin Voyages’ own pages; port facts as noted below | How facts here are checked | Every fact in this pack is listed with its source in the pack’s fact-check file. The sailing’s dates, port order and times come from Virgin Voyages’ itinerary page for this voyage. Ship facts come from Virgin’s fact sheet, ship page and press releases, and from the builder, Fincantieri. Port facts come from government, park and tourism sources (the St. Maarten Tourism Bureau, the Virgin Islands Port Authority, the National Park Service, the BVI tourism board, the Dominican tourism ministry, the Bahamas tourism office, the UK government’s travel advice, the US State Department, NOAA) and from named travel sites where those had no answer. Weather averages were calculated from Open-Meteo’s historical weather records. Where sources disagreed, the pack says so or leaves the number out. | Accessibility | This pack is written to read straight through on a screen reader: headings in order, small labeled tables, and links named for where they go. If something here is hard for you to use, that’s a bug. Tell Tina and it’ll get back to me. | Sources | Ship: Brilliant Lady and sisters Scarlet Lady , Valiant Lady , Resilient Lady ; Virgin Voyages itinerary page, FAQ, ship page, 2025 fact sheet and press releases; Fincantieri. Ports on this site: Miami , St. Maarten , Philipsburg , Tortola , St. Croix , San Juan , Amber Cove , Bimini . Venues: Razzle Dazzle , Pink Agave , Extra Virgin , Gunbae , The Test Kitchen , The Wake , The Galley , The Pizza Place , Lick Me Till Ice Cream . Tools: cruise budget calculator , cruise tipping calculator , ship tracker , ship size atlas . Reference: solo cruising hub , first-cruise guide , countdown , packing lists , internet at sea , reaching someone at sea , disability at sea . Articles: cruise cabin organization , Cruise Tipping 2026 , cruise duck tradition , cruise tech and photography guide . Cover: the Maulsby Travel Co. flyer for this sailing. |"}]</script>
