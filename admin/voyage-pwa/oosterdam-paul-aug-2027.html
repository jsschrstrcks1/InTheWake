<h2 id="pk-section-1">Section 1 — Your Ship: Oosterdam</h2>
<h3 id="pk-built-in-2003-refit-coming-after-your-cruise">Built in 2003, refit coming after your cruise</h3>
<p><a href="/ships/holland-america-line/oosterdam.html">Oosterdam</a> is a Holland America ship built in 2003 and flagged in the Netherlands. VesselFinder lists her at 82,820 gross tons and 285 m long. Gross tonnage isn’t a weight; it measures the ship’s enclosed volume. If you want to see how she compares with other ships, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> lines them up.</p>
<p>In June 2025 Holland America said that in 2027 “Oosterdam will continue as the cruise line’s primary ship to sail Mediterranean cruises,” on voyages of seven to eleven days from Barcelona, Piraeus, Trieste and Civitavecchia. This cruise is one of them.</p>
<h3 id="pk-whats-on-board">What’s on board</h3>
<p>Holland America’s FAQ, read November 2026, describes these across its fleet. Check the app for what’s on Oosterdam the week you sail.</p>
<ul>
<li><strong>A medical center</strong>, “staffed by licensed doctors and nurses,” open twice a day for routine care, with the medical staff “available 24/7” for urgent care. Holland America asks you to bring a copy of your medical records.</li>
<li><strong>Sunday worship.</strong> “On Sunday mornings, an interdenominational service is held and led by the congregation.” Your first sea day, August 29, is a Sunday. The group will have its own program too.</li>
<li><strong>The Greenhouse Spa &amp; Salon</strong>, a fitness center, pools, shops and a photo gallery.</li>
<li><strong>Laundry, but not self-service.</strong> “Holland America Line ships do not offer self-service laundry rooms.” You can buy a laundry package ahead of time in your Holland America account.</li>
</ul>
<h3 id="pk-getting-on-and-off-if-walking-is-hard">Getting on and off, if walking is hard</h3>
<p>Holland America says that for guests with limited mobility “the use of a wheelchair will be the primary mobility assistance aid for getting on and off the ship,” and that gangways can be steep “particularly during low or high tide.” If a port is a tender port (small boats take you ashore), it says that “with the exception of the Volendam and Zaandam, Holland America Line vessels have elevators to the tender level.” That includes Oosterdam. Weather can still stop a transfer, and <strong>the captain makes the final call</strong> on whether to help a guest ashore. Tell Inspiration Travel about any mobility needs when you book.</p>
<h3 id="pk-connectivity">Connectivity</h3>
<p>The ship has Wi-Fi for a fee. Prices change, so check the packages in your Holland America account. The <a href="/internet-at-sea.html">internet at sea guide</a> explains how ship Wi-Fi works.</p>
<hr />

<h3 id="pk-day-barcelona">Day 1 — Saturday, August 28 — Barcelona (embarkation)</h3>
<p><strong>Boarding:</strong> your Holland America booking gives the time and the terminal.</p>
<ul>
<li><strong>Paul and Spain.</strong> Paul wanted to come this way. He wrote to the church at Rome, “Whensoever I take my journey into Spain, I will come to you” (Romans 15:24), and again, “I will come by you into Spain” (15:28). Scripture doesn’t say he ever got here. That’s as close as Barcelona comes to the New Testament, and it’s not a bad place to start: a man with a plan, holding it open before God.</li>
<li><strong>Getting to the ship.</strong> The State Department says “Taxis from Barcelona airport to the cruise terminal cost a flat fee,” and to ask for a receipt. The brochure says transfers from the pier and flight and hotel quotes “are all available” from Inspiration Travel.</li>
<li><strong>Arrive a day early</strong> if you’re flying from the US. An overnight flight and a same-day boarding is a hard day for anyone.</li>
<li><strong>Carry-on.</strong> Keep your passports, medications and a change of clothes with you until your luggage reaches the cabin.</li>
</ul>
<p>More on the <a href="/ports/barcelona.html">Barcelona port page</a>.</p>
<h3 id="pk-day-valletta">Day 3 — Monday, August 30 — Valletta, Malta</h3>
<ul>
<li><strong>Paul and Malta.</strong> This is the island of Acts 28. After two weeks driven by a storm, Paul’s ship ran aground, and everyone aboard reached land: “And so it came to pass, that they escaped all safe to land” (Acts 27:44). “And when they were escaped, then they knew that the island was called Melita” (Acts 28:1). The islanders “shewed us no little kindness: for they kindled a fire, and received us every one” (28:2). A viper fastened on Paul’s hand, and he “shook off the beast into the fire, and felt no harm” (28:5). He prayed for the father of Publius, “the chief man of the island,” and healed him (28:7-8). After three months they sailed on (28:11).</li>
<li><strong>What you can see.</strong> Malta keeps Paul’s memory in many places. This pack couldn’t confirm the details from an official Maltese source in November 2026, so ask your group leaders or a local guide what’s open the day you’re there.</li>
<li><strong>Getting into town.</strong> Ask at the pier, or your group, how to reach the old city before you set out on foot.</li>
<li><strong>Money:</strong> the euro.</li>
</ul>
<p>More on the <a href="/ports/valletta.html">Valletta port page</a>.</p>
<h3 id="pk-day-souda">Day 5 — Wednesday, September 1 — Souda (Chania), Crete, Greece</h3>
<ul>
<li><strong>Paul and Crete.</strong> Paul’s ship sailed “under Crete” and put in at “a place which is called The fair havens; nigh whereunto was the city of Lasea” (Acts 27:7-8). Paul warned them: “Sirs, I perceive that this voyage will be with hurt and much damage” (27:10). They sailed on anyway, hoping for a better harbor to winter in, and the storm caught them. Later Paul wrote to Titus, “For this cause left I thee in Crete, that thou shouldest set in order the things that are wanting, and ordain elders in every city” (Titus 1:5). Souda isn’t Fair Havens; this pack doesn’t claim the ship calls where Paul’s did.</li>
<li><strong>Chania</strong> is the town the port serves. Your group or the ship will say how you get there.</li>
<li><strong>Money:</strong> the euro.</li>
</ul>
<h3 id="pk-day-mykonos">Day 6 — Thursday, September 2 — Mykonos, Greece</h3>
<ul>
<li><strong>No Bible link.</strong> Scripture never mentions Mykonos. Take it as a rest day for your feet before Ephesus.</li>
<li><strong>Port details.</strong> Whether the ship docks or tenders is in your daily program. If it’s a tender, see <a href="/admin/voyage-pwa/guides/oosterdam-paul-aug-2027-guide.html?v=09aab46e07#section-1">Getting on and off</a> above.</li>
<li><strong>Money:</strong> the euro.</li>
</ul>
<p>More on the <a href="/ports/mykonos.html">Mykonos port page</a>.</p>
<h3 id="pk-day-kusadasi">Day 7 — Friday, September 3 — Kusadasi (Ephesus), Turkey</h3>
<p>This is the day the brochure builds to: a <strong>group excursion in Ephesus.</strong></p>
<ul>
<li><strong>Paul and Ephesus.</strong> Paul told the Ephesian elders that “by the space of three years I ceased not to warn every one night and day with tears” (Acts 20:31). He spent two of those years “disputing daily in the school of one Tyrannus. And this continued by the space of two years; so that all they which dwelt in Asia heard the word of the Lord Jesus” (Acts 19:9-10). “So mightily grew the word of God and prevailed” (19:20). The silversmiths who made shrines for Diana stirred up the city, and the crowd “rushed with one accord into the theatre,” crying “Great is Diana of the Ephesians” for “about the space of two hours” (19:29, 34). Later Paul called the Ephesian elders to Miletus and told them, “And now, brethren, I commend you to God, and to the word of his grace” (20:32). He wrote “to the saints which are at Ephesus” (Ephesians 1:1). And the Lord’s word to this church in Revelation still lands: “thou hast left thy first love” (Revelation 2:4).</li>
<li><strong>What you can see.</strong> Turkey’s Ministry of Culture describes the ruins of Ephesus as including the theatre, the Agora (the market square), the Library of Celsus, the Odeum and the bathhouses. It calls the city “a key city in the expansion of Christianity, from which St Paul launched many of his missions.”</li>
<li><strong>Hours.</strong> The Ministry lists the site as open every day, 8:00 AM to 6:00 PM, with the ticket office closing at 5:30 PM (read November 2026). Hours can change by season. Your excursion handles tickets.</li>
<li><strong>It’s hot, and it’s stone.</strong> Turkey’s weather service puts the August average high for Aydın province at about 97°F. Ephesus is a big site of old stone. Wear shoes with grip, bring water, and take a hat.</li>
<li><strong>Money:</strong> Turkey isn’t on the euro. Ask your guide what’s taken, or use a card.</li>
<li><strong>Travel advisory.</strong> Turkey is at Level 2, “exercise increased caution.” The State Department’s “do not travel” area is the region on the Syria and Iraq borders. See <a href="/admin/voyage-pwa/guides/oosterdam-paul-aug-2027-guide.html?v=09aab46e07#section-8">Section 8</a>.</li>
</ul>
<p>More on the <a href="/ports/kusadasi.html">Kusadasi port page</a>.</p>
<h3 id="pk-day-piraeus">Day 8 — Saturday, September 4 — Piraeus (Athens), Greece (debarkation)</h3>
<ul>
<li><strong>Paul and Athens.</strong> Paul waited here for Silas and Timothy, “and his spirit was stirred in him, when he saw the city wholly given to idolatry” (Acts 17:16). Then he “stood in the midst of Mars’ hill, and said, Ye men of Athens … I found an altar with this inscription, TO THE UNKNOWN GOD. Whom therefore ye ignorantly worship, him declare I unto you” (17:22-23). “God that made the world and all things therein … dwelleth not in temples made with hands” (17:24). Some mocked. A few believed, “among the which was Dionysius the Areopagite, and a woman named Damaris” (17:34).</li>
<li><strong>Leaving the ship.</strong> Holland America will tell you how and when to leave the ship. If you’re staying in Athens or flying out the same day, ask Inspiration Travel about transfers.</li>
<li><strong>The Acropolis.</strong> If you’re staying on, Greece’s Ministry of Culture runs the site and publishes its hours. Its website wouldn’t load for this pack in November 2026, so check it before you go, and expect heat and worn marble underfoot.</li>
<li><strong>Money:</strong> the euro.</li>
</ul>
<p>More on the <a href="/ports/athens.html">Athens port page</a>.</p>

<script type="application/json" id="pack-index">[{"t":"Welcome","s":"guide","a":"welcome","x":"Made for anyone sailing this cruise, or thinking about it, who wants one plain read on the week: the ship, the six stops, what Paul did near each of them, and what to check before you go. This pack is about one cruise: Oosterdam , Holland America Line, sailing seven nights from Barcelona, Spain, on Saturday August 28, 2027, to Piraeus, the port of Athens, on Saturday September 4. She calls at Valletta (Malta), Souda (for Chania, on Crete), Mykonos and Kusadasi (for Ephesus) , with two sea days. It’s a group cruise. Salem Media presents it as the “Deeper Faith Mediterranean Cruise with Alistair Begg,” and Inspiration Travel organizes it. The brochure lists Bible teaching with Alistair Begg , worship with Michael O’Brien , and a group excursion in Ephesus . Booking and group questions go to Inspiration Travel, 800-247-1899 , or inspirationtravel.com ."},{"t":"A note on what’s first-hand here and what isn’t","s":"guide","a":"a-note-on-whats-first-hand-here-and-what-isnt","x":"Nothing in this pack comes from a past sailing on Oosterdam or a visit to these ports. It comes from Holland America’s own press releases and FAQ, the group’s brochure, the US State Department, the European Union, Spain’s and Turkey’s national weather services, Turkey’s Ministry of Culture, Medicare, and the King James text of the Bible. Where nobody had an answer, the pack says so. The fact-check file behind this pack lists what was checked, where, and when. Prices and policies here were checked in November 2026, about ten months before you sail. Check them again before final payment, and again the month before. Where this pack and Holland America’s app disagree, go with the app. Where it disagrees with Inspiration Travel, go with them. It is calm by design. No urgency, no upsell, no countdown timer. The site that produced this pack is independent: no cruise-line affiliations, no shore-excursion commissions, no display ads. (See our affiliate disclosure .) A note on the ship’s schedule. Holland America is giving Oosterdam a big refit it calls “Holland America Evolution,” in Marseille, France. On September 9, 2026, it moved the work five weeks earlier and said that “several previously published voyages from Sept. 11, 2027, to Dec. 9, 2027, have been canceled.” Your cruise ends September 4, before that window. It also means you sail on Oosterdam before the refit. The new Grand Dutch Café, the redesigned Ocean Bar, the Solo Verandahs and the new suites come after her return to service on October 31, 2027, so don’t count on them for this trip. Includes an Emergency Contacts section with a fillable handoff card to leave with someone at home. The companion app keeps the card on your phone, and it works offline once it’s loaded."},{"t":"At a Glance","s":"guide","a":"at-a-glance","x":"Ship Oosterdam , Holland America Line, built 2003 Size About 82,800 gross tons (a measure of enclosed volume, not weight) · 285 m (936 ft) long · Netherlands flag (VesselFinder) Sails from Barcelona , Spain · Saturday August 28, 2027 Ends at Piraeus, the port of Athens , Greece · Saturday September 4, 2027 Itinerary 7 nights · one way · two sea days Group Salem Media’s Deeper Faith Mediterranean Cruise with Alistair Begg, organized by Inspiration Travel Brochure price “Starting at $2,958” a person, two to a cabin, including cruise fare and government taxes and fees. Air not included. $50 off a person for booking online (first two people in the cabin) Currency aboard US dollar (Holland America) Ashore Euro in Spain, Malta and Greece (European Central Bank). Turkey isn’t in the euro area"},{"t":"Ports of call","s":"guide","a":"ports-of-call","x":"These come from the group’s brochure. It says, “All dates and locations subject to change.” Holland America hasn’t published arrival and departure times anywhere this pack could read them, so they aren’t here. They will be in your Holland America booking and app before you sail, and in the ship’s daily program. Barcelona , Spain. Board Saturday August 28 At sea. Sunday August 29 Valletta , Malta. Monday August 30 At sea. Tuesday August 31 Souda (Chania), Crete, Greece. Wednesday September 1 Mykonos , Greece. Thursday September 2 Kusadasi (Ephesus), Turkey. Friday September 3 Piraeus ( Athens ), Greece. Leave the ship Saturday September 4 Be back on board by the time the ship gives you. The all-aboard time for each port comes in your booking and the ship’s daily program, and it’s earlier than the departure time. Write it down before you go ashore."},{"t":"Section 1 — Your Ship: Oosterdam","s":"ship","a":"pk-section-1","x":""},{"t":"Built in 2003, refit coming after your cruise","s":"ship","a":"pk-built-in-2003-refit-coming-after-your-cruise","x":"Oosterdam is a Holland America ship built in 2003 and flagged in the Netherlands. VesselFinder lists her at 82,820 gross tons and 285 m long. Gross tonnage isn’t a weight; it measures the ship’s enclosed volume. If you want to see how she compares with other ships, the Ship Size Atlas lines them up. In June 2025 Holland America said that in 2027 “Oosterdam will continue as the cruise line’s primary ship to sail Mediterranean cruises,” on voyages of seven to eleven days from Barcelona, Piraeus, Trieste and Civitavecchia. This cruise is one of them."},{"t":"What’s on board","s":"ship","a":"pk-whats-on-board","x":"Holland America’s FAQ, read November 2026, describes these across its fleet. Check the app for what’s on Oosterdam the week you sail. A medical center , “staffed by licensed doctors and nurses,” open twice a day for routine care, with the medical staff “available 24/7” for urgent care. Holland America asks you to bring a copy of your medical records. Sunday worship. “On Sunday mornings, an interdenominational service is held and led by the congregation.” Your first sea day, August 29, is a Sunday. The group will have its own program too. The Greenhouse Spa & Salon , a fitness center, pools, shops and a photo gallery. Laundry, but not self-service. “Holland America Line ships do not offer self-service laundry rooms.” You can buy a laundry package ahead of time in your Holland America account."},{"t":"Getting on and off, if walking is hard","s":"ship","a":"pk-getting-on-and-off-if-walking-is-hard","x":"Holland America says that for guests with limited mobility “the use of a wheelchair will be the primary mobility assistance aid for getting on and off the ship,” and that gangways can be steep “particularly during low or high tide.” If a port is a tender port (small boats take you ashore), it says that “with the exception of the Volendam and Zaandam, Holland America Line vessels have elevators to the tender level.” That includes Oosterdam. Weather can still stop a transfer, and the captain makes the final call on whether to help a guest ashore. Tell Inspiration Travel about any mobility needs when you book."},{"t":"Connectivity","s":"ship","a":"pk-connectivity","x":"The ship has Wi-Fi for a fee. Prices change, so check the packages in your Holland America account. The internet at sea guide explains how ship Wi-Fi works."},{"t":"Section 2 — Day by Day, with Paul","s":"guide","a":"section-2","x":"Each day has the stop, what Scripture says happened near there, and a few practical notes. The Bible quotations are from the King James Version. The port pages on this site go deeper."},{"t":"Day 1 — Saturday, August 28 — Barcelona (embarkation)","s":"ports","a":"pk-day-barcelona","x":"Boarding: your Holland America booking gives the time and the terminal. Paul and Spain. Paul wanted to come this way. He wrote to the church at Rome, “Whensoever I take my journey into Spain, I will come to you” (Romans 15:24), and again, “I will come by you into Spain” (15:28). Scripture doesn’t say he ever got here. That’s as close as Barcelona comes to the New Testament, and it’s not a bad place to start: a man with a plan, holding it open before God. Getting to the ship. The State Department says “Taxis from Barcelona airport to the cruise terminal cost a flat fee,” and to ask for a receipt. The brochure says transfers from the pier and flight and hotel quotes “are all available” from Inspiration Travel. Arrive a day early if you’re flying from the US. An overnight flight and a same-day boarding is a hard day for anyone. Carry-on. Keep your passports, medications and a change of clothes with you until your luggage reaches the cabin. More on the Barcelona port page ."},{"t":"Day 2 — Sunday, August 29 — At sea","s":"guide","a":"day-2-sunday-august-29-at-sea","x":"A Sunday at sea. Holland America holds an interdenominational service on Sunday mornings, and the group will have its own sessions. Sleep. Walk the deck. Read ahead to Malta: Acts 27 and 28."},{"t":"Day 3 — Monday, August 30 — Valletta, Malta","s":"ports","a":"pk-day-valletta","x":"Paul and Malta. This is the island of Acts 28. After two weeks driven by a storm, Paul’s ship ran aground, and everyone aboard reached land: “And so it came to pass, that they escaped all safe to land” (Acts 27:44). “And when they were escaped, then they knew that the island was called Melita” (Acts 28:1). The islanders “shewed us no little kindness: for they kindled a fire, and received us every one” (28:2). A viper fastened on Paul’s hand, and he “shook off the beast into the fire, and felt no harm” (28:5). He prayed for the father of Publius, “the chief man of the island,” and healed him (28:7-8). After three months they sailed on (28:11). What you can see. Malta keeps Paul’s memory in many places. This pack couldn’t confirm the details from an official Maltese source in November 2026, so ask your group leaders or a local guide what’s open the day you’re there. Getting into town. Ask at the pier, or your group, how to reach the old city before you set out on foot. Money: the euro. More on the Valletta port page ."},{"t":"Day 4 — Tuesday, August 31 — At sea","s":"guide","a":"day-4-tuesday-august-31-at-sea","x":"Today you sail between Malta and Crete, roughly the water Paul crossed the hard way, in the other direction. Read Acts 27:13-44 this morning. “There arose against it a tempestuous wind, called Euroclydon” (27:14). “And when neither sun nor stars in many days appeared, and no small tempest lay on us, all hope that we should be saved was then taken away” (27:20). They were driven “up and down in Adria” until “the fourteenth night was come” (27:27). On a calm day with lunch on deck, that chapter reads differently."},{"t":"Day 5 — Wednesday, September 1 — Souda (Chania), Crete, Greece","s":"ports","a":"pk-day-souda","x":"Paul and Crete. Paul’s ship sailed “under Crete” and put in at “a place which is called The fair havens; nigh whereunto was the city of Lasea” (Acts 27:7-8). Paul warned them: “Sirs, I perceive that this voyage will be with hurt and much damage” (27:10). They sailed on anyway, hoping for a better harbor to winter in, and the storm caught them. Later Paul wrote to Titus, “For this cause left I thee in Crete, that thou shouldest set in order the things that are wanting, and ordain elders in every city” (Titus 1:5). Souda isn’t Fair Havens; this pack doesn’t claim the ship calls where Paul’s did. Chania is the town the port serves. Your group or the ship will say how you get there. Money: the euro."},{"t":"Day 6 — Thursday, September 2 — Mykonos, Greece","s":"ports","a":"pk-day-mykonos","x":"No Bible link. Scripture never mentions Mykonos. Take it as a rest day for your feet before Ephesus. Port details. Whether the ship docks or tenders is in your daily program. If it’s a tender, see Getting on and off above. Money: the euro. More on the Mykonos port page ."},{"t":"Day 7 — Friday, September 3 — Kusadasi (Ephesus), Turkey","s":"ports","a":"pk-day-kusadasi","x":"This is the day the brochure builds to: a group excursion in Ephesus. Paul and Ephesus. Paul told the Ephesian elders that “by the space of three years I ceased no el advisories again ( Section 8 ). They change in both directions. Fill in the handoff card ( Section 6 ) and give it to someone at home."},{"t":"Section 4 — Packing List","s":"guide","a":"section-4","x":""},{"t":"Documents and money","s":"guide","a":"documents-and-money","x":"Passports, and a photocopy kept apart from them A credit card that doesn’t charge foreign transaction fees Some euros for small purchases Insurance card and policy number A list of your medications, with generic names, and a copy of your medical records"},{"t":"Carry-on","s":"guide","a":"carry-on","x":"All medications, in their original containers, with a few extra days’ worth A change of clothes Phone charger"},{"t":"Daytime ashore","s":"guide","a":"daytime-ashore","x":"Walking shoes with grip. Old marble gets slick with wear. Hat, sunglasses, sunscreen, a refillable water bottle A light scarf or covering for church visits A small Bible, or the app on your phone"},{"t":"Evenings","s":"guide","a":"evenings","x":"Holland America’s FAQ mentions “Dressy Nights.” Pack one nicer outfit."},{"t":"Section 5 — Budget Breakdown","s":"guide","a":"section-5","x":""},{"t":"Your fare","s":"guide","a":"your-fare","x":"The brochure says the “starting at $2,958” price is “per passenger based on two per cabin” and includes “cruise fare, government taxes & fees.” It says “Air transportation not included.” Call Inspiration Travel for single rates and wheelchair-accessible cabins."},{"t":"What might cost extra","s":"guide","a":"what-might-cost-extra","x":"Flights to Barcelona and home from Athens Crew Appreciation. Holland America’s FAQ says it “is US $18.00 per guest per day for non-suite stateroom guests and US $20.00 per guest per day for suite guests,” and that it’s “adjustable at your discretion while on board.” For seven nights that’s about $126 a person in a standard cabin, or $140 in a suite. Ask Inspiration Travel whether your package includes it. Drinks, specialty dining, spa, Wi-Fi and laundry Shore excursions other than the group’s Ephesus excursion Hotels if you go early or stay on in Athens The cruise budget calculator can help you add it up."},{"t":"Section 6 — Emergency Contacts","s":"guide","a":"section-6","x":"Fill this in and give a copy to one person at home before you go. FAMILY HANDOFF — IN THE WAKE VOYAGE PACK ───────────────────────────────────────── CRUISER(S): ________________________ CABIN: ____________ SHIP: Oosterdam LINE: Holland America Line SAILING: August 28 – September 4, 2027 FROM: Barcelona, Spain TO: Piraeus (Athens), Greece ITINERARY: Barcelona → at sea → Valletta (Malta) → at sea → Souda/Chania (Crete) → Mykonos → Kusadasi/Ephesus (Turkey) → Piraeus (Athens) GROUP: Salem Media Deeper Faith Cruise Inspiration Travel 800-247-1899 DAILY CHECK-IN: We'll message by ______ each evening (ship time). No message by ______ ? Follow the steps below. EMERGENCY (24/7): US Citizens Abroad — State Dept: +1 (888) 407-4747 (from the US/Canada) +1 (202) 501-4444 (from abroad) Holland America emergency line (from the US): 1-800-426-0327 business hours, Pacific (Mon–Fri 5 AM–7 PM, Sat–Sun 7 AM–3:30 PM) 1-800-628-4771 after hours and holidays 1-206-626-7382 critical emergencies only EMERGENCY NUMBERS ASHORE: Spain, Malta, Greece — 112 (EU emergency number) Turkey — 155 (police) US EMBASSIES (emergency lines): Spain — Embassy Madrid: +34 91-587-2200 Consulate General Barcelona: +34 93-280-2227 Malta — Embassy (Attard): +356 2561-4000 Greece — Embassy Athens: +30 210-721-2951 Turkey — Embassy Ankara: +90 312-294-0000 (emergencies only) CRUISER MEDICAL: Allergies: ________________________ Medications: ________________________ Conditions: ________________________ Insurance: ________________________ policy: ____________ WHERE IS THE SHIP: cruisinginthewake.com/tools/ship-tracker.html ─────────────────────────────────────────"},{"t":"What the person at home should do","s":"guide","a":"what-the-person-at-home-should-do","x":"If they don’t hear from you by the check-in time: Don’t panic. Ship Wi-Fi drops, and people forget. Wait for the next check-in. Then try their phones and messages. Call Inspiration Travel at 800-247-1899. Call Holland America’s emergency line above. If it’s serious, call the State Department: +1 (888) 407-4747. To see where the ship is, use the ship tracker . The page on reaching someone at sea explains how all this works. Where these numbers come from. The embassy and consulate lines, and the 155 police number for Turkey, are from the State Department’s own country information, read November 2026. 112 is from the European Union’s page on its emergency number. Holland America’s lines are from its FAQ. The State Department’s 24/7 numbers are as published on US consulate sites, read October 2026. Check them all again before you go."},{"t":"Section 7 — Weather, Seasickness and Medicare","s":"guide","a":"section-7","x":""},{"t":"Weather","s":"guide","a":"weather","x":"Late August and early September are hot here. Stop Average high Average low Rain Source Barcelona 83°F 68°F About 4 or 5 days of rain in August Spain’s weather service (AEMET), Barcelona airport, 1981-2010 Kusadasi (Ephesus) 97°F 69°F Under one rainy day in August Turkey’s weather service (MGM), Aydın province Valletta, Chania, Mykonos, Athens not yet not yet not yet No published average reached in November 2026 The Turkish figures are for Aydın province’s weather station, not Kusadasi itself. The companion app shows a live forecast for each stop from about two weeks before you sail. The State Department warns that Spain “often experiences intense heatwaves” in summer. Drink water before you’re thirsty, rest in the shade, and don’t push through the middle of the day."},{"t":"Seasickness","s":"guide","a":"seasickness","x":"Nobody can promise how your body will feel at sea. If you’re prone to seasickness: Think about where your cabin is. A cabin low and near the middle of the ship moves the least. Ask your doctor or pharmacist about meclizine, dimenhydrinate or a prescription scopolamine patch, which the CDC names, and try anything new at home first. Fresh air and a view of the horizon: the CDC says a visible horizon gives “some protection” on ships."},{"t":"Medicare and medical care abroad","s":"guide","a":"medicare-and-medical-care-abroad","x":"Read this one twice. Medicare’s own guide says, “Medicare doesn’t cover health care services you get when the ship is more than 6 hours away from a U.S. port.” This whole cruise is in the Mediterranean. The same guide says “Medicare plans can’t cover drugs you buy outside the U.S.” Ask your insurance agent about a travel medical policy before you go, and ask about medical evacuation coverage too. The ship’s medical center bills you."},{"t":"Section 8 — Practical Logistics","s":"guide","a":"section-8","x":""},{"t":"Phones","s":"guide","a":"phones","x":"At sea: use the ship’s Wi-Fi, and turn off cellular data so you don’t pay for the ship’s network. In port: every stop is outside the US. Some US plans include Europe and Turkey, some charge a daily fee. Check with your carrier before you go."},{"t":"Money","s":"guide","a":"money","x":"Aboard: US dollars, on your shipboard account. Spain, Malta, Greece: the euro (European Central Bank). Turkey: not in the euro area. Holland America says that in port “Most tourist locations accept major credit cards, and some may also accept U.S. dollars, but it’s not something you should count on.” On the ship: “Foreign currencies cannot be accepted or exchanged by the Front Office” (Holland America)."},{"t":"Entry rules (US citizens)","s":"guide","a":"entry-rules-us-citizens","x":"Spain, Malta and Greece are in the Schengen area. The State Department says US citizens can enter for up to 90 days for tourism without a visa. Turkey: the State Department says “Ordinary passport holders are exempted from visa up to 90 days in any 180-day period.” Ask Inspiration Travel and Holland America whether anything else is needed before you sail."},{"t":"Travel advisories (US State Department)","s":"guide","a":"travel-advisories-us-state-department","x":"Read November 2026: Spain: Level 2, “exercise increased caution” (July 2026). Malta: Level 1, “exercise normal precautions” (July 2026). Greece: Level 1, “exercise normal precautions” (October 2025). Turkey: Level 2, “exercise increased caution” (June 2026). Its “do not travel” area is the region on the Syria and Iraq borders. These advisories describe the world as it stood in November 2026, not as it will stand the week you sail. They change in both directions: a level can rise or fall before August. Look again in the week before you go. The companion app’s Alerts tab shows the current level for each."},{"t":"Accessibility","s":"guide","a":"accessibility","x":"Tell Inspiration Travel about any mobility needs when you book, and ask about wheelchair-accessible cabins. Ephesus and the Acropolis are hard on feet and knees: old stone, steps and heat. See Getting on and off for Holland America’s tender rules. The accessibility guide on this site covers more."},{"t":"Section 9 — Reading Acts on the Way","s":"guide","a":"section-9","x":"You don’t need a reading plan to enjoy this trip. But if you want one, here’s a short one that follows the ship. Day Where Read Before you go Home Romans 15:22-33 Day 1 Barcelona Acts 9:1-22, how Paul began Day 2 At sea Acts 27:1-12 Day 3 Malta Acts 27:39 to 28:11 Day 4 At sea Acts 27:13-38 Day 5 Crete Titus 1 Day 6 Mykonos Ephesians 1 to 3 Day 7 Ephesus Acts 19; Acts 20:17-38; Revelation 2:1-7 Day 8 Athens Acts 17:15-34 The places don’t make the Word any truer. They do make it harder to read as if it happened nowhere."},{"t":"Section 10 — Traveling with the Group","s":"guide","a":"section-10","x":"The program. The brochure promises Scripture and biblical history with Alistair Begg “as you explore the iconic landscapes Paul encountered” and worship with Michael O’Brien. Inspiration Travel will give you the schedule. The Ephesus excursion is the group’s. Ask how they help anyone who needs to go slower. Booking is through Inspiration Travel. A cabin booked somewhere else is on the same ship but not in the group."},{"t":"Section 11 — First Cruise Notes","s":"guide","a":"section-11","x":"If this is your first cruise, the first-cruise guide goes deeper. A few things worth knowing ahead: Download the Holland America app and log in before you go. Be back early. Use the all-aboard time in the daily program, not the departure time. You don’t have to do everything. Staying aboard to rest is a fine choice, especially the day before Ephesus. One message home a day. Tell your person where you’re going ashore, and that you’re back aboard."},{"t":"Closing","s":"guide","a":"closing","x":"Seven nights, six stops, and the long middle of the book of Acts: Paul’s hope of Spain, the shipwreck on Malta, the warning at Crete, two years of teaching in Ephesus, and a sermon on Mars’ hill. You’ll walk where some of that happened. You’ll read the rest at sea. Check the numbers again before you go, rest when you need to, and enjoy it. Share or save. The companion app has a share button. If someone you know is thinking about this cruise, send them the link. Soli Deo Gloria. All work on this project is offered as a gift to God. The site that produced it is independent: no affiliate links, no commissions, no upsells. If it helped you, that’s the whole point. Last reviewed | 2026-11-01, for a sailing on 2027-08-28 | How facts here are checked | Every fact in this pack is listed with its source in the pack’s fact-check file. The ship, dates and ports come from the group’s brochure, and Holland America’s own press releases (June 2025; May, September and October 2026) confirm Oosterdam’s 2027 Mediterranean season and refit schedule. Tonnage, length and flag come from VesselFinder. Policies come from Holland America’s FAQ. Embassy lines, entry rules and advisories come from the US State Department’s own data. 112 comes from the European Union. Weather comes from Spain’s and Turkey’s national weather services. Ephesus comes from Turkey’s Ministry of Culture. Medicare comes from medicare.gov. Bible quotations are the King James Version, from ebible.org. Where nobody had an answer, the pack says so. | Accessibility | This pack is written to read straight through on a screen reader: headings in order, small labeled tables, and links named for where they go. If something here is hard for you to use, that’s a bug, and we want to hear about it. | Sources | Ship: Oosterdam ; Holland America press releases and FAQ; VesselFinder. Ports on this site: Barcelona , Valletta , Mykonos , Kusadasi , Athens . Group: Inspiration Travel . Tools: cruise budget calculator , ship tracker , ship size atlas . Reference: first-cruise guide , internet at sea , reaching someone at sea , disability at sea . |"}]</script>
