<h2 id="pk-section-1-your-ship-icon-of-the-seas">Section 1 — Your Ship: Icon of the Seas</h2>
<h3 id="pk-the-size-is-the-product">The size is the product</h3>
<p>Icon is 248,663 GT, 20 decks, 5,610 guests at double occupancy, about 7,600 at the absolute top. She and her sister Star currently share the title of largest cruise ships in the world by gross tonnage. Gross tonnage is internal volume, not a comfort guarantee. A 20-deck ship in a winter north swell still moves. Cabin location still matters.</p>
<p>The useful way to hold her in your head is neighborhoods, not decks. The ones you will actually use this week:</p>
<ul>
<li><strong>Thrill Island</strong> — Category 6 waterpark (six slides), Crown’s Edge. This is <em>on the ship</em>. It is not the Thrill Waterpark at CocoCay. People mix those up in Facebook groups every week.</li>
<li><strong>Chill Island</strong> — the pool deck most guests default to.</li>
<li><strong>Surfside</strong> — the stay-all-day family neighborhood. If you have kids under about 12, you will live here more than you planned.</li>
<li><strong>The Hideaway</strong> — adult beach-club neighborhood, including the suspended infinity pool.</li>
<li><strong>Central Park</strong> — open-air garden, mid-ship. Quieter than the pool deck. Park Café is here.</li>
<li><strong>Royal Promenade</strong> — indoor street. The Pearl (the kinetic art piece) is the landmark. Embarkation-day chaos peaks here; after Day 1, walk through it once and pick a less central path.</li>
<li><strong>AquaDome</strong> — glass dome forward, dive shows and the Overlook Bar.</li>
</ul>
<p>Do not try to “see everything” on Day 1. Find your elevator bank, one quiet seat, and the Windjammer. By Day 3 you will have a personal map.</p>
<p>For how Icon sits against the rest of the fleet, the <a href="/tools/ship-size-atlas.html">Ship Size Atlas</a> is the comparison. Live position: <a href="/tools/ship-tracker.html">Ship Logbook</a>, IMO 9829930. Broader 2026 Caribbean deployment context: <a href="/articles/caribbean-cruise-trends-2026.html">Caribbean Cruise Trends 2026</a>.</p>
<p>Icon is LNG-capable (six multi-fuel Wärtsilä engines). Royal Caribbean calls LNG a transitional fuel. Whether that is a climate win depends on methane slip — an open argument, not a fact this pack will settle. It does not change how you pack.</p>
<p>A Deck 5 jogging track loops the perimeter: 670 m / 2,197 ft per lap, per Royal Caribbean’s own figures. That is the number to use, not a guessed “mile.”</p>
<h3 id="pk-your-cabin">Your cabin</h3>
<p>Run the <a href="/articles/stateroom-sanity-check.html">stateroom sanity check</a> before you lock a number. Then the <a href="/articles/cruise-cabin-organization.html">cabin organization guide</a> for the small-space kit.</p>
<p>On a ship this long, midship vs forward vs aft is a real difference. Midship, mid-decks, near a working elevator bank: less motion, less walking. Forward: closer to AquaDome and the spa, more pitch in a swell. Aft: quieter at night, longer walks.</p>
<p><strong>Interior</strong> — sleep and save. Icon’s interiors are a hotel room with no window. Fine if you will not be in the cabin except to change.</p>
<p><strong>Ocean-view / balcony</strong> — the default for this week. Three port days, three sea days. A balcony earns its keep on the two long sea days and on the CocoCay morning approach. Avoid cabins directly under a pool deck or next to a late-night venue; the deck plan is the source, not a forum screenshot from 2024.</p>
<p><strong>Surfside-family connecting rooms</strong> — if you are traveling with children, this is the Icon-specific ask. Confirm the connecting door on the official deck plan, not a third-party overlay.</p>
<p><strong>Suite</strong> — Coastal Kitchen (suite-only restaurant on this ship), priority boarding, the suite neighborhood. On a 7-night with three sea days, the suite lounge is the argument. On a port-heavy week it is less of one. This week is sea-heavy. If you were going to try a suite on Icon, this is the itinerary where the indoor ship is the destination.</p>
<p>I have not stayed in Icon’s suite neighborhood. I am not going to describe the view.</p>
<h3 id="pk-book-before-you-board">Book before you board</h3>
<p>Three things in the Cruise Planner, in this order:</p>
<ol type="1">
<li><strong>Specialty reservations.</strong> Icon’s list, from the ship page on this site: Giovanni’s Italian Kitchen &amp; Bar, Izumi Sushi &amp; Hibachi, Chops Grille, Empire Supper Club, Coastal Kitchen (suites), Hooked Seafood, Celebration Table, Wonderland, Johnny Rockets. Pre-book if a specific night matters. Main dining room does not need this.</li>
<li><strong>AquaDome show.</strong> The dome is the room this class was built around. Reserve. Same-day standby exists; on a full Saturday ship it is a worse plan.</li>
<li><strong>Category 6 / Crown’s Edge timing.</strong> Walk-up often works on the first sea-day morning. Do not spend Cruise Planner money on a slide reservation unless a specific hour is the whole point.</li>
</ol>
<p>Included dining you will actually use: Main Dining Room, Windjammer Marketplace, Sorrento’s, Pearl Cafe, Park Café, the Grove, Surfside Bites, Surfside Eatery, El Loco Fresh.</p>
<h3 id="pk-drink-package-math-for-this-week">Drink package math for this week</h3>
<p>Royal Caribbean’s <em>Deluxe Beverage Package</em> is sold per person, for the whole sailing, and if one legal-age adult in the cabin buys it, the others of age in that cabin have to as well. Coverage is any single drink up to a posted cap (confirm the current cap in the Cruise Planner — it has moved). An 18% gratuity is added on the package itself.</p>
<p>Pricing is dynamic. Treat any dollar-per-day figure you saw in 2024 as stale. Open your Cruise Planner. If the all-in daily rate (package + 18%) is in the high two digits or low three digits, the break-even is several alcoholic drinks plus specialty coffee plus bottled water, every day, including port days.</p>
<p>This week has <strong>three full sea days</strong> (Days 2, 3, and 6), plus an embark afternoon and a CocoCay day where Royal’s beverage package, if you bought one, extends onto the island. That is more “drinking-available hours” than a Western Caribbean week with three long port days. It still does not automatically make Deluxe the right buy. Port days in Philipsburg and Charlotte Amalie you will spend ashore. CocoCay has bars; it also has a free BBQ and a free pool.</p>
<p>The <a href="/drink-calculator.html">Drink Calculator</a> is the tool. Pay-as-you-go is the default if you cannot fill a day of drinks without thinking about it.</p>
<p><em>Refreshment Package</em> (no alcohol) is the family/non-drinker product. Price that separately; do not let Deluxe’s marketing page do the comparison for you.</p>
<p><strong>Wine in the carry-on:</strong> each guest of drinking age may bring one sealed 750 ml bottle of wine or champagne on embarkation day. Boxed wine is out. Drink it in the cabin at no charge; a <strong>$15 corkage</strong> applies if you open it in a public venue. Extra bottles, port purchases, and duty-free liquor get held until the last day. Beer and spirits brought aboard are confiscated and not returned. Non-alcoholic: 12 standard (17 oz) cans/bottles/cartons per stateroom. Source: Royal Caribbean food-and-drink FAQ, opened 2026-09-03.</p>
<h3 id="pk-sea-day-rhythm-on-this-ship">Sea-day rhythm on this ship</h3>
<p>You have two sea days stacked at the start (Miami to St. Maarten is a long eastbound run) and one more between St. Thomas and CocoCay.</p>
<p><strong>Day 2 morning</strong> is the empty-slide window. Category 6, FlowRider, Crown’s Edge, the rock wall — all shorter before lunch. After lunch the line is the activity.</p>
<p><strong>AquaDome in the afternoon heat</strong> is air-conditioned and actually quiet between shows.</p>
<p><strong>Absolute Zero</strong> (ice rink) is the Icon oddity. A 7-night in the Caribbean with an ice rink is a fact, not a metaphor. One session is enough for most people.</p>
<p><strong>Solarium</strong> — adults, quieter water. Use it. Chill Island at 2 PM on a Saturday ship is a different product.</p>
<p><strong>Deck 5 track</strong> — 670 m per loop. Three loops is a short run. Do it at 7 AM or skip the joggers.</p>
<p>A note for solo travelers: the stacked sea days are when a mega-ship can feel either generous or empty. One shared meal, one trivia, one quiet hour. That is a full day.</p>
<hr />

<h3 id="pk-day-1-typically-saturday-embarkation-portmiami">Day 1 (typically Saturday) — Embarkation, PortMiami</h3>
<p>PortMiami sits on Dodge Island in Biscayne Bay. Royal Caribbean uses the Crown of Miami terminal. Arrive in the window the Cruise Planner assigned you, not “when the ship looks ready.”</p>
<p>Bags to the porter at the curb. Tip cash, small bills. Security, check-in, gangway. Cabins are often closed until early afternoon; Windjammer is the holding pattern, and it is crowded, and the food is fine.</p>
<p>Muster is app plus a station check-in. Ten minutes if you read the instructions.</p>
<p>Sailaway is late afternoon on most Miami Saturdays. Confirm. Best deck: wherever you can see the channel and the skyline without standing in a bottleneck. The Promenade at sailaway is a crowd, not a view.</p>
<p><strong>Carry-on for Day 1:</strong> swimsuit, sunscreen, medications, a layer (Miami is humid; the ship is cold), passport, charger, refillable bottle, any paper the app told you to print. Checked bags can land after dinner.</p>
<p>SeaPass card is ID, room key, and onboard charge. Lanyard. You will lose it once if it is in a pocket.</p>
<p>Do not buy the drink package at the Promenade kiosk on Day 1 unless you already ran the calculator. Mid-cruise upgrades cost more and cover fewer days.</p>
<h3 id="pk-day-4-philipsburg-st.-maarten">Day 4 — <a href="/ports/philipsburg.html">Philipsburg, St. Maarten</a></h3>
<p>Royal Caribbean docks at the <strong>Dr. A.C. Wathey Pier</strong> in Philipsburg, Dutch side. Walk off the gangway and you are in the terminal; Front Street is minutes, not a bus transfer. Great Bay Beach runs behind the shops — 10–15 minutes on foot, or the water taxi (all-day pass about $7, per this site’s Philipsburg page, last reviewed February 2026).</p>
<p>St. Maarten / Saint Martin is one island, two countries, no border post. Dutch side: Philipsburg, USD commonly, Maho Beach. French side: Marigot, Orient Beach, euros (USD still taken in tourist zones). Spelling changes at the invisible line. You can cross in a taxi.</p>
<p><strong>Stay close:</strong> Front Street duty-free, Great Bay swim, back to the ship for a quiet lunch. Guavaberry liqueur is the local bottle people actually bring home; prices on the port page were in the low teens USD when last checked — verify.</p>
<p><strong>The Maho morning:</strong> shared taxi about $20–25 per person, about 20 minutes. Princess Juliana’s runway ends at the sand. Jet blast is a real injury risk; the warning signs are not a joke. If you have small children, this is a watch-from-the-bar day, not a stand-at-the-fence day.</p>
<p><strong>French side:</strong> taxi about $25–30, 25–30 minutes to Marigot or Orient. Lunch prices on the port page (rosé, beach-club lounger, grilled lobster) are 2024–2026 traveler notes, not a menu. Confirm.</p>
<p>Set taxi rates are posted at the terminal. Use them.</p>
<p><strong>Accessibility:</strong> the pier and Philipsburg boardwalk are the easy part. Maho and Orient are taxi plus sand. Wheelchair users who want the French side should budget a pre-booked accessible van, not a shared minibus.</p>
<p><strong>Pack:</strong> swimsuit, reef-safe sunscreen, cash in small USD, water. Passport if you are doing anything that could strand you (the island is foreign soil even though the pier feels like a mall).</p>
<h3 id="pk-day-5-charlotte-amalie-st.-thomas">Day 5 — <a href="/ports/st-thomas.html">Charlotte Amalie, St. Thomas</a></h3>
<p>US Virgin Islands. USD. English. <strong>Traffic drives on the left.</strong> Look twice stepping off a curb.</p>
<p>Two cruise piers serve Charlotte Amalie: <strong>Havensight</strong> and <strong>Crown Bay</strong>. They are not interchangeable for walking. Confirm which one Icon is on in the Cruise Planner the night before. Havensight puts you nearer the Paradise Point tram. Crown Bay is a taxi ride to town. Do not copy a “walk to downtown” plan from a ship that berthed at the other pier.</p>
<p>Fort Christian (brick-red, 1666–1680) is the oldest standing structure in the USVI; it has been church, courthouse, governor’s house, and jail. Worth an hour if you like that kind of thing. Magens Bay is the beach the postcards are of: heart-shaped, protected, entrance about $5, loungers about $15/day per this site’s St. Thomas page (2024 visit notes — verify at the gate). Shared “safari” open-air taxis run the mountain road; split the fare.</p>
<p>Paradise Point tram: about seven minutes, about 700 feet up Flag Hill, from Havensight. Harbor view. Paid.</p>
<p>This call is often shorter than St. Maarten. Recent published sailings have left in the early afternoon. <strong>Be on the pier with margin.</strong> Missing the ship in a US territory is still a missed ship: you fly to the next port on your own money.</p>
<p><strong>Easy day:</strong> town, a pastry, back aboard. Windjammer on a port afternoon is half empty.</p>
<p><strong>Half day:</strong> Magens, swim, taxi back.</p>
<p><strong>Skip:</strong> a ship excursion that duplicates the $5 beach. The island is small; the independent taxi is the product.</p>
<p><strong>Accessibility:</strong> pier and downtown shops, yes, with hills. Magens is a taxi plus a beach. The tram is a cable car; confirm wheelchair policy with the operator, not with this pack.</p>
<p><strong>Pack:</strong> swimsuit, water shoes if you dislike the Magens entry, cash, and the reminder that left-side traffic is not a metaphor.</p>
<h3 id="pk-day-7-perfect-day-at-cococay">Day 7 — Perfect Day at <a href="/ports/cococay.html">CocoCay</a></h3>
<p>Royal Caribbean’s private island in the Berry Islands, originally Little Stirrup Cay, about 55 miles northwest of Nassau. <strong>The ship docks. There is no tender.</strong> Trams on flat paved paths connect the zones.</p>
<p>CocoCay is a manufactured beach day, built on purpose, and it does that job. The $250 million rework finished in 2019. What is easy to get wrong is the price list.</p>
<p><strong>Included (as of the CocoCay page’s 2025-12-26 / February 2026 review — reconfirm):</strong> Oasis Lagoon (the large freshwater pool), Chill Island beaches, loungers, umbrellas, towels, BBQ lunch, trams.</p>
<p><strong>Paid (same review; ranges move):</strong> Thrill Waterpark about $50–65/person (slides, wave pool, splash area — this is the <em>island</em> waterpark, not Category 6 on the ship), Up, Up and Away helium balloon about $40–50, Hideaway Beach (adults) about $35–45, zipline about $35–45, Coco Beach Club about $90–120, cabanas in the hundreds to high hundreds.</p>
<p>Your shipboard beverage and Wi-Fi packages, if you bought them, extend onto CocoCay. That is Royal’s published perk, not a rumor.</p>
<p><strong>Easy day:</strong> Oasis Lagoon, a beach chair, the included lunch, back in the heat of the afternoon. The ship on a CocoCay day is quiet. That is a valid way to spend Day 7.</p>
<p><strong>Thrill day:</strong> buy the island waterpark in the Cruise Planner if the slides are the point. Do not assume Category 6 tickets cover CocoCay. They do not.</p>
<p>Hurricane season is 1 June – 30 November, peak September–October. Ships reroute. Travel insurance is the tool, not optimism.</p>
<p><strong>Pack:</strong> reef-safe sunscreen, water shoes optional, a dry shirt for the tram, cash you probably will not need (it is a Royal island; SeaPass works). Bring the ship’s beach towel unless you like buying a replacement.</p>
<h3 id="pk-day-8-typically-saturday-disembarkation-miami">Day 8 (typically Saturday) — Disembarkation, Miami</h3>
<p>Morning arrival. Assigned groups. Eat first; the terminal will not feed you well.</p>
<p>The end-of-cruise statement is the last easy moment to dispute a charge. Guest Services before you leave the ship, not a week later by email.</p>
<p>If you flew in, do not book a 9 AM return out of MIA or FLL on disembark morning unless you like sprinting. 12:30 PM and later is the adult plan.</p>

— it has moved). An 18% gratuity is added on the package itself. Pricing is dynamic. Treat any dollar-per-day figure you saw in 2024 as stale. Open your Cruise Planner. If the all-in daily rate (package + 18%) is in the high two digits or low three digits, the break-even is several alcoholic drinks plus specialty coffee plus bottled water, every day, including port days. This week has three full sea days (Days 2, 3, and 6), plus an embark afternoon and a CocoCay day where Royal’s beverage package, if you bought one, extends onto the island. That is more “drinking-available hours” than a Western Caribbean week with three long port days. It still does not automatically make Deluxe the right buy. Port days in Philipsburg and Charlotte Amalie you will spend ashore. CocoCay has bars; it also has a free BBQ and a free pool. The Drink Calculator is the tool. Pay-as-you-go is the default if you cannot fill a day of drinks without thinking about it. Refreshment Package (no alcohol) is the family/non-drinker product. Price that separately; do not let Deluxe’s marketing page do the comparison for you. Wine in the carry-on: each guest of drinking age may bring one sealed 750 ml bottle of wine or champagne on embarkation day. Boxed wine is out. Drink it in the cabin at no charge; a $15 corkage applies if you open it in a public venue. Extra bottles, port purchases, and duty-free liquor get held until the last day. Beer and spirits brought aboard are confiscated and not returned. Non-alcoholic: 12 standard (17 oz) cans/bottles/cartons per stateroom. Source: Royal Caribbean food-and-drink FAQ, opened 2026-09-03."},{"t":"Sea-day rhythm on this ship","s":"ship","a":"pk-sea-day-rhythm-on-this-ship","x":"You have two sea days stacked at the start (Miami to St. Maarten is a long eastbound run) and one more between St. Thomas and CocoCay. Day 2 morning is the empty-slide window. Category 6, FlowRider, Crown’s Edge, the rock wall — all shorter before lunch. After lunch the line is the activity. AquaDome in the afternoon heat is air-conditioned and actually quiet between shows. Absolute Zero (ice rink) is the Icon oddity. A 7-night in the Caribbean with an ice rink is a fact, not a metaphor. One session is enough for most people. Solarium — adults, quieter water. Use it. Chill Island at 2 PM on a Saturday ship is a different product. Deck 5 track — 670 m per loop. Three loops is a short run. Do it at 7 AM or skip the joggers. A note for solo travelers: the stacked sea days are when a mega-ship can feel either generous or empty. One shared meal, one trivia, one quiet hour. That is a full day."},{"t":"Section 2 — Day-by-Day","s":"guide","a":"section-2-day-by-day","x":"Confirm every clock in your Cruise Planner. The day order below is Royal Caribbean’s published generic product. The hours are not. This is not your plan. What follows is one possible shape of the week, not a schedule to keep. Only a few things on it are actually fixed: the muster drill, sailaway, the ship’s arrival and all-aboard times in each port, and anything you have already booked. Everything else is a suggestion you are free to ignore, reorder, or sleep through. A day spent entirely on your balcony is not a day wasted, and nothing here is a commitment you have made to anyone."},{"t":"Day 1 (typically Saturday) — Embarkation, PortMiami","s":"ports","a":"pk-day-1-typically-saturday-embarkation-portmiami","x":"PortMiami sits on Dodge Island in Biscayne Bay. Royal Caribbean uses the Crown of Miami terminal. Arrive in the window the Cruise Planner assigned you, not “when the ship looks ready.” Bags to the porter at the curb. Tip cash, small bills. Security, check-in, gangway. Cabins are often closed until early afternoon; Windjammer is the holding pattern, and it is crowded, and the food is fine. Muster is app plus a station check-in. Ten minutes if you read the instructions. Sailaway is late afternoon on most Miami Saturdays. Confirm. Best deck: wherever you can see the channel and the ations aside), pools, Category 6 as a place (some attractions still queue), most group fitness, kids’ clubs at the standard hours."},{"t":"Not in the fare","s":"guide","a":"not-in-the-fare","x":"Daily service charge: $18.50 per guest per day, all non-suite staterooms (including Junior Suites); $21.00 per guest per day, suites. Source: Royal Caribbean gratuity FAQ, opened 2026-09-03. For 7 nights that is $129.50 standard or $147.00 suite, per person, before you buy a single drink. 18% more on beverages, beverage packages, specialty dining, room service, mini-bar. 20% on spa and salon. Removable at Guest Relations until the morning of disembarkation; removing it because you want a cheaper cruise is a choice about the crew’s pay. Drink package or à la carte drinks. Specialty dining. Wi-Fi. CocoCay paid zones (Section 2). Shore taxis and entries (Magens ~$5, loungers ~$15; St. Maarten taxis ~$20–30; water taxi ~$7). Gratuities on those taxis. Flights, hotel, travel insurance, souvenirs, the $15 corkage if you open your own wine in a restaurant."},{"t":"A working mid-range picture (couple, beyond fare)","s":"guide","a":"a-working-mid-range-picture-couple-beyond-fare","x":"Service charges: ~$259 for two, standard cabin. Specialty dinners: 2 × whatever your Cruise Planner says. CocoCay: $0 if you stay on the included beach; $100–130 if two Thrill Waterpark tickets. Port days: $80–150 cash for taxis and Magens between you, more with a French-side lunch. Wi-Fi: price the package; do not guess. Drinks: calculator, not vibes. A $1,000-looking fare is not a $1,000 week. Add the service charge first, then decide."},{"t":"How to spend less","s":"guide","a":"how-to-spend-less","x":"Skip Deluxe. Skip CocoCay paid zones. Windjammer and Park Café. Independent taxis, not ship excursions, on St. Thomas and St. Maarten — with a watch and a margin. Carry the allowed wine bottle."},{"t":"How it costs more","s":"guide","a":"how-it-costs-more","x":"Empire Supper Club plus Hideaway Beach plus a cabana plus Deluxe for two. That is a different vacation that happens to use the same hull."},{"t":"Section 6 — Emergency Contacts","s":"guide","a":"section-6-emergency-contacts","x":"If you are reading this in a crisis, start with the State Department line. If you are the cruiser, fill the card and give it to one person ashore before you sail. Cruise-line numbers move; confirm against your booking documents. After first load, the PWA companion keeps this section available offline."},{"t":"The family handoff card","s":"guide","a":"the-family-handoff-card","x":"Privacy: passport number and date of birth are sensitive. Do not email this card unencrypted. Cruiser's full legal name (as on passport): ______________________ Date of birth: ______________________ Passport number: ______________________ Cruiser's mobile (Wi-Fi calling at sea): ______________________ Cruise line: Royal Caribbean Ship name: Icon of the Seas Sailing date: ______________________ Disembark date: ______________________ Booking / reservation number: ______________________ Stateroom / cabin number: ______________________ Travel insurance company: ______________________ Policy number: ______________________ 24-hour assistance line: ______________________ Pre-cruise outbound flight: ______________________ Return flight: ______________________ Allergies / medications / conditions / advance directive: ______________________ Trusted contact at home: Name: __________ Phone: __________ Relationship: __________"},{"t":"Universal 24/7 line","s":"guide","a":"universal-247-line","x":"U.S. State Department, Overseas Citizens Services From the U.S. or Canada: +1-888-407-4747 From abroad: +1-202-501-4444 24 hours. They can locate the ship and coordinate consular help in port."},{"t":"Cruise-line numbers (Royal Caribbean)","s":"guide","a":"cruise-line-numbers-royal-caribbean","x":"Royal Caribbean does not publish a separate free 24/7 family emergency desk. Shore-to-ship voice is a paid relay. Ship-phone relay: (888) 724-7447 (U.S.) · (321) 953-9003 (outside the U.S.). $7.95 USD/min , billed to MasterCard or Visa; international calls also accrue long-distance. Source: Royal Caribbean onboard-phone FAQ, opened 2026-09-03. Use this to pass a message. Do not use it as the first call in a medical crisis — State Department first. Stateroom ship-to-shore is the same $7.95/min, billed to SeaPass. Port-agent names for each call appear in the daily program once you board."},{"t":"This week’s jurisdictions","s":"guide","a":"this-weeks-jurisdictions","x":"Miami / PortMiami — United States. 911. Philipsburg, St. Maarten — country of Sint Maarten (Kingdom of the Netherlands). Local emergency services first; U.S. consular coverage for the Dutch Caribbean is handled through the U.S. Consulate General in Curaçao. Confirm current phone and hours at travel.state.gov before you sail — do not rely on a number copied out of an old forum post. Charlotte Amalie, St. Thomas — United States territory. 911. No embassy. You are still on a clock to make the ship. CocoCay, Bahamas — Bahamian jurisdiction even though it is a private island. U.S. Embassy Nassau covers it. Confirm current phone and hours at travel.state.gov. The ship’s port agent is the practical first call if something happens on the island."},{"t":"What to have in front of you","s":"guide","a":"what-to-have-in-front-of-you","x":"State Department: ship name, sailing date, full legal name of the person aboard, your name, relationship, what you know. Ship-phone relay: booking number, ship name, sailing date, full legal name, cabin if you have it. In-port consulate: your name, where you are standing, whether anyone is hurt, passport number if you have it."},{"t":"Decision tree","s":"guide","a":"decision-tree","x":"Medical emergency at sea → ship’s medical center (dial 911 from the cabin phone) → then State Department if the family ashore needs a consular path home. Port-side emergency → local 911 / equivalent first → port agent / embassy second → State Department third. Missed ship → port agent via Royal’s customer service, then a plane. Passport in hand. See Section 8."},{"t":"Section 7 — Seasickness on this week","s":"guide","a":"section-7-seasickness-on-this-week","x":"Most people on a Miami–eastern-Caribbean winter or spring week will not have a story. The stacked sea days are open water (Atlantic/Caribbean, not an inside passage). Icon is large. Large is not the same as still. If you get sick: fresh air, horizon, ginger if it works for you, meclizine or a scopolamine patch before you feel it — ask your own clinician, this pack is not a prescription. Cabin midship, mid-deck, helps some people and does nothing for others. Do not drink through it. Do not wait for Day 4 to try a patch. Vestibular conditions: talk to the ship’s medical center early, not after a fall on a wet deck. I am not going to promise you a still week."},{"t":"Section 8 — Practical Logistics","s":"guide","a":"section-8-practical-logistics","x":""},{"t":"Travel documents","s":"guide","a":"travel-documents","x":"This is a closed-loop sailing: out of a U.S. port, back to the same U.S. port, with foreign calls (St. Maarten, Bahamas) and a U.S. territory (St. Thomas) in between. U.S. citizens on closed-loop cruises are sometimes allowed to re-enter on a birth certificate plus government photo ID. That is the legal minimum, not the plan. Carry a passport. If you miss the ship in Philipsburg, you are in another country and you need to fly. If you miss it in St. Thomas you are in a U.S. territory and you still need to fly to CocoCay or Miami — a passport makes that a transaction instead of a consular project. REAL ID applies to the domestic flight to Miami , which is a different rule from the cruise. Non-U.S. citizens: your own entry rules for the U.S., St. Maarten, the USVI, and the Bahamas. This pack will not guess them."},{"t":"Travel insurance","s":"guide","a":"travel-insurance","x":"Medical evacuation from an island, a missed-ship catch-up, a hurricane reroute in September. Buy it near deposit if you want CFAR. Read the sports exclusion if Crown’s Edge or a wave pool is on your list."},{"t":"Onboard money","s":"guide","a":"onboard-money","x":"SeaPass. It is a credit-card tab with your face on it. Daily service charges post automatically. Watch the app. Dispute before disembarkation morning."},{"t":"Tipping beyond auto-gratuity","s":"guide","a":"tipping-beyond-auto-gratuity","x":"Porters at PortMiami: cash, $1–2/bag is the going range, more if they save you. Safari taxi drivers in St. Thomas: round up. Bar staff if you are on pay-as-you-go: the 18% is already there on ship drinks; ashore, cash. Do not remove the auto-gratuity because a single bar drink was slow."},{"t":"Missed ship","s":"guide","a":"missed-ship","x":"Philipsburg and Charlotte Amalie will leave without you. The port agent is the adult in the room. Your job is: be at the pier an hour earlier than your pride wants, passport in the day bag, watch set to ship time (not phone-network time — St. Thomas and St. Maarten can disagree with your carrier)."},{"t":"Laundry","s":"guide","a":"laundry","x":"No self-service on this 7-night. Send-out bags via the attendant. Price it on Day 2 if you packed light."},{"t":"Lost items","s":"guide","a":"lost-items","x":"Guest Services. 90-day hold is the usual ship story; still, deal with it before you leave the vessel."},{"t":"Faith","s":"guide","a":"faith","x":"Guest Services will find a quiet room if you ask. There is no dedicated chapel product on this mass-market ship. Friday candle-lighting is a request, not a listing."},{"t":"Disputes after the cruise","s":"guide","a":"disputes-after-the-cruise","x":"Easier on the ship. Shore-side Guest Relations is slower. Photograph the final statement."},{"t":"Section 9 — Accessibility Notes","s":"guide","a":"section-9-accessibility-notes","x":""},{"t":"On the ship","s":"guide","a":"on-the-ship","x":"Icon is a new ship, which helps: wider corridors than a 1990s hull, more elevators, accessible staterooms on the official deck plan. “Accessible” still means you verify your cabin number against Royal’s accessible-stateroom list, not against a pretty photo. Category 6, Crown’s Edge, the balloon at CocoCay, and the ice rink each have their own body and operator rules. Confirm with Guest Services. I am not going to invent a wheelchair count for a ride I have not measured. Medical center: Deck location is on the deck plan; register serious conditions before you sail through Special Needs / Accessible cruising, not at the gangway."},{"t":"At ports","s":"guide","a":"at-ports","x":"PortMiami — modern terminal, long walks, heat. Philipsburg — pier to boardwalk is the accessible part of the day. Sand and Maho are not. St. Thomas — pier yes; Magens is a taxi plus sand; the tram is a separate operator. CocoCay — dock, paved trams, Oasis Lagoon. Thrill Waterpark and beach entry are a different question; ask Royal, not a Facebook album."},{"t":"Fatigue","s":"guide","a":"fatigue","x":"Three sea days help. The ship is still 364.75 m long. Pick a neighborhood and a dining room and let the rest go."},{"t":"Section 10 — Solo Traveler Notes","s":"guide","a":"section-10-solo-traveler-notes","x":"Royal’s single supplement on this class is often 200% of the per-person double rate, with occasional solo promotions below that. Check the actual fare. A second guest in an interior can cost less than you think, which is a math problem, not a lifestyle comment. You will not be the only solo on a 5,610-guest ship. You can also eat every meal alone and have a good week. Trivia in a public bar, one specialty communal table if they are seating that way, and the Deck 5 track are enough social structure. Safety: the cabin deadbolt, the lanyard, Guest Services / security if a room or a corridor feels wrong. You owe no one your evening plan. If you are sailing after a loss: this ship is loud. Surfside will not match a quiet need. Central Park at 8 AM and the Solarium will. You do not have to perform having fun."},{"t":"Section 11 — First Cruise Notes","s":"guide","a":"section-11-first-cruise-notes","x":"Icon is a loud first cruise. That is not a defect. It is the reason you booked it. What surprises people: the walking, the cold interior, the time it takes to get off in St. Thomas if you picked the wrong pier, the fact that CocoCay is not “port” in the St. Maarten sense, the size of the Day-1 Windjammer line, the $129.50 service charge they swore somebody said was optional. What you can skip: the art auction, the ship photographer package, a timeshare-style meeting, a drink package you have not calculated, a Crown’s Edge slot at 3 PM on Day 2. What to do: online check-in, a passport, one specialty reservation if you care, Magens or Maho (not both at a sprint), Oasis Lagoon, sleep. Muster is short. The app is the daily program. The SeaPass is a credit card. You will be fine."},{"t":"Continue planning on the site","s":"guide","a":"continue-planning-on-the-site","x":""},{"t":"About your ship","s":"guide","a":"about-your-ship","x":"Icon of the Seas — deck plans, tracker, dining list, logbook. Ship Size Atlas Stateroom sanity check"},{"t":"About the ports","s":"guide","a":"about-the-ports","x":"PortMiami Philipsburg / St. Maarten and the island overview at St. Maarten St. Thomas CocoCay"},{"t":"Other Voyage Packs","s":"guide","a":"other-voyage-packs","x":"The Voyage Packs catalog lists the other itineraries in this series, including the Symphony Western Caribbean 7-night if you wanted the other Miami Saturday."},{"t":"Closing","s":"guide","a":"closing","x":"This pack exists to make one week easier. The site that produced it is independent. If it was useful, the Support page is how this work continues. Soli Deo Gloria. Have a good week at sea."},{"t":"About this document","s":"guide","a":"about-this-document","x":"Voyage Pack version v0.1.17 Prepared for Icon of the Seas, generic 7-night Eastern Caribbean & Perfect Day, Miami Itinerary source Royal Caribbean published product (Miami → 2 sea days → Philipsburg → Charlotte Amalie → sea day → CocoCay → Miami), verified 2026-09-03. Clocks and CocoCay-first variants: your Cruise Planner. Last reviewed 2026-09-03 Next review trigger Itinerary change, gratuity or package-rate change, CocoCay price-list change, or a new Icon-class sister altering the “largest” claim"}]</script>
